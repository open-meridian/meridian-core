// Numbers: every quantity, and every amount of currency.
//
// decisions/023, with spec/quantities-carry-their-own-scale, as amended at
// contract v18 (a Money names its instrument). Reached from every
// message that carries a quantity or an amount; W2's holdings are the first.
//
// One form everywhere, binary on the wire and never text or a float: an
// integer and the count of decimal places it carries. The shape of FIX's binary
// encoding and of Nasdaq's ITCH and OUCH, only wider, so a reader decodes a
// fixed width and computes on the integer, and the same form serves a holding
// today and a low-latency order path later. Logs, fixtures and pages show the
// value as a decimal (`1.5`); only the wire is binary.
//
// Nothing is rounded anywhere. A value outside the Decimal's range is refused,
// by the SDK before it is sent and by the sidecar and every store after.

syntax = "proto3";

package meridian.v1;

// The Decimal itself: an integer and its scale. Plugin-facing since a
// plugin's figure may be one (W4.5), so declared in meridian-schema's
// sidecar.proto, same package, name and numbers, and imported from there at
// the revision this repository pins.
import "meridian/v1/sidecar.proto";

// An amount of currency: a Decimal and the asset it is in.
//
// One message rather than an amount with its currency beside it, so a message
// holding amounts in several currencies -- a USD price, a EUR commission --
// cannot pair the wrong ones. An amount is never separated from its currency.
//
// In the currency's major unit, whatever the venue counted in: a plugin that
// read cents converts before anything reaches the bus (decisions/023).
//
// From contract v18 a Money always names an instrument (decisions/023 as
// amended; the ruling of 2026-09-30): the cash instrument of the asset it is
// in, fiat and tokens alike, in the deployment's instrument store. A plugin
// may name a fiat currency by its ISO 4217 code alone, which core resolves,
// dated, to its cash instrument; an asset with no ISO 4217 code (USDC, USDT, a
// network's gas token) is named by its instrument alone, which the plugin
// resolves as it resolves any instrument (W3.1). What is kept and read back
// names the instrument.
message Money {
  Decimal amount = 1;

  // ISO 4217, e.g. "USD": the currency's code, where the asset has one.
  // Empty for an asset with no ISO 4217 code, which `instrument_id` alone
  // names; a token's code here is refused. From v18 a plugin may send this
  // alone and core fills `instrument_id`.
  string currency_code = 2;

  // The cash instrument of the asset the amount is in, the deployment's own
  // ID (contract v18). Empty from a plugin that named a fiat currency by
  // `currency_code` alone, which core resolves; set by core on what it keeps
  // and answers. Both set must name the same asset, or the amount is
  // refused; neither set is refused.
  string instrument_id = 3;
}

// A value with its unit (contract v27, the lake's rates slice;
// spec/the-lake-holds-researchs-kinds, shared addition 3 and Q8;
// spec/a-public-rates-and-filings-data-plugin, §1 item 2): a Decimal that is
// not money, in base units, with its unit from a closed list or, for a
// physical unit, its UCUM code. A 3.87 per cent fixing is 3.87 percent, never
// a Money.
message UnitValue {
  Decimal value = 1;
  ValueUnit unit = 2;
  // For VALUE_UNIT_INDEX, the index's base period as its publisher states
  // it (`2015=100`); empty otherwise.
  string index_base = 3;
  // For VALUE_UNIT_UCUM, the physical unit's UCUM code (`Cel`, `[bbl_us]`);
  // empty otherwise.
  string ucum_code = 4;
}

// The closed list of units a UnitValue takes (contract v27).
enum ValueUnit {
  // Refused.
  VALUE_UNIT_UNSPECIFIED = 0;
  VALUE_UNIT_PERCENT = 1;
  VALUE_UNIT_BASIS_POINTS = 2;
  VALUE_UNIT_SHARES = 3;
  VALUE_UNIT_CONTRACTS = 4;
  // A face amount, in its currency's major unit.
  VALUE_UNIT_PRINCIPAL = 5;
  VALUE_UNIT_RATIO = 6;
  VALUE_UNIT_COUNT = 7;
  VALUE_UNIT_DAYS = 8;
  // An index level, with its base period in index_base.
  VALUE_UNIT_INDEX = 9;
  // A physical unit, named by ucum_code.
  VALUE_UNIT_UCUM = 10;
}
