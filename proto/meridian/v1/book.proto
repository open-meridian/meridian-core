// The book of record: the deployment's own positions, breaks and figures.
//
// Derived from workflow W9 (the book of record), revision B of
// plans/the-book-holds-positions, contract v8
// (sdk-contract/the-book-holds-positions); from v9 the book refuses an entry
// missing what downstream needs, naming each field
// (sdk-contract/the-book-refuses-what-downstream-cannot-use); from v10 it
// requires each instrument's asset class and currency, and names the
// delegation a person acted through. From v22 it holds the order path's
// slice A too (W11; sdk-contract/an-order-reaches-a-venue-contract): orders,
// placements, executions, charges, unplaced facts, locates and the trading
// instructions, below the account's attributes. Every message here traces to
// a matrix row; see matrix/matrix.tsv.
//
// W2's governing idea, carried through: there are two beliefs about what is
// held, ours and the custodian's. holdings.proto carries the custodian's into
// the street store; this is ours. An account enters the book once, with an
// opening balance; after that the book changes only by its own entries, each
// a set of movement lines; and an operations plugin compares it with the
// street every day, recording each difference as a break, which a justified
// entry resolves or an explanation closes. No statement is ever applied to
// the book, and the book and the street share no key (decisions/012): a
// street record is named here by value.
//
// The book records; it computes no margin, no projection and no return.
// Every quantity is a Decimal and every amount a Money (decisions/023), and a
// value a source did not state is unset, never zero.

syntax = "proto3";

package meridian.v1;

import "meridian/v1/amounts.proto";
import "meridian/v1/holdings.proto";
import "meridian/v1/journal.proto";
import "meridian/v1/sidecar.proto";
// Identifier: a party's identifiers (W11, contract v22).
import "meridian/v1/reference.proto";

// ── Who, and what every entry records (W9.8) ──

// Who made a change (step 5's requirement 28, landed with v8). Set by the
// book from the envelope the sidecar stamped (W4.9), never by a plugin.
message Actor {
  oneof kind {
    // A person the sidecar vouched for, by the deployment-local subject
    // W6.1 records.
    PersonActor person = 1;
    // A finding reported with no user: the plugin instance that sent it;
    // the book's own act (a merged record followed) leaves it empty.
    SystemActor system = 2;
    // A service account a plugin's autonomous work acted as, whose call the
    // dashboard admitted (W4.15, W9.8; contract v21), from the envelope the
    // sidecar stamped. Never a person, nor the plugin's own finding.
    ServiceAccountActor service_account = 3;
    // The venue, through the connectivity plugin reporting what it did
    // (W11.2, W11.9 to W11.12; step 5's Q24; contract v22): a fact, never a
    // person's act, and never refused for the state it arrives in.
    VenueActor venue = 4;
  }
}

message PersonActor {
  string subject = 1;

  // The delegation the person acted through, and the client's registered
  // name, as the sidecar stamped them beside the person (W4.9, decisions/029;
  // contract v10). Empty for a person at the dashboard in a browser, and on
  // every act recorded before v10. The person stays the actor.
  string delegation_id = 2;
  string client_name = 3;

  // The prepared change it was made from, where a person made it from one
  // (W6.27, W4.9; contract v20): empty otherwise, and before v20.
  string prepared_call_id = 4;
}

message SystemActor {
  string instance_id = 1;
}

// A service account that answered for an act (W9.8, contract v21).
message ServiceAccountActor {
  // Its `SA-` subject, as the sidecar stamped it (W4.9).
  string subject = 1;

  // The deployment-local subject of the person answerable for it when it
  // acted, as the sidecar stamped it; a later change of owner leaves it as
  // it was.
  string owner_subject = 2;

  // The algorithm the service account's call named, one of the
  // identifiers the plugin's version declares (PluginDeclaration.algorithms;
  // W4.9, W4.15; v21's Q16, the order-path plan's refresh, Q24; contract
  // v22): copied by the book from the envelope (MessageMeta.algorithm_id),
  // where the sidecar stamped it from the claims after checking it. Stable
  // across versions, so `reporting` reads it for the decision-maker and
  // executor a regime asks for. Empty where the call named none, and before
  // v22.
  string algorithm_id = 3;
}

// The venue an act is a fact of (W11, contract v22).
message VenueActor {
  // The connectivity plugin instance that reported it, as its sidecar
  // stamped it.
  string instance_id = 1;

  // The venue, the venue master's ID, where the plugin names it; empty
  // where it does not.
  string venue_id = 2;
}

// What a journal entry records beside its JournalRef and ChangeCause.
message EntryMeta {
  // Minted by the book.
  string entry_id = 1;
  // An open list a reader takes as data (Q19): in v8 opening-balance,
  // placeholder-moved (instrument-merged from v10), figures-recorded, break-recorded, break-handled,
  // break-resolved, break-closed, adjustment, reversal, attribute-set; from
  // v22 order-proposed, order-recorded, order-released, execution-recorded
  // among the order path's (W11.13).
  string kind = 2;
  Actor actor = 3;
  // The time on the message that caused it, and when the book received it;
  // when it committed is the cause's committed_at_ns.
  int64 event_time_ns = 4;
  int64 received_at_ns = 5;
  // ISO 8601: the business date it stands for.
  string effective_date = 6;
  // The control partition's sequence in force (decisions/024's note).
  uint64 control_sequence = 7;
  // Each instrument it names, with the reference record's version in force
  // when it was recorded; none where the store has no version (Q31).
  repeated ReferenceVersion reference_versions = 8;
  // Required on a justified act: an opening balance, an adjustment, a
  // reversal, a resolution, handling, an attribute.
  string reason = 9;
  // The breaks it records, handles, resolves or closes.
  repeated string break_ids = 10;
  // The key the plugin sent the command with, where it sent one (Q12 of the
  // sample operations plugin, ruled 2026-10-01).
  string idempotency_key = 11;
}

message ReferenceVersion {
  string instrument_id = 1;
  // The InstrumentRecord's version (W3.6).
  int64 version = 2;
}

// ── Movement: every entry that moves a position is lines (Q19) ──

enum SettlementBucket {
  // Refused.
  SETTLEMENT_BUCKET_UNSPECIFIED = 0;
  SETTLEMENT_BUCKET_SETTLED = 1;
  // Pending settlement on the line's value date. With no value date on an
  // adjustment the street gave no date for, or on a line a v8 opening
  // balance recorded ("date not stated").
  SETTLEMENT_BUCKET_PENDING = 2;
  // The source did not say whether it is settled or pending: only on a line
  // a v8 opening balance recorded. Refused from v9.
  SETTLEMENT_BUCKET_NOT_STATED = 3;
}

message MovementLine {
  // The deployment's instrument record, a currency's cash instrument
  // included.
  string instrument_id = 1;
  HoldingSide side = 2;
  SettlementBucket bucket = 3;
  // ISO 8601; on a pending line, empty only on an adjustment the street gave
  // no date for; may be years out.
  string value_date = 4;
  // Signed as the position's quantity is, and added to it.
  Decimal quantity = 5;
  // The lot it adds to or relieves. Empty on a line that opens a lot, whose
  // identifier the book mints, and on the account's base currency, which has
  // no lots: from v24 every other currency opens lots with base-currency
  // basis (option (c), W11.13).
  string lot_id = 6;
  // Set on the line that opens a lot, and only there: unset on a line that
  // adds to or relieves a lot, or on the account's base currency.
  LotTerms opens_lot = 7;
  // A pending line's fail, where its source reports one.
  PendingState pending_state = 8;

  // The sleeve within the account it moves (W9's invariants, the order-path
  // plan's refresh, Q33; step 5's requirement 59; contract v22): a cash
  // line's too. Empty for the account's unsleeved part, and on every line
  // before v22.
  string sleeve = 9;
}

message LotTerms {
  // Each unset where not known; never derived one from the other. A lot the
  // book opens carries its cost and acquisition date (v9): an opening
  // balance or an adjustment without either is refused
  // (REFUSAL_REASON_INCOMPLETE); a lot a v8 book opened may lack them.
  optional Money unit_cost = 1;
  optional Money cost = 2;
  string acquired_date = 3;
  // Apart from acquisition, for wash-sale tacking; empty is the acquired
  // date.
  string holding_period_start = 4;
  string settlement_date = 5;
  LotSource source = 6;
}

enum LotSource {
  LOT_SOURCE_UNSPECIFIED = 0;
  // As the opening balance's source reported it (Q2).
  LOT_SOURCE_OPENING_BALANCE = 1;
  // Opened by an adjustment resolving a break (Q28). Step 5 adds the
  // book's own trade, slice D a transfer in.
  LOT_SOURCE_ADJUSTMENT = 2;
  // A lot a reported fill opens (W11.13; contract v22).
  LOT_SOURCE_EXECUTION = 3;
}

message PendingState {
  bool failing = 1;
  // As reported.
  string fail_reason = 2;
  // ISO 8601; the date it is now expected; the bucket keeps its intended
  // date ("Three more considerations", 2).
  string expected_date = 3;
}

message BasisAdjustment {
  string lot_id = 1;
  oneof cost {
    // Added to the lot's cost; signed. Only on a lot whose cost is known.
    Money cost_change = 2;
    // The lot's cost, stated where it was unknown: a lot a v8 book opened
    // with no cost, given its cost once it is known. Only on a lot whose cost
    // is unknown; from v9 the book opens none.
    Money stated_cost = 4;
  }
  // Where it moves; empty is unchanged.
  string holding_period_start = 3;
}

// ── The records: the projection (W9.2, W9.8) ──

message BookPosition {
  string account_id = 1;
  string instrument_id = 2;
  HoldingSide side = 3;
  // Settled plus pending, by construction; plus not stated where a v8
  // opening balance opened that bucket.
  Decimal trade_date_quantity = 4;
  // Unset only while some of the quantity is in the not-stated bucket a v8
  // opening balance opened: unknown, never zero.
  optional Decimal settled_quantity = 5;
  // Zero on every position v9 records.
  Decimal not_stated_quantity = 6;
  repeated PendingSettlement pending = 7;
  // Open lots; their open quantities sum to trade_date_quantity, cash
  // excepted.
  repeated Lot lots = 8;
  // The opening balance's sources, with their as-of and basis.
  repeated OpeningSource opened_from = 9;
  // The business date of its last change.
  string effective_date = 10;
  JournalRef last_change = 11;
  // A tombstone, after a merged record's move (W9.9): returned only to a
  // read since a watermark, and delivered once.
  bool removed = 12;
  // Once a flag on a position held under a placeholder instrument; from
  // contract v10 a deployment's record is its own whatever its ID
  // (decisions/030), and what holds a position back is a record the book
  // cannot use (W9.1).
  reserved 13;
  reserved "placeholder";
  // What of it cannot move, as the operations plugin last recorded it from
  // a statement (W9.15): an attribute, never a movement.
  repeated Encumbrance encumbrances = 14;
  // Derived, never reported: the quantity on free_basis less its
  // encumbrances. Unset while that quantity is unknown (some not stated).
  optional Decimal free_quantity = 15;
  FreeBasis free_basis = 16;
  // The sleeve within the account (W9's invariants; the order-path plan's
  // refresh, Q33; contract v22): a position is keyed by account,
  // instrument, side and sleeve. Empty for the account's unsleeved part, as
  // every position before v22 is.
  string sleeve = 17;
}

// The basis a position's free quantity is computed on.
enum FreeBasis {
  FREE_BASIS_UNSPECIFIED = 0;
  // Settled: a pledged or lent security that has not settled cannot be
  // delivered either (the product owner, 2026-10-01, Q2). The book's
  // default, and in v8 its only basis.
  FREE_BASIS_SETTLED = 1;
  FREE_BASIS_TRADE_DATE = 2;
}

// One encumbrance of a position, as the book holds it.
message Encumbrance {
  // PLEDGED to OTHER only; the street's PENDING, REHYPOTHECATED and
  // BORROWED are refused.
  EncumbranceKind kind = 1;
  // Signed as the position's quantity.
  Decimal quantity = 2;
  string pledgee = 3;
  string held_at = 4;
  // Unset where the source names none.
  MarginAgreementRef agreement = 5;
  // The source's code, verbatim; required for OTHER.
  string source_code = 6;
  string detail = 7;
  // The statement it was recorded from.
  StreetRecordRef source = 8;
  // Set by the book: the business date it was first recorded under its
  // kind, pledgee, location and agreement, and the change that last set it.
  string since_date = 9;
  JournalRef set_by = 10;
}

// One position's encumbrances, as a statement states them: the whole set,
// empty when the statement reports none.
message PositionEncumbrances {
  string instrument_id = 1;
  HoldingSide side = 2;
  repeated Encumbrance encumbrances = 3;
}

// W9.15. A finding, so the plugin may send it as itself.
message RecordEncumbrancesRequest {
  string account_id = 1;
  string business_date = 2;
  // The statement they were read from.
  StreetRecordRef source = 3;
  repeated PositionEncumbrances positions = 4;
  // The plugin's key for this command, derived from its source (Q12).
  string idempotency_key = 5;
}

message PendingSettlement {
  // ISO 8601. Required at an opening balance (v9); empty on a position only
  // for "date not stated", from a v8 opening balance or an adjustment the
  // street gave no date for.
  string value_date = 1;
  Decimal quantity = 2;
  PendingState state = 3;
}

message Lot {
  // Minted by the book.
  string lot_id = 1;
  Decimal open_quantity = 2;
  Decimal original_quantity = 3;
  // As opened, with each basis adjustment applied.
  LotTerms terms = 4;
  JournalRef opened_by = 5;
  repeated JournalRef relieved_by = 6;
  repeated JournalRef adjusted_by = 7;
  // Its position's sleeve (contract v22); empty for the unsleeved part.
  string sleeve = 8;
  // Contract v27 (W9.10; rulings 320 and 396): each relief of the lot, in
  // order, with what the quantity relieved was sold for, so a reader
  // computes realized P&L; the book stores nothing derived. Empty for a lot
  // never relieved, and for a relief before v27 the upgrade could not
  // backfill from its execution.
  repeated LotRelief reliefs = 9;
}

// One relief of a lot (contract v27; W9.10).
message LotRelief {
  // The entry that relieved it, also listed in Lot.relieved_by.
  JournalRef relieved_by = 1;
  // The quantity relieved, positive.
  Decimal quantity = 2;
  // What that quantity was sold for, in the execution's asset, fees apart
  // as the execution states them; unset for a relief with no execution
  // behind it (a transfer out, a correction), never zero.
  Money proceeds = 3;
  // ISO 8601: the execution's trade date; empty with no execution.
  string trade_date = 4;
}

// ── W9.1: the opening balance ──

enum OpeningSourceKind {
  OPENING_SOURCE_KIND_UNSPECIFIED = 0;
  OPENING_SOURCE_KIND_CUSTODIAN = 1;
  OPENING_SOURCE_KIND_PRIOR_SYSTEM = 2;
}

enum PositionBasis {
  POSITION_BASIS_UNSPECIFIED = 0;
  POSITION_BASIS_TRADE_DATE = 1;
  POSITION_BASIS_SETTLE_DATE = 2;
}

message OpeningSource {
  OpeningSourceKind kind = 1;
  // The custodian or system as it is known in the deployment (the external
  // account's institution, the prior system's name).
  string name = 2;
  // ISO 8601: the date the source's figures are as of.
  string as_of_date = 3;
  PositionBasis basis = 4;
  // The street records it was composed from, by value (decisions/012).
  repeated StreetRecordRef street_records = 5;
}

// A street record named by value: never a key the book follows.
message StreetRecordRef {
  string statement_id = 1;
  // The custodial position's change, where one was compared or used.
  JournalRef change = 2;
  // ISO 8601: the custodian's as-of date.
  string as_of_date = 3;
}

message OpeningPosition {
  string instrument_id = 1;
  HoldingSide side = 2;
  Decimal trade_date_quantity = 3;
  // Required (v9): where the source states none, a person supplies it.
  // Unset, the opening balance is refused (REFUSAL_REASON_INCOMPLETE).
  optional Decimal settled_quantity = 4;
  // Each with its value date; with the settled quantity they account for
  // the whole trade-date quantity, or the balance is refused.
  repeated PendingSettlement pending = 5;
  // As reported and completed by a person, each with its quantity, cost and
  // acquisition date; required but on cash, which sends none (v9).
  repeated OpeningLot lots = 6;
}

message OpeningLot {
  Decimal quantity = 1;
  LotTerms terms = 2;
}

message RecordOpeningBalanceRequest {
  string account_id = 1;
  // ISO 8601: the business date it stands for (D0).
  string as_of_date = 2;
  // One per custodian or system it was composed from.
  repeated OpeningSource sources = 3;
  // Empty: the account enters holding nothing.
  repeated OpeningPosition positions = 4;
  string reason = 5;
  // The reversed opening balance this replaces (Q27); empty for the first.
  string replaces_entry_id = 6;
  // The plugin's key for this command, derived from its source (Q12 of the
  // sample operations plugin, ruled 2026-10-01, as FIX's ClOrdID): unique per
  // account; the same command again with the same key is answered with the
  // first's reply and applies nothing, and a different command with it is
  // refused (REFUSAL_REASON_IDEMPOTENCY_CONFLICT). Empty: none.
  string idempotency_key = 7;
}

// The account's standing opening balance, set by the book when it journals
// W9.1 and cleared when it is reversed (Q21 of the sample operations plugin,
// ruled 2026-10-01): its entry, D0 and sources, read on the account's
// attributes (W9.14).
message OpeningBalance {
  string entry_id = 1;
  // ISO 8601: D0.
  string as_of_date = 2;
  // As recorded, the street records it was composed from among them.
  repeated OpeningSource sources = 3;
  Actor recorded_by = 4;
  JournalRef journal = 5;
  // The reason the person gave.
  string reason = 6;
}

// ── W9.4 to W9.7: breaks ──

enum BreakState {
  BREAK_STATE_UNSPECIFIED = 0;
  BREAK_STATE_OPEN = 1;
  BREAK_STATE_RESOLVED = 2;
  BREAK_STATE_CLOSED = 3;
}

enum BreakCategory {
  BREAK_CATEGORY_UNSPECIFIED = 0;
  BREAK_CATEGORY_TRADE_DATE_QUANTITY = 1;
  BREAK_CATEGORY_SETTLED_QUANTITY = 2;
  BREAK_CATEGORY_COST_OR_LOTS = 3;
  BREAK_CATEGORY_SETTLED_AGAINST_PENDING = 4;
  BREAK_CATEGORY_BOOK_ONLY = 5;
  BREAK_CATEGORY_STREET_ONLY = 6;
  // A figure the book holds a value of its own for, such as the street's
  // available and not available against the book's position, or an
  // encumbrance against the book's of that kind, location and pledgee.
  BREAK_CATEGORY_FIGURE = 7;
  // Contract v24 (W9.3; the one-ID model, ruled 2026-10-14): a statement row
  // the street kept unresolved because its source is thinner than an
  // instrument record's minimum (W3.7). No instrument and no position: the
  // break names the street record by value. ISO 15022/20022's DSEC.
  BREAK_CATEGORY_UNRECOGNIZED_SECURITY = 8;
}

enum BreakCauseCategory {
  BREAK_CAUSE_CATEGORY_UNSPECIFIED = 0;
  BREAK_CAUSE_CATEGORY_UNBOOKED_TRADE = 1;
  BREAK_CAUSE_CATEGORY_SETTLEMENT_TIMING = 2;
  BREAK_CAUSE_CATEGORY_COST_OR_PRICE = 3;
  BREAK_CAUSE_CATEGORY_CORPORATE_ACTION = 4;
  BREAK_CAUSE_CATEGORY_FAIL = 5;
  BREAK_CAUSE_CATEGORY_CUSTODIAN_ERROR = 6;
  BREAK_CAUSE_CATEGORY_UNKNOWN = 7;
  // Income the custodian reinvested in units, which the book has not
  // booked: a money market fund's monthly dividend (contract v14).
  BREAK_CAUSE_CATEGORY_INCOME_REINVESTED = 8;
  // A pending value date that is not a business day on its calendars
  // (W9.4; spec/settlement-calendars-are-core-reference-data, requirement 14
  // and Q9; contract v22): the cause names the date read's check
  // (BreakCause.date_check). The book never moves the date itself.
  BREAK_CAUSE_CATEGORY_VALUE_DATE_NOT_BUSINESS_DAY = 9;
}

message PositionKey {
  string instrument_id = 1;
  HoldingSide side = 2;
}

message FigureKey {
  MarginAgreementRef agreement = 1;
  // The figure, by its field's name in the data dictionary.
  string figure = 2;
  // For a collateral balance: its instrument.
  string instrument_id = 3;
}

// One side of a difference; unset: absent on that side.
message BreakValue {
  oneof value {
    Decimal quantity = 1;
    Money amount = 2;
    string text = 3;
  }
}

message BreakDifference {
  // The field, by its name in the data dictionary ("settled_quantity",
  // "lots[2].terms.cost").
  string field = 1;
  BreakValue book = 2;
  BreakValue street = 3;
}

message PendingSettlementRef {
  string instrument_id = 1;
  HoldingSide side = 2;
  string value_date = 3;
}

// The item found to cause a break, linked by value (Q23's target).
message BreakCause {
  BreakCauseCategory category = 1;
  oneof item {
    StreetRecordRef street_record = 2;
    JournalRef book_entry = 3;
    PendingSettlementRef pending_settlement = 4;
    // A corporate action's reference, as reported.
    string event_reference = 5;
    bool none_found = 6;
    // The custodian's activity that explains it (contract v14).
    ActivityRef activity = 8;
    // The date read's check of a pending value date (W3.20, W9.4; contract
    // v22): beside BREAK_CAUSE_CATEGORY_VALUE_DATE_NOT_BUSINESS_DAY.
    DateCheck date_check = 9;
  }
  string note = 7;
}

// What the date read found of one date (W3.20, W9.4; the calendars spec's
// requirement 14; contract v22): the date, the calendars and their versions
// it was checked on, and why the day is closed.
message DateCheck {
  // ISO 8601.
  string date = 1;
  // Each calendar it was checked on, with its version.
  repeated CalendarRef calendars = 2;
  // Why the day is closed.
  DateCheckReason reason = 3;
  // On a holiday: its name as the source gives it.
  string holiday_name = 4;
}

// Why a date is not a business day (the calendars spec's requirement 14;
// contract v22).
enum DateCheckReason {
  DATE_CHECK_REASON_UNSPECIFIED = 0;
  // A weekend day on one of the calendars, not listed open.
  DATE_CHECK_REASON_WEEKEND = 1;
  // A closed day listed on one of the calendars, with its name.
  DATE_CHECK_REASON_HOLIDAY = 2;
  // Outside a calendar's coverage: not known, never a business day.
  DATE_CHECK_REASON_OUTSIDE_COVERAGE = 3;
}

// An activity the street recorded (W2.12), named by value: never a key the
// book follows, and recorded as given (decisions/012).
message ActivityRef {
  // The street's identifier for the activity.
  string activity_id = 1;
  // Its record in the street's partition.
  JournalRef change = 2;
  // ISO 8601: the activity's trade date, as the custodian stated it.
  string trade_date = 3;
}

message BreakHandling {
  // A user the deployment knows (W6.1): one granted write on the account
  // through the plugin, or the person taking it (Q11 of the sample
  // operations plugin, ruled 2026-10-01).
  string owner_subject = 1;
  // The operations plugin's own levels; core gives them no meaning.
  uint32 escalation_level = 2;
  // ISO 8601.
  string due_date = 3;
}

message BreakResolution {
  // Resolved: the entries that corrected the book.
  repeated JournalRef entries = 1;
  // Closed: the explanation, no entry.
  string explanation = 2;
  Actor actor = 3;
  string reason = 4;
  // Closed as cleared: the street record where the difference was gone (Q2
  // of the sample operations plugin, ruled 2026-10-01).
  StreetRecordRef cleared_at = 5;
}

message Break {
  string break_id = 1;
  string account_id = 2;
  oneof subject {
    PositionKey position = 3;
    FigureKey figure = 4;
  }
  BreakCategory category = 5;
  repeated BreakDifference differences = 6;
  Watermark book_watermark = 7;
  StreetRecordRef street = 8;
  // ISO 8601 business dates; age is derived from them, never stored.
  string first_seen_date = 9;
  string last_seen_date = 10;
  BreakState state = 11;
  repeated BreakCause candidate_causes = 12;
  BreakCause confirmed_cause = 13;
  BreakHandling handling = 14;
  BreakResolution resolution = 15;
  Actor recorded_by = 16;
  JournalRef last_change = 17;
  // An unrecognized security's identifiers, as the street row carries them
  // (W9.3, contract v25): what an open break of that category is matched
  // on, scheme and value in any order, with its category and account.
  // Empty on every other break.
  repeated Identifier unresolved_identifiers = 18;
}

// W9.4. A new break, or an open one brought up to date.
message RecordBreakRequest {
  string account_id = 1;
  // Empty: a new break, whose identifier the book mints.
  string break_id = 2;
  oneof subject {
    PositionKey position = 3;
    FigureKey figure = 4;
  }
  BreakCategory category = 5;
  repeated BreakDifference differences = 6;
  Watermark book_watermark = 7;
  StreetRecordRef street = 8;
  // The reconciliation's business date: first seen for a new break, last
  // seen for one brought up to date.
  string business_date = 9;
  repeated BreakCause candidate_causes = 10;
  // The plugin's key for this command, derived from its source (Q12):
  // answered with the first's reply when it is sent again.
  string idempotency_key = 11;
  // For BREAK_CATEGORY_UNRECOGNIZED_SECURITY, the street row's
  // unresolved_identifiers (W9.3, contract v25), at least one; refused on
  // any other category. Until v25 they rode as the break's street-only
  // differences.
  repeated Identifier unresolved_identifiers = 12;
}

// W9.6. For a person.
message HandleBreakRequest {
  string account_id = 1;
  string break_id = 2;
  // Unset: unchanged.
  BreakCause confirmed_cause = 3;
  // Unset: unchanged; set: replaces the handling whole.
  BreakHandling handling = 4;
  string reason = 5;
  // The plugin's key for this command (Q12).
  string idempotency_key = 6;
}

// W9.7. For a person.
message ResolveBreakRequest {
  string account_id = 1;
  repeated string break_ids = 2;
  string reason = 3;
  oneof resolution {
    // The correcting entry, journalled in the same act.
    Adjustment adjustment = 4;
    Reversal reversal = 5;
    // Entries already recorded.
    ResolvedByEntries entries = 6;
    // Closes the breaks, with no entry.
    string explanation = 7;
  }
  // The plugin's key for this command (Q12).
  string idempotency_key = 9;
}

// W9.7. Close breaks as cleared, with no entry.
// Citing the statement where the difference was gone (Q2 of the sample operations plugin, ruled
// 2026-10-01: one typed operation a person takes; an opt-in automation runs
// it as a service account once
// sdk-contract/a-service-account-runs-a-plugins-autonomous-work lands, its
// actor an arm of Actor of its own). For a person until then.
message CloseBreaksAsClearedRequest {
  string account_id = 1;
  repeated string break_ids = 2;
  // The street record of the statement where the difference was gone, by
  // value.
  StreetRecordRef cleared_at = 3;
  string reason = 4;
  // The plugin's key for this command (Q12).
  string idempotency_key = 5;
}

// Step 5's non-order transaction's first kind (Q28). Slice D adds the
// cash-flow class and the other kinds as fields of their own (Q20).
message Adjustment {
  // After the opening balance's date.
  string effective_date = 1;
  repeated MovementLine lines = 2;
  repeated BasisAdjustment basis_adjustments = 3;
  // A corporate action's reference, as reported, where it records one; from
  // contract v14, the activity's identifier (W2.12) where the adjustment was
  // proposed from the custodian's activity.
  string event_reference = 4;
}

// Names the entry it reverses; the book negates its lines, at that entry's
// effective date.
message Reversal {
  string entry_id = 1;
}

message ResolvedByEntries {
  repeated string entry_ids = 1;
}

// ── W9.5: figures per margin agreement, as reported ──

message MarginAgreementRef {
  oneof agreement {
    // Step 4: the statement's external account and segment (Q12). An
    // agreement the book records under a template arrives as another arm.
    StatementSegmentRef statement_segment = 1;
  }
}

message StatementSegmentRef {
  string external_account_id = 1;
  // As the venue names it; empty for the account as a whole.
  string segment = 2;
  // As reported: the external account's institution.
  string counterparty = 3;
}

// The custodian's, labelled as such (Q8, revised and ruled); never a
// position's own.
message ReportedPositionValue {
  string instrument_id = 1;
  HoldingSide side = 2;
  optional Money market_value = 3;
  optional Money margin_requirement = 4;
}

message AgreementFigures {
  MarginAgreementRef agreement = 1;
  // As the street recorded them (W2.2), its segment equal to the
  // agreement's.
  StatementFigures figures = 2;
  // On the set with no segment only.
  repeated ReportedPositionValue position_values = 3;
}

message RecordAccountFiguresRequest {
  string account_id = 1;
  string business_date = 2;
  StreetRecordRef source = 3;
  repeated AgreementFigures agreements = 4;
  // The plugin's key for this command, derived from its source (Q12).
  string idempotency_key = 5;
}

// The record: one per account, agreement and business date.
message AccountFigures {
  string account_id = 1;
  string business_date = 2;
  MarginAgreementRef agreement = 3;
  StatementFigures figures = 4;
  repeated ReportedPositionValue position_values = 5;
  StreetRecordRef source = 6;
  JournalRef last_change = 7;
}

// ── Every command's answer, after commit ──

message BookEntryReply {
  // A duplicate, by its message identifier or its idempotency key, is
  // answered with the first's.
  EntryMeta entry = 1;
  // The entry's place in its partition: the number of the first change it
  // made.
  JournalRef journal = 2;
  // Each record the entry changed, as it stands after it.
  repeated BookPosition positions = 3;
  repeated Break breaks = 4;
  repeated AccountFigures figures = 5;
  // The account's attributes, where the entry changed them: an opening
  // balance and its reversal set and clear the standing one (Q21).
  AccountAttributes attributes = 6;
}

// ── W9.8: deliveries, records whole ──

message PositionChangedEvent {
  BookPosition position = 1;
  Decimal previous_trade_date_quantity = 2;
  EntryMeta entry = 3;
  JournalRef journal = 4;
  ChangeCause cause = 5;
}

message BreakChangedEvent {
  // Not `break`, a keyword in the SDKs' languages.
  Break break_record = 1;
  EntryMeta entry = 2;
  JournalRef journal = 3;
  ChangeCause cause = 4;
}

message AccountFiguresRecordedEvent {
  AccountFigures figures = 1;
  EntryMeta entry = 2;
  JournalRef journal = 3;
  ChangeCause cause = 4;
}

// ── W9.10 to W9.12: reads ──

message ListPositionsRequest {
  // Empty: every account in the reader's scope.
  string account_id = 1;
  // Only positions whose last change is above it, tombstones included.
  Watermark since = 2;
  // The positions at the end of this business date (Q22), as known at
  // `at`, or now; served by replay. Neither with `since`.
  string business_date = 3;
  Watermark at = 4;
  int32 page_size = 5;
  string cursor = 6;
}

message ListPositionsReply {
  repeated BookPosition positions = 1;
  string next_cursor = 2;
  Watermark as_of = 3;
}

message ListBreaksRequest {
  string account_id = 1;
  // Empty: every state.
  repeated BreakState states = 2;
  Watermark since = 3;
  int32 page_size = 4;
  string cursor = 5;
}

message ListBreaksReply {
  repeated Break breaks = 1;
  string next_cursor = 2;
  Watermark as_of = 3;
}

message ListAccountFiguresRequest {
  string account_id = 1;
  // Unset: every agreement.
  MarginAgreementRef agreement = 2;
  // ISO 8601 business dates, inclusive; empty for open-ended.
  string from_date = 3;
  string to_date = 4;
  Watermark since = 5;
  Watermark at = 6;
  int32 page_size = 7;
  string cursor = 8;
}

message ListAccountFiguresReply {
  repeated AccountFigures figures = 1;
  string next_cursor = 2;
  Watermark as_of = 3;
}

// ── W9.13, W9.14: the account's attributes (Q21; step 5's names) ──

enum LotReliefMethod {
  LOT_RELIEF_METHOD_UNSPECIFIED = 0;
  LOT_RELIEF_METHOD_FIRST_IN_FIRST_OUT = 1;
  LOT_RELIEF_METHOD_LAST_IN_FIRST_OUT = 2;
  LOT_RELIEF_METHOD_HIGHEST_COST = 3;
  LOT_RELIEF_METHOD_LOWEST_COST = 4;
  LOT_RELIEF_METHOD_AVERAGE_COST = 5;
}

message AccountAttributes {
  string account_id = 1;
  // ISO 4217 until the money revision names an asset
  // (sdk-contract/money-names-an-asset-not-only-an-iso-currency).
  string base_currency_code = 2;
  LotReliefMethod lot_relief_default = 3;
  JournalRef last_change = 4;
  // The standing opening balance, set by the book when it journals W9.1;
  // unset while none stands (Q21 of the sample operations plugin, ruled
  // 2026-10-01).
  OpeningBalance opening_balance = 5;
  // Whether a release waits until every compliance plugin covering the
  // account has answered on the order's version (W9.13, W11.6; step 5's Q5;
  // contract v22). True for a new account and for every account the book
  // held at the upgrade, recorded so (decisions/031); the book always
  // states it, so false is a deployment admin's act with its reason.
  bool waits_for_compliance = 6;
  // Contract v24 (W9.13; the order-path plan's v24 item 10): a booking may
  // allocate to it without the instruction naming it, each allocation
  // carrying its reason and ErrorCause and raising an alert (W11.27,
  // W11.34). A deployment admin's mark; unmarking is recorded, and past
  // allocations keep their flag.
  bool error_account = 7;
  // Contract v24 (W9.13; the order-path plan's v24 item 7): a block order's
  // account, with no statement to reconcile against, flat once booked; a
  // balance left after booking holds the booking (W11.28).
  bool allocation_account = 8;
  // Contract v26 (W9.13, W12.2; ruling 316, 2026-10-18): the platform's ID
  // of the base currency's cash instrument, which the book resolves from
  // base_currency_code when the base is set and keeps; empty while the
  // instrument store has not resolved the code. What the analytics
  // component values an account in.
  string base_cash_instrument_id = 9;
}

message SetAccountAttributeRequest {
  string account_id = 1;
  oneof attribute {
    string base_currency_code = 2;
    LotReliefMethod lot_relief_default = 3;
    // Contract v22 (W9.13): a deployment admin's, from the dashboard or
    // dashboard__set_account_attribute (the order-path plan's refresh, Q44).
    bool waits_for_compliance = 5;
    // Contract v24 (W9.13): a deployment admin's, each change its own
    // record with its reason.
    bool error_account = 6;
    bool allocation_account = 7;
  }
  string reason = 4;
}

message AccountAttributeReply {
  AccountAttributes attributes = 1;
  EntryMeta entry = 2;
  JournalRef journal = 3;
}

message AccountAttributeChangedEvent {
  AccountAttributes attributes = 1;
  EntryMeta entry = 2;
  JournalRef journal = 3;
  ChangeCause cause = 4;
}

message ListAccountAttributesRequest {
  string account_id = 1;
  Watermark since = 2;
  int32 page_size = 3;
  string cursor = 4;
}

message ListAccountAttributesReply {
  repeated AccountAttributes attributes = 1;
  string next_cursor = 2;
  Watermark as_of = 3;
}

// ── W11: the order lifecycle, slice A (contract v22) ──

// sdk-contract/an-order-reaches-a-venue-contract: step 5's slice A
// (spec/one-order-lifecycle-in-the-book) with step 6's order half
// (spec/vendor-differences-have-a-place-in-the-contract), as
// plans/an-order-reaches-a-venue-through-the-book builds it; every name
// approved 2026-10-12. The book owns order state: plugins ask (a command)
// and report (a fact); the book decides, journals and publishes, and an
// order's status and quantities are a fold over its journal, never stored as
// facts (decisions/035). A command the table does not allow is refused with
// its reason; a venue's fact is never refused for the state it arrives in,
// and one the book cannot place is kept as an unplaced fact. Core records;
// it does not police (step 5's Q1). The street holds none of it.
//
// Every quantity is a Decimal at its instrument's scale and every amount a
// Money naming its cash instrument (decisions/023 as amended in v18). Every
// command is answered after its entry commits, in the order's account
// partition, and applied once on its envelope's identifier or its
// idempotency key; a venue fact once on its venue identifiers.
//
// Write scope (W4.9, W11's invariants; the order-path plan's protos, point
// 8, ruled 2026-10-12): a command naming an order, a placement, a change
// request or a locate by its ID alone is admitted by the sidecar on its
// role's grant and stamped with the sending instance's write scope and the
// person's write access (MessageMeta.account_scope); the book resolves the
// record's account and refuses, changing nothing, a command whose account
// is outside them (PERMISSION_DENIED, no reason code). A venue's fact is
// placed in no account outside the connectivity plugin's scope: it is kept
// unplaced.

// ── The lists (decisions/035): states, conditions and their causes ──

// An order is in exactly one of seven states (W11's invariants).
enum OrderState {
  ORDER_STATE_UNSPECIFIED = 0;
  // Proposed, not released: the gate has not passed it (W11.1, W11.6).
  ORDER_STATE_PROPOSED = 1;
  // Ended before release: a check's refuse, or the `oms`'s rejection
  // (W11.4, W11.5). Terminal.
  ORDER_STATE_REFUSED = 2;
  // Released for working, nothing committed or filled yet (W11.6).
  ORDER_STATE_RELEASED = 3;
  // Released with quantity committed at a placement or a child order, or
  // filled in part.
  ORDER_STATE_WORKING = 4;
  // Reported filled reached ordered.
  ORDER_STATE_FILLED = 5;
  // Ended by a cancel, the firm's or the venue's. Terminal.
  ORDER_STATE_CANCELLED = 6;
  // Its time in force ended, by the deployment's clock (W11.13). Terminal.
  ORDER_STATE_EXPIRED = 7;
}

// The nine conditions an order holds beside its state, each with its reason
// and the actor that set it.
enum OrderCondition {
  ORDER_CONDITION_UNSPECIFIED = 0;
  // A change request is outstanding (W11.3; requirement 16).
  ORDER_CONDITION_CHANGE_REQUESTED = 1;
  // `compliance` requires approval by its policy (W11.5).
  ORDER_CONDITION_APPROVAL_REQUIRED = 2;
  // The account waits for compliance and a compliance plugin covering it
  // has not answered on this version (W11.6; step 5's Q5).
  ORDER_CONDITION_AWAITING_CHECK = 3;
  // Claimed to work it, by an instance for a user (W11.7).
  ORDER_CONDITION_CLAIMED = 4;
  ORDER_CONDITION_HELD = 5;
  // Its working paused: not the trading instruction's pause (Q31).
  ORDER_CONDITION_PAUSED = 6;
  // A placement's outcome is not known (W11.10; requirement 20).
  ORDER_CONDITION_OUTCOME_UNKNOWN = 7;
  // Its quantities do not tie out -- an overfill, or a restatement past its
  // intent (Q15, Q16, Q21) -- until an alignment, a booking to an error
  // account (slice B) or a bust clears it. Never acknowledged.
  ORDER_CONDITION_DOES_NOT_TIE_OUT = 8;
  // A fact arrived after the state it would have changed ended (#12):
  // recorded, flagged, acknowledged by a person (W11.14).
  ORDER_CONDITION_LATE_FACT = 9;
}

// A placement is in one of eight states.
enum PlacementState {
  PLACEMENT_STATE_UNSPECIFIED = 0;
  // Created, not yet sent.
  PLACEMENT_STATE_QUEUED = 1;
  // Sent, not acknowledged.
  PLACEMENT_STATE_SENT = 2;
  // Acknowledged by the venue.
  PLACEMENT_STATE_WORKING = 3;
  // Ended for the day by the venue; not terminal for a good-till-cancelled
  // order, whose quantity stays committed (#20).
  PLACEMENT_STATE_DONE_FOR_DAY = 4;
  PLACEMENT_STATE_FILLED = 5;
  PLACEMENT_STATE_CANCELLED = 6;
  PLACEMENT_STATE_EXPIRED = 7;
  // Refused by the venue, or held back by the connectivity plugin's own
  // pre-trade check, with its RejectionReason.
  PLACEMENT_STATE_REJECTED = 8;
}

// The conditions a placement holds beside its state.
enum PlacementCondition {
  PLACEMENT_CONDITION_UNSPECIFIED = 0;
  PLACEMENT_CONDITION_CHANGE_REQUESTED = 1;
  // With its UnknownReason; its quantity stays committed.
  PLACEMENT_CONDITION_OUTCOME_UNKNOWN = 2;
  // Halted by the venue, which may leave its state unchanged.
  PLACEMENT_CONDITION_SUSPENDED = 3;
  // Held at the venue until a stop or a condition triggers.
  PLACEMENT_CONDITION_AWAITING_TRIGGER = 4;
  // Contract v27 (W11.8): sent while its reference price was past its
  // ceiling, the `ems` admin having chosen to warn; its StaleReference on
  // the condition. A record of the warning, never a refusal.
  PLACEMENT_CONDITION_SENT_ON_STALE_REFERENCE = 5;
}

// Contract v27 (W11.8; spec/the-contract-gaps-v26-and-v27-close, B1 to B9):
// how a placement is executed, set by the `ems` at its creation and never
// changed, as FIX's HandlInst (21) is fixed for an order's life.
// Unspecified is read as DMA: a placement from v22 to v26, never backfilled.
enum PlacementType {
  PLACEMENT_TYPE_UNSPECIFIED = 0;
  // Direct market access: HandlInst 1 at the edge; carries no strategy.
  PLACEMENT_TYPE_DMA = 1;
  // A broker's algorithm: HandlInst 1 or 2 with its strategy, which it
  // requires.
  PLACEMENT_TYPE_ALGO = 2;
  // Worked by a broker: HandlInst 3 with ExecInst Not held; carries no
  // strategy.
  PLACEMENT_TYPE_CARE = 3;
  // A request for quote: a QuoteRequest, then the picked quote hit as
  // OrdType D (Previously quoted) with its QuoteID; the only type an order
  // of ORDER_TYPE_REQUEST_FOR_QUOTE takes.
  PLACEMENT_TYPE_RFQ = 4;
  // Agreed by phone or chat: names no connectivity instance, delivered to
  // none, its fills the `ems`'s manual entries for a person.
  PLACEMENT_TYPE_MANUAL = 5;
}

// Contract v27 (W11.40): what became of a dealer's quote on an RFQ placement.
enum PlacementQuoteOutcome {
  PLACEMENT_QUOTE_OUTCOME_UNSPECIFIED = 0;
  // Received and standing.
  PLACEMENT_QUOTE_OUTCOME_OPEN = 1;
  // Picked by the `ems` (W11.41); the acceptance not yet confirmed.
  PLACEMENT_QUOTE_OUTCOME_PICKED = 2;
  // Accepted at the venue; its fill is reported as on any placement.
  PLACEMENT_QUOTE_OUTCOME_ACCEPTED = 3;
  // Past its valid-until time, or ended by the venue, unpicked or before
  // the acceptance.
  PLACEMENT_QUOTE_OUTCOME_EXPIRED = 4;
  // Withdrawn by its dealer.
  PLACEMENT_QUOTE_OUTCOME_WITHDRAWN = 5;
  // Another quote was accepted.
  PLACEMENT_QUOTE_OUTCOME_NOT_PICKED = 6;
}

// Contract v27 (W11.7; spec/sessions-and-data-report-their-latency-and-quality,
// rulings 374 and 420): why an order is held, typed, beside the words.
enum HoldCause {
  // A hold with no typed cause, as every hold before v27.
  HOLD_CAUSE_UNSPECIFIED = 0;
  // The `ems`'s reference price was past its stale ceiling at its
  // pre-trade check, its admin having chosen to refuse.
  HOLD_CAUSE_REFERENCE_PRICE_STALE = 1;
}

// Contract v27 (W11.11; the gaps spec's D4): which convention set an
// internal cross's rate on a net order. Core supports both; the plugin
// chooses.
enum CrossRateSource {
  CROSS_RATE_SOURCE_UNSPECIFIED = 0;
  // The net's street rate for every member: the platforms' allocate-back.
  CROSS_RATE_SOURCE_NET_STREET_RATE = 1;
  // The mid at the netting moment.
  CROSS_RATE_SOURCE_MID_AT_NETTING = 2;
}

// ── The order's values (step 5's Q26; step 6) ──

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
  // With the locate it names (Order.locate_id, W11.18).
  SIDE_SELL_SHORT = 3;
  SIDE_SELL_SHORT_EXEMPT = 4;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_MARKET = 1;
  ORDER_TYPE_LIMIT = 2;
  ORDER_TYPE_STOP = 3;
  ORDER_TYPE_STOP_LIMIT = 4;
  // An RFQ order: from contract v27 its quotes and outcomes are on its RFQ
  // placement (W11.40, W11.41), the buy side as initiator only.
  ORDER_TYPE_REQUEST_FOR_QUOTE = 5;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_DAY = 1;
  TIME_IN_FORCE_GOOD_TILL_CANCELLED = 2;
  TIME_IN_FORCE_GOOD_TILL_DATE = 3;
  // With a kill time.
  TIME_IN_FORCE_GOOD_TILL_TIME = 4;
  TIME_IN_FORCE_IMMEDIATE_OR_CANCEL = 5;
  TIME_IN_FORCE_FILL_OR_KILL = 6;
  TIME_IN_FORCE_AT_THE_OPEN = 7;
  TIME_IN_FORCE_AT_THE_CLOSE = 8;
}

// For a broker's order, set by the `oms`.
enum Capacity {
  CAPACITY_UNSPECIFIED = 0;
  CAPACITY_AGENCY = 1;
  CAPACITY_PRINCIPAL = 2;
  CAPACITY_RISKLESS_PRINCIPAL = 3;
  CAPACITY_MIXED = 4;
}

// Whether an order was received from a client (Q23).
enum OrderDirection {
  // The firm's own order, unmarked.
  ORDER_DIRECTION_UNSPECIFIED = 0;
  // A client's order, proposed by the `portfolio` intake standing for the
  // client's portfolio manager.
  ORDER_DIRECTION_RECEIVED = 1;
}

// Where an order the book did not create came from (W11.2).
enum OrderOrigin {
  // An order the book created: proposed (W11.1).
  ORDER_ORIGIN_UNSPECIFIED = 0;
  // A connectivity plugin records no order (ruled 2026-10-13): a
  // venue-originated fill is v23's.
  reserved 1;
  reserved "ORDER_ORIGIN_VENUE";
  // A telephoned or outside order, recorded by the `oms` for a person.
  ORDER_ORIGIN_TELEPHONED = 2;
  // An order made from venue-originated fills the `ems` accepted (W11.23;
  // contract v23): entered after the trade, filled, never gated.
  ORDER_ORIGIN_ACCEPTED_EXECUTION = 3;
}

// A precision a time was stated in (the order-path plan's refresh, Q38).
enum TimePrecision {
  TIME_PRECISION_UNSPECIFIED = 0;
  TIME_PRECISION_SECOND = 1;
  TIME_PRECISION_MILLISECOND = 2;
  TIME_PRECISION_MICROSECOND = 3;
  TIME_PRECISION_NANOSECOND = 4;
}

// The named links (W11.1; step 5's link 1, Q6; the refresh's Q41): split
// from v22, net from v27. Allocation, street order, two-way quote,
// alternatives and basket join with their slices; a block names its members
// on the block order (v24).
enum OrderLinkKind {
  ORDER_LINK_KIND_UNSPECIFIED = 0;
  // A child order an `ems` (or the `oms`) worked out of its parent.
  ORDER_LINK_KIND_SPLIT = 1;
  // Contract v27 (W11.1; the gaps spec's D2): a member of a net order, set
  // by the book on each member when the `oms` proposes the net, naming it
  // as the parent.
  ORDER_LINK_KIND_NET = 2;
}

// Which quote a quote at time of receipt is (the refresh's Q35, as refined
// and ruled 2026-10-12; the values spelled with the enum's prefix, the
// order-path plan's protos, point 9, ruled 2026-10-12).
enum ReceiptQuoteSourceKind {
  RECEIPT_QUOTE_SOURCE_KIND_UNSPECIFIED = 0;
  // The consolidated best bid and offer across venues, the quote Rule 605's
  // statistics reference.
  RECEIPT_QUOTE_SOURCE_KIND_CONSOLIDATED = 1;
  // One named venue's, its `VEN-` ID beside it.
  RECEIPT_QUOTE_SOURCE_KIND_VENUE = 2;
}

// A broker's algorithm the placement asks for (step 6's Q11; Q6 as ruled).
enum StrategyKind {
  STRATEGY_KIND_UNSPECIFIED = 0;
  STRATEGY_KIND_VWAP = 1;
  STRATEGY_KIND_TWAP = 2;
  STRATEGY_KIND_POV = 3;
  STRATEGY_KIND_IS = 4;
}

// The route type a placement's destination is reached by (requirement 56).
enum RouteType {
  ROUTE_TYPE_UNSPECIFIED = 0;
  // To the destination the `ems` chose.
  ROUTE_TYPE_DIRECTED = 1;
  // The broker chooses the destination.
  ROUTE_TYPE_NOT_DIRECTED = 2;
}

// ── Executions (step 5, "Executions") ──

enum ExecutionKind {
  EXECUTION_KIND_UNSPECIFIED = 0;
  EXECUTION_KIND_VENUE_REPORTED = 1;
  // Entered by the `ems` or the `oms`, for a person.
  EXECUTION_KIND_MANUAL = 2;
  // Joins with its two-account act.
  EXECUTION_KIND_FROM_INVENTORY = 3;
  EXECUTION_KIND_DONE_AWAY = 4;
  // Joins with its link.
  EXECUTION_KIND_FROM_CHILD_ORDERS = 5;
  // Joins with its two-account act (Q23).
  EXECUTION_KIND_INTERNAL_CROSS = 6;
  // From a status report where the venue sends no fill, its ID derived
  // deterministically (requirement 33).
  EXECUTION_KIND_INFERRED = 7;
}

enum ExecutionSource {
  EXECUTION_SOURCE_UNSPECIFIED = 0;
  EXECUTION_SOURCE_PRIMARY = 1;
  // Deduplicated against the primary on the venue's identifiers.
  EXECUTION_SOURCE_DROP_COPY = 2;
}

// Where an execution stands between the venue and the `ems` (W11.11, W11.23,
// W11.24; decisions/035 as amended at contract v23): derived from the
// journal as an order's status is, never stored; its transitions are the
// transition table's e-rows.
enum ExecutionState {
  EXECUTION_STATE_UNSPECIFIED = 0;
  // A fill on no order and no placement, its account mapped, waiting for
  // the `ems` to accept it or answer it DK; one a bust or a correction
  // supersedes stays unmatched, and is answered no more.
  EXECUTION_STATE_UNMATCHED = 1;
  // On a placement: every fill v22 records, and an accepted one.
  EXECUTION_STATE_MATCHED = 2;
  // Answered don't know: recorded and closed, never moving a position.
  EXECUTION_STATE_DONT_KNOW = 3;
}

// Why the `ems` does not know a fill, mirroring FIX's DKReason (127)
// (W11.24; contract v23).
enum DkReason {
  DK_REASON_UNSPECIFIED = 0;
  DK_REASON_UNKNOWN_INSTRUMENT = 1;
  DK_REASON_WRONG_SIDE = 2;
  DK_REASON_QUANTITY_EXCEEDS_ORDER = 3;
  DK_REASON_NO_MATCHING_ORDER = 4;
  DK_REASON_PRICE_EXCEEDS_LIMIT = 5;
  DK_REASON_CALCULATION_DIFFERENCE = 6;
  // With text, as FIX requires Text (58) when DKReason is Other.
  DK_REASON_OTHER = 7;
}

// A level with a time per step; a venue with no steps reports final at once.
enum FinalityLevel {
  FINALITY_LEVEL_UNSPECIFIED = 0;
  // A hit awaiting the maker's accept (Q13, last look).
  FINALITY_LEVEL_AWAITING_ACCEPTANCE = 1;
  FINALITY_LEVEL_MATCHED = 2;
  // On chain, in a block.
  FINALITY_LEVEL_INCLUDED = 3;
  FINALITY_LEVEL_FINAL = 4;
  // It did not happen after all: a last-look reject, a revert, a re-org.
  FINALITY_LEVEL_FAILED = 5;
}

// A fee's kind (requirement 26). Grown by revision.
enum FeeKind {
  FEE_KIND_UNSPECIFIED = 0;
  FEE_KIND_EXCHANGE = 1;
  // A venue's cancel fee.
  FEE_KIND_CANCEL = 2;
  // Gas, on an on-chain venue.
  FEE_KIND_NETWORK = 3;
  // Contract v23 (the OANDA batch's item 2): a rolling position's financing,
  // charged at each roll (W11.12); and the broker's commission on a fill, as
  // FIX keeps it apart in Commission (12) and CommType (13).
  FEE_KIND_FINANCING = 4;
  FEE_KIND_COMMISSION = 5;
}

// ── Checks, approvals and changes ──

// Ruled 2026-09-30 (requirement 44).
enum CheckVerdict {
  CHECK_VERDICT_UNSPECIFIED = 0;
  CHECK_VERDICT_PASS = 1;
  CHECK_VERDICT_WARN = 2;
  // Stands until overridden (W11.5); a release is refused while it does.
  CHECK_VERDICT_BLOCK = 3;
  // Ends a proposed order refused; nobody may override it.
  CHECK_VERDICT_REFUSE = 4;
}

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  // `compliance` sets approval required, by policy.
  APPROVAL_DECISION_REQUIRE = 1;
  // A person approves.
  APPROVAL_DECISION_APPROVE = 2;
  // A person overrides a block, with a reason.
  APPROVAL_DECISION_OVERRIDE = 3;
  // The `oms` rejects a proposed order it was asked to work (Q23): the
  // order ends refused.
  APPROVAL_DECISION_REJECT = 4;
}

// What an order's change request asks (W11.3; step 5's Q20).
enum OrderChangeKind {
  ORDER_CHANGE_KIND_UNSPECIFIED = 0;
  // Each live placement and child order asked to cancel; cancelled when
  // none is live.
  ORDER_CHANGE_KIND_CANCEL = 1;
  // Its limit, time in force or execution instructions.
  ORDER_CHANGE_KIND_AMEND = 2;
  // A released order with nothing committed, back to proposed.
  ORDER_CHANGE_KIND_RECALL = 3;
  // A proposal withdrawn by its proposer.
  ORDER_CHANGE_KIND_WITHDRAW = 4;
  // An increase or a reduction, `portfolio`'s, its allocation amended in the
  // same act; or the `oms`'s justified alignment.
  ORDER_CHANGE_KIND_QUANTITY = 5;
}

// What a placement's change request asks (W11.9).
enum PlacementChangeKind {
  PLACEMENT_CHANGE_KIND_UNSPECIFIED = 0;
  PLACEMENT_CHANGE_KIND_CANCEL = 1;
  PLACEMENT_CHANGE_KIND_REPLACE = 2;
}

// ── What the venue did, in the contract's meanings (W11.10) ──

enum PlacementEvent {
  PLACEMENT_EVENT_UNSPECIFIED = 0;
  PLACEMENT_EVENT_SENT = 1;
  // With the venue's order ID and the routing time.
  PLACEMENT_EVENT_ACKNOWLEDGED = 2;
  PLACEMENT_EVENT_REPLACED = 3;
  PLACEMENT_EVENT_DONE_FOR_DAY = 4;
  // With its RestatementReason.
  PLACEMENT_EVENT_RESTATED = 5;
  PLACEMENT_EVENT_SUSPENDED = 6;
  PLACEMENT_EVENT_TRIGGERED = 7;
  PLACEMENT_EVENT_CANCELLED = 8;
  PLACEMENT_EVENT_EXPIRED = 9;
  // With its RejectionReason.
  PLACEMENT_EVENT_REJECTED = 10;
  // With its UnknownReason; never a rejection.
  PLACEMENT_EVENT_OUTCOME_UNKNOWN = 11;
  // An unknown outcome resolved by asking the venue, never by resending.
  PLACEMENT_EVENT_OUTCOME_RESOLVED = 12;
}

// Why a placement was rejected (step 6, "Refusals and rejections"). A
// rejection, not a refusal: core refuses nothing a venue cannot do.
enum RejectionReason {
  REJECTION_REASON_UNSPECIFIED = 0;
  // Asked for what the plugin or the venue does not offer for this account.
  REJECTION_REASON_UNSUPPORTED = 1;
  // The catch-all, the venue's reason beside it in an AsReported only when
  // no contract reason maps.
  REJECTION_REASON_VENUE_REJECTED = 2;
  // The connectivity plugin's own market-access check (Q18).
  REJECTION_REASON_HELD_BY_PRE_TRADE_CHECK = 3;
}

// Why a placement's outcome is unknown (requirement 20).
enum UnknownReason {
  UNKNOWN_REASON_UNSPECIFIED = 0;
  UNKNOWN_REASON_CONNECTION_LOST = 1;
  UNKNOWN_REASON_REQUEST_UNANSWERED = 2;
  // The venue's status as reported beside it.
  UNKNOWN_REASON_VENUE_STATUS_NOT_MAPPED = 3;
}

// A restatement's reason, after FIX's; one beyond the order's intent sets
// late fact and does not tie out (Q15).
enum RestatementReason {
  RESTATEMENT_REASON_UNSPECIFIED = 0;
  RESTATEMENT_REASON_CORPORATE_ACTION = 1;
  RESTATEMENT_REASON_RENEWAL = 2;
  RESTATEMENT_REASON_REPRICING = 3;
  RESTATEMENT_REASON_PARTIAL_DECLINE = 4;
  RESTATEMENT_REASON_CANCEL_ON_HALT = 5;
  RESTATEMENT_REASON_CANCEL_ON_SYSTEM_FAILURE = 6;
  // The venue's option: FIX's "Market (Exchange) option".
  RESTATEMENT_REASON_VENUE_OPTION = 7;
  RESTATEMENT_REASON_OTHER = 8;
}

// Why a fact was kept unplaced (requirement 13; W11.13).
enum UnplacedReason {
  UNPLACED_REASON_UNSPECIFIED = 0;
  // It names a placement the book does not hold.
  UNPLACED_REASON_UNKNOWN_PLACEMENT = 1;
  // Its venue account code maps to no account on the sending connectivity
  // plugin (W11.22).
  UNPLACED_REASON_UNMAPPED_VENUE_ACCOUNT = 2;
  // A venue's recorded order on an incomplete record, gone with the
  // venue-originated path (ruled 2026-10-13).
  reserved 3;
  reserved "UNPLACED_REASON_INSTRUMENT_INCOMPLETE";
  // A value-date roll meeting no pending line on its from date that the
  // sending connectivity plugin's fills or rolls on the code put there
  // (W11.25, contract v23): kept in the account, so operations sees the
  // venue's position and the book's differ.
  UNPLACED_REASON_NOTHING_PENDING = 4;
  // A give-up's answer naming an execution, or an allocation, the book does
  // not hold (W11.32, contract v26): kept whole in UnplacedFact.give_up.
  UNPLACED_REASON_UNKNOWN_EXECUTION = 5;
}

// The standard execution instructions (step 6's requirement 12; FIX's
// ExecInst, tag 18), set by the `oms`; a venue's own parameters are never
// here.
enum ExecutionInstruction {
  EXECUTION_INSTRUCTION_UNSPECIFIED = 0;
  EXECUTION_INSTRUCTION_NOT_HELD = 1;
  EXECUTION_INSTRUCTION_DO_NOT_REDUCE = 2;
  EXECUTION_INSTRUCTION_DO_NOT_INCREASE = 3;
  EXECUTION_INSTRUCTION_REDUCE_ONLY = 4;
  // Self-match prevention, honoured by the connectivity plugin with the
  // venue's own identifier and instruction (step 5, "Self-match and
  // wash-trade prevention").
  EXECUTION_INSTRUCTION_SELF_MATCH_PREVENTION = 5;
}

// Why an order does not tie out (W11's invariants; Q15, Q16).
enum TieOutReason {
  TIE_OUT_REASON_UNSPECIFIED = 0;
  TIE_OUT_REASON_OVERFILL = 1;
  // A restatement past the order's intent.
  TIE_OUT_REASON_RESTATEMENT = 2;
}

// A party's role on an order or an execution.
enum PartyRole {
  PARTY_ROLE_UNSPECIFIED = 0;
  // The client, as delivered.
  PARTY_ROLE_CLIENT = 1;
  // The counterparty, where known.
  PARTY_ROLE_COUNTERPARTY = 2;
  // Contract v29: the firm a trade is given up to for TRACE (6730(c)(9); FIX
  // PartyRole 14).
  PARTY_ROLE_GIVE_UP_FIRM = 3;
  // Contract v29: the contra side's introducing broker (6730(c)(10)).
  PARTY_ROLE_INTRODUCING_BROKER = 4;
}

// Maker or taker (FIX's LastLiquidityInd, tag 851).
enum LiquidityIndicator {
  LIQUIDITY_INDICATOR_UNSPECIFIED = 0;
  // Added liquidity.
  LIQUIDITY_INDICATOR_MAKER = 1;
  // Removed liquidity.
  LIQUIDITY_INDICATOR_TAKER = 2;
}

// A strategy's urgency (step 6's Q11): a few levels, as brokers have.
enum Urgency {
  URGENCY_UNSPECIFIED = 0;
  URGENCY_LOW = 1;
  URGENCY_MEDIUM = 2;
  URGENCY_HIGH = 3;
}

// What became of a change request (requirement 16).
enum ChangeRequestOutcome {
  CHANGE_REQUEST_OUTCOME_UNSPECIFIED = 0;
  // Outstanding: the order or placement holds change requested.
  CHANGE_REQUEST_OUTCOME_PENDING = 1;
  CHANGE_REQUEST_OUTCOME_APPLIED = 2;
  // Refused by the venue, as FIX's OrderCancelReject (9).
  CHANGE_REQUEST_OUTCOME_REJECTED = 3;
}

// ── The trading instructions (W11.15; step 5's Q31, Q32) ──

// Conventions each plugin honours; the book refuses and cancels nothing for
// any (Q1, Q18). The most restrictive in force governs.
enum TradingInstructionValue {
  TRADING_INSTRUCTION_VALUE_UNSPECIFIED = 0;
  TRADING_INSTRUCTION_VALUE_ACTIVE = 1;
  // No new orders.
  TRADING_INSTRUCTION_VALUE_PAUSE = 2;
  // No new orders, and working orders cancelled; a connectivity plugin
  // cancels at its venue at once (W11.9).
  TRADING_INSTRUCTION_VALUE_STOP = 3;
}

// The level an instruction was set at, from the claims; an entry is lifted
// only at the level that set it.
enum SetterLevel {
  SETTER_LEVEL_UNSPECIFIED = 0;
  SETTER_LEVEL_DEPLOYMENT_ADMIN = 1;
  SETTER_LEVEL_PLUGIN_ADMIN = 2;
}

// ── Locates (W11.18, W11.19; requirement 50a) ──

enum LocateUseKind {
  LOCATE_USE_KIND_UNSPECIFIED = 0;
  // Reserved against the locate for an order (at release, recommended).
  LOCATE_USE_KIND_RESERVE = 1;
  // Given back: a cancel, or the day's end.
  LOCATE_USE_KIND_GIVE_BACK = 2;
  // Consumed by fills.
  LOCATE_USE_KIND_CONSUME = 3;
}

// ── The records ──

// An order (W11.1, W11.2): its identity (account, instrument, side) never
// changes (Q20); each field set by its owner (step 5, "The order's fields").
message Order {
  // `ORD-` and a ULID, minted by the book; never reused (decisions/035).
  string order_id = 1;

  string account_id = 2;
  string instrument_id = 3;

  // The sleeve within the account (ruled 2026-10-10); empty for the
  // account's unsleeved part.
  string sleeve = 4;

  Side side = 5;

  // On a short: the prime's locate ID on a locate record in the book
  // (W11.18), which `compliance` checks at release by its own logic.
  string locate_id = 6;

  // The ordered quantity, or, where the order is for an amount, its cash
  // quantity: exactly one is set, as FIX's OrderQty (38) and CashOrderQty
  // (152) are alternatives (ruled 2026-10-12).
  Decimal quantity = 7;
  Money cash_quantity = 8;

  OrderType order_type = 9;
  Money limit_price = 10;
  // A stop or stop-limit order's trigger (FIX's StopPx, tag 99).
  Money stop_price = 40;

  // On a pair: the dealt currency, by its cash instrument's ID.
  string dealt_currency = 11;
  // Contract v23 (W11.1): on an FX order, the pair's quote currency by its
  // cash instrument's ID, so with the order's instrument, the base
  // currency's, it names the pair; a limit or stop is in it.
  string quote_currency = 44;

  // A slot of optional legs (FX swaps, spreads; step 5's Q26).
  repeated Leg legs = 12;

  // `portfolio`'s: accounts with amounts or weights. At release it sums to
  // the ordered quantity, or, unset, the whole is in the order's own account
  // (principle 1; REFUSAL_REASON_ALLOCATION_UNBALANCED). A child order
  // carries none: its parent's governs (Q47).
  AllocationInstruction allocation_instruction = 13;

  // Set by the `oms`, on its proposal or by a change (W11.3).
  TimeInForce time_in_force = 14;
  // ISO 8601: a good-till-date order's date (FIX's ExpireDate, tag 432);
  // and a good-till-time order's kill time (FIX's ExpireTime, tag 126).
  string expire_date = 41;
  int64 expire_time_ns = 42;
  // The standard execution instructions, set by the `oms` (FIX's ExecInst,
  // tag 18).
  repeated ExecutionInstruction execution_instructions = 43;

  // How a sale relieves lots: the method, or the lots it names; unset, the
  // account's lot_relief_default (W9.13, W11.13).
  LotReliefMethod lot_relief_method = 15;
  repeated string relieve_lot_ids = 16;

  Capacity capacity = 17;
  OrderDirection direction = 18;

  // The client, as delivered, with its LEI where given.
  repeated Party parties = 19;

  // Entered by, from the actor; decided by, where it differs (requirement
  // 29).
  PersonRoles person_roles = 20;

  // The reporting fields its decision owns (requirements 55, 56; the
  // refresh's Q36): stored as stated, core reporting nothing.
  string customer_id = 21;
  string firm_designated_id = 22;
  repeated string handling_instructions = 23;
  int64 received_at_ns = 24;
  TimePrecision received_precision = 25;
  ReceiptQuote quote_at_receipt = 26;
  // The orders a firm's order represents, recorded and not checked (Q37).
  repeated string represents_order_ids = 27;

  // Slice C's sell side, carried empty, not v27's (the refresh's Q34): the axe an
  // order was made from in the lake, its source and counterparty.
  string axe_source = 28;
  string axe_counterparty_id = 29;

  // On a child order: its parent, released, whose instrument and side it
  // has (Q46).
  OrderLink link = 30;

  // On an order the book did not create (W11.2); unspecified on one it did.
  OrderOrigin origin = 31;
  // The venue's order ID on such an order, an external reference, never a
  // key.
  string venue_order_id = 32;

  // A fold over its journal (decisions/035), never stored.
  OrderStatus status = 33;

  // Each check recorded on it, naming the version it checked (W11.4).
  repeated Check checks = 34;

  // Its change requests, each tracked to its outcome (requirement 16).
  repeated ChangeRequest change_requests = 35;

  // On a read (W11.17): its placements, executions and charges.
  repeated Placement placements = 36;
  repeated Execution executions = 37;
  repeated Charge charges = 38;

  JournalRef last_change = 39;

  // Contract v24 (W11.1; the order-path plan's v24 item 6): on a block
  // order, its members as proposed -- released orders of one instrument and
  // side, each in no other live block. Empty on any other order.
  repeated string block_member_order_ids = 45;

  // Contract v24 (W11.33): each sleeve cross that filled the order; its
  // filled quantity counts each, and no execution is minted for one.
  repeated string sleeve_cross_ids = 46;

  // Contract v27 (W11.1; the gaps spec's D2): on a net order, its members
  // as proposed -- released FX orders of one pair and one value date, of
  // both sides, each in no other live block or net. Empty on any other
  // order.
  repeated string net_member_order_ids = 47;

  // Contract v27 (W11.1): the date an FX order settles on, as `portfolio`
  // states it (FIX's SettlDate, 64), ISO 8601; empty is spot.
  string value_date = 48;
  // Contract v28: as option brokers require it: buy to open, sell to close.
  // Unspecified on an instrument that is no option or future.
  PositionEffect position_effect = 49;
  // Contract v29: percent of par in limit_price, a yield in limit_yield, or a
  // spread over a benchmark in limit_spread_bps; a when-issued Treasury before
  // its auction is priced in yield. Unspecified: per unit, as before v29.
  PriceBasis price_basis = 50;
  // Contract v29: the least yield on a buy, the most on a sell, in its
  // convention (FIX Yield, 236, with YieldType, 235). Unset unless price_basis
  // is yield.
  QuotedYield limit_yield = 51;
  // Contract v29: over benchmark_instrument_id, the least on a buy (FIX Spread,
  // 218). Unset unless price_basis is spread.
  optional Decimal limit_spread_bps = 52;
  // Contract v29: an on-the-run Treasury's bond record, or a rate_curve record.
  // Empty unless price_basis is spread.
  string benchmark_instrument_id = 53;
}

// An order's status: its state, its conditions and its quantities, each
// derived.
message OrderStatus {
  OrderState state = 1;
  repeated StandingOrderCondition conditions = 2;
  OrderQuantities quantities = 3;
}

// One condition an order holds, with its reason and who set it.
message StandingOrderCondition {
  OrderCondition condition = 1;

  // In words, for a person; a plugin acts on the condition, never on these.
  string reason = 2;

  // Who set it.
  Actor actor = 3;

  // On claimed: the instance claiming and the user it claims for (W11.7).
  Claimant claimant = 4;

  // On does not tie out: why.
  TieOutReason tie_out_reason = 5;

  // Contract v27 (W11.7): on held, its typed cause, and for a stale
  // reference price the dataset, its age and the ceiling; unspecified and
  // unset on any other condition, and on a hold with no typed cause.
  HoldCause hold_cause = 6;
  StaleReference stale_reference = 7;
}

// A reference price found past its ceiling at an `ems`'s pre-trade check
// (contract v27; W11.7, W11.8).
message StaleReference {
  // The dataset the price came from, `instance:key`.
  string dataset = 1;
  // How old the price's confirmed time was at the check.
  int64 age_ns = 2;
  // The ceiling in force: the tighter of the dataset's and the `ems`
  // admin's own.
  int64 ceiling_ns = 3;
}

// The instance holding a claim, and the user it acts for.
message Claimant {
  string instance_id = 1;
  oneof user {
    PersonActor person = 2;
    ServiceAccountActor service_account = 3;
  }
}

// The quantities, derived; idle may go negative, shown, never refused (Q3).
message OrderQuantities {
  Decimal ordered = 1;
  // Executions at matched or later, a child order's included.
  Decimal reported_filled = 2;
  // Executions at final.
  Decimal final_filled = 3;
  Decimal awaiting_acceptance = 4;
  // Open at live placements and live child orders.
  Decimal committed = 5;
  // Ordered less committed and filled.
  Decimal idle = 6;
  Decimal leaves = 7;
}

// The link on a child order (W11.1; Q41), or, from contract v27, on a
// member of a net order, naming the net as its parent.
message OrderLink {
  OrderLinkKind kind = 1;
  string parent_order_id = 2;
}

// One leg of an order (step 5's Q26).
message Leg {
  string instrument_id = 1;
  Side side = 2;
  // FIX's LegRatioQty (623).
  Decimal ratio = 3;
  // Contract v28: as option brokers require it: buy to open, sell to close; on
  // a package, per leg. Unspecified on an instrument that is no option or
  // future.
  PositionEffect position_effect = 4;
}

// `portfolio`'s allocation instruction (principle 1; FIX's
// AllocationInstruction).
message AllocationInstruction {
  repeated AllocationLine lines = 1;
}

// One account's part of an allocation instruction.
message AllocationLine {
  string account_id = 1;
  // The amount, or, where weighted, unset.
  optional Decimal quantity = 2;
  // A weighted line's share, 0 to 1.
  optional Decimal weight = 3;
  // Slice B's, with the allocation; carried empty until then.
  string sleeve = 4;
}

// A party to an order or an execution, as delivered (requirements 30, 55).
// After FIX's Parties (PartyID 448, PartyIDSource 447, PartyRole 452).
message Party {
  // Its identifiers as delivered, each with its scheme.
  repeated Identifier identifiers = 1;
  // Its LEI, where given (requirement 55).
  string lei = 2;
  PartyRole party_role = 3;
  // Its contact as delivered (requirement 30).
  string contact = 4;
}

// The people on an order, a placement or an entered execution (requirement
// 29). Each a person who has signed in (W6.1) or a service account.
message PersonRoles {
  // Stamped from the actor of the proposing or recording command.
  Actor entered_by = 1;
  // The placement's, and an entered execution's: that act's actor.
  Actor executed_by = 2;
  // Named in the command, where it differs from entered by.
  Actor decided_by = 3;
}

// The quote at time of receipt, held as stated (requirement 56; the
// refresh's Q35).
message ReceiptQuote {
  optional Money bid = 1;
  optional Money ask = 2;

  ReceiptQuoteSourceKind source_kind = 3;
  // With RECEIPT_QUOTE_SOURCE_KIND_VENUE: the venue, its `VEN-` ID.
  string venue_id = 4;

  int64 quoted_at_ns = 5;

  // The sizes (FIX's BidSize, 134, and OfferSize, 135).
  optional Decimal bid_size = 6;
  optional Decimal ask_size = 7;

  // The lake row it was read from, optional: its dataset and row key.
  string dataset = 8;
  string row_key = 9;
}

// A strategy for the venue to work (step 6's Q11): the kinds name which of
// a broker's strategies, described in its catalogue on FIXatdl's model
// (W11.20), is its VWAP, TWAP, POV or IS. A connectivity plugin whose
// broker has none rejects it unsupported.
message StrategyInstruction {
  StrategyKind kind = 1;
  int64 start_ns = 2;
  int64 end_ns = 3;
  // A participation rate, 0.1 for ten percent.
  optional Decimal participation = 4;
  Urgency urgency = 5;
  // The limits (step 6's Q11): the most participation, and a price beyond
  // which it does not trade, distinct from the order's limit.
  optional Decimal max_participation = 6;
  optional Money price_limit = 7;
}

// A verdict on an order version or a placement (W11.4).
message Check {
  CheckVerdict verdict = 1;
  // The order version it checked: the journal sequence of the order's last
  // change when it checked. Unset on a placement's.
  uint64 order_version = 2;
  // On a check of a placement before it is sent.
  string placement_id = 3;
  string rule = 4;
  string note = 5;
  // The compliance plugin instance that recorded it.
  string instance_id = 6;
  Actor recorded_by = 7;
}

// A change request, tracked to its outcome (requirement 16).
message ChangeRequest {
  // `CRQ-` and a ULID, minted by the book.
  string change_request_id = 1;
  string order_id = 2;
  // On a placement's change.
  string placement_id = 3;
  oneof change {
    OrderChange order_change = 4;
    PlacementChange placement_change = 5;
  }
  string reason = 6;
  EntryMeta entry = 7;
  ChangeRequestOutcome outcome = 8;
}

// What an order's change asks (W11.3).
message OrderChange {
  OrderChangeKind kind = 1;
  // The new ordered quantity, on ORDER_CHANGE_KIND_QUANTITY.
  optional Decimal quantity = 2;
  optional Money limit_price = 3;
  TimeInForce time_in_force = 4;
  // Amended in the same act as an increase or a reduction.
  AllocationInstruction allocation_instruction = 5;
  // On ORDER_CHANGE_KIND_AMEND: the instructions now, whole.
  repeated ExecutionInstruction execution_instructions = 6;
}

// What a placement's change asks (W11.9).
message PlacementChange {
  PlacementChangeKind kind = 1;
  optional Decimal quantity = 2;
  optional Money limit_price = 3;
  TimeInForce time_in_force = 4;
}

// A placement (W11.8): part of a released order at one connectivity plugin
// linked to the placing `ems`, which it reaches alone.
message Placement {
  // `PLC-` and a ULID, minted by the book. The client order identifier the
  // venue sees is this, or one the plugin derives from it.
  string placement_id = 1;
  string order_id = 2;
  string account_id = 3;

  // The placing `ems`, as its sidecar stamped it.
  string ems_instance_id = 4;
  // The connectivity plugin that sends it, linked to that `ems`.
  string connectivity_instance_id = 5;
  // What the `ems` set in the venue's account field, from its map (W11.22).
  string venue_account_code = 6;

  Decimal quantity = 7;
  Money limit_price = 8;
  TimeInForce time_in_force = 9;
  StrategyInstruction strategy = 10;

  // The reporting fields (requirement 56): the destination, a `VEN-` ID,
  // and route type by the `ems`; the routing time as the connectivity
  // plugin sent it, on its acknowledgement.
  string destination = 11;
  RouteType route_type = 12;
  int64 routed_at_ns = 13;
  TimePrecision routed_precision = 14;
  repeated string handling_instructions = 15;

  // Slice C's sell side, carried empty, not v27's (the refresh's Q34): the RFQ a
  // placement answers, as FIX's QuoteID (tag 117), and the axe, as FIX's
  // IOIID (tag 23).
  string rfq_id = 16;
  string axe_id = 17;

  // The venue's order ID now; every one it has had, in venue_order_ids.
  string venue_order_id = 18;

  PlacementStatus status = 19;
  // Executed by: the actor of the placing command.
  PersonRoles person_roles = 20;
  repeated Check checks = 21;

  // On a rejection: its reason, and the venue's as reported only beside
  // REJECTION_REASON_VENUE_REJECTED.
  RejectionReason rejection_reason = 22;
  AsReported rejection_as_reported = 23;

  JournalRef last_change = 24;

  // Every venue order ID it has had, in order, the current last
  // (requirement 34): external references, never keys.
  repeated string venue_order_ids = 25;

  // Its own change requests, each with its PlacementChange and tracked to
  // its outcome (W11.9; approved 2026-10-13), so its connectivity plugin
  // hears each on the placement. The order's stay on the order.
  repeated ChangeRequest change_requests = 26;

  // Contract v27 (W11.8; the gaps spec's B1): how it is executed, set by
  // the `ems` at its creation and never changed; unspecified is read as
  // DMA.
  PlacementType placement_type = 27;

  // Contract v27 (W11.8; B5): a manual placement's trade details, its
  // evidence and not street data -- the counterparty's contact as the
  // person states it, and the time agreed with its precision. Empty on any
  // other type.
  string counterparty_contact = 28;
  int64 agreed_at_ns = 29;
  TimePrecision agreed_precision = 30;

  // Contract v27 (W11.40, W11.41; slice C's buy side): the dealers' quotes
  // received on an RFQ placement, each with its outcome, and the one the
  // `ems` picked. Empty on any other type.
  repeated PlacementQuote quotes = 31;
  string picked_quote_id = 32;
}

// One dealer's quote received on the firm's RFQ placement (contract v27;
// W11.40; requirement 50): a trade detail in the book, the buy side's
// best-execution record, never copied into the lake.
message PlacementQuote {
  // `PQT-` and a ULID, minted by the book, never reused.
  string quote_id = 1;
  // The dealer, the venue master's `VEN-` ID.
  string dealer_id = 2;
  // The dealer's own QuoteID (FIX 117), as delivered: an external
  // reference, never a key.
  string dealer_quote_id = 3;
  // The side the dealer quoted to the firm: its offer to a buyer, its bid
  // to a seller.
  Side side = 4;
  Money price = 5;
  Decimal quantity = 6;
  int64 received_at_ns = 7;
  // Its ValidUntilTime (FIX 62); 0 when unstated.
  int64 valid_until_ns = 8;
  PlacementQuoteOutcome outcome = 9;
  RawRecordRef raw_record = 10;
}

// A placement's status, derived.
message PlacementStatus {
  PlacementState state = 1;
  repeated StandingPlacementCondition conditions = 2;
}

// One condition a placement holds; see StandingOrderCondition.
message StandingPlacementCondition {
  PlacementCondition condition = 1;
  string reason = 2;
  Actor actor = 3;
  // On outcome unknown.
  UnknownReason unknown_reason = 4;
  AsReported status_as_reported = 5;
  // Contract v27 (W11.8): on sent on a stale reference, what the `ems`'s
  // check found.
  StaleReference stale_reference = 6;
}

// An execution, never edited (W11.11): a bust or a correction is another,
// superseding it.
message Execution {
  // `EXE-` and a ULID, minted by the book.
  string execution_id = 1;
  string order_id = 2;
  string placement_id = 3;
  string account_id = 4;
  string instrument_id = 5;
  // Its order's sleeve (the refresh's Q33).
  string sleeve = 6;
  Side side = 7;

  Decimal quantity = 8;
  Money price = 9;
  int64 trade_time_ns = 10;
  // ISO 8601, as the venue reports it.
  string trade_date = 11;

  // The venue's, or one the plugin derived deterministically (requirement
  // 33); an external reference.
  string venue_execution_id = 12;
  ExecutionKind kind = 13;
  ExecutionSource source = 14;
  Finality finality = 15;

  // Each with its kind, a signed amount and its asset; a rebate negative.
  repeated Fee fees = 16;

  // ISO 8601: the date the venue states, kept as stated; and, where it
  // states none or the plugin also asked, the date read's answer with its
  // basis (W3.20; the calendars spec's requirement 13). The pending lines
  // take the stated date, else the computed one.
  string settlement_date = 17;
  string computed_settlement_date = 18;
  DateBasis settlement_date_basis = 19;

  // The execution it busts or corrects: the last correction, not the
  // original.
  string supersedes = 20;

  // The place of execution, a `VEN-` ID.
  string venue_id = 21;

  // The reporting fields (requirements 55, 57, 58), carried where set.
  string uti = 22;
  string prior_uti = 23;
  string upi = 24;
  // Derivative terms, where traded terms differ from the template's, come
  // with v28's templates (options and futures); slice A is equities and
  // spot (2026-10-12).
  reserved 25;
  reserved "derivative_terms";
  // A prime broker.
  string given_up_to = 26;
  string trade_chain_reference = 27;
  string settlement_counterparty = 28;

  // Executed by, on an entered execution.
  PersonRoles person_roles = 29;
  RawRecordRef raw_record = 30;
  JournalRef last_change = 31;

  // On a correction: the date it takes effect, beside the journal's own
  // sequence.
  string effective_date = 32;
  // The counterparty where known, its contact as delivered.
  Party counterparty = 33;
  LiquidityIndicator liquidity_indicator = 34;
  // Who generated the UTI.
  string uti_generated_by = 35;

  // Contract v23 (W11.11, W11.23, W11.24). Its state, derived from the
  // journal.
  ExecutionState state = 36;
  // The venue's order ID (FIX 37), as the venue states it: set on a fill
  // reported on no placement, so the plugin can answer its venue.
  string venue_order_id = 37;
  // On a DK: the reason, and the text the `ems` sent.
  DkReason dk_reason = 38;
  string dk_text = 39;
  // The venue's client order ID (FIX 11), copied from the report of a fill
  // on no placement where the venue sent one, which FIX requires back on BN
  // and Q.
  string venue_client_order_id = 40;
  // Contract v24 (W11.32): each prime's answer to a give-up of the
  // execution, in the order recorded; a rejection moves no position.
  repeated GiveUpRecord give_up_answers = 41;
  // Contract v27 (W11.11; the gaps spec's D4): on an internal cross of a
  // net order, which convention set its rate; unspecified on any other.
  CrossRateSource cross_rate_source = 42;
  // Contract v28: a package is reported once for the package and once per leg,
  // linked. Unspecified: single.
  MultiLegReportingType multi_leg_reporting_type = 43;
  // Contract v28: on a leg reported, the package fill's venue_execution_id as
  // reported; on a leg recorded, the package's execution_id. Empty except on a
  // leg's fill.
  string package_execution_id = 44;
  // Contract v29: per unit, or percent of par (TRACE's decimal price), yield or
  // spread, as the lake's PriceBasis (W10.4). Unspecified: per unit, as before
  // v29.
  PriceBasis price_basis = 45;
  // Contract v29: a when-issued Treasury's yield, a municipal's yield to worst
  // on its confirmation, or TRACE's yield; a QuotedYield. Unset where none is
  // stated.
  QuotedYield yield = 46;
  // Contract v29: second, millisecond, microsecond or nanosecond, on every
  // execution of every asset class. Unspecified where not said; set on every
  // execution from v29 where the source states its precision.
  TimePrecision trade_time_precision = 47;
  // Contract v29: states the factor a pool or TBA trade was done at, where not
  // the latest (6730(d)(2)(B); FIX Factor, 228): an exact decimal. Unset: the
  // latest published Factor row.
  optional Decimal factor_used = 48;
  // Contract v29: true for a new-issue municipal traded when issued, so an
  // empty date is never ambiguous. False: the settlement date is known.
  bool settlement_date_unknown = 49;
  // Contract v29: customer, dealer, non-member affiliate or clearing broker,
  // matching the lake's characteristics by meaning (W10.4). Unspecified where
  // not a fixed-income street report.
  ContraPartyType contra_party_type = 50;
  // Contract v29: a give-up firm (PARTY_ROLE_GIVE_UP_FIRM, 6730(c)(9)) and the
  // contra side's introducing broker (PARTY_ROLE_INTRODUCING_BROKER,
  // 6730(c)(10)), each with its mpid. None where only the counterparty is
  // delivered.
  repeated Party parties = 51;
  // Contract v29: one of the existing four but mixed: a mixed order's fills
  // each carry one. Unspecified where not a broker's trade.
  Capacity capacity = 52;
  // Contract v29: true where the firm takes no transaction-based compensation.
  // False: not so, or not stated.
  bool no_remuneration = 53;
  // Contract v29: true for a back-to-back with a non-member affiliate, same
  // day, same price. False: not so, or not stated.
  bool affiliate_back_to_back = 54;
  // Contract v29: true where priced away from the market, its reason in
  // special_price_reason. False: not so, or not stated.
  bool special_price = 55;
  // Contract v29: true where priced by a weighted-average method. False: not
  // so, or not stated.
  bool weighted_average_price = 56;
  // Contract v29: true for a primary-market trade. False: not so, or not
  // stated.
  bool primary_market = 57;
  // Contract v29: marks a list offering price or takedown trade (G-14 RTRS
  // Procedures (b)(iv)(B)(1)): true where so. False: not so, or not stated.
  bool list_offering_price_takedown = 58;
  // Contract v29: marks a trade without accrued interest (G-14 (b)(iv)(B)(4)):
  // true where traded flat. False: not so, or not stated.
  bool traded_flat = 59;
  // Contract v29: true where traded with stipulations. False: not so, or not
  // stated.
  bool stipulated = 60;
  // Contract v29: true on each execution of a basket of ten or more issues at
  // one agreed price, linked by trade_chain_reference. False: not so, or not
  // stated.
  bool portfolio_trade = 61;
  // Contract v29: up to 50 characters, as the firm writes it. Empty unless
  // special_price.
  string special_price_reason = 62;
  // Contract v29: a futures leg in the series, a series not priced at the
  // market, or hedged. Unspecified: none.
  TreasuryTradeModifier treasury_trade_modifier = 63;
}

// An execution's finality: a level, and when it reached it.
message Finality {
  FinalityLevel level = 1;
  int64 at_ns = 2;
}

// A fee (requirement 26), in any asset with a cash instrument (v18).
message Fee {
  FeeKind kind = 1;
  // Signed; a rebate negative.
  Money amount = 2;
  // Contract v24 (W11.27; the order-path plan's v24 item 4): the `oms`'s
  // choice by its policy. A capitalised fee enters the lot's cost on a buy;
  // every fee stays its own cash line either way.
  bool capitalised = 3;
}

// A fee with no fill, on its placement (W11.12): it moves cash, pending to
// its settlement date, and counts toward no quantity.
message Charge {
  // `CHG-` and a ULID, minted by the book.
  string charge_id = 1;
  string placement_id = 2;
  string order_id = 3;
  string account_id = 4;
  Fee fee = 5;
  string trade_date = 6;
  string settlement_date = 7;
  RawRecordRef raw_record = 8;
}

// A well-formed fact naming nothing the book holds, kept with its reason,
// never dropped (requirement 13); placed by its own entry when a later
// record claims it.
message UnplacedFact {
  // `UNP-` and a ULID, minted by the book.
  string unplaced_id = 1;
  // Empty where its venue account code maps to no account: delivered to no
  // plugin, counted on its connectivity plugin's admin view.
  string account_id = 2;
  // The kind of fact, as data: `execution`, `placement`, `charge`,
  // `locate`, from contract v23 `value-date-roll`, and from contract v25
  // `give-up`.
  string fact_kind = 3;
  UnplacedReason reason = 4;
  RawRecordRef raw_record = 5;
  string venue_account_code = 6;
  // The fact as it arrived, named by fact_kind.
  oneof fact {
    ReportExecutionRequest execution = 7;
    ReportPlacementRequest placement = 8;
    ReportChargeRequest charge = 9;
    RecordLocateRequest locate = 11;
    // A value-date roll on a code no ems mapped, or meeting no pending line
    // to move (W11.25, contract v23).
    ReportValueDateRollRequest value_date_roll = 14;
    // A give-up's answer naming no execution or allocation the book holds
    // (W11.32, contract v25), its fact_kind `give-up`.
    ReportGiveUpRequest give_up = 15;
  }
  // A venue's recorded order, gone with the venue-originated path (ruled
  // 2026-10-13).
  reserved 10;
  reserved "order";
  // The entry that placed it, once a later record claimed it.
  JournalRef placed_by = 12;
  // Its latest entry: the one that kept it, or the one that placed it.
  JournalRef last_change = 13;
}

// A trading instruction (W11.15): recorded with its setter's level, a
// deployment admin's on one account in that account's partition, every
// other in the control partition.
message TradingInstruction {
  TradingInstructionTarget target = 1;
  TradingInstructionValue value = 2;
  SetterLevel setter_level = 3;
  // On a user group's: the persons it covers, by their deployment-local
  // subjects, resolved by core when set and whenever membership changes.
  repeated string covers = 4;
  string reason = 5;
  EntryMeta entry = 6;
  // Its latest entry, which a catch-up reads it by (W11.16).
  JournalRef last_change = 7;
}

// What an instruction names: a deployment admin's an account, All accounts,
// a plugin, a person, a service account or a user group; a plugin admin's
// their plugin, or a person, service account or account within it, naming
// the plugin beside it.
message TradingInstructionTarget {
  bool all_accounts = 1;
  string account_id = 2;
  // A plugin, by its instance.
  string instance_id = 3;
  // A person, by the deployment-local subject.
  string subject = 4;
  string service_account_id = 5;
  string user_group_id = 6;
}

// A locate the fund requested of its prime, the prime's answer on it
// (W11.18; requirement 50a). Each change its own entry; the street never
// holds one.
message Locate {
  // `LOC-` and a ULID, minted by the book.
  string locate_record_id = 1;
  string account_id = 2;
  string instrument_id = 3;
  Decimal quantity_requested = 4;
  // Unset until the prime answers.
  LocateAnswer answer = 5;
  // The prime's locate ID, from its answer, which a short order names.
  string locate_id = 6;
  // Derived from its uses.
  Decimal remaining = 7;
  repeated LocateUse uses = 8;
  RawRecordRef raw_record = 9;
  JournalRef last_change = 10;
}

// The prime's answer.
message LocateAnswer {
  Decimal quantity_approved = 1;
  optional Decimal rate = 2;
  int64 expires_at_ns = 3;
  string locate_id = 4;
}

// One use of a locate, its own entry (W11.19): when a locate is used up is
// `compliance`'s or the `oms`'s logic (principle 3).
message LocateUse {
  LocateUseKind kind = 1;
  Decimal quantity = 2;
  string order_id = 3;
}

// ── W11.1 to W11.12, W11.14, W11.18, W11.19: commands ──

// W11.1. For a person or a service account; by `portfolio`, the `oms`, or an
// `ems` for a child order.
message ProposeOrderRequest {
  string account_id = 1;
  string instrument_id = 2;
  string sleeve = 3;
  Side side = 4;
  string locate_id = 5;
  // Exactly one of quantity and cash_quantity is set, as FIX's OrderQty
  // (38) and CashOrderQty (152) are alternatives (ruled 2026-10-12): an
  // order naming both, or neither, is refused INVALID_ARGUMENT naming
  // `quantity` and `cash_quantity`. 0, a pass, is refused naming `quantity`
  // until slice C's sell side defines it, which is not v27's.
  optional Decimal quantity = 6;
  optional Money cash_quantity = 7;
  OrderType order_type = 8;
  optional Money limit_price = 9;
  string dealt_currency = 10;
  repeated Leg legs = 11;
  AllocationInstruction allocation_instruction = 12;
  TimeInForce time_in_force = 13;
  LotReliefMethod lot_relief_method = 14;
  repeated string relieve_lot_ids = 15;
  Capacity capacity = 16;
  OrderDirection direction = 17;
  repeated Party parties = 18;
  // Where who decided differs from who enters it.
  Actor decided_by = 19;
  string customer_id = 20;
  string firm_designated_id = 21;
  repeated string handling_instructions = 22;
  int64 received_at_ns = 23;
  TimePrecision received_precision = 24;
  ReceiptQuote quote_at_receipt = 25;
  repeated string represents_order_ids = 26;
  string axe_source = 27;
  string axe_counterparty_id = 28;
  // A child order: in its parent's account, released on creation within it
  // (Q19 (i)); under a parent not released, REFUSAL_REASON_ORDER_STATE.
  OrderLink link = 29;
  string idempotency_key = 30;
  optional Money stop_price = 31;
  string expire_date = 32;
  int64 expire_time_ns = 33;
  repeated ExecutionInstruction execution_instructions = 34;
  // Contract v23 (W11.1): an FX order's quote currency, by its cash
  // instrument's ID. One naming the order's own instrument is refused
  // INVALID_ARGUMENT naming `quote_currency`; a limit or stop priced in
  // another currency INVALID_ARGUMENT naming `limit_price` or `stop_price`.
  string quote_currency = 35;
  // Contract v24 (W11.1; the order-path plan's v24 item 6): the `oms`'s
  // block order, in the allocation account, naming its members, each a
  // released order of one instrument and side in no other live block
  // (REFUSAL_REASON_ORDER_STATE). Released on creation, its quantity the
  // sum of its members' idle quantities.
  repeated string block_member_order_ids = 36;
  // Contract v27 (W11.1; the gaps spec's D2): the `oms`'s net order, in the
  // allocation account, naming members of both sides, each a released FX
  // order of one pair and one value date in no other live block or net.
  // Released on creation, its quantity signed buys minus sells, its side
  // the larger's.
  repeated string net_member_order_ids = 37;
  // Contract v27 (W11.1): an FX order's value date, ISO 8601 (FIX's
  // SettlDate, 64); empty is spot.
  string value_date = 38;
  // Contract v28: as option brokers require it: buy to open, sell to close.
  // Unspecified on an instrument that is no option or future.
  PositionEffect position_effect = 39;
  // Contract v29: percent of par in limit_price, a yield in limit_yield, or a
  // spread over a benchmark in limit_spread_bps; a when-issued Treasury before
  // its auction is priced in yield. Unspecified: per unit, as before v29.
  PriceBasis price_basis = 40;
  // Contract v29: the least yield on a buy, the most on a sell, in its
  // convention (FIX Yield, 236, with YieldType, 235). Unset unless price_basis
  // is yield.
  QuotedYield limit_yield = 41;
  // Contract v29: over benchmark_instrument_id, the least on a buy (FIX Spread,
  // 218). Unset unless price_basis is spread.
  optional Decimal limit_spread_bps = 42;
  // Contract v29: an on-the-run Treasury's bond record, or a rate_curve record.
  // Empty unless price_basis is spread.
  string benchmark_instrument_id = 43;
}

// W11.2. A fact: never through the gate. By the `oms`, for a user, naming
// the account: a telephoned or outside order. A connectivity plugin records
// no order (ruled 2026-10-13).
message RecordOrderRequest {
  string account_id = 1;
  // A venue's recorded order's, gone with the venue-originated path.
  reserved 2;
  reserved "venue_account_code";
  string instrument_id = 3;
  string sleeve = 4;
  Side side = 5;
  Decimal quantity = 6;
  OrderType order_type = 7;
  optional Money limit_price = 8;
  TimeInForce time_in_force = 9;
  string venue_order_id = 10;
  OrderOrigin origin = 11;
  // As venue_account_code: a venue's, gone with it.
  reserved 12;
  reserved "raw_record";
  string idempotency_key = 13;
}

// W11.3.
message RequestOrderChangeRequest {
  string order_id = 1;
  OrderChange change = 2;
  // Required on a justified act: an alignment, an override.
  string reason = 3;
  string idempotency_key = 4;
}

// W11.4. By `compliance`; on an order version, or on a placement before it
// is sent, answered with the placement.
message RecordCheckRequest {
  string order_id = 1;
  uint64 order_version = 2;
  string placement_id = 3;
  CheckVerdict verdict = 4;
  string rule = 5;
  string note = 6;
  string idempotency_key = 7;
}

// W11.5.
message DecideApprovalRequest {
  string order_id = 1;
  ApprovalDecision decision = 2;
  // Required on an override.
  string reason = 3;
  string idempotency_key = 4;
}

// W11.6. Through the gate, in its order: allocation, block, approval,
// compliance.
message ReleaseOrderRequest {
  string order_id = 1;
  string idempotency_key = 2;
}

// W11.7. Claimed, held or paused, set or cleared.
message SetWorkingConditionRequest {
  string order_id = 1;
  // ORDER_CONDITION_CLAIMED, _HELD or _PAUSED; any other refused.
  OrderCondition condition = 2;
  // True sets it, false clears it.
  bool set = 3;
  string reason = 4;
  string idempotency_key = 5;
  // Contract v27 (W11.7): a hold's typed cause, and for a stale reference
  // price what the check found; on any condition but held, refused
  // INVALID_ARGUMENT naming `hold_cause`.
  HoldCause hold_cause = 6;
  StaleReference stale_reference = 7;
}

// W11.8. By the `ems` alone (ruled 2026-10-13).
message CreatePlacementRequest {
  string order_id = 1;
  // One linked to the placing `ems` and made available to the user the
  // command acts for, or REFUSAL_REASON_CONNECTIVITY_NOT_ALLOWED, recorded.
  string connectivity_instance_id = 2;
  string venue_account_code = 3;
  Decimal quantity = 4;
  optional Money limit_price = 5;
  TimeInForce time_in_force = 6;
  StrategyInstruction strategy = 7;
  string destination = 8;
  RouteType route_type = 9;
  repeated string handling_instructions = 10;
  // Offered empty: slice C's sell side and axes are not v27's.
  string rfq_id = 11;
  string axe_id = 12;
  // Stamped by the sidecar: the sending instance.
  string ems_instance_id = 13;
  string idempotency_key = 14;
  // Contract v27 (W11.8): its type; a manual placement names no
  // connectivity instance and carries its trade details, any other type
  // names one and carries none (INVALID_ARGUMENT naming the field).
  PlacementType placement_type = 15;
  string counterparty_contact = 16;
  int64 agreed_at_ns = 17;
  TimePrecision agreed_precision = 18;
  // Contract v27 (W11.8): set where the `ems` places on a stale reference
  // price, its admin having chosen to warn; the placement then holds
  // PLACEMENT_CONDITION_SENT_ON_STALE_REFERENCE.
  StaleReference stale_reference = 19;
}

// W11.40 (contract v27): a dealer's quote received on the firm's RFQ
// placement, recorded by its connectivity plugin; or a later outcome of one
// recorded, named by its quote ID. Answered with PlacementReply.
message ReportPlacementQuoteRequest {
  string placement_id = 1;
  // Empty to record a new quote, which the book mints an ID for; a quote's
  // ID to record its later outcome.
  string quote_id = 2;
  string dealer_id = 3;
  string dealer_quote_id = 4;
  Side side = 5;
  optional Money price = 6;
  optional Decimal quantity = 7;
  int64 received_at_ns = 8;
  int64 valid_until_ns = 9;
  PlacementQuoteOutcome outcome = 10;
  RawRecordRef raw_record = 11;
  string idempotency_key = 12;
}

// W11.41 (contract v27): the `ems` picks one open quote on an RFQ placement
// it made. Answered with PlacementReply.
message PickPlacementQuoteRequest {
  string placement_id = 1;
  string quote_id = 2;
  string reason = 3;
  string idempotency_key = 4;
}

// W11.9. By the `ems` or the `oms`; by a connectivity plugin only to report
// a cancel it already sent under a stop, a fact naming the instruction's
// entry as its cause (v21's Q17).
message RequestPlacementChangeRequest {
  string placement_id = 1;
  PlacementChange change = 2;
  string reason = 3;
  // The trading instruction's entry, on a cancel reported under a stop:
  // only its entry_id is read, and the sidecar refuses any other field set
  // (the order-path plan's protos, point 10, ruled 2026-10-12).
  EntryMeta cause = 4;
  string idempotency_key = 5;
}

// W11.10. A fact, each with the raw record it was converted from.
message ReportPlacementRequest {
  string placement_id = 1;
  PlacementEvent event = 2;
  string venue_order_id = 3;
  int64 routed_at_ns = 4;
  TimePrecision routed_precision = 5;
  RejectionReason rejection_reason = 6;
  AsReported rejection_as_reported = 7;
  UnknownReason unknown_reason = 8;
  AsReported status_as_reported = 9;
  RestatementReason restatement_reason = 10;
  // On a replace or a restatement: the quantity and limit now.
  optional Decimal quantity = 11;
  optional Money limit_price = 12;
  RawRecordRef raw_record = 13;
}

// W11.11. A fact by a connectivity plugin; or, for a person, a manual or
// done-away execution by the `ems` or the `oms`. A fill with no settlement
// date, stated or computed, is refused INVALID_ARGUMENT naming
// `settlement_date` (the refresh's Q39).
message ReportExecutionRequest {
  string placement_id = 1;
  // A done-away execution's order.
  string order_id = 2;
  // Stamped from venue_account_code on a connectivity plugin's
  // (`venue-account-map`); empty, never refused, where none is mapped, so
  // the fact is kept unplaced. Named on an entry for a person.
  string account_id = 3;
  string venue_account_code = 4;
  string venue_execution_id = 5;
  ExecutionKind kind = 6;
  ExecutionSource source = 7;
  Decimal quantity = 8;
  Money price = 9;
  int64 trade_time_ns = 10;
  string trade_date = 11;
  Finality finality = 12;
  string settlement_date = 13;
  string computed_settlement_date = 14;
  DateBasis settlement_date_basis = 15;
  repeated Fee fees = 16;
  string supersedes = 17;
  string venue_id = 18;
  string uti = 19;
  string prior_uti = 20;
  string upi = 21;
  // As Execution's: derivative terms come with v28's templates.
  reserved 22;
  reserved "derivative_terms";
  string given_up_to = 23;
  string trade_chain_reference = 24;
  string settlement_counterparty = 25;
  RawRecordRef raw_record = 26;
  string idempotency_key = 27;
  string effective_date = 28;
  Party counterparty = 29;
  LiquidityIndicator liquidity_indicator = 30;
  string uti_generated_by = 31;

  // Contract v23 (W11.11): a fill on no order and no placement names its
  // instrument, its side and the venue's order ID (FIX 37), each required
  // when no placement is named; and the venue's client order ID (FIX 11)
  // where the venue sent one, which FIX requires back on BN and Q.
  string instrument_id = 32;
  Side side = 33;
  string venue_order_id = 34;
  string venue_client_order_id = 35;

  // Contract v27 (W11.11): on the `oms`'s internal cross of a net order,
  // which convention set its rate; refused INVALID_ARGUMENT naming it where
  // missing on such a cross, or set on any other execution.
  CrossRateSource cross_rate_source = 36;
  // Contract v28: a package is reported once for the package and once per leg,
  // linked. Unspecified: single.
  MultiLegReportingType multi_leg_reporting_type = 37;
  // Contract v28: on a leg reported, the package fill's venue_execution_id as
  // reported; on a leg recorded, the package's execution_id. Empty except on a
  // leg's fill.
  string package_execution_id = 38;
  // Contract v29: per unit, or percent of par (TRACE's decimal price), yield or
  // spread, as the lake's PriceBasis (W10.4). Unspecified: per unit, as before
  // v29.
  PriceBasis price_basis = 39;
  // Contract v29: a when-issued Treasury's yield, a municipal's yield to worst
  // on its confirmation, or TRACE's yield; a QuotedYield. Unset where none is
  // stated.
  QuotedYield yield = 40;
  // Contract v29: second, millisecond, microsecond or nanosecond, on every
  // execution of every asset class. Unspecified where not said; set on every
  // execution from v29 where the source states its precision.
  TimePrecision trade_time_precision = 41;
  // Contract v29: states the factor a pool or TBA trade was done at, where not
  // the latest (6730(d)(2)(B); FIX Factor, 228): an exact decimal. Unset: the
  // latest published Factor row.
  optional Decimal factor_used = 42;
  // Contract v29: true for a new-issue municipal traded when issued, so an
  // empty date is never ambiguous. False: the settlement date is known.
  bool settlement_date_unknown = 43;
  // Contract v29: customer, dealer, non-member affiliate or clearing broker,
  // matching the lake's characteristics by meaning (W10.4). Unspecified where
  // not a fixed-income street report.
  ContraPartyType contra_party_type = 44;
  // Contract v29: a give-up firm (PARTY_ROLE_GIVE_UP_FIRM, 6730(c)(9)) and the
  // contra side's introducing broker (PARTY_ROLE_INTRODUCING_BROKER,
  // 6730(c)(10)), each with its mpid. None where only the counterparty is
  // delivered.
  repeated Party parties = 45;
  // Contract v29: one of the existing four but mixed: a mixed order's fills
  // each carry one. Unspecified where not a broker's trade.
  Capacity capacity = 46;
  // Contract v29: true where the firm takes no transaction-based compensation.
  // False: not so, or not stated.
  bool no_remuneration = 47;
  // Contract v29: true for a back-to-back with a non-member affiliate, same
  // day, same price. False: not so, or not stated.
  bool affiliate_back_to_back = 48;
  // Contract v29: true where priced away from the market, its reason in
  // special_price_reason. False: not so, or not stated.
  bool special_price = 49;
  // Contract v29: true where priced by a weighted-average method. False: not
  // so, or not stated.
  bool weighted_average_price = 50;
  // Contract v29: true for a primary-market trade. False: not so, or not
  // stated.
  bool primary_market = 51;
  // Contract v29: marks a list offering price or takedown trade (G-14 RTRS
  // Procedures (b)(iv)(B)(1)): true where so. False: not so, or not stated.
  bool list_offering_price_takedown = 52;
  // Contract v29: marks a trade without accrued interest (G-14 (b)(iv)(B)(4)):
  // true where traded flat. False: not so, or not stated.
  bool traded_flat = 53;
  // Contract v29: true where traded with stipulations. False: not so, or not
  // stated.
  bool stipulated = 54;
  // Contract v29: true on each execution of a basket of ten or more issues at
  // one agreed price, linked by trade_chain_reference. False: not so, or not
  // stated.
  bool portfolio_trade = 55;
  // Contract v29: up to 50 characters, as the firm writes it. Empty unless
  // special_price.
  string special_price_reason = 56;
  // Contract v29: a futures leg in the series, a series not priced at the
  // market, or hedged. Unspecified: none.
  TreasuryTradeModifier treasury_trade_modifier = 57;
}

// W11.12.
message ReportChargeRequest {
  string placement_id = 1;
  Fee fee = 2;
  string trade_date = 3;
  string settlement_date = 4;
  RawRecordRef raw_record = 5;
}

// W11.14. Late fact only; does not tie out is never acknowledged.
message AcknowledgeFlagRequest {
  string order_id = 1;
  OrderCondition condition = 2;
  string reason = 3;
  string idempotency_key = 4;
}

// W11.15. From the dashboard, for a deployment admin or a plugin's admin;
// the setter's level from the claims.
message SetTradingInstructionRequest {
  TradingInstructionTarget target = 1;
  TradingInstructionValue value = 2;
  string reason = 3;
  // The level it is set at, stamped by the dashboard from the setter's
  // claims -- a deployment admin's or a plugin admin's -- never entered, so
  // the book records the instruction at the right level and lifts an entry
  // only at the level that set it (W11.15; approved 2026-10-12).
  SetterLevel setter_level = 4;
}

// W11.18. By the fund's connectivity plugin; the answer later on the same
// record as its own entry.
message RecordLocateRequest {
  // Stamped from venue_account_code (`venue-account-map`).
  string account_id = 1;
  string venue_account_code = 2;
  string instrument_id = 3;
  optional Decimal quantity_requested = 4;
  LocateAnswer answer = 5;
  // Names the record an answer arriving later is on; empty for a new one.
  string locate_record_id = 6;
  RawRecordRef raw_record = 7;
  string idempotency_key = 8;
}

// W11.19. By `compliance` or the `oms`; on an expired locate,
// REFUSAL_REASON_ORDER_STATE.
message RecordLocateUseRequest {
  string locate_record_id = 1;
  LocateUse use = 2;
  string idempotency_key = 3;
}

// W11.23 (contract v23). By the `ems`, for a person or its service account:
// 1 to 500 unmatched executions of one account, instrument and side,
// accepted to an existing order or to a new order made from them.
message AcceptExecutionRequest {
  repeated string execution_ids = 1;
  oneof matched_order {
    // An order the accepting `ems` may place against: released, working or
    // filled, never ended.
    string order_id = 2;
    // A new order made from the fills, at filled, never gated.
    NewOrderFromExecutions new_order = 3;
  }
  // Kept on the accept's entry.
  string note = 4;
}

// What the accept adds to the order the fills make (W11.23): the rest is
// the fills'.
message NewOrderFromExecutions {
  string sleeve = 1;
  string note = 2;
}

// W11.24 (contract v23). By the `ems`, for a person or its service account:
// 1 to 500 unmatched executions answered don't know, with a reason, and
// text when the reason is DK_REASON_OTHER.
message DontKnowExecutionRequest {
  repeated string execution_ids = 1;
  DkReason reason = 2;
  string text = 3;
}

// W11.25 (contract v23). By a connectivity plugin whose venue rolls a spot
// position at its daily cut: the account's pending lines in the pair move
// from one value date to the next by one entry, `value-date-rolled`;
// answered with FactReply.
message ReportValueDateRollRequest {
  // Stamped from venue_account_code (`venue-account-map`); empty, never
  // refused, where none is mapped, so the fact is kept unplaced.
  string account_id = 1;
  string venue_account_code = 2;
  // The pair's two cash instruments, as the date read's spot inputs name it.
  repeated string pair = 3;
  // ISO 8601: the value date left, and the date read's answer moved to,
  // with its basis.
  string from_value_date = 4;
  string to_value_date = 5;
  DateBasis value_date_basis = 6;
  int64 rolled_at_ns = 7;
  // The `CHG-` IDs of the roll's financing charges, each reported first.
  repeated string charge_ids = 8;
  RawRecordRef raw_record = 9;
  string idempotency_key = 10;
}

// ── Their answers, after commit ──

message OrderReply {
  Order order = 1;
  EntryMeta entry = 2;
  JournalRef journal = 3;
  // On a change request: the one it opened.
  string change_request_id = 4;
}

message PlacementReply {
  Placement placement = 1;
  EntryMeta entry = 2;
  JournalRef journal = 3;
  string change_request_id = 4;
}

// A fact's answer: each record it changed, or the unplaced fact kept.
message FactReply {
  Placement placement = 1;
  Execution execution = 2;
  Order order = 3;
  Charge charge = 4;
  UnplacedFact unplaced = 5;
  EntryMeta entry = 6;
  JournalRef journal = 7;
}

// An accept's answer (W11.23): each execution matched, the order and the
// placement it linked them to.
message AcceptExecutionReply {
  repeated Execution executions = 1;
  Order order = 2;
  Placement placement = 3;
  JournalRef journal = 4;
}

// A DK's answer (W11.24).
message DontKnowExecutionReply {
  repeated Execution executions = 1;
  JournalRef journal = 2;
}

message TradingInstructionReply {
  TradingInstruction instruction = 1;
  JournalRef journal = 2;
}

message LocateReply {
  Locate locate = 1;
  EntryMeta entry = 2;
  JournalRef journal = 3;
}

// ── W11.13, W11.16, W11.18: deliveries, records whole ──

message OrderUpdatedEvent {
  Order order = 1;
  // What changed, by field.
  repeated string changed = 2;
  EntryMeta entry = 3;
  JournalRef journal = 4;
  ChangeCause cause = 5;
}

// To the `ems`, `oms` and `compliance` within scope, and to the
// connectivity plugin it names, alone of its role (matrix/directed.tsv).
message PlacementUpdatedEvent {
  Placement placement = 1;
  repeated string changed = 2;
  EntryMeta entry = 3;
  JournalRef journal = 4;
  ChangeCause cause = 5;
}

// W9's PositionChanged follows for each position it moved.
message ExecutionRecordedEvent {
  Execution execution = 1;
  EntryMeta entry = 2;
  JournalRef journal = 3;
  ChangeCause cause = 4;
}

message UnplacedFactRecordedEvent {
  UnplacedFact unplaced = 1;
  EntryMeta entry = 2;
  JournalRef journal = 3;
  ChangeCause cause = 4;
}

// To every subscriber, without an account scope.
message TradingInstructionChangedEvent {
  TradingInstruction instruction = 1;
  JournalRef journal = 2;
  ChangeCause cause = 3;
}

message LocateUpdatedEvent {
  Locate locate = 1;
  EntryMeta entry = 2;
  JournalRef journal = 3;
  ChangeCause cause = 4;
}

// ── W11.16 to W11.18: reads ──

// The orders in the reader's scope, as of now or changed since a watermark;
// a connectivity plugin's, those behind placements naming its instance.
message ListOrdersRequest {
  // Empty: every account in the reader's scope.
  string account_id = 1;
  // Only records whose last change is above it, as every record catch-up
  // reads (W4.3); unset, every record in scope as of now.
  Watermark since = 2;
  int32 page_size = 3;
  string cursor = 4;
  // Contract v23 (W11.17): only executions in this state; unspecified,
  // every one. Unmatched leaves out an execution a later one supersedes,
  // and a bust.
  ExecutionState execution_state = 5;
}

// Each kind of record the order path delivers, in its own list, so a
// catch-up after a gap or a loss reads the records its row carries: an
// order's (OrderUpdated), a placement's (PlacementUpdated), an execution's
// (ExecutionRecorded), an unplaced fact's (UnplacedFactRecorded).
message ListOrdersReply {
  repeated Order orders = 1;
  Watermark as_of = 2;
  string next_cursor = 3;
  repeated Placement placements = 4;
  repeated Execution executions = 5;
  // Those naming an account in the reader's scope; one naming none is read
  // by no plugin (W11.13).
  repeated UnplacedFact unplaced_facts = 6;
}

// One order's journal from its first entry; the history never changes.
message OrderHistoryRequest {
  string account_id = 1;
  string order_id = 2;
  int32 page_size = 3;
  string cursor = 4;
}

message OrderHistoryReply {
  // Each with its actor, its times, and the prepared change it was made
  // from where one was.
  repeated EntryMeta entries = 1;
  string next_cursor = 2;
}

// Those in force, never a history; read on start, whatever the scope.
// With `since`, each instruction changed above it, an instruction set back
// to active included, as an unscoped record row's catch-up reads (W4.3).
message ListTradingInstructionsRequest {
  Watermark since = 1;
  int32 page_size = 2;
  string cursor = 3;
}

message ListTradingInstructionsReply {
  repeated TradingInstruction instructions = 1;
  // The control partition's sequence they were read at. Kept (the product
  // owner, 2026-10-12) with an invariant: it equals the control partition's
  // head in the reply's `as_of`, so a reader may take either.
  uint64 control_sequence = 2;
  Watermark as_of = 3;
  string next_cursor = 4;
}

message ListLocatesRequest {
  string account_id = 1;
  // Only locates whose last change is above it (W4.3).
  Watermark since = 2;
  int32 page_size = 3;
  string cursor = 4;
}

message ListLocatesReply {
  repeated Locate locates = 1;
  Watermark as_of = 2;
  string next_cursor = 3;
}

// ── W11.26 to W11.37: booking, the alert and the escape hatch (contract v24) ──
//
// sdk-contract/an-execution-is-booked-to-its-accounts-contract, its booking
// track: the order-path plan's "v24: booking (slice B)", items 1 to 24, and
// its "v24's text", every name approved 2026-10-13 and 2026-10-14. A booking
// is in the partition of its order's account; each allocation's movement in
// another account is a child entry in that account's own partition
// (decisions/024). Its states are matrix/transitions.tsv's rows b1 to b9
// (decisions/035 as amended at v24).

// A booking's state (W11.30), derived from its journal, never stored.
enum BookingState {
  BOOKING_STATE_UNSPECIFIED = 0;
  // Booked, its allocations tying out, not yet handed off or closed.
  BOOKING_STATE_BOOKED = 1;
  // Executed no longer equals allocated -- a bust, a correction, a late
  // fill or a later fee since booking -- or a hand-off's check failed; its
  // reason in held_reason, and a held-booking alert raised.
  BOOKING_STATE_HELD = 2;
  // Handed off to `operations`, which owns each allocation's post-trade
  // life.
  BOOKING_STATE_HANDED_OFF = 3;
  // A client's booking the firm does not settle, closed, its error-account
  // allocations handed off.
  BOOKING_STATE_CLOSED = 4;
  // Cancelled by the `oms` before the hand-off, so its executions may be
  // booked again.
  BOOKING_STATE_CANCELLED = 5;
}

// A booking's correction (W11.29), as FIX's AllocTransType (71).
enum BookingCorrectionKind {
  BOOKING_CORRECTION_KIND_UNSPECIFIED = 0;
  // The `oms`'s, before the hand-off or closing.
  BOOKING_CORRECTION_KIND_CANCEL = 1;
  // `operations`', after it, with the full new allocation set: a new
  // version, the state kept.
  BOOKING_CORRECTION_KIND_REPLACE = 2;
}

// Why an allocation is to an error account (W11.27; the order-path plan's
// v24 item 10). FIX has no standard list.
enum ErrorCause {
  // Not an error-account allocation.
  ERROR_CAUSE_UNSPECIFIED = 0;
  // The venue filled more than ordered; the excess booked to the error
  // account.
  ERROR_CAUSE_OVERFILL = 1;
  ERROR_CAUSE_CLIENT_RENEGED = 2;
  // A venue-originated fill accepted to the wrong order (W11.23).
  ERROR_CAUSE_WRONG_ACCEPT = 3;
  // The firm's own booking error.
  ERROR_CAUSE_BOOKING_ERROR = 4;
  // Another cause, which error_text says.
  ERROR_CAUSE_OTHER = 5;
}

// A prime's answer to a give-up (W11.32), as FIX's AllocStatus (87).
enum GiveUpAnswer {
  GIVE_UP_ANSWER_UNSPECIFIED = 0;
  GIVE_UP_ANSWER_ACCEPTED = 1;
  // The trade stays with the executing side; no position moves.
  GIVE_UP_ANSWER_REJECTED = 2;
}

// An alert's state (W11.34); nothing is deleted.
enum AlertState {
  ALERT_STATE_UNSPECIFIED = 0;
  // Raised, by the book or by `compliance`.
  ALERT_STATE_RAISED = 1;
  // Acknowledged by `compliance` for a person, with a reason; never
  // clearing it.
  ALERT_STATE_ACKNOWLEDGED = 2;
  // Cleared by the book: a held booking handed off or closed.
  ALERT_STATE_CLEARED = 3;
}

// What an alert is about (W11.34); v26 adds rule results to the same record.
enum AlertKind {
  ALERT_KIND_UNSPECIFIED = 0;
  // An allocation to an error account, raised by the book on each.
  ALERT_KIND_ERROR_ACCOUNT_BOOKING = 1;
  // A booking held, raised by the book and cleared by it at the hand-off
  // or closing.
  ALERT_KIND_BOOKING_HELD = 2;
  // `compliance`'s own, through RaiseAlert.
  ALERT_KIND_COMPLIANCE = 3;
}

// A booking of an order's executions to their accounts (W11.27 to W11.30).
message Booking {
  // `BKG-` and a ULID, minted by the book, never reused (decisions/035,
  // point 7); the reference the street echoes back.
  string booking_id = 1;
  // The order's `ORD-` ID; a child's executions are booked as its parent's.
  string order_id = 2;
  // The order's account, whose partition the booking is in; the allocation
  // account for a block.
  string account_id = 3;
  // An explicit list on one order, sharing instrument, side, trade date and
  // settlement date, as FIX's AllocationInstruction (J) requires of NoExecs.
  repeated string execution_ids = 4;
  // One per account, summing exactly to the executions booked in quantity,
  // gross and each fee kind.
  repeated Allocation allocations = 5;
  // Derived from its journal, never stored.
  BookingState state = 6;
  // The book's words for what moved executed away from allocated, as FIX
  // keeps a rejection's reason in AllocRejCode (88); empty unless held.
  string held_reason = 7;
  // Its latest entry, which a catch-up reads it by (W4.3).
  JournalRef last_change = 8;
}

// One account's part of a booking (W11.27).
message Allocation {
  // `ALC-` and a ULID, minted by the book even for one account, never
  // reused (FIX IndividualAllocID, 467); empty on a command.
  string allocation_id = 1;
  // An account the allocation instruction names, or one marked an error
  // account (W9.13).
  string account_id = 2;
  // The instruction line's sleeve, the order's own the default; empty for
  // the account's unsleeved part.
  string sleeve = 3;
  Decimal quantity = 4;
  // The price the account's confirmation states.
  Money average_price = 5;
  // Quantity times average price, as the `oms` rounds it; the residual on a
  // named allocation.
  Money gross_amount = 6;
  // Each kind summing exactly to the executions' fees of that kind.
  repeated Fee fees = 7;
  // Derived from gross and fees, not checked by the book.
  Money net_amount = 8;
  // The date `operations` reconciles the allocation by, superseding the
  // fill's.
  string intended_settlement_date = 9;
  // Priced at the average, as the SEC's average-price notation marks a
  // confirmation.
  bool average_priced = 10;
  // The receiving account's own lots to relieve; empty, by the method.
  repeated string relieve_lot_ids = 11;
  // A person's words, required on an error-account allocation
  // (REFUSAL_REASON_REASON_REQUIRED).
  string reason = 12;
  // Unspecified unless the allocation is to an error account.
  ErrorCause error_cause = 13;
  // Required with ERROR_CAUSE_OTHER (INVALID_ARGUMENT naming it), as FIX's
  // Text (58).
  string error_text = 14;
  // Each prime's answer to a give-up of the allocation, in the order
  // recorded (W11.32).
  repeated GiveUpRecord give_up_answers = 15;
  // Contract v29: the accrued interest the customer pays or receives, a Money
  // in the settlement currency (FIX AccruedInterestAmt, 159, on Confirmation
  // 35=AK); final money is net_amount plus it. Unset on an allocation in an
  // instrument that accrues nothing; on a fixed-income allocation booked before
  // v29, unset, a backfilled record saying it was not recorded (decisions/031).
  optional Money accrued_interest = 16;
  // Contract v29: signed, a Money for the whole allocation: positive a markup
  // on a sale to the customer, negative a markdown on a purchase from it, the
  // name following the side as the rules name it; inside the price, never a fee
  // (a FIX export writes MiscFeeType 8). Unset where none: an agency trade, or
  // unset on an allocation booked before v29.
  optional Money markup = 17;
  // Contract v29: per unit in the instrument's price basis: per 100 of face for
  // a bond. Unset where no markup is disclosed, or unset on an allocation
  // booked before v29.
  optional Money prevailing_market_price = 18;
  // Contract v29: the rules' ladder in their order, one enum for both
  // regulators. Unspecified where no PMP.
  PrevailingMarketPriceBasis prevailing_market_price_basis = 19;
  // Contract v29: an EXE- execution (the firm's own contemporaneous trade) or a
  // lake row's dataset, row key and version (a trade, a quote, an engine
  // result's row), with its time. Unset where no PMP.
  PrevailingMarketPriceReference prevailing_market_price_reference = 20;
  // Contract v29: one of the existing four but mixed. Unspecified where not a
  // broker's trade; unset on an allocation booked before v29, each fixed-income
  // one given a backfilled record saying it was not recorded (decisions/031).
  Capacity capacity = 21;
  // Contract v29: for an allocation booking one execution its time; for an
  // average-priced allocation the time the oms fixed the customer's price, the
  // time all terms sufficient to compute the dollar price were agreed (FINRA
  // Rule 6710(d)'s time of execution). 0 where not a customer trade, or unset
  // on an allocation booked before v29.
  int64 execution_time_ns = 22;
  // Contract v29: to the second at least for a confirmation. Unspecified where
  // execution_time_ns is 0.
  TimePrecision execution_time_precision = 23;
  // Contract v29: as Execution.no_remuneration, for the same regulators. False:
  // not so, or not stated.
  bool no_remuneration = 24;
}

// A prime's answer to a give-up (W11.32), its own record, as FIX sends each
// AllocationReport (AS) as its own message.
message GiveUpRecord {
  GiveUpAnswer answer = 1;
  // As reported, FIX's SecondaryAllocID (793).
  string prime_reference = 2;
  string reason = 3;
  // Its entry in the account's partition.
  EntryMeta entry = 4;
}

// A cross between two sleeves of one account (W11.33), its tax and
// performance layers; no execution is minted for it.
message SleeveCross {
  // `SXC-` and a ULID, minted by the book, never reused.
  string sleeve_cross_id = 1;
  // One account; a cross between accounts is an internal cross, a real
  // trade.
  string account_id = 2;
  string instrument_id = 3;
  // Empty for the account's unsleeved part.
  string giving_sleeve = 4;
  string receiving_sleeve = 5;
  Decimal quantity = 6;
  // The plugin's choice (mid, last or close): each moved lot's performance
  // cost, never its tax basis.
  Money cross_price = 7;
  // Which price and when, the plugin's words.
  string price_source = 8;
  // Each order's filled quantity counts the cross.
  repeated string order_ids = 9;
  string reason = 10;
}

// A post-trade alert in an account's partition (W11.34), raised,
// acknowledged or cleared, never deleted; landed in the compliance spec's
// shape.
message Alert {
  // `ALR-` and a ULID, minted by the book, never reused.
  string alert_id = 1;
  string account_id = 2;
  AlertKind kind = 3;
  AlertState state = 4;
  // The book's words or `compliance`'s.
  string reason = 5;
  // What it is about.
  AlertSubject subject = 6;
  // A held booking's: the moment the `operations` plugin's
  // affirmation_deadline falls on the trade date, in the deployment's time
  // zone; zero otherwise.
  int64 due_by = 7;
  // Its latest entry, which a catch-up reads it by (W4.3).
  JournalRef last_change = 8;
}

// What an alert is about: a booking and its allocation, or for
// `compliance`'s own an order or a position.
message AlertSubject {
  string order_id = 1;
  string booking_id = 2;
  string allocation_id = 3;
  // An instrument and a side in the account, as a break names one (W9.4).
  PositionKey position = 4;
}

// W11.26: an order's allocation instruction amended, with a reason;
// answered with OrderReply.
message SetAllocationInstructionRequest {
  string order_id = 1;
  // The whole instruction; refused REFUSAL_REASON_ORDER_STATE where an
  // account's amount falls below what its live bookings allocate.
  AllocationInstruction allocation_instruction = 2;
  string reason = 3;
}

// W11.27: book an explicit list of executions on one order.
message BookOrderRequest {
  string order_id = 1;
  repeated string execution_ids = 2;
  repeated Allocation allocations = 3;
  // Handed off in the same act where the check passes, and booked where it
  // does not, as FIX's Ready-To-Book (AllocType, 626) in one step.
  bool hand_off = 4;
}

// W11.28: hand a booked or held booking off to `operations`, or close a
// client's booking the firm does not settle.
message HandOffBookingRequest {
  string booking_id = 1;
  // The client's allocations close, any error-account allocation on it
  // handed off to the firm's operations in the same act.
  bool close = 2;
}

// W11.29: cancel a booking before its hand-off, or replace its allocations
// after it.
message CorrectBookingRequest {
  // As FIX's RefAllocID (72) names the allocation it replaces.
  string booking_id = 1;
  BookingCorrectionKind kind = 2;
  // The whole set on a replace, as FIX's allocation Replace carries it;
  // empty on a cancel.
  repeated Allocation allocations = 3;
  // Empty: the trade date; empty on a cancel.
  string effective_date = 4;
  // As FIX's AllocCancReplaceReason (796) records why.
  string reason = 5;
}

// W11.32: a prime's answer to a give-up, from `connectivity` or
// `confirmation`; a fact, answered with FactReply.
message ReportGiveUpRequest {
  // One the book does not hold keeps the fact unplaced.
  string execution_id = 1;
  // Empty where no allocation is booked.
  string allocation_id = 2;
  GiveUpAnswer answer = 3;
  string prime_reference = 4;
  string reason = 5;
  RawRecordRef raw_record = 6;
}

// W11.33: a cross between two sleeves of one account, the `oms`'s.
message RecordSleeveCrossRequest {
  SleeveCross sleeve_cross = 1;
}

// W11.34: `compliance`'s own alert.
message RaiseAlertRequest {
  string account_id = 1;
  AlertKind kind = 2;
  string reason = 3;
  AlertSubject subject = 4;
}

// W11.34: an alert acknowledged, for a person, with a reason.
message AcknowledgeAlertRequest {
  string alert_id = 1;
  string reason = 2;
}

// W11.36: the deployment admin's setting for orders on local records, kept
// in the control partition, each change its own entry.
message SetLocalRecordOrdersRequest {
  // Shown "Allow orders on local records"; true by default.
  bool allows_local_record_orders = 1;
  string reason = 2;
}

// W11.37: the setting read.
message ReadLocalRecordOrdersRequest {}

// The escape hatch's setting in force (W11.36, W11.37).
message LocalRecordOrdersSetting {
  bool allows_local_record_orders = 1;
  // Orders not ended whose instrument's record is provisional, as of the
  // answer, for the deployment: a count naming no account and no order.
  int64 open_order_count = 2;
}

// W11.38 (contract v26): the deployment admin's guard on agents' orders,
// kept in the control partition, each change its own entry. Refused false
// in the version that brings it.
message SetAgentOrdersDemoOnlyRequest {
  // Shown "Agents may place orders on demo connections only"; true by
  // default.
  bool agent_orders_demo_only = 1;
  string reason = 2;
}

// W11.39: the guard read.
message ReadAgentOrdersDemoOnlyRequest {}

// The agents' guard in force (W11.38, W11.39).
message AgentOrdersDemoOnlySetting {
  bool agent_orders_demo_only = 1;
}

// W9.10 (contract v25): the book's health per account, for a deployment
// admin -- the dashboard's tool and the CLI's `meridian status` -- whatever
// database the book runs on.
message ReadBookHealthRequest {
  // One account; empty for every account, paged.
  string account_id = 1;
  int32 page_size = 2;
  string cursor = 3;
}

message ReadBookHealthReply {
  repeated AccountBookHealth accounts = 1;
  string next_cursor = 2;
}

// One account's journal and its last snapshot.
message AccountBookHealth {
  string account_id = 1;
  // Every entry in the account's journal.
  uint64 journal_entries = 2;
  // The replay length: entries a command or a read replays after the last
  // snapshot.
  uint64 entries_since_snapshot = 3;
  // When the last snapshot was taken; 0 where none is yet.
  int64 last_snapshot_at_ns = 4;
}

message BookingReply {
  Booking booking = 1;
  EntryMeta entry = 2;
  JournalRef journal = 3;
}

message SleeveCrossReply {
  SleeveCross sleeve_cross = 1;
  JournalRef journal = 2;
}

message AlertReply {
  Alert alert = 1;
  JournalRef journal = 2;
}

// W11.30: to `operations`, `oms`, `compliance`, `portfolio` and `reporting`
// within scope, by the account the booking is in.
message BookingUpdatedEvent {
  // Its whole new state, safe to apply twice.
  Booking booking = 1;
  EntryMeta entry = 2;
  JournalRef journal = 3;
  ChangeCause cause = 4;
}

// W11.35: to `compliance`, `reporting`, `oms` and `operations` within scope.
message AlertChangedEvent {
  Alert alert = 1;
  JournalRef journal = 2;
  ChangeCause cause = 3;
}

// W11.31: the bookings in the reader's scope, as of now or changed since a
// watermark, filtered by state.
message ListBookingsRequest {
  // Empty: every account in the reader's scope.
  string account_id = 1;
  // Only records whose last change is above it (W4.3).
  Watermark since = 2;
  // Unspecified: every state.
  BookingState state = 3;
  int32 page_size = 4;
  string cursor = 5;
}

message ListBookingsReply {
  repeated Booking bookings = 1;
  Watermark as_of = 2;
  string next_cursor = 3;
}

// W11.35: the alerts in the reader's scope, as of now or changed since a
// watermark, filtered by state and kind.
message ListAlertsRequest {
  // Empty: every account in the reader's scope.
  string account_id = 1;
  // Unspecified: every state.
  AlertState state = 2;
  // Only records whose last change is above it (W4.3).
  Watermark since = 3;
  int32 page_size = 4;
  string cursor = 5;
  // Unspecified: every kind.
  AlertKind kind = 6;
}

message ListAlertsReply {
  repeated Alert alerts = 1;
  Watermark as_of = 2;
  string next_cursor = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// Contract v28, track A: listed options and futures
// (sdk-contract/listed-options-and-futures-contract)
// ─────────────────────────────────────────────────────────────────────────────

// Contract v28: a listed option's exercise, assignment or expiry, or a
// future's day of settlement variation, reported, proposed or released, each
// its own record (contract v28, W9.16 to W9.19).
message LifecycleEvent {
  // LCE- and a ULID, minted by the book, never reused. Empty on a request;
  // never empty on a record.
  string event_id = 1;
  // An account in the sender's scope. Never empty.
  string account_id = 2;
  // A listed_option, future_option or future INS- record; from contract v29 a
  // debt record (bond, mbs_pool, tba, cmo_tranche, certificate_of_deposit).
  // Never empty.
  string instrument_id = 3;
  // The event's kind, a closed list. Unspecified is refused.
  LifecycleEventKind kind = 4;
  // Decided by the book. Unset on a request.
  LifecycleEventState state = 5;
  // Contracts exercised, assigned or expired; on a variation, the contracts
  // held at the settlement; from contract v29, on a debt record, its face
  // (original face for a pool or a tranche). Never unset.
  Decimal quantity = 6;
  // A plain date: the exercise, assignment or expiry date, or the settlement's
  // trading date. Never empty.
  string event_date = 7;
  // Each instrument and its signed quantity, as the broker states it, the
  // deliverable's components among them. None: an expiry, a cash settlement or
  // a variation; refused on a physical exercise or assignment.
  repeated LifecycleDelivery deliveries = 8;
  // Signed, positive received: a cash settlement's amount, a deliverable's
  // cash component, or a day's variation. Unset where no cash moves.
  optional Money cash = 9;
  // The exchange's settlement price for a variation; the settlement value for
  // a cash-settled option. Unset on an exercise or assignment with physical
  // delivery and on an expiry; refused unset on a variation.
  optional Money settlement_price = 10;
  // As the plugin read it; with the account, the book's key for a report sent
  // twice. Empty on a proposal, and where the broker states none.
  string external_event_id = 11;
  // The proposal's event_id. Empty except on a report that answered a
  // proposal, and on a release.
  string answers_event_id = 12;
  // The underlying's close against the strike for an exercise by exception, or
  // the settlement price. Unset except on a proposal.
  optional Money proposal_basis = 13;
  // The plugin's raw record, kept at the edge. Unset on a proposal.
  RawRecordRef raw_record = 14;
  // Its journal entry. Unset on a request.
  JournalRef last_change = 15;
  // Contract v29: maturity, full call, partial call, put or sinking-fund draw,
  // as the custodian states it; a partial call by lottery can only be reported,
  // never derived. Unspecified on any kind but redemption.
  RedemptionEventKind redemption_kind = 16;
  // Contract v29: per 100 of face, before accrued, as the custodian states it;
  // the lots close at it. Unset on any kind but redemption.
  optional Decimal redemption_price = 17;
  // Contract v29: a plain date, the accrual start. Empty on any kind but coupon
  // received.
  string period_start_date = 18;
  // Contract v29: a plain date, exclusive, the accrual end. Empty on any kind
  // but coupon received.
  string period_end_date = 19;
  // Contract v29: a plain date: a coupon's, a redemption's or a paydown's.
  // Empty where the kind has none.
  string record_date = 20;
  // Contract v29: the agency's published factor the paydown or accretion
  // brought the pool or class to, an exact decimal, as the Factor row (W10.4).
  // Unset on any kind but paydown and accretion.
  optional Decimal factor = 21;
  // Contract v29: the factor the event moved from; cash on a paydown is
  // (prior_factor - factor) times original face. Unset on any kind but paydown
  // and accretion.
  optional Decimal prior_factor = 22;
  // Contract v29: signed: positive a Z class's accretion, negative an IO's
  // notional fall; no cash moves and the lots stay in original face. Unset on
  // any kind but accretion.
  optional Decimal face_change = 23;
}

// Contract v28 (LifecycleEvent.deliveries): states what changed hands on
// physical delivery.
message LifecycleDelivery {
  // The underlying, a deliverable component, or a currency's cash instrument.
  // Never empty.
  string instrument_id = 1;
  // Signed: positive received into the account, negative delivered out. Never
  // unset; never zero.
  Decimal quantity = 2;
  // The strike, or an adjusted deliverable's stated price. Unset: the strike,
  // by the option's terms.
  optional Money price = 3;
}

// Contract v28 (W9.16): RecordLifecycleEvent's request.
message RecordLifecycleEventRequest {
  // The event as the broker states it, or as proposed. Never unset.
  LifecycleEvent event = 1;
  // The plugin's key for the report. Empty: the envelope's message identifier
  // stands for it.
  string idempotency_key = 2;
}

// Contract v28 (W9.16): RecordLifecycleEvent's answer.
message RecordLifecycleEventReply {
  // Its event_id, state and the proposal it answered. Never unset.
  LifecycleEvent event = 1;
}

// Contract v28 (W9.17): ProposeLifecycleEvents's request.
message ProposeLifecycleEventsRequest {
  // Each in its account, recorded as proposed. Never empty.
  repeated LifecycleEvent events = 1;
}

// Contract v28 (W9.17): ProposeLifecycleEvents's answer.
message ProposeLifecycleEventsReply {
  // Its event_id and state. One per event proposed, in order.
  repeated LifecycleEvent events = 1;
}

// Contract v28 (W9.18): ReleaseLifecycleEvent's request.
message ReleaseLifecycleEventRequest {
  // A proposal no report answered. Never empty.
  string event_id = 1;
  // Kept on the release's entry (decisions/031). Never empty: refused
  // REFUSAL_REASON_REASON_REQUIRED.
  string note = 2;
}

// Contract v28 (W9.18): ReleaseLifecycleEvent's answer.
message ReleaseLifecycleEventReply {
  // The proposal, booked. Never unset.
  LifecycleEvent event = 1;
}

// Contract v28 (W9.19): LifecycleEventRecorded's event.
message LifecycleEventRecordedEvent {
  // The event as committed. Never unset.
  LifecycleEvent event = 1;
  // The partition and sequence the entry committed at; the event is sent only
  // after it commits (W9's invariants; amendment to DESIGN28, 2026-10-24).
  // Never unset.
  JournalRef journal = 2;
  // The message that caused it, its instance and its identifiers, as every
  // delivery's cause (W9.8). Never unset.
  ChangeCause cause = 3;
}

// Contract v28 (W9.19): ListLifecycleEvents's request.
message ListLifecycleEventsRequest {
  // An account in the reader's scope. Never empty.
  string account_id = 1;
  // Its INS- record. Empty: every instrument.
  string instrument_id = 2;
  // The kinds answered. None: every kind.
  repeated LifecycleEventKind kinds = 3;
  // A plain date, on event_date. Empty: from the account's opening balance.
  string from_date = 4;
  // A plain date, on event_date. Empty: to today.
  string to_date = 5;
  // A sequence per partition; events whose last change is above it (amendment
  // to DESIGN28, 2026-10-24: a record row is caught up by watermark, as the
  // book's other records are). Unset is everything.
  Watermark since = 6;
  // How many events a page holds at most. 0 is 100; past 500, answered at 500.
  uint32 page_size = 7;
  // The next_cursor a page answered, as written. Empty is the first page.
  string cursor = 8;
}

// Contract v28 (W9.19): ListLifecycleEvents's answer.
message ListLifecycleEventsReply {
  // Each with its state, in the account's sequence. None in the window.
  repeated LifecycleEvent events = 1;
  // The head of each partition the read saw, at one snapshot. Never empty.
  Watermark as_of = 2;
  // Opaque. Empty when nothing follows.
  string next_cursor = 3;
}

enum PositionEffect {
  // Not stated: an instrument that is no option or future; refused on an
  // option or a future.
  POSITION_EFFECT_UNSPECIFIED = 0;
  // Opens or adds to a position.
  POSITION_EFFECT_OPEN = 1;
  // Closes or reduces a position.
  POSITION_EFFECT_CLOSE = 2;
}

// Contract v29 (711; FINRA Rule 2121.02(b), MSRB G-30 .06(a)): what a
// prevailing market price was read from -- an EXE- execution, the firm's own
// contemporaneous trade, or a lake row's dataset, row key and version -- with
// its time.
message PrevailingMarketPriceReference {
  // Names the firm's own contemporaneous trade: an EXE- execution. Empty where
  // the PMP came from the lake.
  string execution_id = 1;
  // Names the lake dataset the row is in: as Source.dataset. Empty where the
  // PMP came from an execution.
  string dataset = 2;
  // Names the lake row: its row key. Empty where the PMP came from an
  // execution.
  string row_key = 3;
  // Names the row's version: the version read. 0 where the PMP came from an
  // execution.
  int64 version = 4;
  // States the time of the price taken: the trade's or quote's time. Never 0
  // when set.
  int64 at_ns = 5;
}

// Contract v29 (711): how a prevailing market price was found, the rules'
// ladder in their order, one enum for both regulators.
enum PrevailingMarketPriceBasis {
  // Not stated: no PMP, or booked before v29.
  PREVAILING_MARKET_PRICE_BASIS_UNSPECIFIED = 0;
  // The dealer's contemporaneous cost or proceeds, the presumption (FINRA
  // 2121.02(b)(1); MSRB G-30 .06(a)(i)).
  PREVAILING_MARKET_PRICE_BASIS_CONTEMPORANEOUS_COST = 1;
  // Contemporaneous inter-dealer transactions in the security.
  PREVAILING_MARKET_PRICE_BASIS_INTER_DEALER_TRANSACTIONS = 2;
  // Contemporaneous dealer transactions with institutional accounts.
  PREVAILING_MARKET_PRICE_BASIS_INSTITUTIONAL_TRANSACTIONS = 3;
  // Contemporaneous quotations.
  PREVAILING_MARKET_PRICE_BASIS_QUOTATIONS = 4;
  // Similar securities.
  PREVAILING_MARKET_PRICE_BASIS_SIMILAR_SECURITIES = 5;
  // An economic model.
  PREVAILING_MARKET_PRICE_BASIS_ECONOMIC_MODEL = 6;
}

// Contract v29: a fixed-income street report's contra party, matching the
// lake's trade characteristics by meaning (W10.4).
enum ContraPartyType {
  // Not said: not a fixed-income street report.
  CONTRA_PARTY_TYPE_UNSPECIFIED = 0;
  // A customer (TRACE's C).
  CONTRA_PARTY_TYPE_CUSTOMER = 1;
  // A FINRA member or MSRB dealer, named by its MPID.
  CONTRA_PARTY_TYPE_DEALER = 2;
  // A non-member affiliate (TRACE's A1).
  CONTRA_PARTY_TYPE_NON_MEMBER_AFFILIATE = 3;
  // A clearing broker on an RTRS inter-dealer regulatory-only trade.
  CONTRA_PARTY_TYPE_CLEARING_BROKER = 4;
}

// Contract v29: TRACE's Treasury trade modifiers.
enum TreasuryTradeModifier {
  // None.
  TREASURY_TRADE_MODIFIER_UNSPECIFIED = 0;
  // A leg of a series with a futures leg (TRACE's .B).
  TREASURY_TRADE_MODIFIER_FUTURES_LEG = 1;
  // A series not priced at the market (TRACE's .S).
  TREASURY_TRADE_MODIFIER_NON_MARKET_SERIES = 2;
  // Hedged (TRACE's H).
  TREASURY_TRADE_MODIFIER_HEDGED = 3;
}

enum MultiLegReportingType {
  // Read as single.
  MULTI_LEG_REPORTING_TYPE_UNSPECIFIED = 0;
  // A fill of a single-instrument order (FIX 442 = 1).
  MULTI_LEG_REPORTING_TYPE_SINGLE = 1;
  // One leg's fill of a package (442 = 2): the leg's instrument, side,
  // quantity and price.
  MULTI_LEG_REPORTING_TYPE_LEG = 2;
  // The package's fill (442 = 3): no instrument, quantity in package units,
  // the net price.
  MULTI_LEG_REPORTING_TYPE_PACKAGE = 3;
}

enum LifecycleEventKind {
  // Refused.
  LIFECYCLE_EVENT_KIND_UNSPECIFIED = 0;
  // A long option exercised: by the holder, or by exception at expiry.
  LIFECYCLE_EVENT_KIND_EXERCISE = 1;
  // A short option assigned, as the broker allocated it.
  LIFECYCLE_EVENT_KIND_ASSIGNMENT = 2;
  // An option expired with nothing delivered or paid.
  LIFECYCLE_EVENT_KIND_EXPIRY = 3;
  // A future's day of variation against the settlement price, a cash line only
  // (ruling 562).
  LIFECYCLE_EVENT_KIND_SETTLEMENT_VARIATION = 4;
  // Contract v29: coupon received: a debt record's interest paid to the holder
  // of record, cash only, the period and record date stated (683).
  LIFECYCLE_EVENT_KIND_COUPON_RECEIVED = 5;
  // Contract v29: redemption: a maturity, a full or partial call, a put or a
  // sinking-fund draw, closing or reducing lots at the redemption price (683).
  LIFECYCLE_EVENT_KIND_REDEMPTION = 6;
  // Contract v29: paydown: principal returned on a pool or tranche, cash equal
  // to the factor's fall times original face, the lots kept in original face
  // and their cost relieved pro rata (680).
  LIFECYCLE_EVENT_KIND_PAYDOWN = 7;
  // Contract v29: accretion: a Z class's face increase or an IO's notional
  // fall, no cash (682).
  LIFECYCLE_EVENT_KIND_ACCRETION = 8;
  // Contract v29: tba allocation: at pool notice, the TBA's lots closed and the
  // delivered pools' lots opened (681).
  LIFECYCLE_EVENT_KIND_TBA_ALLOCATION = 9;
  // Contract v29: strip: a whole bond exchanged for its STRIPS components, the
  // basis allocated by relative value.
  LIFECYCLE_EVENT_KIND_STRIP = 10;
  // Contract v29: reconstitution: STRIPS components exchanged back for the
  // whole bond.
  LIFECYCLE_EVENT_KIND_RECONSTITUTION = 11;
}

// Contract v29 (683): what a redemption record redeemed, as the custodian
// states it.
enum RedemptionEventKind {
  // Unset on any kind but redemption; refused on a redemption.
  REDEMPTION_EVENT_KIND_UNSPECIFIED = 0;
  // Repaid at maturity.
  REDEMPTION_EVENT_KIND_MATURITY = 1;
  // Called in full: CDM CorporateActionTypeEnum EarlyRedemption.
  REDEMPTION_EVENT_KIND_FULL_CALL = 2;
  // Called in part, by lottery or pro rata: no CDM type, held more.
  REDEMPTION_EVENT_KIND_PARTIAL_CALL = 3;
  // Put by the holder.
  REDEMPTION_EVENT_KIND_PUT = 4;
  // A mandatory sinking-fund draw: no CDM type, held more.
  REDEMPTION_EVENT_KIND_SINKING_FUND = 5;
}

enum LifecycleEventState {
  // Never on a record; a sender leaves it unset.
  LIFECYCLE_EVENT_STATE_UNSPECIFIED = 0;
  // Proposed by servicing, moving nothing.
  LIFECYCLE_EVENT_STATE_PROPOSED = 1;
  // A proposal a report answered.
  LIFECYCLE_EVENT_STATE_ANSWERED = 2;
  // A report, or a released proposal, its movement lines journaled.
  LIFECYCLE_EVENT_STATE_BOOKED = 3;
  // A booked event a later correction names.
  LIFECYCLE_EVENT_STATE_SUPERSEDED = 4;
}
