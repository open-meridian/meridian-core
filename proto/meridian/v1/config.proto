// What a deployment admin authors, and what the conductor's configuration
// store serves from it.
//
// Derived from workflows W6 (a person in a deployment) and W4 (plugin
// lifecycle); from contract v22 also W11.20 to W11.22, a connectivity
// plugin's link to its `ems`, the `ems`'s venue account map and the venue's
// catalogue. Every message here traces to a matrix row; see matrix/matrix.tsv.
//
// The governing idea: access is three dimensions joined by a permission -- a
// user group (who), an account group (which accounts), an access group (which
// plugins and roles, each at read, write or admin) -- and a person's access is the
// union of their user groups' permissions, combined permission by permission.
// None of it is read from a token, and none of it ever reaches the platform.
//
// Everything here lives in the conductor's configuration store. The dashboard
// writes it by command and reads it by query; a sidecar reads its own plugin's
// part by query, answered for the instance the envelope names and no other.

syntax = "proto3";

package meridian.v1;

// What a plugin declares it needs (W4.1), which a settings form is built from,
// and the levels of access (W6.7), which a plugin's pages and a person's
// claims name too. Plugin-facing, and imported from there at the revision
// this repository pins.
import "meridian/v1/sidecar.proto";

// An instance's archive (W8.7, contract v16), which the moves' read carries.
import "meridian/v1/plugins.proto";

// A dataset's entitlements and its catalogue entry (W10.1, contract v18),
// which an entitlements change carries.
import "meridian/v1/lake.proto";
// The order path's order types, times in force and strategy kinds (W11,
// contract v22), which a venue's catalogue lists.
import "meridian/v1/book.proto";
// IdentifierUsageReport: a usage report the conductor sent (W3.28, contract
// v24).
import "meridian/v1/reference.proto";

// ─────────────────────────────────────────────────────────────────────────────
// W6.1 — who has signed in
// ─────────────────────────────────────────────────────────────────────────────

// Published by the dashboard at each sign-in and kept by the conductor, for
// the access table (W4.10) and the per-plugin count. Only people who have
// signed in are in it, and it never leaves the deployment.
message SignInRecord {
  // Deployment-local: the directory's issuer and subject.
  string subject = 1;
  string display_name = 2;

  // As the directory presented them at this sign-in. Never synchronised.
  repeated string directory_groups = 3;

  int64 signed_in_at_ns = 4;
}

// The dashboard's refresh of everything it evaluates access from, at least
// every 30 seconds (decisions/015).
message AccessRecordsRequest {}

message AccessRecords {
  repeated AccountRecord accounts = 1;
  repeated UserGroup user_groups = 2;
  repeated AccountGroup account_groups = 3;
  repeated AccessGroup access_groups = 4;
  repeated Permission permissions = 5;

  // The latest sign-in of each person who has signed in.
  repeated SignInRecord people = 6;

  // When the store answered. The dashboard refuses once this is 10 minutes old.
  int64 read_at_ns = 7;

  // Every external account linked to an account (W6.4), so the dashboard can
  // show the links and tell which of the accounts a connector reports have
  // none. Only the conductor and each plugin's own sidecar knew them before.
  repeated ExternalAccountLink links = 8;

  // Each known plugin's settings form (W6.11): what it declared, its values
  // that are not secret, and which secrets are set. Never a secret's value.
  repeated PluginSettingsRecord plugin_settings = 9;

  // Each known plugin's roles, as its sidecar last reported them (contract
  // v15, W6.1): every plugin a sidecar has reported, launched through the
  // dashboard or installed by the chart, running or stopped, so the dashboard
  // folds each grant per plugin and role and mints each role's entry in the
  // claims. Empty before any sidecar has reported.
  repeated KnownPluginRoles known_plugins = 10;

  // The holds on raw records a deployment admin set (W6.25, contract v16),
  // one per edge role or one for every one, for the deployment's Settings
  // and each edge plugin's Summary. Empty while none is set.
  repeated Hold holds = 11;

  // Each plugin instance's linkable accounts (W6.30, contract v20), for the
  // dashboard's Accounts tab, the "Setting up" step and its read tool.
  repeated LinkableAccounts linkable_accounts = 12;

  // Each connectivity plugin's link as the conductor keeps it (W11.21,
  // contract v22; approved 2026-10-12): available, its one `ems`, its users,
  // for the dashboard's pages and dashboard__read_plugin_access. Filled for
  // the dashboard only; an instance never recorded is withdrawn and
  // unlinked, and absent.
  repeated ConnectivityLink connectivity_links = 13;

  // Each `ems`'s venue account map (W11.22, contract v22; approved
  // 2026-10-12): the mappings that reach something, at connectivity plugins
  // linked to that `ems` now, for its Access tab and
  // dashboard__read_plugin_access. Filled for the dashboard only.
  repeated VenueAccountMap venue_account_maps = 14;
}

// One known plugin and the roles it was launched with (contract v15).
message KnownPluginRoles {
  string plugin_instance_id = 1;

  // Roles from the deployment's fixed list; empty for a plugin holding none.
  repeated string roles = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// W6.3 — accounts
// ─────────────────────────────────────────────────────────────────────────────

// The only thing holdings are recorded against. A plugin creates one only by
// linking an external account to a new one, acting for a deployment admin in
// a session opened by Manage (W6.4).
message AccountRecord {
  string account_id = 1;
  string name = 2;
  AccountState state = 3;
  int64 created_at_ns = 4;

  // Free text, optional, and searchable as the name is (W6.3). Where the
  // account is held, e.g. "Fidelity". At most 200 characters.
  string custodian = 5;

  // What the account is, e.g. "Roth IRA". At most 200 characters.
  string account_type = 6;

  // One ownership or grouping label, e.g. "Fund I". At most 200 characters.
  string owner = 7;

  // Anything else worth knowing about it. At most 2,000 characters.
  string note = 8;
}

enum AccountState {
  ACCOUNT_STATE_UNSPECIFIED = 0;
  ACCOUNT_STATE_OPEN = 1;

  // Closed, not deleted: an account is the subject of records that outlive it.
  ACCOUNT_STATE_CLOSED = 2;
}

// Creates an account when `account_id` is empty; edits it otherwise, setting
// its name, custodian, type, owner and note to those given, so an empty one
// clears it.
message DefineAccountRequest {
  string account_id = 1;
  string name = 2;
  string custodian = 3;
  string account_type = 4;
  string owner = 5;
  string note = 6;
}

message CloseAccountRequest {
  string account_id = 1;

  // Contract v24 (W6.3): "Unlink all and close". The conductor withdraws
  // every grant of the account to a plugin instance (W6.30), each its own
  // record, and closes it, in one step. A link (W6.4) or an ems's mapping
  // (W11.22) still standing is undone at its plugin's page: the closure is
  // refused naming each, and nothing is withdrawn or closed. Without it, an
  // account anything is still attached to is refused the same way.
  bool unlink_attached = 2;

  // Why, at most 2,000 characters, on each grant's withdrawal; required
  // through a delegation (approved 2026-10-15).
  string note = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// W6.4 — linking a plugin's external account
// ─────────────────────────────────────────────────────────────────────────────

// Links an external account a plugin reported, or removes its link.
// Names an existing account, or a new account's name for the conductor to
// create and link in one step, or neither to remove the link; never both. Held
// as one of that plugin's settings. Sent by the plugin from one of its pages at
// admin, acting for the admin of the plugin viewing it in a session opened by
// Manage (W6.4, W6.9): any of them names an existing account, and only a
// deployment admin a new one. The plugin's sidecar stamps plugin_instance_id.
message LinkExternalAccountRequest {
  string plugin_instance_id = 1;
  string external_account_id = 2;
  string account_id = 3;

  // A new account's name, for the conductor to create and link in one step.
  string new_account_name = 4;

  // The new account's custodian, type, owner and note (W6.3), which the
  // plugin may pre-fill from what the venue reported. Ignored unless
  // new_account_name is given: an existing account is edited only by W6.3.
  string new_account_custodian = 5;
  string new_account_type = 6;
  string new_account_owner = 7;
  string new_account_note = 8;
}

// W6.30, contract v20. A deployment admin grants a plugin instance that reads
// external accounts the accounts its admins may link to, or withdraws some.
// The dashboard stamps who, through which delegation and client, and when.
// Each grant and withdrawal is its own record in the conductor
// (LinkableAccountsChange, decisions/031). A withdrawal removes no link.
message SetLinkableAccountsRequest {
  string plugin_instance_id = 1;

  // Accounts to grant, each an existing account; one already granted is
  // unchanged. At most 1,000.
  repeated string grant_account_ids = 2;

  // Accounts to withdraw; one not granted is unchanged. At most 1,000.
  repeated string withdraw_account_ids = 3;

  // Why, at most 4,000 characters; required through a delegation.
  string note = 4;
}

// The accounts one plugin instance's admins may link its external accounts
// to (W6.4, W6.30, contract v20). Nothing by default.
message LinkableAccounts {
  string plugin_instance_id = 1;
  repeated string account_ids = 2;

  // Who last changed it and when, the delegation and client a person acted
  // through, as the dashboard stamped them; empty before any grant. The
  // upgrade's own grant names no person.
  string updated_by = 3;
  int64 updated_at_ns = 4;
  string acting_through_delegation = 5;
  string client_name = 6;
}

message ExternalAccountLink {
  string plugin_instance_id = 1;
  string external_account_id = 2;
  string account_id = 3;
}

// The deployment's accounts, read by a plugin acting for its admin
// in a session opened by Manage, to offer the accounts an external account
// can be linked to (W4.9, W6.4): from contract v20 every account the
// deployment admin granted the asking instance (W6.30), the instance the
// envelope's; every account before v20. Its identity alone.
message AccountsRequest {}

message Accounts {
  // Each account's identifier, name, state, custodian, type, owner and note;
  // no holdings.
  repeated AccountRecord accounts = 1;
}

// Published by a sidecar when its plugin brought data for external accounts
// with no link, which it refused (W2, W4.8). In the config domain rather than
// beside the plugin report, because the deployment domain carries no account.
message UnlinkedExternalAccountsEvent {
  string plugin_instance_id = 1;
  repeated UnlinkedExternalAccount accounts = 2;
}

message UnlinkedExternalAccount {
  string external_account_id = 1;
  int64 refused_rows = 2;
  int64 first_seen_at_ns = 3;
  int64 last_seen_at_ns = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// W6.5 to W6.8 — the three dimensions, and the permission joining them
// ─────────────────────────────────────────────────────────────────────────────

// Who. Permissions name user groups, never directory groups, so moving to a
// new directory changes only these members.
message UserGroup {
  string user_group_id = 1;
  string name = 2;

  // A person is a member when, at sign-in, they are in one of these.
  repeated string directory_groups = 3;

  // Or when they are one of these: deployment-local subjects.
  repeated string logins = 4;
}

// Creates when `user_group.user_group_id` is empty; replaces it otherwise.
message DefineUserGroupRequest {
  UserGroup user_group = 1;
}

// Which accounts. An explicit list: no nesting, and an empty group reaches
// nothing. One group is built in, All accounts (W6.6).
message AccountGroup {
  string account_group_id = 1;
  string name = 2;

  // Empty for All accounts, whose accounts are read from the accounts as
  // they are.
  repeated string account_ids = 3;

  // True only for All accounts, which holds every account the deployment
  // has -- those no other group lists and those opened after a permission
  // names it included -- lists none of its own, and cannot be edited or
  // deleted. A permission may name it like any other (W6.6, W6.8).
  bool built_in = 4;
}

message DefineAccountGroupRequest {
  AccountGroup account_group = 1;
}

// Which plugin, which of its roles, at which level: `read`, `write` or
// `admin`. One plugin per entry, so each plugin's users can be counted on
// their own. The levels are the same for every plugin and role, and a plugin
// names no parts of itself for access: its roles are the deployment's fixed
// list (W6.7; decisions/026, 027, 033). A group may name a plugin and role at
// `admin` and at one data level; naming it at both `read` and `write`, or
// twice at one level, is refused.
message AccessEntry {
  string plugin_instance_id = 1;
  AccessLevel level = 3;

  // The role of the plugin the entry grants a level on (contract v15,
  // decisions/033): one the plugin holds, as its sidecar last reported. Empty
  // only for a plugin holding no role. An entry naming a role the plugin no
  // longer holds holds nothing.
  string role = 4;

  // One of the plugin's tags, retired with them (decisions/026).
  reserved 2;
  reserved "tag";
}

message AccessGroup {
  string access_group_id = 1;
  string name = 2;
  repeated AccessEntry entries = 3;

  // True for the two built-in groups, neither of which can be edited or
  // deleted, each known by its identifier. Deployment admin holds the
  // dashboard's own capabilities, admin on no plugin and no account's data
  // (W6.7). All plugins (admin) grants `admin` on every plugin, those launched
  // later included, and no account's data; first run and a claim code link
  // the deployment admins' user group to it (W6.2, W7.6).
  bool built_in = 4;
}

message DefineAccessGroupRequest {
  AccessGroup access_group = 1;
}

// One user group, one account group, one access group. A permission to
// deployment admin, to All plugins (admin), or to an access group whose
// entries are all `admin` names no account group, since configuring a plugin
// is not an act on an account; one to an access group with a `read` or
// `write` entry names one, and its `admin` entries use none (W6.8).
message Permission {
  string permission_id = 1;
  string user_group_id = 2;
  string account_group_id = 3;
  string access_group_id = 4;
}

message GrantPermissionRequest {
  string user_group_id = 1;
  string account_group_id = 2;
  string access_group_id = 3;
}

// Refused for the last permission to deployment admin, so a deployment is
// never left without an administrator. Any permission to All plugins (admin)
// may be withdrawn, so a firm that separates the duties has deployment admins
// who configure no plugin (W6.7).
message WithdrawPermissionRequest {
  string permission_id = 1;
}

message WithdrawPermissionReply {
  bool withdrawn = 1;
  string refusal_reason = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// W6.11 — plugin settings
// ─────────────────────────────────────────────────────────────────────────────

message PluginSettingValue {
  string name = 1;
  string value = 2;
}

// Sets or clears a plugin's settings, for an admin of the plugin.
// Sent by the dashboard alone, from the plugin's Settings form, for the admin
// signed in (W6.11). A plugin sets none of its settings: it reads them as
// they are delivered (W4.7).
message SetPluginSettingsRequest {
  string plugin_instance_id = 1;

  // Set or replace these.
  repeated PluginSettingValue values = 2;

  // Remove these.
  repeated string cleared = 3;

  // Why, in the words of the person or of the agent acting for them, kept
  // with each change's record (decisions/031; contract v17). Through /mcp
  // every change carries one (W6.20); a person at the page may give none.
  string note = 4;

  // The settings record's updated_at_ns as it was read (contract v17): the
  // conductor refuses the change, naming this field, where the record has
  // changed since. 0 from a client built before it, checked as before.
  int64 against_updated_at_ns = 5;
}

// What the dashboard may show. A secret's value is never here, only that it
// is set.
message PluginSettingsRecord {
  string plugin_instance_id = 1;
  repeated PluginSettingValue values = 2;
  repeated string secrets_set = 3;
  int64 updated_at_ns = 4;

  // What the plugin declared when it last registered (W4.8), which the form
  // is built from and every value is checked against.
  repeated SettingDeclaration declared_settings = 5;

  // Who made the latest change to the settings, a clear included, at
  // updated_at_ns: the deployment-local subject of the admin the dashboard
  // stamped on the Settings form (W6.11). Empty while nothing was ever
  // changed, and for a clear the plugin's re-declaring a setting made.
  string updated_by = 6;

  // Per setting ever changed, its latest change as its own record says it
  // (contract v17): who, when, and the delegation and client where one was
  // used, so the form and core's tools say when a secret was set and by
  // whom, never its value. Empty from a conductor before v17.
  repeated SettingLastChange changes = 7;
}

// One setting's latest change (W6.11, contract v17): set or cleared, a
// secret's included, and never its value.
message SettingLastChange {
  string name = 1;

  // The deployment-local subject the dashboard stamped; empty for a clear
  // the plugin's re-declaring a setting made.
  string changed_by = 2;
  int64 changed_at_ns = 3;

  // The delegation the person acted through, and its client's registered
  // name, as the dashboard stamped them (W4.9): empty for a change made in
  // a browser, and on every change before v17, each of which was.
  string acting_through_delegation = 4;
  string client_name = 5;

  // Why, as kept with that change (contract v17): the words of whoever made
  // it -- required through /mcp, optional at the form -- or the store's own
  // where it backfilled the record. Empty where none was given.
  string note = 6;

  // The prepared change it was made from, where a person made it from one
  // (W6.27, W4.9; contract v20): empty otherwise, and before v20.
  string prepared_call_id = 7;

  // For a secret of sixteen characters or more, its last four, kept
  // apart from the secret when it was set and never derived from it again
  // (W6.11, contract v20; the name approved 2026-10-11): empty for a
  // setting that is not secret, a shorter secret, and every secret set
  // before v20. Not the value, which is never read back.
  string hint = 8;
}

// ─────────────────────────────────────────────────────────────────────────────
// W6.25 — the hold on raw records, contract v16
// ─────────────────────────────────────────────────────────────────────────────

// Sets or clears a hold, for a deployment admin, from the deployment's
// Settings (spec/an-edge-plugins-older-records-move-to-the-archive,
// requirement 8). Sent by the dashboard alone, for the admin signed in.
message SetHoldRequest {
  // An edge role (decisions/028), or empty for every one. Another role is
  // refused, naming it.
  string role = 1;

  // The least number of days a record is kept anywhere, storage or
  // archive, from when it was received. 0 clears the hold; at most 36,500.
  uint32 days = 2;

  // Whether the hold needs records that cannot be altered: met only by an
  // archive with object lock, for the hold's length, and refused where the
  // deployment's archive cannot lock (kernel/edge-plugins-own-storage-for-
  // raw-records, ruling 3).
  bool write_once = 3;

  // Why, kept with the change's record (decisions/031; contract v17).
  // Through /mcp every change carries one (W6.20).
  string note = 4;
}

// A hold as the conductor records it.
message Hold {
  string role = 1;
  uint32 days = 2;
  bool write_once = 3;

  // Who set it, the deployment-local subject the dashboard stamped, and
  // when. Each change is its own record (decisions/031).
  string updated_by = 4;
  int64 updated_at_ns = 5;

  // The delegation the person acted through and its client's name, as the
  // dashboard stamped them (contract v17): empty for a hold set in a
  // browser, and on every hold before v17, each of which was.
  string acting_through_delegation = 6;
  string client_name = 7;

  // Why, as kept with its latest change (contract v17): required through
  // /mcp, optional at the page; empty where none was given, and on every
  // change before v17.
  string note = 8;

  // The prepared change it was made from, where a person made it from one
  // (W6.27, W4.9; contract v20): empty otherwise, and before v20.
  string prepared_call_id = 9;
}

// ─────────────────────────────────────────────────────────────────────────────
// W6.9, W4.13 — the moves of an edge plugin's raw records, contract v16
// ─────────────────────────────────────────────────────────────────────────────

// The dashboard reads an edge plugin's moves for its Summary, newest first.
message ReadMovesRequest {
  string plugin_instance_id = 1;

  // Empty for the newest page; the reply's `next_cursor` for the next.
  string cursor = 2;
}

message ReadMovesReply {
  // A page of the instance's moves, newest first, each as recorded.
  repeated MoveRecord moves = 1;

  // Empty when there is no older page.
  string next_cursor = 2;

  // Per kind, what the archive holds: the units archived and not deleted,
  // summed from the moves.
  repeated StoredSpan archived = 3;

  // Whether a deployment admin allowed the instance an archive, and its
  // bound (W8.7); unset when never allowed.
  PluginArchive archive = 4;
}

// One move as the conductor recorded it (W4.13): the move the sidecar
// reported, and who and when.
message MoveRecord {
  RecordMoveRequest move = 1;

  // The deployment-local subject of the person it was done for, from the
  // envelope; empty for a window's move, whose rule the move names.
  string person = 2;

  // When the conductor recorded it, in nanoseconds since the epoch.
  int64 at_ns = 3;

  // The delegation the person acted through and its client's name, from
  // the envelope (contract v17): empty for a window's move, for a person in
  // a browser, and on every move recorded before v17.
  string acting_through_delegation = 4;
  string client_name = 5;
}

// ─────────────────────────────────────────────────────────────────────────────
// W4.7, W4.11 — what a sidecar is told about its own plugin
// ─────────────────────────────────────────────────────────────────────────────

// Answered for the instance the envelope names, and no other. Secrets travel
// only on this reply, never on a broadcast, because the broker narrows
// publishing to an instance and not subscribing.
message PluginConfigurationRequest {}

message PluginConfiguration {
  string plugin_instance_id = 1;

  // Including secrets' values, for the sidecar to hand to its plugin.
  repeated PluginSettingValue settings = 2;

  // For translating external accounts on the way in (W2).
  repeated ExternalAccountLink links = 3;

  // The plugin's account scope, derived from permissions (decisions/014).
  repeated string read_account_ids = 4;
  repeated string write_account_ids = 5;

  // The accounts this plugin's links name, each once, as the configuration
  // holds them: for the sidecar to give its plugin each link's account name
  // beside its scope (W4.11). A rename or a close of one is a change to the
  // plugin's configuration, announced as any other.
  repeated AccountRecord linked_accounts = 6;

  // The hold over the instance (W6.25, contract v16): the longest of its
  // edge roles' and the one for every role, in days; 0 when none. The
  // sidecar refuses a deletion inside it (W4.13).
  uint32 hold_days = 7;

  // Whether that hold needs records that cannot be altered.
  bool hold_write_once = 8;

  // Contract v22 (W4.11, W11.21, W11.22): for a connectivity plugin, its
  // link to its one `ems`, its scope the accounts that `ems` mapped on it;
  // for an `ems`, the connectivity plugins linked to it, who may route
  // through each, and its venue account map. The sidecar hands them to the
  // plugin beside its scope (AccountScopeDelivery).
  ConnectivityLink connectivity_link = 9;
  repeated ConnectivityLink connectivity_links = 10;
  VenueAccountMap venue_account_map = 11;

  // The launched version's declaration (W4.1, contract v25), so the sidecar
  // holds the plugin's registration to it. Unset for a version uploaded
  // with none.
  PluginDeclaration declaration = 12;

  // Whether the catalogue launched this instance (W4.1, W8.3, contract v25).
  // Registration is held to the uploaded declaration only for an instance
  // the catalogue launched, and a plugin declaring v25 whose version was
  // uploaded with none is refused. False for a sidecar no launch made --
  // the plugin harness, a developer's local run -- which admits
  // registration unchecked unless it was handed a declaration
  // (MERIDIAN_PLUGIN_DECLARATION), and then holds it to that one.
  bool launched = 13;
}

// Something in a plugin's configuration changed; its sidecar asks again.
// Carries no setting, so every sidecar may hear it.
message PluginConfigurationChangedEvent {
  string plugin_instance_id = 1;
  int64 changed_at_ns = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// W10.1 — a dataset's licence and its entitlements, contract v18
// ─────────────────────────────────────────────────────────────────────────────
//
// Kept by the conductor beside the plugins' configuration, set by a deployment
// admin at the dashboard's Data sources page or through its tools, and never
// sent to the platform (spec/the-lake, requirements 12 to 14).

// A deployment admin licenses a dataset: confirms or replaces the terms its
// catalogue declares (DatasetDeclaration.licence_default). Answered by the
// licence as recorded.
message SetDatasetLicenceRequest {
  string dataset = 1;

  // The terms; its dataset and who set it are the request's and the
  // dashboard's, whatever it carries.
  DatasetLicence licence = 2;

  // Why, kept with the change's record (decisions/031). Through /mcp every
  // change carries one.
  string note = 3;
}

// A deployment admin entitles a plugin instance to a dataset, all fields or
// some, or withdraws it. Answered by the entitlement as recorded.
message SetDatasetEntitlementRequest {
  string dataset = 1;
  string instance = 2;

  // False withdraws the entitlement.
  bool allowed = 3;

  // By their dictionary entries; empty for every field. At most 64.
  repeated string fields = 4;

  // Why, kept with the change's record. Through /mcp every change carries
  // one.
  string note = 5;
}

// The deployment's data configuration changed: every launched dataset with
// its catalogue entry, every licence and every entitlement, whole. The lake
// answers and keeps by it; each sidecar keeps its own plugin's entitlements
// and strips what its plugin may not read. Published on every change and on
// the conductor's start.
message EntitlementsChangedEvent {
  repeated DatasetRef datasets = 1;
  repeated DatasetLicence licences = 2;
  repeated DatasetEntitlement entitlements = 3;
  int64 changed_at_ns = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// W11.20 to W11.22 — a connectivity plugin's `ems`, and its venue's catalogue,
// contract v22
// ─────────────────────────────────────────────────────────────────────────────
//
// Ruled 2026-10-10 (step 5's Q14 extended; the order-path plan's Q20): the
// deployment admin makes a connectivity plugin available; the `ems` plugin's
// admin links an available one to their `ems` and makes it available to the
// `ems`'s users; each connectivity plugin is linked to exactly one `ems`,
// and an `ems`, usually a desk, may have many. The `ems` maps its accounts to
// the venue account codes they trade under, so it sets the venue's account
// field and the sidecar stamps a venue fact's account
// (`venue-account-map`); a connectivity plugin links no account of its own.
// The conductor keeps each, every change its own record (decisions/031:
// ConnectivityLinkChange and VenueAccountMapChange, kept by the conductor and
// named in the dictionary with `kept_by: conductor`, which no proto carries,
// as the dashboard keeps ServiceAccountChange), and delivers them beside
// each plugin's scope (W4.11). ConnectivityLink and
// VenueAccountMap ride that delivery, so they are plugin-facing, declared in
// meridian-schema's sidecar.proto and imported from there.

// W11.21. For a deployment admin, at the page only (access): makes an
// instance holding `connectivity` available, or withdraws it. Answered by
// its link as recorded. Nothing is available by default.
message SetConnectivityAvailableRequest {
  string connectivity_instance_id = 1;
  bool available = 2;
  // Why, kept with the change's record.
  string note = 3;
}

// W11.21. For the `ems` plugin's admin, at the page only (access): links an
// available connectivity plugin to their `ems`, or unlinks it (an empty
// ems_instance_id), and makes it available to the `ems`'s users. Refused
// REFUSAL_REASON_CONNECTIVITY_LINKED for one already linked to another
// `ems`. Unlinking leaves the placements already made as they are.
message LinkConnectivityRequest {
  string connectivity_instance_id = 1;
  string ems_instance_id = 2;
  // The whole set, replacing the last.
  repeated ConnectivityUser users = 3;
  string note = 4;
}

// W11.22. Sent by the `ems` acting for the admin viewing its page (W4.9):
// maps an account to the venue account code it trades under at one of the
// `ems`'s connectivity plugins, or removes the mapping (an empty
// account_id). Answered by the `ems`'s map as recorded; refused
// REFUSAL_REASON_ACCOUNT_NOT_LINKABLE for an account not granted to the
// `ems`'s instance (W6.30), REFUSAL_REASON_CONNECTIVITY_NOT_ALLOWED for a
// connectivity plugin not linked to it, ALREADY_EXISTS for a code mapped on
// that plugin already.
message MapVenueAccountRequest {
  string connectivity_instance_id = 1;
  string venue_account_code = 2;
  string account_id = 3;
  // Stamped by the sidecar: the sending instance.
  string ems_instance_id = 4;
}

// A venue's offering per venue account code (W11.20), converted at the edge
// from the venue's own definitions: not a capability, and nothing declared
// about the role. What is not listed is rejected unsupported if sent.
message VenueCatalogue {
  // The connectivity plugin it came from: the stamped publisher's.
  string connectivity_instance_id = 1;
  string venue_account_code = 2;
  repeated VenueOrderType order_types = 3;
  repeated VenueStrategy strategies = 4;
  repeated VenueEligibility eligibility = 5;
  // Contract v23 (W11.20, W11.23, W11.24): what the connectivity plugin
  // sends its venue when the `ems` accepts a venue-originated fill or
  // answers it DK. Unspecified, as a v22 catalogue is, reads as none.
  ExecutionAcknowledgement execution_acknowledgement = 6;
  // Contract v26 (W11.20; G1 question 5, approved 2026-10-14): the
  // environment the plugin's session actually reached, read from the
  // vendor's host, in the role-common setting's values -- `live`,
  // `sandbox` or `paper`; empty, as a v25 catalogue is, is no report. A
  // connection is demo only while its setting and this both say `sandbox`
  // or `paper`.
  string environment = 7;
  // Contract v27 (W11.20; the gaps spec's B4): the placement types the
  // venue takes beside its order types; one not listed is rejected
  // unsupported by the connectivity plugin. Empty, as a v26 catalogue is,
  // reads as DMA alone.
  repeated PlacementType placement_types = 8;
}

// The acknowledgement a venue takes of an execution it originated (W11.20;
// contract v23). Never a record of one sent: FIX answers BN with nothing.
enum ExecutionAcknowledgement {
  // Not said: read as EXECUTION_ACKNOWLEDGEMENT_NONE, the venue not told.
  EXECUTION_ACKNOWLEDGEMENT_UNSPECIFIED = 0;
  // The venue takes neither message: nothing is sent at an accept or a DK.
  EXECUTION_ACKNOWLEDGEMENT_NONE = 1;
  // FIX's ExecutionAcknowledgement (35=BN): ExecAckStatus (1036) Accepted
  // at an accept, Don't know / Rejected with DKReason (127) at a DK.
  EXECUTION_ACKNOWLEDGEMENT_BN = 2;
  // FIX's DontKnowTrade (35=Q) at a DK, and nothing at an accept.
  EXECUTION_ACKNOWLEDGEMENT_DONT_KNOW_TRADE = 3;
}

// An order type the venue offers, with the times in force it takes.
message VenueOrderType {
  OrderType order_type = 1;
  repeated TimeInForce times_in_force = 2;
  int64 stated_at_ns = 3;
}

// A broker's strategy (the order-path plan's refresh, Q31, as refined and
// ruled 2026-10-12): the strategy and its parameters on the model of FIXatdl,
// the FIX Trading Community's standard for describing algorithmic strategies,
// or mapping one to one onto it, so a broker's published definitions are
// imported at the edge rather than keyed again.
message VenueStrategy {
  // Which of the contract's kinds it is the broker's, where it is one.
  StrategyKind kind = 1;
  // The broker's name for it.
  string name = 2;
  int64 stated_at_ns = 3;
  // Its parameters, as FIXatdl's Parameter elements describe them.
  repeated StrategyParameter parameters = 4;
}

// One parameter of a broker's strategy, on FIXatdl's Parameter: its name,
// type, whether required (use="required"), its range (minValue, maxValue),
// its allowed values (EnumPair) and its default (initValue). FIXatdl's
// fixTag and the strategy's wireValue stay at the edge: an `ems` never
// meets a FIX tag (W11.20).
message StrategyParameter {
  string name = 1;
  StrategyParameterType type = 2;
  bool required = 3;
  // In the type's text form; empty where unbounded.
  string min_value = 4;
  string max_value = 5;
  // Empty where any value of the type is allowed.
  repeated string allowed_values = 6;
  string default_value = 7;
}

// FIXatdl's parameter types (Int_t, Float_t, Qty_t, Price_t, PriceOffset_t,
// Amt_t, Percentage_t, Boolean_t, Char_t, String_t, UTCTimestamp_t,
// LocalMktDate_t), in the contract's spelling.
enum StrategyParameterType {
  STRATEGY_PARAMETER_TYPE_UNSPECIFIED = 0;
  STRATEGY_PARAMETER_TYPE_INT = 1;
  STRATEGY_PARAMETER_TYPE_FLOAT = 2;
  STRATEGY_PARAMETER_TYPE_QTY = 3;
  STRATEGY_PARAMETER_TYPE_PRICE = 4;
  STRATEGY_PARAMETER_TYPE_PRICE_OFFSET = 5;
  STRATEGY_PARAMETER_TYPE_AMOUNT = 6;
  STRATEGY_PARAMETER_TYPE_PERCENTAGE = 7;
  STRATEGY_PARAMETER_TYPE_BOOLEAN = 8;
  STRATEGY_PARAMETER_TYPE_CHAR = 9;
  STRATEGY_PARAMETER_TYPE_STRING = 10;
  STRATEGY_PARAMETER_TYPE_UTC_TIMESTAMP = 11;
  STRATEGY_PARAMETER_TYPE_LOCAL_MARKET_DATE = 12;
}

// The venue's eligibility for one instrument.
message VenueEligibility {
  string instrument_id = 1;
  bool fractionable = 2;
  bool shortable = 3;
  int64 stated_at_ns = 4;
  BorrowStatus borrow_status = 5;
  // The options level the venue states for the account; 0 where none.
  uint32 options_level = 6;
}

// A venue's borrow status for an instrument (W11.18's easy- and
// hard-to-borrow).
enum BorrowStatus {
  BORROW_STATUS_UNSPECIFIED = 0;
  BORROW_STATUS_EASY_TO_BORROW = 1;
  BORROW_STATUS_HARD_TO_BORROW = 2;
}

// W11.20. Published by a connectivity plugin, per venue account code its
// `ems` mapped; kept by the conductor, latest per code, each change its own
// record; heard by the `ems` and the `oms`.
message VenueCatalogueEvent {
  VenueCatalogue catalogue = 1;
  // Stamped by the sidecar, whatever the plugin sent.
  string publisher_instance_id = 2;
}

// W11.20. The latest per venue account code; a code the plugin has not
// published is answered empty, not refused.
message ReadVenueCatalogueRequest {
  string connectivity_instance_id = 1;
  string venue_account_code = 2;
}

message ReadVenueCatalogueReply {
  VenueCatalogue catalogue = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// W3.28 — the deployment's identifier usage report, contract v24
// ─────────────────────────────────────────────────────────────────────────────
//
// The deployment admin's setting `reports_usage`, shown "Report identifier
// usage", on by default and kept by the conductor, each change recorded as
// any setting's; the reports the conductor sent, kept on the deployment as
// its own records (the platform-master intent's ruling 15).

// A deployment admin turns the report on or off, with a reason.
message SetReportsUsageRequest {
  bool reports_usage = 1;
  string reason = 2;
}

// The setting in force.
message ReportsUsageSetting {
  bool reports_usage = 1;

  // The identifier schemes the deployment declares it is licensed for
  // (W3.28, contract v25), as the report carries them; empty until a
  // deployment admin declares one.
  repeated string licensed_schemes = 2;
}

// The deployment admin declares the identifier schemes the deployment is
// licensed for (W3.28, contract v25): the whole list, replacing the last,
// each a scheme the licence list names. Each change is its own record, as
// any setting's is.
message SetLicensedSchemesRequest {
  repeated string licensed_schemes = 1;
  string reason = 2;
}

// The reports the conductor sent.
message ListUsageReportsRequest {}

message ListUsageReportsReply {
  repeated SentUsageReport reports = 1;

  // The setting in force (`reports_usage`), so the page says whether the
  // report is on.
  bool reports_usage = 2;

  // The schemes the deployment declares it is licensed for (contract v25).
  repeated string licensed_schemes = 3;
}

// A usage report the conductor sent, kept on the deployment as its own
// record.
message SentUsageReport {
  int64 sent_at_ns = 1;
  // Whether the platform received it.
  bool received = 2;
  IdentifierUsageReport report = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// W6.35 — the deployment's time zone, contract v26
// ─────────────────────────────────────────────────────────────────────────────

// The deployment admin sets the deployment's time zone (W6.35; the v26
// plan's question 229): each change its own record.
message SetDeploymentTimeZoneRequest {
  // An IANA time-zone ID (RFC 6557's database): `America/New_York`.
  string deployment_time_zone = 1;
  string reason = 2;
}

// W6.35: the zone read, by the book for due_by (W11.34) and the dashboard.
message ReadDeploymentTimeZoneRequest {}

// The deployment's time zone in force, and beside it the deadline the book
// sets a held booking's due_by from (W11.34; question 230).
message DeploymentTimeZoneSetting {
  // `America/New_York` by default.
  string deployment_time_zone = 1;
  // The last change; 0 and empty for the default never changed.
  int64 changed_at_ns = 2;
  string changed_by = 3;
  // The earliest affirmation_deadline a launched operations instance
  // declares (W8.1), minutes after midnight in the zone, 1 to 1440; 0 where
  // none is launched or none declares one.
  uint32 affirmation_deadline = 4;
  // The instance declaring it; empty with 0.
  string affirmation_deadline_instance_id = 5;
}

// ─────────────────────────────────────────────────────────────────────────────
// W6.36 — the deployment's FX pivot currencies, contract v27
// ─────────────────────────────────────────────────────────────────────────────

// The deployment admin sets the order of the pivots the analytics component
// crosses a fiat cash leg through when the lake holds no direct rate in
// either direction (W6.36, W12.2; rulings 462 and 483): each change its own
// record.
message SetFxPivotCurrenciesRequest {
  // Fiat cash instruments by their `INS-` IDs, tried in order: one to four,
  // none repeated, never a crypto or stablecoin instrument.
  repeated string fx_pivot_currencies = 1;
  string reason = 2;
}

// W6.36: the pivots read, by the analytics component as it converts a job's
// legs (W12.2) and by the dashboard.
message ReadFxPivotCurrenciesRequest {}

// The deployment's FX pivot currencies in force.
message FxPivotCurrenciesSetting {
  // USD's cash instrument, then EUR's, by default.
  repeated string fx_pivot_currencies = 1;
  // The last change; 0 and empty for the default never changed.
  int64 changed_at_ns = 2;
  string changed_by = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// Contract v28, track A: listed options and futures
// (sdk-contract/listed-options-and-futures-contract)
// ─────────────────────────────────────────────────────────────────────────────

// W6.37 (ruling 561; its shape ruled 2026-10-24, 589): the deployment
// admin's standing acceptance rule for asking the platform to mint listed
// series: an order's want, a standing want, and a daily limit. Each change
// its own record.
message SetSeriesRequestRuleRequest {
  SeriesRequestRule rule = 1;
  string reason = 2;
}

// W6.37: the rule read, by the instrument store before it asks
// (RequestSeriesRecords, W3.31) and by the dashboard.
message ReadSeriesRequestRuleRequest {}

// The series request rule in force (W6.37; 589).
message SeriesRequestRule {
  // True: a series an order or a proposal names is asked for. On by
  // default.
  bool orders = 1;
  // True: a standing want's series (a signal plugin's watched chains) are
  // asked for. Off by default, refused by rule.
  bool standing_wants = 2;
  // The most series asked for in a day, 1 or more; 500 by default.
  uint32 daily_limit = 3;
  // The last change; 0 and empty for the default never changed.
  int64 changed_at_ns = 4;
  string changed_by = 5;
}

// ─────────────────────────────────────────────────────────────────────────────
// Contract v28, track D: the latency remainder
// (sdk-contract/sessions-and-data-report-their-latency-contract)
// ─────────────────────────────────────────────────────────────────────────────

// W6.38 (rulings 515 and 517): whether an ems plugin's admin may choose
// to warn, beside refuse, when an order is placed on a reference price past
// its ceiling. Refuse only by default. Each change its own record.
message SetStaleReferenceActionsPermittedRequest {
  bool warn_permitted = 1;
  string reason = 2;
}

// W6.38: the setting read, by an ems plugin before it places on a stale
// reference, and by the dashboard.
message ReadStaleReferenceActionsPermittedRequest {}

// The stale-reference actions permitted in force (W6.38).
message StaleReferenceActionsPermittedSetting {
  // True: an ems plugin admin may choose warn; false: refuse only, and a
  // plugin's warn is read as refuse.
  bool warn_permitted = 1;
  // The last change; 0 and empty for the default never changed.
  int64 changed_at_ns = 2;
  string changed_by = 3;
}
