// What a deployment admin authors, and what the conductor's configuration
// store serves from it.
//
// Derived from workflows W6 (a person in a deployment) and W4 (plugin
// lifecycle). Every message here traces to a matrix row; see matrix/matrix.tsv.
//
// The governing idea: access is three dimensions joined by a permission -- a
// user group (who), an account group (which accounts), an access group (which
// plugins, each at read or write) -- and a person's access is the
// union of their user groups' permissions, combined permission by permission.
// None of it is read from a token, and none of it ever reaches the platform.
//
// Everything here lives in the conductor's configuration store. The dashboard
// writes it by command and reads it by query; a sidecar reads its own plugin's
// part by query, answered for the instance the envelope names and no other.

syntax = "proto3";

package meridian.v1;

// What a plugin declares it needs (W4.1), which a settings form is built from.
// Plugin-facing, and imported from there at the revision this repository pins.
import "meridian/v1/sidecar.proto";

// ─────────────────────────────────────────────────────────────────────────────
// W6.1 — who has signed in
// ─────────────────────────────────────────────────────────────────────────────

// Published by the dashboard at each sign-in and kept by the conductor, for
// the access table (W4.10) and the per-plugin count. Only people who have
// signed in are in it, and it never leaves the deployment.
message SignInRecord {
  // Deployment-local: the directory's issuer and subject.
  string subject = 1;
  string display_name = 2;

  // As the directory presented them at this sign-in. Never synchronised.
  repeated string directory_groups = 3;

  int64 signed_in_at_ns = 4;
}

// The dashboard's refresh of everything it evaluates access from, at least
// every 30 seconds (decisions/015).
message AccessRecordsRequest {}

message AccessRecords {
  repeated AccountRecord accounts = 1;
  repeated UserGroup user_groups = 2;
  repeated AccountGroup account_groups = 3;
  repeated AccessGroup access_groups = 4;
  repeated Permission permissions = 5;

  // The latest sign-in of each person who has signed in.
  repeated SignInRecord people = 6;

  // When the store answered. The dashboard refuses once this is 10 minutes old.
  int64 read_at_ns = 7;

  // Every external account linked to an account (W6.4), so the dashboard can
  // show the links and tell which of the accounts a connector reports have
  // none. Only the conductor and each plugin's own sidecar knew them before.
  repeated ExternalAccountLink links = 8;

  // Each known plugin's settings form (W6.11): what it declared, its values
  // that are not secret, and which secrets are set. Never a secret's value.
  repeated PluginSettingsRecord plugin_settings = 9;
}

// ─────────────────────────────────────────────────────────────────────────────
// W6.3 — accounts
// ─────────────────────────────────────────────────────────────────────────────

// The only thing holdings are recorded against. A plugin creates one only by
// linking an external account to a new one, acting for a deployment admin
// (W6.4).
message AccountRecord {
  string account_id = 1;
  string name = 2;
  AccountState state = 3;
  int64 created_at_ns = 4;

  // Free text, optional, and searchable as the name is (W6.3). Where the
  // account is held, e.g. "Fidelity". At most 200 characters.
  string custodian = 5;

  // What the account is, e.g. "Roth IRA". At most 200 characters.
  string account_type = 6;

  // One ownership or grouping label, e.g. "Fund I". At most 200 characters.
  string owner = 7;

  // Anything else worth knowing about it. At most 2,000 characters.
  string note = 8;
}

enum AccountState {
  ACCOUNT_STATE_UNSPECIFIED = 0;
  ACCOUNT_STATE_OPEN = 1;

  // Closed, not deleted: an account is the subject of records that outlive it.
  ACCOUNT_STATE_CLOSED = 2;
}

// Creates an account when `account_id` is empty; edits it otherwise, setting
// its name, custodian, type, owner and note to those given, so an empty one
// clears it.
message DefineAccountRequest {
  string account_id = 1;
  string name = 2;
  string custodian = 3;
  string account_type = 4;
  string owner = 5;
  string note = 6;
}

message CloseAccountRequest {
  string account_id = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// W6.4 — linking a plugin's external account
// ─────────────────────────────────────────────────────────────────────────────

// Links an external account a plugin reported, or removes its link.
// Names an existing account, or a new account's name for the conductor to
// create and link in one step, or neither to remove the link; never both. Held
// as one of that plugin's settings. Sent by the plugin from its own admin page,
// acting for the deployment admin viewing it (W6.4); the plugin's sidecar
// stamps plugin_instance_id.
message LinkExternalAccountRequest {
  string plugin_instance_id = 1;
  string external_account_id = 2;
  string account_id = 3;

  // A new account's name, for the conductor to create and link in one step.
  string new_account_name = 4;

  // The new account's custodian, type, owner and note (W6.3), which the
  // plugin may pre-fill from what the venue reported. Ignored unless
  // new_account_name is given: an existing account is edited only by W6.3.
  string new_account_custodian = 5;
  string new_account_type = 6;
  string new_account_owner = 7;
  string new_account_note = 8;
}

message ExternalAccountLink {
  string plugin_instance_id = 1;
  string external_account_id = 2;
  string account_id = 3;
}

// The deployment's accounts, read by a plugin acting for a deployment admin
// to offer the accounts an external account can be linked to (W6.4).
message AccountsRequest {}

message Accounts {
  // Each account's identifier, name, state, custodian, type, owner and note;
  // no holdings.
  repeated AccountRecord accounts = 1;
}

// Published by a sidecar when its plugin brought data for external accounts
// with no link, which it refused (W2, W4.8). In the config domain rather than
// beside the plugin report, because the deployment domain carries no account.
message UnlinkedExternalAccountsEvent {
  string plugin_instance_id = 1;
  repeated UnlinkedExternalAccount accounts = 2;
}

message UnlinkedExternalAccount {
  string external_account_id = 1;
  int64 refused_rows = 2;
  int64 first_seen_at_ns = 3;
  int64 last_seen_at_ns = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// W6.5 to W6.8 — the three dimensions, and the permission joining them
// ─────────────────────────────────────────────────────────────────────────────

// Who. Permissions name user groups, never directory groups, so moving to a
// new directory changes only these members.
message UserGroup {
  string user_group_id = 1;
  string name = 2;

  // A person is a member when, at sign-in, they are in one of these.
  repeated string directory_groups = 3;

  // Or when they are one of these: deployment-local subjects.
  repeated string logins = 4;
}

// Creates when `user_group.user_group_id` is empty; replaces it otherwise.
message DefineUserGroupRequest {
  UserGroup user_group = 1;
}

// Which accounts. An explicit list: no nesting, no "all accounts", and an
// empty group reaches nothing.
message AccountGroup {
  string account_group_id = 1;
  string name = 2;
  repeated string account_ids = 3;
}

message DefineAccountGroupRequest {
  AccountGroup account_group = 1;
}

// Which plugin, at which level. One plugin per entry, so each plugin's users
// can be counted on their own. The levels are the same for every plugin, and
// a plugin names no parts of itself for access (decisions/026).
message AccessEntry {
  string plugin_instance_id = 1;
  AccessLevel level = 3;

  // One of the plugin's tags, retired with them (decisions/026).
  reserved 2;
  reserved "tag";
}

enum AccessLevel {
  ACCESS_LEVEL_UNSPECIFIED = 0;

  // What the plugin reads, which it may show the person, cut to the accounts
  // they may read: queries and receiving events.
  ACCESS_LEVEL_READ = 1;

  // What the plugin publishes, which it may do for the person, acting for
  // them, on the accounts they may write: commands, and everything read
  // allows.
  ACCESS_LEVEL_WRITE = 2;
}

message AccessGroup {
  string access_group_id = 1;
  string name = 2;
  repeated AccessEntry entries = 3;

  // True only for deployment admin, which holds the dashboard's own
  // capabilities and every account, and cannot be edited or deleted.
  bool built_in = 4;
}

message DefineAccessGroupRequest {
  AccessGroup access_group = 1;
}

// One user group, one account group, one access group. A permission to the
// built-in deployment admin access group names no account group.
message Permission {
  string permission_id = 1;
  string user_group_id = 2;
  string account_group_id = 3;
  string access_group_id = 4;
}

message GrantPermissionRequest {
  string user_group_id = 1;
  string account_group_id = 2;
  string access_group_id = 3;
}

// Refused for the last permission to deployment admin, so a deployment is
// never left without an administrator.
message WithdrawPermissionRequest {
  string permission_id = 1;
}

message WithdrawPermissionReply {
  bool withdrawn = 1;
  string refusal_reason = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// W6.11 — plugin settings
// ─────────────────────────────────────────────────────────────────────────────

message PluginSettingValue {
  string name = 1;
  string value = 2;
}

message SetPluginSettingsRequest {
  string plugin_instance_id = 1;

  // Set or replace these.
  repeated PluginSettingValue values = 2;

  // Remove these.
  repeated string cleared = 3;
}

// What the dashboard may show. A secret's value is never here, only that it
// is set.
message PluginSettingsRecord {
  string plugin_instance_id = 1;
  repeated PluginSettingValue values = 2;
  repeated string secrets_set = 3;
  int64 updated_at_ns = 4;

  // What the plugin declared when it last registered (W4.8), which the form
  // is built from and every value is checked against.
  repeated SettingDeclaration declared_settings = 5;
}

// ─────────────────────────────────────────────────────────────────────────────
// W4.7, W4.11 — what a sidecar is told about its own plugin
// ─────────────────────────────────────────────────────────────────────────────

// Answered for the instance the envelope names, and no other. Secrets travel
// only on this reply, never on a broadcast, because the broker narrows
// publishing to an instance and not subscribing.
message PluginConfigurationRequest {}

message PluginConfiguration {
  string plugin_instance_id = 1;

  // Including secrets' values, for the sidecar to hand to its plugin.
  repeated PluginSettingValue settings = 2;

  // For translating external accounts on the way in (W2).
  repeated ExternalAccountLink links = 3;

  // The plugin's account scope, derived from permissions (decisions/014).
  repeated string read_account_ids = 4;
  repeated string write_account_ids = 5;
}

// Something in a plugin's configuration changed; its sidecar asks again.
// Carries no setting, so every sidecar may hear it.
message PluginConfigurationChangedEvent {
  string plugin_instance_id = 1;
  int64 changed_at_ns = 2;
}
