// Instrument identity, symbology mapping, and the escalation path when a
// resolution misses.
//
// Derived from workflows W1 (security master administration) and W3 (instrument
// resolution and completion in a deployment; contract v10, decisions/030: a
// deployment mints its own instrument IDs, and a person completes its records).
// From contract v18 also the venue master: the platform's own record of each
// venue, which deployments pull and never mint (W1.16 to W1.19, W3.14, W3.15).
// From contract v22 the settlement calendars and date rules, the platform's
// records too, and the date read that works out every date one way (W1.20 to
// W1.23, W3.16 to W3.21). Every message here traces to a matrix row; see
// matrix/matrix.tsv.
//
// The scope boundary is load-bearing: this is identity, mapping and structure.
// Prices, yields, ratings, volumes and sector data are client-licensed and live
// in the deployment. Identity attributes and data values never mix, and no
// field below invites them to.

syntax = "proto3";

package meridian.v1;

import "meridian/v1/sidecar.proto";
// Money: a binary event contract's payout (contract v19).
import "meridian/v1/amounts.proto";

// ─────────────────────────────────────────────────────────────────────────────
// The record
// ─────────────────────────────────────────────────────────────────────────────

// Lifecycle. The transition verbs are the commands; nothing sets this directly.
enum InstrumentLifecycleState {
  INSTRUMENT_LIFECYCLE_STATE_UNSPECIFIED = 0;

  // Identity exists, attributes may be incomplete. A holding can reference it,
  // which is the point: a position may arrive before anyone has decided what
  // the instrument is.
  INSTRUMENT_LIFECYCLE_STATE_DEFINE = 1;

  // Fully defined.
  INSTRUMENT_LIFECYCLE_STATE_ACTIVE = 2;

  // Retired. Existing holdings stay resolvable, because history does not stop
  // being true when an instrument stops trading.
  INSTRUMENT_LIFECYCLE_STATE_DECOMMISSIONED = 3;
  // Contract v28: A listed series past its last lifecycle date, marked by the
  // platform: still resolvable for a date it traded, never reused; never set
  // on a venue.
  INSTRUMENT_LIFECYCLE_STATE_EXPIRED = 4;
}

// The kind of claim holding an instrument gives. A closed list, ruled by the
// product owner (sdk-contract/asset-class-is-an-enum, 2026-09-28 and
// 2026-09-30); a class joins it by a ruling, never because a feed sent one.
// Spelled in text as the value's name without its prefix, lower case:
// `equity`, `debt`, `fund`, `derivative`, `crypto_asset`, `event_contract`,
// `cash`.
//
// What kind of instrument within a class is its instrument type
// (InstrumentType, contract v11), which grows one type at a time as a
// workflow needs it.
enum AssetClass {
  // No class. Held only by a stub minted from a deployment's miss (W3.4),
  // which may not know one; activating an instrument requires a class (W1.8).
  ASSET_CLASS_UNSPECIFIED = 0;

  // A share of ownership.
  ASSET_CLASS_EQUITY = 1;

  // Somebody owes the holder.
  ASSET_CLASS_DEBT = 2;

  // A share of a pool: ETFs and mutual funds among them.
  ASSET_CLASS_FUND = 3;

  // A contract whose value comes from something else: options and futures
  // among them.
  ASSET_CLASS_DERIVATIVE = 4;

  ASSET_CLASS_CRYPTO_ASSET = 5;

  // Pays on whether an event happens.
  ASSET_CLASS_EVENT_CONTRACT = 6;

  // A holding of a currency's cash instrument (spec/the-account-side-fits-every-venue).
  ASSET_CLASS_CASH = 7;

  // Contract v27 (W1.1; spec/a-public-rates-and-filings-data-plugin, Q3):
  // what the lake observes and nobody holds -- an interest rate, a rate
  // curve, an index -- following ISO 10962's category T. Never held: W9
  // refuses a position in one.
  ASSET_CLASS_REFERENTIAL = 8;
}

// What kind of instrument within its asset class (contract v11; the product
// owner, 2026-10-02: "Yes to put instrument type into v11 scope"). In the
// contract's own words, ISO 10962 (CFI) a reference and not the vocabulary;
// a type joins when a workflow needs it, each with its dictionary entry, and
// each is under one asset class. Spelled in text as the value's name without
// its prefix, lower case: `money_market_fund`.
enum InstrumentType {
  // No type stated: the asset class says all the record says.
  INSTRUMENT_TYPE_UNSPECIFIED = 0;

  // Under fund: a fund that invests in short-term debt under SEC rule 2a-7
  // and aims to keep its value, with the attributes of MoneyMarketFund.
  // Held as a fund, never as cash, even where a custodian sweeps cash into it.
  INSTRUMENT_TYPE_MONEY_MARKET_FUND = 1;

  // Under event_contract (contract v19): a contract paying a fixed amount if
  // an event happens and nothing if it does not, with the attributes of
  // BinaryEventContract. A venue's YES and NO tokens are two instruments,
  // each one.
  INSTRUMENT_TYPE_BINARY_EVENT_CONTRACT = 2;

  // Under referential (contract v27; the rates slice): a reference rate --
  // SOFR, EFFR, €STR, an average, a bound of the FOMC range.
  INSTRUMENT_TYPE_INTEREST_RATE = 3;
  // Under referential (contract v27): a rate curve, one record whose points
  // are the lake's rows by tenor -- Treasury's par curves, the Board's zero
  // curve.
  INSTRUMENT_TYPE_RATE_CURVE = 4;
  // Under referential (contract v27): an index -- the SOFR Index.
  INSTRUMENT_TYPE_INDEX = 5;
  // Contract v28: Under derivative: a listed equity, ETF or index option, one
  // series a record, with the attributes of ListedOption.
  INSTRUMENT_TYPE_LISTED_OPTION = 6;
  // Contract v28: Under derivative: a listed future, one contract month a
  // record, with the attributes of FutureContract.
  INSTRUMENT_TYPE_FUTURE = 7;
  // Contract v28: Under derivative: an option whose underlying is a future
  // record, with the attributes of ListedOption.
  INSTRUMENT_TYPE_FUTURE_OPTION = 8;
  // Contract v28: Under referential: a commodity a future is written on, never
  // held.
  INSTRUMENT_TYPE_COMMODITY = 9;
}

// A binary event contract's attributes (contract v19; plans/the-lake-prices-
// the-book, Q38): what it pays and when trading in it closes. Which outcome
// it pays on stays in its description, the venue's words, until the outcome
// is an observation (vL1c); the outcome and its settlement are not the
// record's.
message BinaryEventContract {
  // What one contract pays if the event happens, naming its cash instrument:
  // 1 USD at Kalshi, 1 in the venue's USDC instrument at Polymarket. A
  // contract's price divided by this is its implied probability, a reader's
  // computation, never stored.
  Money payout = 1;

  // When trading in it closes, as the venue states it; 0 when it states none.
  int64 closes_at_ns = 2;

  // Contract v26 (W1.24; spec/the-contract-gaps-v26-and-v27-close, A4,
  // approved 2026-10-14): a range market's bounds, fields of the binary
  // event contract template's v26 version, never the group's. An open tail
  // has one bound only; neither set where the contract is no range.
  EventContractBound floor = 3;
  EventContractBound cap = 4;
  // The unit both bounds are in: an instrument's ID where the bound is a
  // price, otherwise the venue's unit word (`degrees_f`, `index_points`,
  // `percent`); empty where neither bound is set.
  string bound_unit = 5;
}

// One bound of a range market (A4): Kalshi's `greater` and
// `greater_or_equal` are inclusive false and true.
message EventContractBound {
  Decimal value = 1;
  bool inclusive = 2;
}

// A money market fund's attributes, from SEC rule 2a-7 as amended in 2023
// (the product owner, 2026-10-02, the custody audit's Q4). Its observations
// -- its NAV on a day, its seven-day yield, its liquid assets, a fee imposed
// -- are the lake's, not the record's.
message MoneyMarketFund {
  MoneyMarketFundCategory category = 1;
  MoneyMarketFundInvestors investors = 2;
  MoneyMarketFundNav nav = 3;
  LiquidityFeeRegime liquidity_fee = 4;
}

// What a money market fund invests in.
enum MoneyMarketFundCategory {
  MONEY_MARKET_FUND_CATEGORY_UNSPECIFIED = 0;
  // Cash, government securities and repurchase agreements backed by them.
  MONEY_MARKET_FUND_CATEGORY_GOVERNMENT = 1;
  // Also corporate short-term debt.
  MONEY_MARKET_FUND_CATEGORY_PRIME = 2;
  // Short-term municipal debt.
  MONEY_MARKET_FUND_CATEGORY_TAX_EXEMPT = 3;
}

// Whom a money market fund is offered to.
enum MoneyMarketFundInvestors {
  MONEY_MARKET_FUND_INVESTORS_UNSPECIFIED = 0;
  // Natural persons only.
  MONEY_MARKET_FUND_INVESTORS_RETAIL = 1;
  MONEY_MARKET_FUND_INVESTORS_INSTITUTIONAL = 2;
}

// How a money market fund prices its shares.
enum MoneyMarketFundNav {
  MONEY_MARKET_FUND_NAV_UNSPECIFIED = 0;
  // A stable share price of 1.00: the book takes its position as one lot at
  // stable value (W9.1).
  MONEY_MARKET_FUND_NAV_STABLE = 1;
  // A share price that floats with its holdings: lots like any fund.
  MONEY_MARKET_FUND_NAV_FLOATING = 2;
}

// When a money market fund charges a fee on redemptions.
enum LiquidityFeeRegime {
  LIQUIDITY_FEE_REGIME_UNSPECIFIED = 0;
  // Charged when daily net redemptions pass 5% of net assets: an
  // institutional prime or tax-exempt fund.
  LIQUIDITY_FEE_REGIME_MANDATORY = 1;
  // At the board's discretion, where in the fund's interest.
  LIQUIDITY_FEE_REGIME_DISCRETIONARY = 2;
  // No liquidity fee: a government fund that has not chosen one, which
  // neither of the others describes (contract v12).
  LIQUIDITY_FEE_REGIME_NONE = 3;
}

// One typed identifier for an instrument.
//
// `scheme` says what kind of identifier this is: a global scheme ("figi",
// "isin", "cusip", "sedol") or a source-scoped one ("symbol"). A source-scoped
// identifier is only meaningful alongside its source, which is why `source` is
// present and why a bare symbol can never drive a global resolve.
message Identifier {
  string scheme = 1;
  string value = 2;

  // The namespace a source-scoped identifier belongs to, e.g. "snaptrade".
  // Empty for a global scheme.
  string source = 3;

  // When the identifier named the record it is on (contract v19;
  // decisions/034): from, inclusive, and until, exclusive, 0 until it left.
  // An identifier that leaves a record has its window closed at that date,
  // never deleted, so a resolve as of a date before answers the record that
  // held it. Filled by the instrument store on what it answers and by the
  // platform on a pull; a plugin never sets either, and the sidecar sends
  // both empty.
  int64 valid_from_ns = 4;
  int64 valid_until_ns = 5;

  // For a listing identifier -- an exchange-level or composite FIGI on a
  // security's record -- the ISO 4217 currency that listing trades in
  // (W3.1, contract v25), as the platform's master holds it per listing;
  // empty on every other identifier, and where the master holds none. The
  // record's own currency stays the security's.
  string trading_currency = 6;
}

// The canonical instrument record.
//
// Three time axes, and conflating any two of them produces a resolution bug
// that only appears when an identifier is reused:
//
//   reference time  the as-of a resolution is FOR. A query parameter, never a
//                   field here.
//   effective time  valid_from_ns -- when this mapping became true in the world.
//   record time     record_time_ns -- when the authority knew it.
//
// Identifiers get reused: a ticker freed by a delisting is later reassigned to
// a different instrument. A consumer resolving a historical date must key on
// effective time, not on when it happened to learn the mapping.
message InstrumentRecord {
  // The record's key for life. On the platform's master, "INS-...", minted
  // by it (W1). In a deployment, the deployment's own (decisions/030): "LCL-"
  // for a record its instrument store minted (W3.7), which says who minted it
  // and nothing about whether it is resolved; or the "INS-" ID of a record
  // applied from the platform before contract v10, which it keeps. A global
  // ID the platform answers later joins `identifiers` (scheme
  // `open_meridian`), never replacing this. Never reused (decisions/034): a
  // retired, decommissioned or replaced record keeps its ID, and no other
  // record is ever given it, so a position or an order storing it names one
  // instrument for as long as it survives.
  string instrument_id = 1;

  // The full identifier set. An amend replaces this authoritatively.
  repeated Identifier identifiers = 2;

  AssetClass asset_class = 11;

  // ISO 4217.
  string currency = 4;

  // ISO 10383 market identifier code. Empty where there is no listing venue.
  // Deprecated from contract v18 for `listing_venue_id`, the venue master's
  // ID, of which the MIC is one identifier; read until the platform's and
  // the deployments' records carry venue IDs.
  string exchange_mic = 5;

  string description = 6;

  InstrumentLifecycleState lifecycle_state = 7;

  // Monotonic, assigned by the store, starting at 1. An apply carrying a
  // version at or below the one held is a no-op, which is what makes replica
  // application idempotent and overlapping pulls harmless.
  int64 version = 8;

  // Effective time. When this version's mapping became true.
  int64 valid_from_ns = 9;

  // Record time. Stamped by the store, never accepted from a caller: knowledge
  // cannot be back-dated.
  int64 record_time_ns = 10;

  // In a deployment (contract v10): where each value in force came from --
  // the asset class, the currency, the description and each identifier --
  // with the person who set or accepted it, or the plugin that reported it
  // (W3, requirement 1). Empty on the platform's master, whose changelog
  // says it (W1.7).
  repeated InstrumentValueSource sources = 12;

  // In a deployment (contract v10): values offered by a plugin's source
  // (W3.1) or the platform (W3.3), in force only when a person accepts one
  // (W3.10). A later offer never overwrites a value in force.
  repeated OfferedValue offers = 13;

  // Its type within its asset class (contract v11), in force once a person
  // set or accepted it, as the asset class is. Unspecified where none is.
  InstrumentType instrument_type = 14;

  // A money market fund's attributes (contract v11); set only on a record
  // whose type is money market fund.
  MoneyMarketFund money_market_fund = 15;

  // The venue it is listed on, the venue master's ID (contract v18): a
  // segment's venue where the listing is on one. Empty where it is listed
  // on no venue, or its venue is not yet known.
  string listing_venue_id = 16;

  // A binary event contract's attributes (contract v19); set only on a
  // record whose type is binary event contract.
  BinaryEventContract binary_event_contract = 17;

  // Contract v24 (W3.7; decisions/037, point 2 as amended 2026-10-14; the
  // one-ID model): the deployment's own local record -- the platform
  // unreachable, the request waiting for its staff, or, at the current
  // stage, no open identifier to ask by. It names its template, may be
  // incomplete, is a local line in the book, never priced, and an order on
  // it the escape hatch (W9.1, W11). False on a record named by the
  // platform's INS- ID, or keyed before v10.
  bool provisional = 18;

  // Contract v24 (W3.7, W3.24): the platform's template the record is held
  // to, a class's base template where its type has none; empty on a record
  // kept before v24 and not yet migrated, and on one whose source stated no
  // class ("class needed").
  string template_id = 19;
  // A published version, immutable; empty where template_id is.
  string template_version = 20;

  // Contract v24 (W3.7): each required field of its template the record
  // does not hold, by its path in the template (TemplateField.path); empty
  // on a complete record and on every INS- record the platform minted.
  // Never a gate on asking the platform.
  repeated string missing_fields = 21;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 3;
  // Contract v28: the series' full terms, so the record read alone is complete
  // (ruling 575); an adjustment is a new version of them, the INS- ID kept.
  // Unset unless the record's type is listed_option or future_option.
  ListedOption listed_option = 22;
  // Contract v28: one contract month's full terms. Unset unless the record's
  // type is future.
  FutureContract future = 23;
}

// Which value of a deployment's instrument record (W3, contract v10).
enum InstrumentField {
  INSTRUMENT_FIELD_UNSPECIFIED = 0;
  INSTRUMENT_FIELD_ASSET_CLASS = 1;
  INSTRUMENT_FIELD_CURRENCY = 2;
  INSTRUMENT_FIELD_DESCRIPTION = 3;
  // One of its identifiers, named beside the field.
  INSTRUMENT_FIELD_IDENTIFIER = 4;
  // Contract v11.
  INSTRUMENT_FIELD_INSTRUMENT_TYPE = 5;
  INSTRUMENT_FIELD_MONEY_MARKET_FUND = 6;
  // Contract v19.
  INSTRUMENT_FIELD_BINARY_EVENT_CONTRACT = 7;
}

// One value for a deployment's record, set or offered, with where it came
// from (W3.10, W3.1, W3.3).
message InstrumentValue {
  oneof value {
    // One of the closed list; never unspecified.
    AssetClass asset_class = 1;
    // An ISO 4217 code, three capital letters; never a pseudo-currency such
    // as BASE.
    string currency = 2;
    string description = 3;
    Identifier identifier = 4;
    // Contract v11: one under the record's asset class; never unspecified.
    InstrumentType instrument_type = 6;
    // Contract v11: on a money market fund only, each attribute stated.
    MoneyMarketFund money_market_fund = 7;
    // Contract v19: on a binary event contract only, its payout stated.
    BinaryEventContract binary_event_contract = 8;
  }

  // Where the value came from, in words: a statement, a prospectus, "ISO
  // 4217", "the platform, record INS-... version 3". Required on a value a
  // person sets.
  string source = 5;
}

// Where a value in force on a deployment's record came from (W3,
// requirements 1 and 3).
message InstrumentValueSource {
  InstrumentField field = 1;

  // For INSTRUMENT_FIELD_IDENTIFIER: which identifier.
  Identifier identifier = 2;

  // In words, as the value was set with.
  string source = 3;

  // The person who set or accepted it: the deployment-local subject core
  // stamped from the command's envelope (W4.9), never typed. Empty for an
  // identifier a plugin reported, the platform's global ID, and a value
  // applied from the platform before contract v10.
  string person = 4;

  // The plugin instance whose resolve joined the identifier (W3.1). Empty
  // otherwise.
  string instance_id = 5;

  // When the store recorded it.
  int64 recorded_at_ns = 6;

  // Why a value held was changed, where given.
  string note = 7;

  // The delegation the person acted through, when they set or accepted the
  // value through a client -- an agent on the deployment's MCP surface --
  // rather than at the dashboard in a browser (W3.10, W6.20, contract v12):
  // stamped from the command's envelope (W4.9), never typed. Empty beside a
  // person at the dashboard, and wherever person is.
  string acting_through_delegation = 8;

  // The client's registered name, beside acting_through_delegation, as the
  // envelope carried it; empty whenever it is.
  string client_name = 9;

  // The prepared change it was made from, where a person made it from one
  // (W6.27, W4.9; contract v20): empty otherwise, and before v20.
  string prepared_call_id = 10;
}

// A value offered for a deployment's record (W3.1, W3.3), shown beside its
// field and in force only when a person accepts it (W3.10).
message OfferedValue {
  InstrumentValue value = 1;

  // The plugin instance whose source stated it. Empty for the platform's
  // answer and for an offer the store derives itself (ISO 4217 for an
  // `iso4217` identifier).
  string instance_id = 2;

  int64 offered_at_ns = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// The venue master, contract v18
// ─────────────────────────────────────────────────────────────────────────────
//
// plans/the-lake-prices-the-book, "Refreshed 2026-10-09", ruling 2: the
// platform keeps a venue master beside the security master, each venue under
// its own ID, the ISO 10383 MIC one optional identifier among them and vendor
// codes allowed. Deployments pull venues; a deployment or a plugin never mints
// one. A new venue is a new record, never a schema change.

// What kind of venue it is. A closed list, grown by revision.
enum VenueKind {
  VENUE_KIND_UNSPECIFIED = 0;

  // A regulated exchange.
  VENUE_KIND_EXCHANGE = 1;

  // An alternative trading system, or a multilateral trading facility.
  VENUE_KIND_ALTERNATIVE_TRADING_SYSTEM = 2;

  // An exchange of crypto assets.
  VENUE_KIND_CRYPTO_EXCHANGE = 3;

  // A network of dealers quoting on request, over the counter or by
  // indication: RFQ, OTC and, for now, IOI networks.
  VENUE_KIND_DEALER_NETWORK = 4;

  // A facility trades are reported to, not traded on: a trade reporting
  // facility, an alternative display facility, an approved publication
  // arrangement.
  VENUE_KIND_REPORTING_FACILITY = 5;
}

// The venue master's record of one venue (W1.16). The platform mints its ID;
// a deployment keeps what it pulled (W3.5) and answers it (W3.14).
message VenueRecord {
  // The venue's ID for life, "VEN-...", minted by the platform.
  string venue_id = 1;

  string name = 2;

  // ISO 3166-1 alpha-2: where the venue operates.
  string country_code = 3;

  VenueKind kind = 4;

  // Its identifiers: an ISO 10383 MIC under the scheme `iso10383`, operating
  // or segment, where it has one; a vendor's code as a `symbol` with its
  // source. In force from `valid_from_ns`. An amend replaces them.
  repeated Identifier identifiers = 5;

  // A segment's operating venue, the venue master's ID; empty for a venue
  // that is its own operating venue.
  string operating_venue_id = 6;

  // An IANA time zone: the venue's local time, which its sessions and a
  // business date at it are in.
  string time_zone = 7;

  // Monotonic, assigned by the platform, starting at 1.
  int64 version = 8;

  // When this version became true.
  int64 valid_from_ns = 9;

  // When the platform recorded it. Stamped by the platform, never accepted
  // from a caller.
  int64 record_time_ns = 10;

  // Active, or decommissioned: an expired MIC is a decommissioned venue,
  // which still resolves for a date it was in force. The security master's
  // lifecycle; a venue is never in its define state.
  InstrumentLifecycleState lifecycle_state = 11;
}

// W1.16: a curator, a person or the curator agent, records a venue it has
// vetted. Answered by the venue's record.
message DefineVenueRequest {
  string name = 1;
  // ISO 3166-1 alpha-2.
  string country_code = 2;
  // Required: a kind the enum defines.
  VenueKind kind = 3;
  repeated Identifier identifiers = 4;
  string operating_venue_id = 5;
  // Required: an IANA time zone.
  string time_zone = 6;
  // Zero means now.
  int64 valid_from_ns = 7;
  // Where the writer found what it wrote, and its change note, as an
  // instrument's define has them: required from an agent.
  string source = 8;
  string note = 9;
}

// W1.17: an authoritative replace of a venue's values, as an instrument's
// amend is: an identifier absent here is removed as of `valid_from_ns`.
message AmendVenueRequest {
  string venue_id = 1;
  string name = 2;
  string country_code = 3;
  VenueKind kind = 4;
  repeated Identifier identifiers = 5;
  string operating_venue_id = 6;
  string time_zone = 7;
  int64 valid_from_ns = 8;
  string source = 9;
  string note = 10;

  // Active, or decommissioned as of `valid_from_ns`, when its MIC expired
  // or it closed. Unspecified leaves it as it was.
  InstrumentLifecycleState lifecycle_state = 11;
}

// W1.18: the venues the master holds, a page at a time.
message ListVenuesRequest {
  // Unspecified lists every kind.
  VenueKind kind = 1;
  int32 page_size = 2;
  string cursor = 3;
}

message ListVenuesReply {
  repeated VenueRecord venues = 1;
  // Empty when the listing is exhausted.
  string next_cursor = 2;
}

// W1.19: any identifier value, of any scheme, or a name; resolved as of a
// date. Answered as a listing.
message SearchVenuesRequest {
  string query = 1;
  // Zero means now.
  int64 as_of_ns = 2;
  int32 page_size = 3;
  string cursor = 4;
}

// W3.14: which venue a set of identifiers names on a date, in the venues the
// deployment holds.
message ResolveVenueRequest {
  // At least one, unless venue_id is set: a MIC under `iso10383`, or a
  // vendor's code as a `symbol` with its source.
  repeated Identifier identifiers = 1;

  // Reference time. Zero means now.
  int64 as_of_ns = 2;

  // A venue held by its ID (W3.14, contract v25; D9): answered with its
  // record, so the dashboard shows a calendar's venue by its MIC and name.
  // Set instead of identifiers; a request carrying both is refused naming
  // venue_id. Empty: resolved by identifiers.
  string venue_id = 3;
}

message ResolveVenueReply {
  bool found = 1;
  VenueRecord venue = 2;
  // Set only when found is false.
  MissReason miss_reason = 3;
}

// W3.15: a venue a plugin's source named resolved to none the deployment
// holds. A fact, not a request: the plugin keeps the venue as reported and
// continues; the deployment asks the platform, and the plugin resolves again
// once the venue is held.
message MissingVenueDetectedEvent {
  // The namespace the miss occurred in, e.g. a plugin's registry name.
  string source = 1;

  // Everything the publisher held of the venue.
  repeated Identifier identifiers = 2;

  // Reference time of the missed resolve.
  int64 as_of_ns = 3;

  // Stamped by the sidecar.
  string publisher_instance_id = 4;

  MissReason reason = 5;
  int64 observed_at_ns = 6;
}

// ─────────────────────────────────────────────────────────────────────────────
// W1 — administration
// ─────────────────────────────────────────────────────────────────────────────

message DefineInstrumentRequest {
  repeated Identifier identifiers = 1;
  // Required: a class the enum defines. A define without one, or with one it
  // does not define, is refused.
  AssetClass asset_class = 9;
  string currency = 3;
  // Deprecated from contract v18 for `listing_venue_id`.
  string exchange_mic = 4;
  string description = 5;

  // When the mapping becomes effective. Zero means now.
  int64 valid_from_ns = 6;

  // Where the writer found what it wrote, and its change note: an agent
  // documents its research here (what it looked for, where, what it found,
  // why). Required from an agent, optional from a person. W1; spec
  // agents-keep-the-security-master, requirements 27 and 28.
  string source = 7;
  string note = 8;

  // The venue it is listed on, the venue master's ID (contract v18). A venue
  // the master does not hold is refused, naming it.
  string listing_venue_id = 10;

  // Its type within its asset class (contract v19): the binary event
  // contract, under event_contract, is the one type the master's records
  // take; unspecified for none. A type under another class is refused.
  InstrumentType instrument_type = 11;

  // A binary event contract's attributes (contract v19): required with that
  // type, its payout stated; refused with any other.
  BinaryEventContract binary_event_contract = 12;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 2;
}

// Authoritative replace of the identifier set and attributes. Not a delta: an
// identifier absent here is removed, and its validity window closes as of
// valid_from_ns. A delta cannot express removal without a second verb, and the
// second verb is where drift starts.
message AmendInstrumentRequest {
  string instrument_id = 1;
  repeated Identifier identifiers = 2;
  // A class the enum defines. Unspecified is accepted only while the
  // instrument is a stub that has none.
  AssetClass asset_class = 10;
  string currency = 4;
  // Deprecated from contract v18 for `listing_venue_id`.
  string exchange_mic = 5;
  string description = 6;
  int64 valid_from_ns = 7;

  // Where the writer found what it wrote, and its change note: an agent
  // documents its research here (what it looked for, where, what it found,
  // why). Required from an agent, optional from a person. W1; spec
  // agents-keep-the-security-master, requirements 27 and 28.
  string source = 8;
  string note = 9;

  // The venue it is listed on, the venue master's ID (contract v18). A venue
  // the master does not hold is refused, naming it.
  string listing_venue_id = 11;

  // Its type and a binary event contract's attributes, replaced as the rest
  // is (contract v19), as on a define.
  InstrumentType instrument_type = 12;
  BinaryEventContract binary_event_contract = 13;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 3;
}

// The verb is the transition, so the request carries only the subject.
message DecommissionInstrumentRequest {
  string instrument_id = 1;
  string source = 2;
  string note = 3;
}

message ReactivateInstrumentRequest {
  string instrument_id = 1;
  string source = 2;
  string note = 3;
}

message ListInstrumentsRequest {
  // Zero-value filters mean unfiltered.
  InstrumentLifecycleState lifecycle_state = 1;
  AssetClass asset_class = 5;
  int32 page_size = 3;
  string cursor = 4;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 2;
}

message ListInstrumentsReply {
  repeated InstrumentRecord instruments = 1;
  // Empty when the listing is exhausted.
  string next_cursor = 2;
}

// W1.6. Any identifier value, of any scheme, or a name; resolved as of a date.
message SearchInstrumentsRequest {
  string query = 1;
  // Zero means now.
  int64 as_of_ns = 2;
  int32 page_size = 3;
  string cursor = 4;
}

// Who made a change: a person, or an agent acting for one on a delegation.
message ChangeActor {
  string person_id = 1;
  // Empty when a person acted in their own name.
  string agent_client_id = 2;
  string delegation_id = 3;
}

// W1.7. One entry per change, append-only, record time stamped by the store.
message ChangelogEntry {
  string entry_id = 1;
  string instrument_id = 2;
  int64 version = 3;
  // The step that made it: define, amend, activate, decommission,
  // reactivate, map, mint; or close_miss, a miss closed as found (W1.13),
  // which changes no instrument: at the version that holds what the miss
  // asked for, its identifiers before and after the same, naming the miss
  // (miss_id) and, in the note, why.
  string operation = 4;
  repeated Identifier identifiers_before = 5;
  repeated Identifier identifiers_after = 6;
  ChangeActor actor = 7;
  string source = 8;
  string note = 9;
  // Set when the change was an accepted proposal.
  string proposal_id = 10;
  // The person who accepted it, when it was.
  string accepted_by_person_id = 11;
  int64 record_time_ns = 12;
  // The miss a close_miss entry closed, as MissEntry names it; empty for
  // every other operation.
  string miss_id = 13;
  // When the change became true, beside when the store recorded it
  // (record_time_ns): when it took effect, or, for an entry backfilled
  // after the event, the event's own time. Filled by the platform on every
  // entry; never 0.
  int64 valid_from_ns = 14;
}

message InstrumentChangelogRequest {
  string instrument_id = 1;
  int32 page_size = 2;
  string cursor = 3;
}

message InstrumentChangelogReply {
  // Newest first.
  repeated ChangelogEntry entries = 1;
  string next_cursor = 2;
}

// W1.8. DEFINE to ACTIVE: completing a defined instrument, a stub included.
message ActivateInstrumentRequest {
  string instrument_id = 1;
  string source = 2;
  string note = 3;
}

enum ProposalOperation {
  PROPOSAL_OPERATION_UNSPECIFIED = 0;
  // Changing or ending an identifier an active instrument already has.
  PROPOSAL_OPERATION_AMEND = 1;
  PROPOSAL_OPERATION_DECOMMISSION = 2;
  PROPOSAL_OPERATION_REACTIVATE = 3;
  PROPOSAL_OPERATION_MAP_STUB = 4;
  // A calendar's or date rule's definition proposed for a person to decide
  // (contract v22; approved 2026-10-12); an instrument proposal never uses
  // it.
  PROPOSAL_OPERATION_DEFINE = 5;
}

enum ProposalState {
  PROPOSAL_STATE_UNSPECIFIED = 0;
  PROPOSAL_STATE_PENDING = 1;
  PROPOSAL_STATE_ACCEPTED = 2;
  PROPOSAL_STATE_REJECTED = 3;
  // The instrument moved past the version the proposal was made against.
  PROPOSAL_STATE_SUPERSEDED = 4;
}

// W1.9. What an agent asks for when it may not make the change itself. It
// never blocks the agent's run; staff decide later (W1.10).
message ProposeChangeRequest {
  string instrument_id = 1;
  int64 against_version = 2;
  ProposalOperation operation = 3;
  // The full amend, for PROPOSAL_OPERATION_AMEND.
  AmendInstrumentRequest amend = 4;
  // The existing instrument a stub is the same as, for MAP_STUB.
  string map_onto_instrument_id = 5;
  string source = 6;
  // Required: the agent's research, for the person who reviews it.
  string note = 7;
}

message ProposalRecord {
  string proposal_id = 1;
  string instrument_id = 2;
  int64 against_version = 3;
  ProposalOperation operation = 4;
  AmendInstrumentRequest amend = 5;
  string map_onto_instrument_id = 6;
  string source = 7;
  string note = 8;
  ChangeActor proposed_by = 9;
  int64 proposed_at_ns = 10;
  ProposalState state = 11;
  string decided_by_person_id = 12;
  int64 decided_at_ns = 13;
  string decision_note = 14;
}

// W1.10.
message ListProposalsRequest {
  // Zero means pending.
  ProposalState state = 1;
  int32 page_size = 2;
  string cursor = 3;
}

message ListProposalsReply {
  repeated ProposalRecord proposals = 1;
  string next_cursor = 2;
}

message DecideProposalRequest {
  string proposal_id = 1;
  bool accept = 2;
  string note = 3;
}

// W1.11. A stub minted from a miss is the same as an instrument the master
// already holds: its identifiers move onto that one, and the stub is retired.
message MapStubRequest {
  string stub_instrument_id = 1;
  string onto_instrument_id = 2;
  string source = 3;
  string note = 4;
}

// W1.13. What deployments asked for and the master did not hold, gathered by
// identifier set (W3.3 and W3.4 record each miss).
message MissEntry {
  string miss_id = 1;
  repeated Identifier identifiers = 2;
  AssetClass asset_class = 9;
  int64 count = 4;
  int32 deployment_count = 5;
  int64 first_seen_ns = 6;
  int64 last_seen_ns = 7;
  // The stub it minted or found, if it was escalated.
  string stub_instrument_id = 8;
  // W1.14, for a miss an agent assigning asset classes classed: which
  // allowed source stated the class, the note saying how, and who set it
  // (the agent, the admin it acts for and the delegation). Empty for a miss
  // whose class a deployment reported, or that has none.
  string class_source = 10;
  string class_note = 11;
  ChangeActor class_set_by = 12;

  // Contract v24 (W1.13, W1.25; ruled 2026-10-14, the platform build's
  // Q4): a request in the staff's queue, its source not confirming it, as
  // the platform answered EscalateInstrumentReply.pending_review; false on
  // a plain miss.
  bool pending_review = 13;
  // Why it waits, the platform's own string -- not_confirmed,
  // wants_template, class_needed, no_match_identifier, met_a_stub -- as
  // ChangelogEntry.operation's are; empty on a plain miss.
  string review_reason = 14;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 3;
}

message ListMissesRequest {
  AssetClass asset_class = 4;
  int32 page_size = 2;
  string cursor = 3;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 1;
}

message ListMissesReply {
  // Most wanted first.
  repeated MissEntry misses = 1;
  string next_cursor = 2;
}

// W1.14. The records with no asset class, for a delegation that assigns
// asset classes (W1.12) and refused for any other. What deployments reported
// in them is a lead, never a source.
message ListUnclassifiedRequest {
  int32 page_size = 1;
}

message ListUnclassifiedReply {
  // Instruments with no class, stubs minted from deployments' misses among
  // them, oldest first.
  repeated InstrumentRecord instruments = 1;
  // Misses no stub was minted for, with no class, most wanted first.
  repeated MissEntry misses = 2;
}

// W1.14. Set the class of one record that has none: an instrument, or a miss
// no stub was minted for; exactly one of the two is named, and `{id}` in the
// route is that one's ID. Any class the enum defines, whatever the
// delegation's classes; made directly, and nothing else about the record
// changes. Refused for a record that has a class and for a delegation that
// does not assign asset classes. The source and note are required, as on
// every agent write: which allowed source stated the class, and how.
message AssignClassRequest {
  string instrument_id = 1;
  string miss_id = 2;
  AssetClass asset_class = 3;
  string source = 4;
  string note = 5;
}

// The record with its class: the instrument at its next version, or the
// miss.
message AssignClassReply {
  InstrumentRecord instrument = 1;
  MissEntry miss = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// W3 — resolution
// ─────────────────────────────────────────────────────────────────────────────

// Why a resolution did not produce exactly one instrument; on a conflict
// (contract v19), whether a resolve met it.
enum MissReason {
  MISS_REASON_UNSPECIFIED = 0;

  // No instrument matched.
  MISS_REASON_NOT_FOUND = 1;

  // More than one matched. Reported as a miss rather than resolved by picking,
  // because picking would be wrong about half the time and would be silent.
  MISS_REASON_AMBIGUOUS = 2;
}

// Reverse resolution: identifiers to an instrument, as of a date. Answered
// from every date the instrument store holds, without the platform (contract
// v19): an identifier that left a record answers the record that held it on
// the date asked. Asked by `reporting` (contract v19), it is read-only:
// nothing is minted, joined, offered or listed, and nothing matched is a
// miss, not found.
message ResolveIdentifierRequest {
  // At least one. Matched strongest-first: a global scheme before a
  // source-scoped symbol.
  repeated Identifier identifiers = 1;

  // Reference time. The date the mapping is being asked about.
  int64 as_of_ns = 2;

  // Narrows a symbol match. Empty means unconstrained.
  string exchange_mic = 3;
  string currency = 4;

  // What the plugin's source states of the security, where it states it,
  // and nothing it would have to guess (principle 14). Kept on the record as
  // offers with the instance as their source, in force only when a person
  // accepts them (W3.1, contract v10). Unspecified, or empty, is not stated.
  AssetClass stated_asset_class = 5;
  // An ISO 4217 code: the source's, or, with its entry in provenance, one
  // derived by a named rule or supplied by a person (contract v23).
  string stated_currency = 6;
  string stated_description = 7;
  // Its type within the stated class, where the source says it (contract
  // v11): a custodian's sweep fund is a money market fund.
  InstrumentType stated_instrument_type = 8;

  // Where the security's currency came from, where the plugin closed it
  // rather than read it from the security's own record (contract v23,
  // W3.1): one entry, `stated_currency` by its path, supplied by a named
  // person on the plugin's page (the linked account's currency its admin
  // set), derived by a named rule, or reported from another of the source's
  // records. None where the source stated it. Kept with the offer; a
  // currency supplied or derived never narrows a symbol match.
  repeated Provenance provenance = 9;
}

message ResolveIdentifierReply {
  bool found = 1;
  string instrument_id = 2;
  // Set only when found is false.
  MissReason miss_reason = 3;

  // True when nothing matched and this resolve minted instrument_id, the
  // deployment's record for the set (W3.7, contract v10); found is true
  // alongside it. A later resolve of the same identifiers matches the
  // record, and is not minted. Until v10, true meant a placeholder.
  bool minted = 4;

  // Contract v24 (W3.1, W3.7; decisions/037, point 2 as amended): the
  // record answered is the deployment's provisional LCL- record -- the
  // platform not reached within the bounded ask, its staff to review the
  // request, or no open identifier to ask by -- naming its template, asked
  // again on reconnect or once it has an open identifier.
  bool provisional = 5;
}

// Forward resolution: an instrument identifier to its record.
message ResolveInstrumentRequest {
  string instrument_id = 1;

  // Selects the version whose values were in force on the date, never which
  // record: an instrument ID is never reused (decisions/034). 0 for now.
  int64 as_of_ns = 2;
}

message ResolveInstrumentReply {
  bool found = 1;
  InstrumentRecord instrument = 2;
}

// A resolution missed. A fact, not a request.
//
// The publisher reports what it held and continues. It does not ask for a mint,
// does not wait for one, and has no authority to perform one. Keeping the
// authority to create identity on the far side of an event boundary is what
// stops a misbehaving feed from filling the master with junk.
message MissingInstrumentDetectedEvent {
  // The namespace the miss occurred in, e.g. "snaptrade".
  string source = 1;

  // Unspecified when the publisher does not know it.
  AssetClass asset_class = 9;

  // Everything the publisher held at the miss. Enough for a reader to attempt a
  // pull against a global scheme, or to mint a stub carrying them.
  repeated Identifier identifiers = 3;

  // Reference time of the missed resolve. The reaction must target the mapping
  // effective then, not the mapping effective now.
  int64 as_of_ns = 4;

  string publisher_instance_id = 5;
  MissReason reason = 6;
  int64 observed_at_ns = 7;

  // The source's kind as reported, set only when it did not convert to an
  // asset class and `asset_class` is unspecified (contract v11;
  // spec/vendor-differences-have-a-place-in-the-contract, requirement 4).
  // For a person setting the class; never read.
  AsReported asset_class_as_reported = 10;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 2;

  // Once the deployment's placeholder its instrument store announced on this
  // topic (W3.7 until contract v10); a deployment's records are its own and
  // nothing is announced (decisions/030).
  reserved 8;
  reserved "placeholder_instrument_id";
}

// Reply to a pull of one instrument from the central authority.
message PullInstrumentReply {
  bool found = 1;
  InstrumentRecord instrument = 2;

  // The venues the platform's answer names (contract v18): the instrument's
  // listing venue and that venue's operating venue, each the venue master's
  // record, which the instrument store keeps (W3.5). A deployment holds every
  // venue a record it keeps names, and mints none.
  repeated VenueRecord venues = 4;

  // On the instrument-pulled event: the deployment's record a person asked
  // about (W3.3), on which the instrument store keeps this record's values
  // as offers and adds its ID as an identifier, never replacing the
  // deployment's key (W3.5, contract v10). Until v10, the placeholder it
  // replaced.
  string for_instrument_id = 3;
}

// Reply to a pull resolving identifiers against the central authority.
message PullIdentifierReply {
  bool found = 1;
  InstrumentRecord instrument = 2;
  MissReason miss_reason = 3;

  // The venues the answer names (contract v18): an instrument's listing
  // venue and its operating venue; or, asked by a venue's identifiers (a MIC
  // under `iso10383`, a vendor's code as a `symbol` with its source, W3.15),
  // the venue they name, with no instrument. One venue at a time, on demand:
  // never the whole list, which ISO 10383's terms forbid reproducing for
  // third parties.
  repeated VenueRecord venues = 4;
}

// The deployment's matching and minting request (W3.4), the conductor's,
// from contract v24 (decisions/037; the one-ID spec's requirement 7): it
// says what to look for, and the platform verifies the security against its
// own source and mints from that source's values (option (c), the one-ID
// model). Only identifiers in schemes on the licence list (W3.25). It never
// carries the deployment's LCL- ID or its name. Until v24, the platform's
// surface for pairing a deployment's ID, which a deployment did not call
// from contract v10.
message EscalateInstrumentRequest {
  string source = 1;
  AssetClass asset_class = 7;
  repeated Identifier identifiers = 3;
  int64 as_of_ns = 4;

  // Contract v24: the template the record names, and its version.
  string template_id = 8;
  string template_version = 9;
  // What the record's sources state, each with its source: offers to the
  // platform's curation, never the master's record.
  repeated TemplateFieldValue fields = 10;
  // Only for retrying an answer that was lost: the platform answers a
  // repeat with the answer it stored for the key; a new ask is a new key.
  string request_key = 11;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 2;
  // The deployment's ID and its LCL- record's ID, W3.4's v9 shape: retired
  // at v24, since the request never names the deployment or its LCL- ID.
  reserved 5, 6;
  reserved "requesting_deployment_id", "placeholder_instrument_id";
}

message EscalateInstrumentReply {
  InstrumentRecord instrument = 1;

  // False when the authority paired the deployment's ID with an instrument it
  // already held rather than minting one. The caller applies the record
  // either way; this is for the operator.
  bool minted = 2;

  // True when the identifiers point at more than one instrument, or agree on
  // one identifier and contradict another of the same scheme. Nothing is
  // paired or minted, instrument is empty, and staff decide. From contract
  // v24 never answered true: such a request is a near-match, minted and
  // flagged (near_match); kept, never renumbered, deprecated at the next
  // floor.
  bool conflict = 4;

  // Contract v24 (W1.25, W3.4): minted, and flagged for the platform's
  // staff to review as a near-match.
  bool near_match = 5;

  // Contract v24 (W1.25, W3.4): the request is in the staff's queue, its
  // source not confirming it; nothing matched or minted, and the deployment
  // keeps a provisional record and asks again.
  bool pending_review = 6;

  // The deployment's ID echoed from the request: retired at v24 with it.
  reserved 3;
  reserved "replaces_instrument_id";
}

// A record of the deployment's reached a new version (W3.5): minted, joined
// by an identifier, completed, merged, or answered by the platform.
message InstrumentAppliedEvent {
  InstrumentRecord instrument = 1;

  // False when nothing changed: a redelivery, or a version already held.
  bool applied = 2;

  int64 applied_at_ns = 3;
}

// A deployment's record was replaced by another (W3.8): from contract v10, a
// record a person merged into the one that stays (W3.13); before it, a
// placeholder by its INS- ID. Stores keyed by instrument move what they hold
// under it onto the one that stays (W3.9, W9.9); records of what was
// reported keep it.
//
// From contract v24 also a provisional record resolved and a platform merge,
// each with its cause, heard by every role (W3.8) and caught up by
// ListReplacements (W3.22).
message InstrumentReplacedEvent {
  // The record replaced.
  string replaced_instrument_id = 1;

  // What replaces it.
  InstrumentRecord instrument = 2;

  int64 replaced_at_ns = 3;

  // Contract v24 (W3.8): why it was replaced; unspecified only on a
  // replacement recorded before v24 and not yet backfilled.
  ReplacementCause cause = 4;

  // Contract v24 (W3.22): monotonic per deployment; ListReplacements reads
  // after it. Zero only on a replacement recorded before v24.
  int64 sequence = 5;
}

// Why a record was replaced (W3.8, contract v24).
enum ReplacementCause {
  // A replacement before v24 whose facts are missing, recorded as a gap.
  REPLACEMENT_CAUSE_UNSPECIFIED = 0;
  // A person merged the record into the one that stays (W3.13).
  REPLACEMENT_CAUSE_MERGED = 1;
  // A provisional record resolved to the platform's INS- record.
  REPLACEMENT_CAUSE_RESOLVED = 2;
  // The platform merged two INS- records, followed from the replacement
  // feed (W3.27).
  REPLACEMENT_CAUSE_PLATFORM_MERGED = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// W3, contract v10 — a deployment completes its own records, at the dashboard
// ─────────────────────────────────────────────────────────────────────────────

// One record's values, set against the version it was read at (W3.10).
message InstrumentCompletion {
  string instrument_id = 1;

  // The record's version when it was read; a record changed since is refused
  // alone (REFUSAL_REASON_RECORD_CHANGED).
  int64 against_version = 2;

  // Each value with its source. A value already in force, sent again, is no
  // change.
  repeated InstrumentValue values = 3;

  // Why: required where a value changes one already held
  // (REFUSAL_REASON_REASON_REQUIRED); optional for filling a blank.
  string note = 4;
}

// W3.10. For a deployment admin, the person stamped on the envelope.
message CompleteInstrumentsRequest {
  // Up to 500, each its own result.
  repeated InstrumentCompletion completions = 1;
}

message InstrumentCompletionResult {
  string instrument_id = 1;

  // The record at its new version, when completed.
  InstrumentRecord instrument = 2;

  // When refused: the reason and each field, by its path in the completion
  // (`values[0].currency`, `values[1].source`, `note`, `against_version`).
  Refusal refusal = 3;

  // The refusal in words, for the person.
  string detail = 4;
}

message CompleteInstrumentsReply {
  // One per completion, in the request's order.
  repeated InstrumentCompletionResult results = 1;
}

// W3.11. For a deployment admin.
message ListInstrumentsToCompleteRequest {
  // Records complete as well; otherwise only those lacking something.
  bool include_complete = 1;

  // One record by its ID, as the page opening it reads it; empty for the
  // list.
  string instrument_id = 4;

  int32 page_size = 2;
  string cursor = 3;

  // Contract v20 (W3.11): the records whose identifier values, symbols or
  // description contain it, case-insensitive, complete ones included, as
  // the instrument picker searches; empty for the list. At most 100
  // characters.
  string search = 5;

  // Contract v24 (W3.11): only provisional records.
  bool provisional = 6;
}

// A record and what it lacks (W3.11).
message InstrumentToComplete {
  InstrumentRecord instrument = 1;

  // An asset class or a currency, which the book requires (W9.1); a
  // description; a symbol, where the record has a source that names one.
  repeated InstrumentField lacks = 2;

  // An asset class and a currency in force.
  bool complete_for_book = 3;

  // Complete for the book, a description, and a symbol where one exists.
  bool complete = 4;

  // Contract v24 (W3.7, W3.11): why the record is provisional; unspecified
  // on a record that is not.
  ProvisionalReason provisional_reason = 5;

  // Contract v24 (W3.26; the names approved 2026-10-15): the migration's
  // section for this record's line, and the INS- record the platform
  // answered it with -- set for a line matched, minted, a near-match,
  // already held or held back, empty otherwise. Two records answered by
  // one INS- ID are a duplicate line: making both replaces each by it.
  MigrationSection migration_section = 6;
  string answered_instrument_id = 7;

  // Contract v25 (W3.26): the values the platform's answer contradicts that
  // a person set or accepted on this record -- an uncertain line of its
  // own, made only by the deployment admin. Empty where none is.
  repeated InstrumentField contradicted_fields = 8;
}

// Why a deployment's record is provisional (W3.7, W3.11; contract v24).
enum ProvisionalReason {
  PROVISIONAL_REASON_UNSPECIFIED = 0;
  // The platform not reached within the bounded ask.
  PROVISIONAL_REASON_UNREACHABLE = 1;
  // Incomplete against its template, its missing_fields listed: the
  // incomplete or offline state, a thin record with no open identifier
  // whose terms are incomplete among them. Also a migration's line the
  // platform answered -- matched, minted, a near-match or already held --
  // until the deployment admin makes it (W3.26).
  PROVISIONAL_REASON_INCOMPLETE = 2;
  // Its request in the platform's staff's queue.
  PROVISIONAL_REASON_AWAITING_STAFF = 3;
  // No asset class stated, so no template named.
  PROVISIONAL_REASON_CLASS_NEEDED = 4;
  // Held back by the deployment admin at the migration (W3.26).
  PROVISIONAL_REASON_HELD_BACK = 5;
}

// W3.26 (contract v24; approved 2026-10-15): the section a migration's
// line is in, as MigrationCounts counts them.
enum MigrationSection {
  MIGRATION_SECTION_UNSPECIFIED = 0;
  // Already carrying the platform's ID.
  MIGRATION_SECTION_ALREADY_HELD = 1;
  MIGRATION_SECTION_MATCHED = 2;
  MIGRATION_SECTION_MINTED = 3;
  MIGRATION_SECTION_NEAR_MATCH = 4;
  MIGRATION_SECTION_AWAITING_STAFF = 5;
  // No open identifier: nothing the licence list lets it send.
  MIGRATION_SECTION_KEPT_LOCAL = 6;
  MIGRATION_SECTION_UNREACHABLE = 7;
  MIGRATION_SECTION_HELD_BACK = 8;
}

// Identifiers that met more than one record, or an identifier another record
// carries (W3.1, W3.2, W3.10): not a match, and listed until a merge
// settles it (W3.13).
message InstrumentConflict {
  // The identifiers that disagree.
  repeated Identifier identifiers = 1;

  // The records they meet, each as it is now.
  repeated string instrument_ids = 2;

  // The plugin instance that reported it; empty where a person's completion
  // met it.
  string reported_by = 3;

  int64 first_seen_ns = 4;
  int64 last_seen_ns = 5;

  // Where it came from (contract v19): ambiguous where a resolve met several
  // records, flagged for a person's curation and never escalated (W3.4);
  // unspecified where a join or a completion met another record's
  // identifier. Nothing of it is told to the platform.
  MissReason reason = 6;
}

// How many identifiers of a licensed scheme the deployment's records carry
// (W3.11): CUSIP Global Services counts toward its 500-identifier threshold.
message LicensedIdentifierCount {
  // `cusip`, `isin` or `sedol`.
  string scheme = 1;
  int64 count = 2;
}

message ListInstrumentsToCompleteReply {
  // Those the book cannot use first, then the rest lacking something.
  repeated InstrumentToComplete instruments = 1;
  string next_cursor = 2;

  // Every conflict not yet settled.
  repeated InstrumentConflict conflicts = 3;

  // Across the deployment, whatever the page.
  int64 incomplete_for_book = 4;
  int64 incomplete = 5;
  repeated LicensedIdentifierCount licensed_identifiers = 6;

  // Contract v24 (W3.11): the upgrade's migration run (W3.26), and per
  // scheme being backfilled its backfill (W3.25). Counts, never a holding.
  MigrationCounts migration_counts = 7;
  repeated BackfillCount backfill_counts = 8;
}

// What the upgrade's migration run found (W3.11, W3.26; contract v24).
message MigrationCounts {
  // Already carrying the platform's ID.
  int64 already_held = 1;
  int64 matched = 2;
  int64 minted = 3;
  int64 near_match = 4;
  int64 awaiting_staff = 5;
  // No open identifier.
  int64 kept_local = 6;
  int64 unreachable = 7;
  int64 held_back = 8;
  // Still to send.
  int64 remaining = 9;
}

// One scheme's backfill (W3.11, W3.25; contract v24).
message BackfillCount {
  string scheme = 1;
  int64 matched = 2;
  int64 awaiting_person = 3;
  int64 remaining = 4;
}

// W3.12.
message ReadInstrumentHistoryRequest {
  string instrument_id = 1;
  int32 page_size = 2;
  string cursor = 3;
}

// One change a version made.
message InstrumentChange {
  InstrumentField field = 1;

  // For INSTRUMENT_FIELD_IDENTIFIER: which identifier.
  Identifier identifier = 2;

  // As text: an asset class by its name (`cash`), a currency, a
  // description, an identifier's value. Empty where there was none, or
  // where an identifier joined.
  string before = 3;
  string after = 4;

  string source = 5;
}

// One version of a deployment's record, append-only (W3.12).
message InstrumentVersion {
  string instrument_id = 1;
  int64 version = 2;

  // What made it: mint, join, complete, platform, merge, merged-into,
  // migrate. An open list a reader takes as data.
  string operation = 3;

  repeated InstrumentChange changes = 4;

  // The person, stamped by core; empty for a plugin's report or a
  // migration.
  string person = 5;

  // The plugin instance whose resolve made it, where one did.
  string instance_id = 6;

  string note = 7;
  int64 record_time_ns = 8;

  // For a merge, the other record: the one merged in, or the one this was
  // merged into.
  string merged_instrument_id = 9;

  // The delegation the person acted through, when they made the version
  // through a client rather than at the dashboard in a browser (W3.10,
  // W3.13, W6.20, contract v12), stamped from the command's envelope (W4.9);
  // and the client's registered name beside it. Both empty for a person at
  // the dashboard, a plugin's report and a migration.
  string acting_through_delegation = 10;
  string client_name = 11;

  // The prepared change it was made from, where a person made it from one
  // (W6.27, W4.9; contract v20): empty otherwise, and before v20.
  string prepared_call_id = 12;
}

message ReadInstrumentHistoryReply {
  // Newest first.
  repeated InstrumentVersion versions = 1;
  string next_cursor = 2;
}

// W3.13. For a deployment admin, the person stamped on the envelope.
message MergeInstrumentsRequest {
  // The record that stays, and the version it was read at.
  string kept_instrument_id = 1;
  int64 kept_version = 2;

  // The record merged into it, replaced by it (W3.8).
  string merged_instrument_id = 3;
  int64 merged_version = 4;

  // Fields where both carry a value, they differ, and the merged record's
  // stands; any other differing field keeps the kept record's.
  repeated InstrumentField take_from_merged = 5;

  // Required: why they are one security.
  string note = 6;
}

message MergeInstrumentsReply {
  // The record that stays, at its new version.
  InstrumentRecord instrument = 1;
}

// W3.3. For a person at the dashboard; the conductor alone reaches the
// platform (decisions/011).
message AskPlatformForInstrumentRequest {
  // The deployment's record asked about; empty when the instrument store
  // asks for a currency it does not hold yet, by its ISO 4217 code alone
  // (W3.1, W3.3, contract v20).
  string instrument_id = 1;

  // The record's identifiers. The conductor sends the platform only the
  // open ones -- the global ID, a FIGI, an ISO 4217 code -- never a licensed
  // scheme's value nor a source-scoped symbol.
  repeated Identifier identifiers = 2;

  // The date the record's identifiers are asked about. Zero means now.
  int64 as_of_ns = 3;

  // Contract v24 (W3.4; the order-path plan's v24 question 30): the
  // instrument store's matching and minting request, which the conductor
  // sends the platform as EscalateInstrument, within its bounded ask.
  EscalateInstrumentRequest match_or_mint = 4;
}

message AskPlatformForInstrumentReply {
  // False when the platform could not be reached; `detail` says why, and
  // completing the record works without it.
  bool reachable = 1;

  // The platform holds a record by one of the identifiers asked with.
  bool found = 2;

  // Its record: its ID joins the deployment's record as an identifier, and
  // the rest is offered (W3.5).
  InstrumentRecord instrument = 3;

  string detail = 4;

  // Contract v24 (W3.4): the platform's reply to match_or_mint.
  EscalateInstrumentReply match_or_mint_answer = 5;
}

// ─────────────────────────────────────────────────────────────────────────────
// The settlement calendars and date rules, contract v22
// ─────────────────────────────────────────────────────────────────────────────
//
// spec/settlement-calendars-are-core-reference-data (accepted 2026-10-11, its
// names approved; the names it left to the text approved 2026-10-12), under
// sdk-contract/an-order-reaches-a-venue-contract. A calendar is a platform
// record under its own `CAL-` ID, never changed and never reused
// (decisions/036); the rules are platform records named by kind, subject and
// version, with no ID of their own (the spec's Q11). The platform's curation
// keeps them (W1.20 to W1.23); the conductor pulls what a deployment needs
// (W3.16); the instrument store keeps every version and answers the calendar
// read and the date read, in the kernel's own code (W3.17 to W3.21). Nothing
// in a deployment mints or edits one, and nothing here claims anything
// regulatory: a computed date is what a named rule gives on named calendars.
//
// DateBasis, DateRuleKind and the two references a basis holds are
// plugin-facing, since a plugin's Provenance carries a basis: declared in
// meridian-schema's sidecar.proto and imported from there.

// A calendar's kind.
enum CalendarKind {
  CALENDAR_KIND_UNSPECIFIED = 0;
  // A currency's settlement days; its subject the currency's cash
  // instrument.
  CALENDAR_KIND_CURRENCY = 1;
  // A venue's trading days; its subject the venues that follow it.
  CALENDAR_KIND_TRADING = 2;
  // A securities settlement system's days; its subject the system by name
  // and country.
  CALENDAR_KIND_SECURITIES_SETTLEMENT = 3;
  // Contract v27 (W1.20; ruling 419): a venue's trading sessions, in its
  // trading_sessions; its subject the venues that follow it.
  CALENDAR_KIND_TRADING_SESSIONS = 4;
}

// A venue's trading sessions (contract v27; W1.20, W3.19; ruling 419): the
// minimal kind staleness needs, sessions a day in local time.
message TradingSessions {
  // IANA.
  string time_zone = 1;
  repeated TradingSession sessions = 2;
  // Each day whose sessions differ: an early close, a late open, a day
  // closed; an early close announced later is a new version.
  repeated TradingSessionDay early_closes = 3;
}

// One session, on the weekdays it runs.
message TradingSession {
  repeated Weekday weekdays = 1;
  // Minutes after local midnight: the start, and the end, exclusive, at most
  // 1440.
  uint32 start_minute = 2;
  uint32 end_minute = 3;
  // An extended session: pre-market or after-hours.
  bool extended = 4;
}

// One dated day's sessions, in place of the weekday's.
message TradingSessionDay {
  // ISO 8601, a plain date.
  string date = 1;
  // None for a day closed.
  repeated TradingSession sessions = 2;
  // A source_id among the version's sources.
  string source = 3;
}

// What a listed day is.
enum CalendarDayKind {
  CALENDAR_DAY_KIND_UNSPECIFIED = 0;
  // A weekday that is not a business day: a holiday, an ad hoc closure.
  CALENDAR_DAY_KIND_CLOSED = 1;
  // A weekend day that is nevertheless a business day.
  CALENDAR_DAY_KIND_OPEN = 2;
}

enum Weekday {
  WEEKDAY_UNSPECIFIED = 0;
  WEEKDAY_MONDAY = 1;
  WEEKDAY_TUESDAY = 2;
  WEEKDAY_WEDNESDAY = 3;
  WEEKDAY_THURSDAY = 4;
  WEEKDAY_FRIDAY = 5;
  WEEKDAY_SATURDAY = 6;
  WEEKDAY_SUNDAY = 7;
}

// A calendar's weekend, dated, so a change of weekend takes effect on its
// day.
message CalendarWeekend {
  // A set: each weekday once.
  repeated Weekday weekdays = 1;
  // ISO 8601.
  string valid_from_date = 2;
}

// One listed day, naming the source it came from: never listed without one.
message CalendarDay {
  // ISO 8601, a plain date.
  string date = 1;
  CalendarDayKind kind = 2;
  // The holiday's name as the source gives it.
  string name = 3;
  // A source_id among the version's sources.
  string source = 4;
}

// A source a calendar or a rule version cites, with the moment the platform
// read it (requirement 3).
message CalendarSource {
  // Unique within the version, which its days name.
  string source_id = 1;
  string name = 2;
  // Where it is read: a public primary source's address.
  string address = 3;
  int64 read_at_ns = 4;
}

// The first and last dates a calendar vouches for (requirement 4): outside
// them a date's status is not known, never a business day by default.
message CalendarCoverage {
  // ISO 8601, inclusive.
  string from_date = 1;
  string to_date = 2;
}

// A securities settlement system, a calendar's subject by name and country.
message SettlementSystem {
  string name = 1;
  // ISO 3166-1 alpha-2.
  string country_code = 2;
}

// A calendar version (W1.20, W1.21): sent whole, as a venue's amend is; a
// ten-year calendar is a few hundred dates.
message CalendarRecord {
  // "CAL-...", minted by the platform; never reused (decisions/036).
  string calendar_id = 1;
  string name = 2;
  CalendarKind kind = 3;

  // Its subject, by its kind: a currency's cash instrument by its `INS-`
  // ID; the venues that follow it by their `VEN-` IDs; or a settlement
  // system.
  string instrument_id = 4;
  repeated string venue_ids = 5;
  SettlementSystem settlement_system = 6;

  // Optional dated identifiers others use: an ISO 4217 code, an FpML
  // business centre under the scheme `fpml_business_center`.
  repeated Identifier identifiers = 7;

  repeated CalendarWeekend weekends = 8;
  // Each closed weekday and each weekend business day.
  repeated CalendarDay days = 9;
  CalendarCoverage coverage = 10;
  repeated CalendarSource sources = 11;

  // Monotonic, assigned by the platform, starting at 1.
  int64 version = 12;
  // When its change came into force: an ad hoc closure's, its
  // announcement.
  int64 valid_time_ns = 13;
  // When the platform recorded it; never back-dated, never accepted from a
  // caller.
  int64 record_time_ns = 14;
  // Its change note; a backfilled version says so and from what.
  string note = 15;
  // Active, or decommissioned: the master's lifecycle, as a venue's.
  InstrumentLifecycleState lifecycle_state = 16;
  // Contract v27: a trading-sessions calendar's sessions; unset on every
  // other kind.
  TradingSessions trading_sessions = 17;
}

// W1.20. Answered by the calendar's record at version 1.
message DefineCalendarRequest {
  string name = 1;
  CalendarKind kind = 2;
  string instrument_id = 3;
  repeated string venue_ids = 4;
  SettlementSystem settlement_system = 5;
  repeated Identifier identifiers = 6;
  repeated CalendarWeekend weekends = 7;
  repeated CalendarDay days = 8;
  CalendarCoverage coverage = 9;
  repeated CalendarSource sources = 10;
  // Zero means now.
  int64 valid_time_ns = 11;
  // Required from an agent, whose draft a person on the staff approves.
  string note = 12;
  // Contract v27: for CALENDAR_KIND_TRADING_SESSIONS, its sessions, required
  // there and refused on any other kind.
  TradingSessions trading_sessions = 13;
}

// W1.21. The next version, whole, or a decommission; refused against a
// version that is not the latest.
message AmendCalendarRequest {
  string calendar_id = 1;
  int64 against_version = 2;
  string name = 3;
  string instrument_id = 4;
  repeated string venue_ids = 5;
  SettlementSystem settlement_system = 6;
  repeated Identifier identifiers = 7;
  repeated CalendarWeekend weekends = 8;
  repeated CalendarDay days = 9;
  CalendarCoverage coverage = 10;
  repeated CalendarSource sources = 11;
  int64 valid_time_ns = 12;
  string note = 13;
  // Decommissioned as of valid_time_ns; unspecified leaves it as it was.
  InstrumentLifecycleState lifecycle_state = 14;
  // Contract v27: a trading-sessions calendar's sessions, whole.
  TradingSessions trading_sessions = 15;
}

// How a date rolls on its calendars.
enum BusinessDayConvention {
  BUSINESS_DAY_CONVENTION_UNSPECIFIED = 0;
  BUSINESS_DAY_CONVENTION_FOLLOWING = 1;
  BUSINESS_DAY_CONVENTION_MODIFIED_FOLLOWING = 2;
  BUSINESS_DAY_CONVENTION_PRECEDING = 3;
  BUSINESS_DAY_CONVENTION_NONE = 4;
}

enum TenorUnit {
  TENOR_UNIT_UNSPECIFIED = 0;
  TENOR_UNIT_DAY = 1;
  TENOR_UNIT_WEEK = 2;
  TENOR_UNIT_MONTH = 3;
  TENOR_UNIT_YEAR = 4;
  // The short dates, counted in single business days from the trade date,
  // the next day and spot.
  TENOR_UNIT_OVERNIGHT = 5;
  TENOR_UNIT_TOM_NEXT = 6;
  TENOR_UNIT_SPOT_NEXT = 7;
}

message Tenor {
  // Of the unit; 1 for the short dates.
  int32 count = 1;
  TenorUnit unit = 2;
}

// A day's cut: after it, an execution's trade date is the next day.
message DayCut {
  // HH:MM, local.
  string local_time = 1;
  // An IANA time zone; required.
  string time_zone = 2;
}

// A spot-date rule's tenor-date rule, carried on the same record.
message TenorDateRule {
  BusinessDayConvention convention = 1;
  bool end_of_month = 2;
}

// A settlement-date rule for a country and an asset class, a venue's
// override where a venue differs (requirement 6): T+2 then T+1 are two dated
// versions of one rule.
message SettlementDateRule {
  // ISO 3166-1 alpha-2.
  string country_code = 1;
  AssetClass asset_class = 2;
  // Empty for the market's rule.
  string venue_id = 3;
  // In business days.
  int32 lag_days = 4;
  // The calendars a day must be good in to count, by their `CAL-` IDs.
  repeated string counting_calendars = 5;
  // ISO 8601: the date this version takes effect.
  string effective_from_date = 6;
}

// A spot-date rule for a currency pair, named by its two cash instruments in
// either order (requirement 6).
message SpotDateRule {
  // Two `INS-` IDs, each a cash instrument.
  repeated string pair = 1;
  int32 lag_days = 2;
  // The calendars an intermediate day must be good in to count.
  repeated string counting_calendars = 3;
  // The calendars the spot date itself must be good in.
  repeated string spot_calendars = 4;
  DayCut cut = 5;
  TenorDateRule tenor_rule = 6;
  string effective_from_date = 7;
  // Contract v23 (W1.22, W3.20): how the counting calendars count the lag;
  // unspecified means joint, v22's way, so every rule held keeps its dates.
  SpotCountingMode counting_mode = 8;
}

// How a spot-date rule counts its lag (W1.22; contract v23).
enum SpotCountingMode {
  // Joint, v22's way.
  SPOT_COUNTING_MODE_UNSPECIFIED = 0;
  // A day counts only if it is a business day on every counting calendar.
  SPOT_COUNTING_MODE_JOINT = 1;
  // Each currency's own spot on its own calendar, the later of the two,
  // then rolled to a day good on both: the convention for a cross.
  SPOT_COUNTING_MODE_EACH_CURRENCY = 2;
}

// One rule version, as the platform keeps and publishes it.
message DateRuleVersion {
  // Its kind, subject and version, as a DateRuleRef names them.
  DateRuleKind kind = 1;
  string subject = 2;
  int64 version = 3;
  oneof parameters {
    SettlementDateRule settlement = 4;
    SpotDateRule spot = 5;
  }
  repeated CalendarSource sources = 6;
  string note = 7;
  // When the platform recorded it; never back-dated.
  int64 record_time_ns = 8;
}

// W1.22. Answered by the rule's kind, subject and version.
message DefineDateRuleRequest {
  oneof rule_parameters {
    SettlementDateRule settlement = 1;
    SpotDateRule spot = 2;
  }
  repeated CalendarSource sources = 3;
  string note = 4;
}

message DefineDateRuleReply {
  DateRuleRef rule = 1;
}

// W1.22. The rule's next version, dated; a date before it is still answered
// by the version before.
message AmendDateRuleRequest {
  // Its kind and subject; the version is the platform's.
  DateRuleRef rule = 1;
  oneof rule_parameters {
    SettlementDateRule settlement = 2;
    SpotDateRule spot = 3;
  }
  repeated CalendarSource sources = 4;
  string note = 5;
}

message AmendDateRuleReply {
  DateRuleRef rule = 1;
}

// W1.23: the platform's calendars and rules, filtered by kind, paged; a
// deployment never lists them, it pulls what it needs.
message ListCalendarRecordsRequest {
  // Unspecified lists every kind.
  CalendarKind kind = 1;
  int32 page_size = 2;
  string cursor = 3;
  // A rule's subject, as DateRuleRef names it; empty for every subject.
  string subject = 4;
}

message ListCalendarRecordsReply {
  repeated CalendarRecord calendars = 1;
  repeated DateRuleVersion rules = 2;
  string next_cursor = 3;
}

// W1.23: one calendar, at its latest version or at a version.
message GetCalendarRecordRequest {
  string calendar_id = 1;
  // Zero means the latest.
  int64 version = 2;
}

// W3.16: the platform's answer to a pull, handed to the instrument store on
// the bus as it came (`platform.reference.event.calendar-pulled`). Only a
// calendar's subject leaves the deployment, never a holding.
message PullCalendarReply {
  repeated CalendarRecord calendars = 1;
  repeated DateRuleVersion rules = 2;
}

// W3.17: a version kept, which the dashboard hears; the book moves no date
// for it.
message CalendarAppliedEvent {
  // A calendar's version; or a rule's, in `rule`.
  string calendar_id = 1;
  int64 version = 2;
  DateRuleRef rule = 3;
  int64 applied_at_ns = 4;
}

// What a read named that the store does not hold (W3.18): one of a
// calendar, a pair or a market.
message CalendarSubject {
  string calendar_id = 1;
  // Two cash instruments' `INS-` IDs.
  repeated string pair = 2;
  // A market: its country, ISO 3166-1 alpha-2, and asset class.
  string country_code = 3;
  AssetClass asset_class = 4;
}

// W3.18: by its subject only; the conductor pulls it, and the read answers
// "calendar not held" or "rule not held" meanwhile.
message MissingCalendarDetectedEvent {
  CalendarSubject subject = 1;
  // Where the miss is a rule's.
  DateRuleKind kind = 2;
  int64 observed_at_ns = 3;
}

// W3.19: a calendar's days over a range, as of a recorded time or its latest
// version. A reference read, answered whatever the asker's scope.
message ReadCalendarRequest {
  string calendar_id = 1;
  // ISO 8601, inclusive; a range ending before it starts is refused naming
  // `to_date`.
  string from_date = 2;
  string to_date = 3;
  // Zero means the latest version held.
  int64 as_of_ns = 4;
}

message ReadCalendarReply {
  // False: the calendar is not held, reported missing (W3.18).
  bool found = 1;
  string calendar_id = 2;
  int64 version = 3;
  // The days listed in the range, each with its source.
  repeated CalendarDay days = 4;
  repeated CalendarWeekend weekends = 5;
  CalendarCoverage coverage = 6;
  repeated CalendarSource sources = 7;
  // Contract v27 (W3.19): a trading-sessions calendar's sessions, with the
  // early closes falling in the range; unset on every other kind.
  TradingSessions trading_sessions = 8;
}

// Why a date was or was not computed (requirement 9).
enum DateOutcome {
  DATE_OUTCOME_UNSPECIFIED = 0;
  DATE_OUTCOME_COMPUTED = 1;
  // Transient: reported missing, the conductor pulls it, the asker retries.
  DATE_OUTCOME_CALENDAR_NOT_HELD = 2;
  // Never a business day by default.
  DATE_OUTCOME_OUTSIDE_COVERAGE = 3;
  DATE_OUTCOME_RULE_NOT_HELD = 4;
}

// W3.20: an instrument's settlement date by its market's rule.
message SettlementDateInputs {
  string instrument_id = 1;
  string trade_date = 2;
}

// W3.20: a pair's spot date, from a trade date or from an execution's moment
// through the pair's cut.
message SpotDateInputs {
  repeated string pair = 1;
  string trade_date = 2;
  // In place of trade_date: the moment, its trade date taken through the
  // cut.
  int64 at_ns = 3;
}

// W3.20: a tenor date from a trade date.
message TenorDateInputs {
  repeated string pair = 1;
  Tenor tenor = 2;
  string trade_date = 3;
}

// W3.20: one way to work out a date, in core. The same inputs and versions
// always give the same date; the wall clock is never read.
message ComputeDateRequest {
  oneof inputs {
    SettlementDateInputs settlement = 1;
    SpotDateInputs spot = 2;
    TenorDateInputs tenor = 3;
    RollInputs roll = 5;
    BusinessDayInputs business_day = 6;
  }
  // The records as of this recorded time; zero means the latest held.
  int64 as_of_ns = 4;
}

message ComputeDateReply {
  // ISO 8601; empty unless computed.
  string date = 1;
  DateOutcome outcome = 2;
  // The rule and each calendar, with their versions, it was computed on.
  DateBasis basis = 3;
  // On a business-day question, computed: whether the date is one on every
  // calendar named.
  bool business_day = 4;
}

// W3.20: a date rolled by a convention on a set of calendars.
message RollInputs {
  string date = 1;
  BusinessDayConvention convention = 2;
  // By their `CAL-` IDs; a day is good only if good in every one.
  repeated string calendars = 3;
}

// W3.20: whether a date is a business day on a set of calendars.
message BusinessDayInputs {
  string date = 1;
  repeated string calendars = 2;
}

// W3.21: the calendars the deployment holds, for a deployment admin; the
// Instruments page's Calendars tab and dashboard__list_calendars.
message ListCalendarsRequest {
  int32 page_size = 1;
  string cursor = 2;
  // Contract v23: unspecified lists every kind.
  CalendarKind kind = 3;
  // Contract v23: a text match on the name and the subject's codes; empty
  // matches every calendar.
  string query = 4;
}

message ListCalendarsReply {
  repeated HeldCalendar calendars = 1;
  string next_cursor = 2;
  repeated HeldDateRule rules = 3;
}

// One calendar the deployment holds, one line.
message HeldCalendar {
  string calendar_id = 1;
  string name = 2;
  CalendarKind kind = 3;
  int64 version = 4;
  // ISO 8601: its coverage's last date.
  string coverage_to_date = 5;
  int64 refreshed_at_ns = 6;
  // Contract v23: its subject, as CalendarRecord carries it -- a
  // currency's cash instrument by its `INS-` ID, the venues that follow it
  // by their `VEN-` IDs, or a settlement system -- shown resolved on the
  // page.
  string instrument_id = 7;
  repeated string venue_ids = 8;
  SettlementSystem settlement_system = 9;
}

// One date rule the deployment holds, one line.
message HeldDateRule {
  DateRuleKind kind = 1;
  string subject = 2;
  int64 version = 3;
  int64 refreshed_at_ns = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// W3.22 to W3.28 — one ID: replacements, templates, the licence list, the
// replacement feed and usage statistics, contract v24
// ─────────────────────────────────────────────────────────────────────────────
//
// sdk-contract/an-execution-is-booked-to-its-accounts-contract, its one-ID
// track (spec/the-platform-master-mints-every-instrument-from-a-template,
// requirements 1 to 26; decisions/037), every name approved 2026-10-13 and
// 2026-10-14.

// W3.22: the replacements the instrument store recorded after a sequence,
// unscoped reference data every plugin role reads.
message ListReplacementsRequest {
  // The last sequence the reader saw; zero reads every replacement.
  int64 after_sequence = 1;
}

message ListReplacementsReply {
  // Each as its instrument-replaced delivery carried it, in sequence.
  repeated InstrumentReplacedEvent replacements = 1;
  // The next read's after_sequence: the sequence asked after, when none
  // since.
  int64 sequence = 2;
}

// W3.23: a `reference` plugin's offer of a record's template fields.
message OfferTemplateFieldsRequest {
  // A record the deployment holds, followed through its replacement.
  string instrument_id = 1;
  string template_id = 2;
  // A version the catalogue holds; one it does not is refused naming it.
  string template_version = 3;
  repeated TemplateFieldValue fields = 4;
}

// A value at a template field's path, with its provenance (W3.4, W3.23).
message TemplateFieldValue {
  // The field's path in the template; one the template lacks is refused
  // naming it.
  string path = 1;
  // As the template's field type writes it.
  string value = 2;
  // The source it was reconciled from; unset, the plugin's own source.
  Provenance provenance = 3;
}

message OfferTemplateFieldsReply {
  // At its new version, the values kept as offers.
  InstrumentRecord instrument = 1;
}

// W3.24: the templates the store holds, unscoped reference data.
message ListTemplatesRequest {
  // Unspecified lists every class.
  AssetClass asset_class = 1;
}

message ListTemplatesReply {
  // Each at its latest version.
  repeated SecurityTemplate templates = 1;
}

// W3.24: one template, at a version.
message ReadTemplateRequest {
  string template_id = 1;
  // Empty reads the latest.
  string template_version = 2;
}

message ReadTemplateReply {
  SecurityTemplate template = 1;
}

// A security template (W1.24, W3.24; the intent's "security template"): the
// platform authors, versions and publishes it, and a deployment's store
// holds every version and never changes one.
message SecurityTemplate {
  // `TPL-`, the platform's, never a deployment's.
  string template_id = 1;
  // Published and immutable; a change is a new version.
  string template_version = 2;
  // The platform's words for it.
  string name = 3;
  AssetClass asset_class = 4;
  // Unspecified for a class's base template.
  InstrumentType instrument_type = 5;
  // True for the one template per asset class carrying identifiers, a
  // description and a currency; the platform mints no INS- record under it.
  bool base = 6;
  // The v24 slot for its calculation package, defined and kept empty: from
  // contract v26 the package is calculation_package.
  string calculation = 7;
  // Each by its path, its type and whether it is required.
  repeated TemplateField fields = 8;
  // The identifier schemes it matches on, each by its scheme's spelling,
  // share_class_figi first.
  repeated string match_rule = 9;
  // Contract v26 (W1.24; the intent's rulings 9 and 11; the v26 plan's
  // question 225): its calculation package, declarative data; unset on a
  // class's base template and on a version published before v26.
  CalculationPackage calculation_package = 10;
  // Contract v28: true: readable and runnable, so past answers recompute, and
  // minted under no more; its instruments move to successor_version, each by a
  // recorded change. False: in use.
  bool withdrawn = 11;
  // Contract v28: a published version of the same template. Empty unless
  // withdrawn.
  string successor_version = 12;
}

// A template version's calculation package (W1.24): the pricing model it
// binds, the market objects it reads, and test cases with exact answers,
// which the analytics engine's built-in model and every implementation
// routed for it must equal exactly. Data, never code.
message CalculationPackage {
  // `cash`, `quoted_price` or `binary_event` in v26, and the version.
  string model_id = 1;
  int32 model_version = 2;
  // The kinds of its pricing inputs, as the lake names them: `close`,
  // `nav`, `outcome`.
  repeated string pricing_inputs = 3;
  // Where its corporate-action factors come from, for returns (the first
  // release's Q7); empty where none applies.
  string corporate_action_factors = 4;
  // Its version, which every valuation names.
  string calculation_version = 5;
  repeated CalculationTestCase test_cases = 6;
  // Contract v28: a table keyed by exercise style and, where it matters, the
  // underlying's asset class; a combination with no row is refused at publish.
  // None: the package's own model_id and model_version bind every instrument.
  repeated ModelBinding model_bindings = 7;
}

// One test case of a calculation package: inputs and the exact answer, each
// as canonical JSON (RFC 8785).
message CalculationTestCase {
  string name = 1;
  string inputs = 2;
  string expected = 3;
}

// One field of a template (W3.24).
message TemplateField {
  // As an offer (TemplateFieldValue.path) and a missing field name it.
  string path = 1;
  // One of the contract's types, as a dictionary entry's type is written.
  string type = 2;
  // A record without it is incomplete, its missing fields listed (W3.7).
  bool required = 3;
  // Contract v28: mint, complete or optional, the intent's three levels.
  // Unspecified on a version published before v28.
  FieldRequirement requirement = 4;
  // Contract v28: true: a repeating group, as FIX's are, its values offered by
  // path with an index (deliverable[0].quantity). False: one value.
  bool repeated = 5;
}

// W3.24: the platform's answer to a pull of its template catalogue, the
// versions after the highest held, handed to the instrument store on the
// bus as it came (`platform.reference.event.templates-pulled`).
message PullTemplatesReply {
  repeated SecurityTemplate templates = 1;
}

// W3.25: the identifier schemes the platform may receive, by family, and
// the pace a migration's or a backfill's batches are sent at; pulled by the
// conductor and handed to the store
// (`platform.reference.event.licence-list-pulled`). open_meridian_local and
// the LCL- ID are never on it.
message LicenceList {
  int64 version = 1;
  repeated string schemes = 2;
  // The pace a migration's or a backfill's batches are sent at.
  LicencePace pace = 3;
  // The administrators whose codes the administrator_symbol family admits
  // (W3.25; ruling 545): a wire `symbol` is sent only when its `source`
  // names one of these and `schemes` names the family. Each is a source as
  // the platform's referential records spell it (nyfed, frb, ecb,
  // ustreasury); one is added by a list update, with no release. A
  // vendor's symbol is never sent.
  repeated string administrators = 4;
}

// A pace, as OpenFIGI states its own limits (W3.25).
message LicencePace {
  // Requests in one batch.
  int32 batch_size = 1;
  int32 batches_per_minute = 2;
}

// W3.26: the deployment admin makes the migration's lines -- the exact lines
// as one change, each uncertain line its own -- from the Instruments page's
// provisional records, a prepared change made (W6.26, W6.27). Each record in
// instrument_ids is replaced by the INS- record its line answered (W3.8,
// REPLACEMENT_CAUSE_RESOLVED); each in held_back_ids keeps its LCL- ID,
// provisional with PROVISIONAL_REASON_HELD_BACK, and nothing is minted for
// it. Made together or refused whole, naming each line by its path. Answered
// with the run's counts after (MigrationCounts).
message ApplyInstrumentMigrationRequest {
  // The LCL- records whose lines are made. At most 500.
  repeated string instrument_ids = 1;

  // The LCL- records whose lines are held back. At most 500.
  repeated string held_back_ids = 2;

  // Why, at most 2,000 characters, on each record's version; required
  // through a delegation (approved 2026-10-15).
  string note = 3;
}

// W3.27: the platform's replacements and decommissions after a sequence,
// the same for every deployment, handed to the store as it came
// (`platform.reference.event.replacements-pulled`).
message PullReplacementsReply {
  repeated ReplacementFeedEntry entries = 1;
}

// One merge or decommission on the platform's master (W1.27, W3.27).
message ReplacementFeedEntry {
  int64 sequence = 1;
  // The INS- record merged or decommissioned.
  string instrument_id = 2;
  // The record it was merged into; empty on a decommission.
  string replaced_by = 3;
  bool decommissioned = 4;
  // Contract v28: true: the record is expired, neither merged nor
  // decommissioned; it moves no position. False: a merge or a decommission.
  bool expired = 5;
}

// W3.28: the deployment's usage statistics, counts only -- never a value, a
// holding, a quantity or an account -- sent weekly and once after the
// migration, unless the deployment admin turned the report off.
message IdentifierUsageReport {
  // ISO 8601 dates, the period the counts cover.
  string period_start = 1;
  string period_end = 2;
  // The scheme names the deployment declares it is licensed for.
  repeated string licensed_schemes = 3;
  repeated SchemeUsageCount scheme_counts = 4;
}

// One identifier scheme's counts over the period (W3.28).
message SchemeUsageCount {
  string scheme = 1;
  // Instruments carrying it.
  int64 instruments_carrying = 2;
  // Instruments that resolve only through it.
  int64 instruments_only_by = 3;
  // Misses that arrived with it as their only identifier.
  int64 misses_only_by = 4;
}

message ReportIdentifierUsageReply {
  bool received = 1;
}

// W3.28: the conductor asks the instrument store for the counts its report
// carries, weekly and once after the migration
// (`platform.reference.query.list-identifier-usage`). Counts only: never a
// value, a holding, a quantity or an account.
message ListIdentifierUsageRequest {
  // ISO 8601 dates, the period the counts cover.
  string period_start = 1;
  string period_end = 2;
}

message ListIdentifierUsageReply {
  // One per identifier scheme: the instruments carrying it and those
  // resolving only through it, as the period ends, and the misses that
  // arrived with it as their only identifier within the period.
  repeated SchemeUsageCount scheme_counts = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// Event groups, contract v26
// ─────────────────────────────────────────────────────────────────────────────
//
// spec/the-contract-gaps-v26-and-v27-close, A1 to A9 (accepted 2026-10-14,
// their names approved): a reference record grouping event contracts, kept
// in the instrument master, minted on the platform beside the instruments it
// groups (W1.30), reported by a venue's data plugin (W3.29), read and heard
// by every role (W3.30). Each change of a flag or a member is a new dated
// version; an ID is never reused (decisions/034).

// A flag a venue may not state (A2): unknown is never false.
enum EventGroupFlag {
  // Read as not stated.
  EVENT_GROUP_FLAG_UNSPECIFIED = 0;
  EVENT_GROUP_FLAG_TRUE = 1;
  EVENT_GROUP_FLAG_FALSE = 2;
  EVENT_GROUP_FLAG_NOT_STATED = 3;
}

// An event's group of contracts, at a version.
message EventGroup {
  // `EVG-` and a ULID, the platform's; `LCL-` and a ULID for a deployment's
  // own while it waits (A8's gap measure).
  string event_group_id = 1;
  // The venue that states it, the venue master's ID.
  string venue_id = 2;
  // The venue's reference for its event: Kalshi's event ticker,
  // Polymarket's event slug.
  string venue_event_ref = 3;
  // The venue's words for it.
  string title = 4;
  repeated string member_instrument_ids = 5;
  EventGroupFlag mutually_exclusive = 6;
  EventGroupFlag exhaustive = 7;
  // The venue's series, for a recurring event (A5); no series record in
  // v26.
  string series_id = 8;
  // Monotonic from 1; a new version for each change of a flag or a member.
  int64 version = 9;
  // When this version became true, as the venue states it.
  int64 valid_from_ns = 10;
  // Stamped by the store.
  int64 record_time_ns = 11;
  // True for the deployment's own `LCL-` group, not yet matched or minted.
  bool provisional = 12;
  // Its place in the store's sequence of event groups, which a read after
  // a sequence catches up by.
  int64 sequence = 13;
}

// W3.29: a venue's data plugin reports the grouping its venue states.
message ReportEventGroupRequest {
  string venue_id = 1;
  string venue_event_ref = 2;
  string title = 3;
  // Each resolved through W3.1 before it is sent.
  repeated string member_instrument_ids = 4;
  EventGroupFlag mutually_exclusive = 5;
  EventGroupFlag exhaustive = 6;
  string series_id = 7;
  int64 valid_from_ns = 8;
  RawRecordRef raw_record = 9;
  // Stamped by the sidecar: the reporting instance.
  string publisher_instance_id = 10;
  // Contract v27 (W3.29; ruling 464): each range member's floor, cap and
  // unit as the venue states them, taken as values offered for the
  // member's record; a person's value wins.
  repeated EventGroupMemberBound member_bounds = 11;
}

// One range member's bounds as its venue states them (contract v27; ruling
// 464): the binary event contract template's floor, cap and bound_unit.
message EventGroupMemberBound {
  // One of the report's members.
  string instrument_id = 1;
  EventContractBound floor = 2;
  EventContractBound cap = 3;
  string bound_unit = 4;
}

message ReportEventGroupReply {
  // The group as the store holds it, at its version.
  EventGroup event_group = 1;
  // The platform's staff have it to review; the deployment keeps its own
  // `LCL-` group meanwhile.
  bool pending_review = 2;
}

// W3.29: the instrument store asks the conductor, which alone dials the
// platform.
message AskPlatformForEventGroupRequest {
  EscalateEventGroupRequest match_or_mint = 1;
}

message AskPlatformForEventGroupReply {
  // False when the platform could not be reached; detail says why.
  bool reachable = 1;
  string detail = 2;
  EscalateEventGroupReply answer = 3;
}

// W3.29, W1.30: the conductor's matching and minting request for a group,
// members by their `INS-` IDs; it names no deployment and no `LCL-` ID.
message EscalateEventGroupRequest {
  string venue_id = 1;
  string venue_event_ref = 2;
  string title = 3;
  repeated string member_instrument_ids = 4;
  EventGroupFlag mutually_exclusive = 5;
  EventGroupFlag exhaustive = 6;
  string series_id = 7;
  int64 valid_from_ns = 8;
  // Only for retrying an answer that was lost.
  string request_key = 9;
}

message EscalateEventGroupReply {
  // The `EVG-` group matched or minted, at its version; unset while queued.
  EventGroup event_group = 1;
  // False when the master already held it.
  bool minted = 2;
  // In the staff's queue: a conflicting report, or one the venue's
  // reference data does not confirm.
  bool pending_review = 3;
}

// W3.30: the groups holding given instruments or given groups, as of a
// time, or those changed after a sequence.
message ListEventGroupsRequest {
  repeated string instrument_ids = 1;
  repeated string event_group_ids = 2;
  // 0 for now.
  int64 as_of_ns = 3;
  // The last sequence the reader saw; 0 reads by the filters above.
  int64 after_sequence = 4;
  int32 page_size = 5;
  string cursor = 6;
}

message ListEventGroupsReply {
  repeated EventGroup event_groups = 1;
  // The sequence read to.
  int64 sequence = 2;
  string next_cursor = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// Contract v28, track A: listed options and futures
// (sdk-contract/listed-options-and-futures-contract)
// ─────────────────────────────────────────────────────────────────────────────

// Contract v28 (InstrumentRecord.listed_option): carries a listed option's
// terms.
message ListedOption {
  // The underlying's INS- record: an equity, a fund, an index, or for a
  // future_option a future record (FIX UnderlyingSecurityID, 309). Never
  // empty.
  string underlying_instrument_id = 1;
  // The right the holder has. Unspecified is refused.
  PutOrCall put_or_call = 2;
  // The price per unit of the underlying at which the option is exercised, as
  // listed; an adjusted strike is a new version. Never unset.
  Money strike_price = 3;
  // A plain date, YYYY-MM-DD, the expiration the series is listed for. Never
  // empty.
  string expiration_date = 4;
  // A plain date, YYYY-MM-DD. Empty until the platform's source states it: the
  // record is then incomplete, listing it.
  string last_trade_date = 5;
  // The style the series is listed with; the calculation package binds its
  // model by it (ruling 576). Unspecified is refused.
  ExerciseStyle exercise_style = 6;
  // Physical or cash, as listed. Unspecified is refused.
  SettlementMethod settlement_method = 7;
  // When the settlement value is fixed, which is where time to expiry counts
  // to (minutes over 525,600). Unspecified: the record is incomplete on a
  // cash-settled option, listing it.
  SettlementTime settlement_time = 8;
  // What one contract's premium is multiplied by: 100 on a standard equity
  // option; an adjustment may change it apart from the deliverable. Never
  // unset.
  Decimal contract_multiplier = 9;
  // Each instrument and its quantity, cash among them as its cash instrument's
  // quantity: 100 shares on a standard option, 150 after a 3-for-2 split,
  // shares and cash after a merger. None until the platform's source states
  // it: the record is then incomplete, listing it; a cash-settled option's
  // states its cash.
  repeated DeliverableComponent deliverable = 10;
  // The OCC root (SPX, SPXW, AAPL, AAPL1 once adjusted); on a future option,
  // the exchange's option product code. Never empty.
  string option_root = 11;
  // YYYYMM. Empty on a listed_option, and on a future option whose exchange
  // lists no serial month.
  string contract_month = 12;
}

// Contract v28 (InstrumentRecord.future): carries a listed future's terms.
message FutureContract {
  // An index, an equity, a rate or a commodity's referential INS- record.
  // Never empty.
  string underlying_instrument_id = 1;
  // The exchange's code for the product every month of it shares (ES, CL).
  // Never empty.
  string product_code = 2;
  // YYYYMM. Never empty.
  string contract_month = 3;
  // A plain date, YYYY-MM-DD. Empty until the source states it: the record is
  // then incomplete.
  string last_trade_date = 4;
  // A plain date, YYYY-MM-DD: after it the platform marks the record expired
  // (ruling 579). Empty until the source states it: the record is then
  // incomplete.
  string final_settlement_date = 5;
  // Physical or cash, as listed. Unspecified is refused.
  SettlementMethod settlement_method = 6;
  // What a one-point move in the price is worth per contract: 50 USD on ES.
  // Never unset.
  Decimal contract_multiplier = 7;
  // A plain date, YYYY-MM-DD; the oms warns before it (W11.4), since v28 books
  // no delivery. Empty on a cash-settled future; on a physically delivered one
  // the record is incomplete until it is stated.
  string first_notice_date = 8;
}

// Contract v28 (ListedOption.deliverable): states what one contract delivers
// on exercise (ruling 559).
message DeliverableComponent {
  // An INS- record: the underlying, another company's shares after a merger,
  // or a currency's cash instrument for cash. Never empty: a component naming
  // no instrument is refused.
  string instrument_id = 1;
  // 100 shares; 150 after a 3-for-2 split; for cash, the amount in the cash
  // instrument's major unit. Never unset.
  Decimal quantity = 2;
}

// Contract v28 (CalculationPackage.model_bindings): binds the model by term
// (ruling 576).
message ModelBinding {
  // The style an instrument's terms state. Unspecified: any style.
  ExerciseStyle exercise_style = 1;
  // Equity or fund (the tree with discrete dividends), referential (an index).
  // Unspecified: any underlying.
  AssetClass underlying_asset_class = 2;
  // American_binomial, black_scholes, black_76 or quoted_price in v28. Never
  // empty.
  string model_id = 3;
  // 1 or more. Never 0.
  int32 model_version = 4;
}

// Contract v28 (W3.31): RequestSeriesRecords's request.
message RequestSeriesRecordsRequest {
  // Each series by its key and its underlying, with why it is wanted. Never
  // empty.
  repeated SeriesWant series = 1;
  // Kept on the request's record (decisions/031). Empty from a plugin;
  // required through a delegation.
  string note = 2;
}

// Contract v28 (RequestSeriesRecordsRequest.series): names the series wanted
// (W3.31).
message SeriesWant {
  // The occ_osi symbol, or a future's or future option's exchange symbol and
  // its MIC as two identifiers. Never empty.
  repeated Identifier series_key = 1;
  // The INS- record the chain rows name as their subject. Never empty.
  string underlying_instrument_id = 2;
  // Which part of the deployment's series request rule allows it (W6.37).
  // Unspecified is refused.
  SeriesRequestCause cause = 3;
}

// Contract v28 (W3.31): RequestSeriesRecords's answer.
message RequestSeriesRecordsReply {
  // Its record, queued, or refused by the rule. One per series asked, in
  // order.
  repeated SeriesAnswer answers = 1;
}

// Contract v28 (RequestSeriesRecordsReply.answers): answers each series.
message SeriesAnswer {
  // As asked. Never empty.
  repeated Identifier series_key = 1;
  // The INS- record the platform matched or minted. Empty where queued or
  // refused.
  string instrument_id = 2;
  // True: asked again daily, as W3.4's queued requests are. False.
  bool pending_review = 3;
  // True: nothing was sent to the platform. False.
  bool refused_by_rule = 4;
}

enum PutOrCall {
  // Refused.
  PUT_OR_CALL_UNSPECIFIED = 0;
  // A put: the right to sell the deliverable at the strike.
  PUT_OR_CALL_PUT = 1;
  // A call: the right to buy the deliverable at the strike.
  PUT_OR_CALL_CALL = 2;
}

enum ExerciseStyle {
  // Refused.
  EXERCISE_STYLE_UNSPECIFIED = 0;
  // Exercisable on any business day to expiration.
  EXERCISE_STYLE_AMERICAN = 1;
  // Exercisable at expiration only.
  EXERCISE_STYLE_EUROPEAN = 2;
}

enum SettlementMethod {
  // Refused.
  SETTLEMENT_METHOD_UNSPECIFIED = 0;
  // The deliverable changes hands on exercise; for a future option, the
  // future.
  SETTLEMENT_METHOD_PHYSICAL = 1;
  // Cash against the settlement value on exercise.
  SETTLEMENT_METHOD_CASH = 2;
}

enum SettlementTime {
  // Not stated: on a physically settled option, where it does not apply.
  SETTLEMENT_TIME_UNSPECIFIED = 0;
  // Settled on the expiration day's opening prints (SPX's monthly series).
  SETTLEMENT_TIME_AM = 1;
  // Settled on the expiration day's close (SPXW).
  SETTLEMENT_TIME_PM = 2;
}

enum FieldRequirement {
  // A version published before v28: read from required, true as mint and false
  // as optional.
  FIELD_REQUIREMENT_UNSPECIFIED = 0;
  // The platform mints an INS- record only when its source fills it.
  FIELD_REQUIREMENT_MINT = 1;
  // Minted without it, the record listing it missing until it is filled.
  FIELD_REQUIREMENT_COMPLETE = 2;
  // Never missing.
  FIELD_REQUIREMENT_OPTIONAL = 3;
}

enum SeriesRequestCause {
  // Refused.
  SERIES_REQUEST_CAUSE_UNSPECIFIED = 0;
  // An order or a proposal names it, or is about to.
  SERIES_REQUEST_CAUSE_ORDER = 1;
  // A standing want for an underlying's series.
  SERIES_REQUEST_CAUSE_STANDING = 2;
}
