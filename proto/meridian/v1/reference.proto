// Instrument identity, symbology mapping, and the escalation path when a
// resolution misses.
//
// Derived from workflows W1 (security master administration) and W3 (instrument
// resolution and escalation). Every message here traces to a matrix row; see
// matrix/matrix.tsv.
//
// The scope boundary is load-bearing: this is identity, mapping and structure.
// Prices, yields, ratings, volumes and sector data are client-licensed and live
// in the deployment. Identity attributes and data values never mix, and no
// field below invites them to.

syntax = "proto3";

package meridian.v1;

// ─────────────────────────────────────────────────────────────────────────────
// The record
// ─────────────────────────────────────────────────────────────────────────────

// Lifecycle. The transition verbs are the commands; nothing sets this directly.
enum InstrumentLifecycleState {
  INSTRUMENT_LIFECYCLE_STATE_UNSPECIFIED = 0;

  // Identity exists, attributes may be incomplete. A holding can reference it,
  // which is the point: a position may arrive before anyone has decided what
  // the instrument is.
  INSTRUMENT_LIFECYCLE_STATE_DEFINE = 1;

  // Fully defined.
  INSTRUMENT_LIFECYCLE_STATE_ACTIVE = 2;

  // Retired. Existing holdings stay resolvable, because history does not stop
  // being true when an instrument stops trading.
  INSTRUMENT_LIFECYCLE_STATE_DECOMMISSIONED = 3;
}

// The kind of claim holding an instrument gives. A closed list, ruled by the
// product owner (sdk-contract/asset-class-is-an-enum, 2026-09-28 and
// 2026-09-30); a class joins it by a ruling, never because a feed sent one.
// Spelled in text as the value's name without its prefix, lower case:
// `equity`, `debt`, `fund`, `derivative`, `crypto_asset`, `event_contract`,
// `cash`.
//
// What kind of instrument within a class (an ETF is a fund, an option a
// derivative) is its instrument type, which this does not carry: the list of
// types is still open.
enum AssetClass {
  // No class. Held only by a stub minted from a deployment's miss (W3.4),
  // which may not know one; activating an instrument requires a class (W1.8).
  ASSET_CLASS_UNSPECIFIED = 0;

  // A share of ownership.
  ASSET_CLASS_EQUITY = 1;

  // Somebody owes the holder.
  ASSET_CLASS_DEBT = 2;

  // A share of a pool: ETFs and mutual funds among them.
  ASSET_CLASS_FUND = 3;

  // A contract whose value comes from something else: options and futures
  // among them.
  ASSET_CLASS_DERIVATIVE = 4;

  ASSET_CLASS_CRYPTO_ASSET = 5;

  // Pays on whether an event happens.
  ASSET_CLASS_EVENT_CONTRACT = 6;

  // A holding of a currency's cash instrument (spec/the-account-side-fits-every-venue).
  ASSET_CLASS_CASH = 7;
}

// One typed identifier for an instrument.
//
// `scheme` says what kind of identifier this is: a global scheme ("figi",
// "isin", "cusip", "sedol") or a source-scoped one ("symbol"). A source-scoped
// identifier is only meaningful alongside its source, which is why `source` is
// present and why a bare symbol can never drive a global resolve.
message Identifier {
  string scheme = 1;
  string value = 2;

  // The namespace a source-scoped identifier belongs to, e.g. "snaptrade".
  // Empty for a global scheme.
  string source = 3;
}

// The canonical instrument record.
//
// Three time axes, and conflating any two of them produces a resolution bug
// that only appears when an identifier is reused:
//
//   reference time  the as-of a resolution is FOR. A query parameter, never a
//                   field here.
//   effective time  valid_from_ns -- when this mapping became true in the world.
//   record time     record_time_ns -- when the authority knew it.
//
// Identifiers get reused: a ticker freed by a delisting is later reassigned to
// a different instrument. A consumer resolving a historical date must key on
// effective time, not on when it happened to learn the mapping.
message InstrumentRecord {
  // Canonical identifier, "INS-..." and minted only by the central authority.
  //
  // A deployment's stores may also hold its own placeholder, "LCL-...", which
  // its instrument store mints for an identifier set nothing matched (W3.7)
  // and which the INS- ID replaces in everything live when it arrives (W3.8).
  // A placeholder is never minted by the authority and never leaves the
  // deployment except on its own escalation.
  string instrument_id = 1;

  // The full identifier set. An amend replaces this authoritatively.
  repeated Identifier identifiers = 2;

  AssetClass asset_class = 11;

  // ISO 4217.
  string currency = 4;

  // ISO 10383 market identifier code. Empty where there is no listing venue.
  string exchange_mic = 5;

  string description = 6;

  InstrumentLifecycleState lifecycle_state = 7;

  // Monotonic, assigned by the store, starting at 1. An apply carrying a
  // version at or below the one held is a no-op, which is what makes replica
  // application idempotent and overlapping pulls harmless.
  int64 version = 8;

  // Effective time. When this version's mapping became true.
  int64 valid_from_ns = 9;

  // Record time. Stamped by the store, never accepted from a caller: knowledge
  // cannot be back-dated.
  int64 record_time_ns = 10;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// W1 — administration
// ─────────────────────────────────────────────────────────────────────────────

message DefineInstrumentRequest {
  repeated Identifier identifiers = 1;
  // Required: a class the enum defines. A define without one, or with one it
  // does not define, is refused.
  AssetClass asset_class = 9;
  string currency = 3;
  string exchange_mic = 4;
  string description = 5;

  // When the mapping becomes effective. Zero means now.
  int64 valid_from_ns = 6;

  // Where the writer found what it wrote, and its change note: an agent
  // documents its research here (what it looked for, where, what it found,
  // why). Required from an agent, optional from a person. W1; spec
  // agents-keep-the-security-master, requirements 27 and 28.
  string source = 7;
  string note = 8;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 2;
}

// Authoritative replace of the identifier set and attributes. Not a delta: an
// identifier absent here is removed, and its validity window closes as of
// valid_from_ns. A delta cannot express removal without a second verb, and the
// second verb is where drift starts.
message AmendInstrumentRequest {
  string instrument_id = 1;
  repeated Identifier identifiers = 2;
  // A class the enum defines. Unspecified is accepted only while the
  // instrument is a stub that has none.
  AssetClass asset_class = 10;
  string currency = 4;
  string exchange_mic = 5;
  string description = 6;
  int64 valid_from_ns = 7;

  // Where the writer found what it wrote, and its change note: an agent
  // documents its research here (what it looked for, where, what it found,
  // why). Required from an agent, optional from a person. W1; spec
  // agents-keep-the-security-master, requirements 27 and 28.
  string source = 8;
  string note = 9;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 3;
}

// The verb is the transition, so the request carries only the subject.
message DecommissionInstrumentRequest {
  string instrument_id = 1;
  string source = 2;
  string note = 3;
}

message ReactivateInstrumentRequest {
  string instrument_id = 1;
  string source = 2;
  string note = 3;
}

message ListInstrumentsRequest {
  // Zero-value filters mean unfiltered.
  InstrumentLifecycleState lifecycle_state = 1;
  AssetClass asset_class = 5;
  int32 page_size = 3;
  string cursor = 4;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 2;
}

message ListInstrumentsReply {
  repeated InstrumentRecord instruments = 1;
  // Empty when the listing is exhausted.
  string next_cursor = 2;
}

// W1.6. Any identifier value, of any scheme, or a name; resolved as of a date.
message SearchInstrumentsRequest {
  string query = 1;
  // Zero means now.
  int64 as_of_ns = 2;
  int32 page_size = 3;
  string cursor = 4;
}

// Who made a change: a person, or an agent acting for one on a delegation.
message ChangeActor {
  string person_id = 1;
  // Empty when a person acted in their own name.
  string agent_client_id = 2;
  string delegation_id = 3;
}

// W1.7. One entry per change, append-only, record time stamped by the store.
message ChangelogEntry {
  string entry_id = 1;
  string instrument_id = 2;
  int64 version = 3;
  // The step that made it: define, amend, activate, decommission,
  // reactivate, map, mint.
  string operation = 4;
  repeated Identifier identifiers_before = 5;
  repeated Identifier identifiers_after = 6;
  ChangeActor actor = 7;
  string source = 8;
  string note = 9;
  // Set when the change was an accepted proposal.
  string proposal_id = 10;
  // The person who accepted it, when it was.
  string accepted_by_person_id = 11;
  int64 record_time_ns = 12;
}

message InstrumentChangelogRequest {
  string instrument_id = 1;
  int32 page_size = 2;
  string cursor = 3;
}

message InstrumentChangelogReply {
  // Newest first.
  repeated ChangelogEntry entries = 1;
  string next_cursor = 2;
}

// W1.8. DEFINE to ACTIVE: completing a defined instrument, a stub included.
message ActivateInstrumentRequest {
  string instrument_id = 1;
  string source = 2;
  string note = 3;
}

enum ProposalOperation {
  PROPOSAL_OPERATION_UNSPECIFIED = 0;
  // Changing or ending an identifier an active instrument already has.
  PROPOSAL_OPERATION_AMEND = 1;
  PROPOSAL_OPERATION_DECOMMISSION = 2;
  PROPOSAL_OPERATION_REACTIVATE = 3;
  PROPOSAL_OPERATION_MAP_STUB = 4;
}

enum ProposalState {
  PROPOSAL_STATE_UNSPECIFIED = 0;
  PROPOSAL_STATE_PENDING = 1;
  PROPOSAL_STATE_ACCEPTED = 2;
  PROPOSAL_STATE_REJECTED = 3;
  // The instrument moved past the version the proposal was made against.
  PROPOSAL_STATE_SUPERSEDED = 4;
}

// W1.9. What an agent asks for when it may not make the change itself. It
// never blocks the agent's run; staff decide later (W1.10).
message ProposeChangeRequest {
  string instrument_id = 1;
  int64 against_version = 2;
  ProposalOperation operation = 3;
  // The full amend, for PROPOSAL_OPERATION_AMEND.
  AmendInstrumentRequest amend = 4;
  // The existing instrument a stub is the same as, for MAP_STUB.
  string map_onto_instrument_id = 5;
  string source = 6;
  // Required: the agent's research, for the person who reviews it.
  string note = 7;
}

message ProposalRecord {
  string proposal_id = 1;
  string instrument_id = 2;
  int64 against_version = 3;
  ProposalOperation operation = 4;
  AmendInstrumentRequest amend = 5;
  string map_onto_instrument_id = 6;
  string source = 7;
  string note = 8;
  ChangeActor proposed_by = 9;
  int64 proposed_at_ns = 10;
  ProposalState state = 11;
  string decided_by_person_id = 12;
  int64 decided_at_ns = 13;
  string decision_note = 14;
}

// W1.10.
message ListProposalsRequest {
  // Zero means pending.
  ProposalState state = 1;
  int32 page_size = 2;
  string cursor = 3;
}

message ListProposalsReply {
  repeated ProposalRecord proposals = 1;
  string next_cursor = 2;
}

message DecideProposalRequest {
  string proposal_id = 1;
  bool accept = 2;
  string note = 3;
}

// W1.11. A stub minted from a miss is the same as an instrument the master
// already holds: its identifiers move onto that one, and the stub is retired.
message MapStubRequest {
  string stub_instrument_id = 1;
  string onto_instrument_id = 2;
  string source = 3;
  string note = 4;
}

// W1.13. What deployments asked for and the master did not hold, gathered by
// identifier set (W3.3 and W3.4 record each miss).
message MissEntry {
  string miss_id = 1;
  repeated Identifier identifiers = 2;
  AssetClass asset_class = 9;
  int64 count = 4;
  int32 deployment_count = 5;
  int64 first_seen_ns = 6;
  int64 last_seen_ns = 7;
  // The stub it minted or found, if it was escalated.
  string stub_instrument_id = 8;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 3;
}

message ListMissesRequest {
  AssetClass asset_class = 4;
  int32 page_size = 2;
  string cursor = 3;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 1;
}

message ListMissesReply {
  // Most wanted first.
  repeated MissEntry misses = 1;
  string next_cursor = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// W3 — resolution
// ─────────────────────────────────────────────────────────────────────────────

// Why a resolution did not produce exactly one instrument.
enum MissReason {
  MISS_REASON_UNSPECIFIED = 0;

  // No instrument matched.
  MISS_REASON_NOT_FOUND = 1;

  // More than one matched. Reported as a miss rather than resolved by picking,
  // because picking would be wrong about half the time and would be silent.
  MISS_REASON_AMBIGUOUS = 2;
}

// Reverse resolution: identifiers to an instrument, as of a date.
message ResolveIdentifierRequest {
  // At least one. Matched strongest-first: a global scheme before a
  // source-scoped symbol.
  repeated Identifier identifiers = 1;

  // Reference time. The date the mapping is being asked about.
  int64 as_of_ns = 2;

  // Narrows a symbol match. Empty means unconstrained.
  string exchange_mic = 3;
  string currency = 4;
}

message ResolveIdentifierReply {
  bool found = 1;
  string instrument_id = 2;
  // Set only when found is false.
  MissReason miss_reason = 3;

  // True when nothing matched and instrument_id is the deployment's LCL-
  // placeholder for the set (W3.7), which a holding may be recorded against
  // until its INS- ID replaces it. found is true alongside it. An ambiguous
  // resolve never answers a placeholder.
  bool placeholder = 4;
}

// Forward resolution: an instrument identifier to its record.
message ResolveInstrumentRequest {
  string instrument_id = 1;
  int64 as_of_ns = 2;
}

message ResolveInstrumentReply {
  bool found = 1;
  InstrumentRecord instrument = 2;
}

// A resolution missed. A fact, not a request.
//
// The publisher reports what it held and continues. It does not ask for a mint,
// does not wait for one, and has no authority to perform one. Keeping the
// authority to create identity on the far side of an event boundary is what
// stops a misbehaving feed from filling the master with junk.
message MissingInstrumentDetectedEvent {
  // The namespace the miss occurred in, e.g. "snaptrade".
  string source = 1;

  // Unspecified when the publisher does not know it.
  AssetClass asset_class = 9;

  // Everything the publisher held at the miss. Enough for a reader to attempt a
  // pull against a global scheme, or to mint a stub carrying them.
  repeated Identifier identifiers = 3;

  // Reference time of the missed resolve. The reaction must target the mapping
  // effective then, not the mapping effective now.
  int64 as_of_ns = 4;

  string publisher_instance_id = 5;
  MissReason reason = 6;
  int64 observed_at_ns = 7;

  // The deployment's LCL- placeholder for these identifiers, when its
  // instrument store minted or re-announced one (W3.7). Empty for an
  // ambiguous miss, which has no placeholder.
  string placeholder_instrument_id = 8;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 2;
}

// Reply to a pull of one instrument from the central authority.
message PullInstrumentReply {
  bool found = 1;
  InstrumentRecord instrument = 2;

  // On the instrument-pulled event: the deployment's placeholder this record
  // replaces (W3.3, W3.4), so the instrument store can replace it (W3.8).
  // Empty when the record replaces nothing.
  string replaces_instrument_id = 3;
}

// Reply to a pull resolving identifiers against the central authority.
message PullIdentifierReply {
  bool found = 1;
  InstrumentRecord instrument = 2;
  MissReason miss_reason = 3;
}

// Ask the central authority to pair a deployment's placeholder with an
// instrument (W3.4): one sharing an identifier in force on the date, or a stub
// minted from these identifiers for an administrator to complete. Idempotent
// per placeholder: asking again answers the same pairing.
message EscalateInstrumentRequest {
  string source = 1;
  AssetClass asset_class = 7;
  repeated Identifier identifiers = 3;
  int64 as_of_ns = 4;
  string requesting_deployment_id = 5;

  // The deployment's LCL- placeholder for these identifiers.
  string placeholder_instrument_id = 6;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 2;
}

message EscalateInstrumentReply {
  InstrumentRecord instrument = 1;

  // False when the authority paired the placeholder with an instrument it
  // already held rather than minting one. The caller applies the record
  // either way; this is for the operator.
  bool minted = 2;

  // The placeholder the instrument replaces, echoed from the request.
  string replaces_instrument_id = 3;

  // True when the identifiers point at more than one instrument, or agree on
  // one identifier and contradict another of the same scheme. Nothing is
  // paired or minted, instrument is empty, and staff decide; the placeholder
  // stays in use until they have.
  bool conflict = 4;
}

// A record reached the local replica, by pull or by mint.
message InstrumentAppliedEvent {
  InstrumentRecord instrument = 1;

  // False when the apply was a no-op because the held version was already at or
  // above this one.
  bool applied = 2;

  int64 applied_at_ns = 3;
}

// A deployment's placeholder was replaced by the instrument that it stood for
// (W3.8). Stores keyed by instrument move what they hold under the placeholder
// onto the instrument (W3.9); records of what was reported keep it.
message InstrumentReplacedEvent {
  // The LCL- placeholder.
  string replaced_instrument_id = 1;

  // What replaces it.
  InstrumentRecord instrument = 2;

  int64 replaced_at_ns = 3;
}
