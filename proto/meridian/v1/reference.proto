// Instrument identity, symbology mapping, and the escalation path when a
// resolution misses.
//
// Derived from workflows W1 (security master administration) and W3 (instrument
// resolution and completion in a deployment; contract v10, decisions/030: a
// deployment mints its own instrument IDs, and a person completes its records).
// Every message here traces to a matrix row; see matrix/matrix.tsv.
//
// The scope boundary is load-bearing: this is identity, mapping and structure.
// Prices, yields, ratings, volumes and sector data are client-licensed and live
// in the deployment. Identity attributes and data values never mix, and no
// field below invites them to.

syntax = "proto3";

package meridian.v1;

import "meridian/v1/sidecar.proto";

// ─────────────────────────────────────────────────────────────────────────────
// The record
// ─────────────────────────────────────────────────────────────────────────────

// Lifecycle. The transition verbs are the commands; nothing sets this directly.
enum InstrumentLifecycleState {
  INSTRUMENT_LIFECYCLE_STATE_UNSPECIFIED = 0;

  // Identity exists, attributes may be incomplete. A holding can reference it,
  // which is the point: a position may arrive before anyone has decided what
  // the instrument is.
  INSTRUMENT_LIFECYCLE_STATE_DEFINE = 1;

  // Fully defined.
  INSTRUMENT_LIFECYCLE_STATE_ACTIVE = 2;

  // Retired. Existing holdings stay resolvable, because history does not stop
  // being true when an instrument stops trading.
  INSTRUMENT_LIFECYCLE_STATE_DECOMMISSIONED = 3;
}

// The kind of claim holding an instrument gives. A closed list, ruled by the
// product owner (sdk-contract/asset-class-is-an-enum, 2026-09-28 and
// 2026-09-30); a class joins it by a ruling, never because a feed sent one.
// Spelled in text as the value's name without its prefix, lower case:
// `equity`, `debt`, `fund`, `derivative`, `crypto_asset`, `event_contract`,
// `cash`.
//
// What kind of instrument within a class is its instrument type
// (InstrumentType, contract v11), which grows one type at a time as a
// workflow needs it.
enum AssetClass {
  // No class. Held only by a stub minted from a deployment's miss (W3.4),
  // which may not know one; activating an instrument requires a class (W1.8).
  ASSET_CLASS_UNSPECIFIED = 0;

  // A share of ownership.
  ASSET_CLASS_EQUITY = 1;

  // Somebody owes the holder.
  ASSET_CLASS_DEBT = 2;

  // A share of a pool: ETFs and mutual funds among them.
  ASSET_CLASS_FUND = 3;

  // A contract whose value comes from something else: options and futures
  // among them.
  ASSET_CLASS_DERIVATIVE = 4;

  ASSET_CLASS_CRYPTO_ASSET = 5;

  // Pays on whether an event happens.
  ASSET_CLASS_EVENT_CONTRACT = 6;

  // A holding of a currency's cash instrument (spec/the-account-side-fits-every-venue).
  ASSET_CLASS_CASH = 7;
}

// What kind of instrument within its asset class (contract v11; the product
// owner, 2026-10-02: "Yes to put instrument type into v11 scope"). In the
// contract's own words, ISO 10962 (CFI) a reference and not the vocabulary;
// a type joins when a workflow needs it, each with its dictionary entry, and
// each is under one asset class. Spelled in text as the value's name without
// its prefix, lower case: `money_market_fund`.
enum InstrumentType {
  // No type stated: the asset class says all the record says.
  INSTRUMENT_TYPE_UNSPECIFIED = 0;

  // Under fund: a fund that invests in short-term debt under SEC rule 2a-7
  // and aims to keep its value, with the attributes of MoneyMarketFund.
  // Held as a fund, never as cash, even where a custodian sweeps cash into it.
  INSTRUMENT_TYPE_MONEY_MARKET_FUND = 1;
}

// A money market fund's attributes, from SEC rule 2a-7 as amended in 2023
// (the product owner, 2026-10-02, the custody audit's Q4). Its observations
// -- its NAV on a day, its seven-day yield, its liquid assets, a fee imposed
// -- are the lake's, not the record's.
message MoneyMarketFund {
  MoneyMarketFundCategory category = 1;
  MoneyMarketFundInvestors investors = 2;
  MoneyMarketFundNav nav = 3;
  LiquidityFeeRegime liquidity_fee = 4;
}

// What a money market fund invests in.
enum MoneyMarketFundCategory {
  MONEY_MARKET_FUND_CATEGORY_UNSPECIFIED = 0;
  // Cash, government securities and repurchase agreements backed by them.
  MONEY_MARKET_FUND_CATEGORY_GOVERNMENT = 1;
  // Also corporate short-term debt.
  MONEY_MARKET_FUND_CATEGORY_PRIME = 2;
  // Short-term municipal debt.
  MONEY_MARKET_FUND_CATEGORY_TAX_EXEMPT = 3;
}

// Whom a money market fund is offered to.
enum MoneyMarketFundInvestors {
  MONEY_MARKET_FUND_INVESTORS_UNSPECIFIED = 0;
  // Natural persons only.
  MONEY_MARKET_FUND_INVESTORS_RETAIL = 1;
  MONEY_MARKET_FUND_INVESTORS_INSTITUTIONAL = 2;
}

// How a money market fund prices its shares.
enum MoneyMarketFundNav {
  MONEY_MARKET_FUND_NAV_UNSPECIFIED = 0;
  // A stable share price of 1.00: the book takes its position as one lot at
  // stable value (W9.1).
  MONEY_MARKET_FUND_NAV_STABLE = 1;
  // A share price that floats with its holdings: lots like any fund.
  MONEY_MARKET_FUND_NAV_FLOATING = 2;
}

// When a money market fund charges a fee on redemptions.
enum LiquidityFeeRegime {
  LIQUIDITY_FEE_REGIME_UNSPECIFIED = 0;
  // Charged when daily net redemptions pass 5% of net assets: an
  // institutional prime or tax-exempt fund.
  LIQUIDITY_FEE_REGIME_MANDATORY = 1;
  // At the board's discretion, where in the fund's interest.
  LIQUIDITY_FEE_REGIME_DISCRETIONARY = 2;
  // No liquidity fee: a government fund that has not chosen one, which
  // neither of the others describes (contract v12).
  LIQUIDITY_FEE_REGIME_NONE = 3;
}

// One typed identifier for an instrument.
//
// `scheme` says what kind of identifier this is: a global scheme ("figi",
// "isin", "cusip", "sedol") or a source-scoped one ("symbol"). A source-scoped
// identifier is only meaningful alongside its source, which is why `source` is
// present and why a bare symbol can never drive a global resolve.
message Identifier {
  string scheme = 1;
  string value = 2;

  // The namespace a source-scoped identifier belongs to, e.g. "snaptrade".
  // Empty for a global scheme.
  string source = 3;
}

// The canonical instrument record.
//
// Three time axes, and conflating any two of them produces a resolution bug
// that only appears when an identifier is reused:
//
//   reference time  the as-of a resolution is FOR. A query parameter, never a
//                   field here.
//   effective time  valid_from_ns -- when this mapping became true in the world.
//   record time     record_time_ns -- when the authority knew it.
//
// Identifiers get reused: a ticker freed by a delisting is later reassigned to
// a different instrument. A consumer resolving a historical date must key on
// effective time, not on when it happened to learn the mapping.
message InstrumentRecord {
  // The record's key for life. On the platform's master, "INS-...", minted
  // by it (W1). In a deployment, the deployment's own (decisions/030): "LCL-"
  // for a record its instrument store minted (W3.7), which says who minted it
  // and nothing about whether it is resolved; or the "INS-" ID of a record
  // applied from the platform before contract v10, which it keeps. A global
  // ID the platform answers later joins `identifiers` (scheme
  // `open_meridian`), never replacing this.
  string instrument_id = 1;

  // The full identifier set. An amend replaces this authoritatively.
  repeated Identifier identifiers = 2;

  AssetClass asset_class = 11;

  // ISO 4217.
  string currency = 4;

  // ISO 10383 market identifier code. Empty where there is no listing venue.
  string exchange_mic = 5;

  string description = 6;

  InstrumentLifecycleState lifecycle_state = 7;

  // Monotonic, assigned by the store, starting at 1. An apply carrying a
  // version at or below the one held is a no-op, which is what makes replica
  // application idempotent and overlapping pulls harmless.
  int64 version = 8;

  // Effective time. When this version's mapping became true.
  int64 valid_from_ns = 9;

  // Record time. Stamped by the store, never accepted from a caller: knowledge
  // cannot be back-dated.
  int64 record_time_ns = 10;

  // In a deployment (contract v10): where each value in force came from --
  // the asset class, the currency, the description and each identifier --
  // with the person who set or accepted it, or the plugin that reported it
  // (W3, requirement 1). Empty on the platform's master, whose changelog
  // says it (W1.7).
  repeated InstrumentValueSource sources = 12;

  // In a deployment (contract v10): values offered by a plugin's source
  // (W3.1) or the platform (W3.3), in force only when a person accepts one
  // (W3.10). A later offer never overwrites a value in force.
  repeated OfferedValue offers = 13;

  // Its type within its asset class (contract v11), in force once a person
  // set or accepted it, as the asset class is. Unspecified where none is.
  InstrumentType instrument_type = 14;

  // A money market fund's attributes (contract v11); set only on a record
  // whose type is money market fund.
  MoneyMarketFund money_market_fund = 15;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 3;
}

// Which value of a deployment's instrument record (W3, contract v10).
enum InstrumentField {
  INSTRUMENT_FIELD_UNSPECIFIED = 0;
  INSTRUMENT_FIELD_ASSET_CLASS = 1;
  INSTRUMENT_FIELD_CURRENCY = 2;
  INSTRUMENT_FIELD_DESCRIPTION = 3;
  // One of its identifiers, named beside the field.
  INSTRUMENT_FIELD_IDENTIFIER = 4;
  // Contract v11.
  INSTRUMENT_FIELD_INSTRUMENT_TYPE = 5;
  INSTRUMENT_FIELD_MONEY_MARKET_FUND = 6;
}

// One value for a deployment's record, set or offered, with where it came
// from (W3.10, W3.1, W3.3).
message InstrumentValue {
  oneof value {
    // One of the closed list; never unspecified.
    AssetClass asset_class = 1;
    // An ISO 4217 code, three capital letters; never a pseudo-currency such
    // as BASE.
    string currency = 2;
    string description = 3;
    Identifier identifier = 4;
    // Contract v11: one under the record's asset class; never unspecified.
    InstrumentType instrument_type = 6;
    // Contract v11: on a money market fund only, each attribute stated.
    MoneyMarketFund money_market_fund = 7;
  }

  // Where the value came from, in words: a statement, a prospectus, "ISO
  // 4217", "the platform, record INS-... version 3". Required on a value a
  // person sets.
  string source = 5;
}

// Where a value in force on a deployment's record came from (W3,
// requirements 1 and 3).
message InstrumentValueSource {
  InstrumentField field = 1;

  // For INSTRUMENT_FIELD_IDENTIFIER: which identifier.
  Identifier identifier = 2;

  // In words, as the value was set with.
  string source = 3;

  // The person who set or accepted it: the deployment-local subject core
  // stamped from the command's envelope (W4.9), never typed. Empty for an
  // identifier a plugin reported, the platform's global ID, and a value
  // applied from the platform before contract v10.
  string person = 4;

  // The plugin instance whose resolve joined the identifier (W3.1). Empty
  // otherwise.
  string instance_id = 5;

  // When the store recorded it.
  int64 recorded_at_ns = 6;

  // Why a value held was changed, where given.
  string note = 7;

  // The delegation the person acted through, when they set or accepted the
  // value through a client -- an agent on the deployment's MCP surface --
  // rather than at the dashboard in a browser (W3.10, W6.20, contract v12):
  // stamped from the command's envelope (W4.9), never typed. Empty beside a
  // person at the dashboard, and wherever person is.
  string acting_through_delegation = 8;

  // The client's registered name, beside acting_through_delegation, as the
  // envelope carried it; empty whenever it is.
  string client_name = 9;
}

// A value offered for a deployment's record (W3.1, W3.3), shown beside its
// field and in force only when a person accepts it (W3.10).
message OfferedValue {
  InstrumentValue value = 1;

  // The plugin instance whose source stated it. Empty for the platform's
  // answer and for an offer the store derives itself (ISO 4217 for an
  // `iso4217` identifier).
  string instance_id = 2;

  int64 offered_at_ns = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// W1 — administration
// ─────────────────────────────────────────────────────────────────────────────

message DefineInstrumentRequest {
  repeated Identifier identifiers = 1;
  // Required: a class the enum defines. A define without one, or with one it
  // does not define, is refused.
  AssetClass asset_class = 9;
  string currency = 3;
  string exchange_mic = 4;
  string description = 5;

  // When the mapping becomes effective. Zero means now.
  int64 valid_from_ns = 6;

  // Where the writer found what it wrote, and its change note: an agent
  // documents its research here (what it looked for, where, what it found,
  // why). Required from an agent, optional from a person. W1; spec
  // agents-keep-the-security-master, requirements 27 and 28.
  string source = 7;
  string note = 8;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 2;
}

// Authoritative replace of the identifier set and attributes. Not a delta: an
// identifier absent here is removed, and its validity window closes as of
// valid_from_ns. A delta cannot express removal without a second verb, and the
// second verb is where drift starts.
message AmendInstrumentRequest {
  string instrument_id = 1;
  repeated Identifier identifiers = 2;
  // A class the enum defines. Unspecified is accepted only while the
  // instrument is a stub that has none.
  AssetClass asset_class = 10;
  string currency = 4;
  string exchange_mic = 5;
  string description = 6;
  int64 valid_from_ns = 7;

  // Where the writer found what it wrote, and its change note: an agent
  // documents its research here (what it looked for, where, what it found,
  // why). Required from an agent, optional from a person. W1; spec
  // agents-keep-the-security-master, requirements 27 and 28.
  string source = 8;
  string note = 9;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 3;
}

// The verb is the transition, so the request carries only the subject.
message DecommissionInstrumentRequest {
  string instrument_id = 1;
  string source = 2;
  string note = 3;
}

message ReactivateInstrumentRequest {
  string instrument_id = 1;
  string source = 2;
  string note = 3;
}

message ListInstrumentsRequest {
  // Zero-value filters mean unfiltered.
  InstrumentLifecycleState lifecycle_state = 1;
  AssetClass asset_class = 5;
  int32 page_size = 3;
  string cursor = 4;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 2;
}

message ListInstrumentsReply {
  repeated InstrumentRecord instruments = 1;
  // Empty when the listing is exhausted.
  string next_cursor = 2;
}

// W1.6. Any identifier value, of any scheme, or a name; resolved as of a date.
message SearchInstrumentsRequest {
  string query = 1;
  // Zero means now.
  int64 as_of_ns = 2;
  int32 page_size = 3;
  string cursor = 4;
}

// Who made a change: a person, or an agent acting for one on a delegation.
message ChangeActor {
  string person_id = 1;
  // Empty when a person acted in their own name.
  string agent_client_id = 2;
  string delegation_id = 3;
}

// W1.7. One entry per change, append-only, record time stamped by the store.
message ChangelogEntry {
  string entry_id = 1;
  string instrument_id = 2;
  int64 version = 3;
  // The step that made it: define, amend, activate, decommission,
  // reactivate, map, mint.
  string operation = 4;
  repeated Identifier identifiers_before = 5;
  repeated Identifier identifiers_after = 6;
  ChangeActor actor = 7;
  string source = 8;
  string note = 9;
  // Set when the change was an accepted proposal.
  string proposal_id = 10;
  // The person who accepted it, when it was.
  string accepted_by_person_id = 11;
  int64 record_time_ns = 12;
}

message InstrumentChangelogRequest {
  string instrument_id = 1;
  int32 page_size = 2;
  string cursor = 3;
}

message InstrumentChangelogReply {
  // Newest first.
  repeated ChangelogEntry entries = 1;
  string next_cursor = 2;
}

// W1.8. DEFINE to ACTIVE: completing a defined instrument, a stub included.
message ActivateInstrumentRequest {
  string instrument_id = 1;
  string source = 2;
  string note = 3;
}

enum ProposalOperation {
  PROPOSAL_OPERATION_UNSPECIFIED = 0;
  // Changing or ending an identifier an active instrument already has.
  PROPOSAL_OPERATION_AMEND = 1;
  PROPOSAL_OPERATION_DECOMMISSION = 2;
  PROPOSAL_OPERATION_REACTIVATE = 3;
  PROPOSAL_OPERATION_MAP_STUB = 4;
}

enum ProposalState {
  PROPOSAL_STATE_UNSPECIFIED = 0;
  PROPOSAL_STATE_PENDING = 1;
  PROPOSAL_STATE_ACCEPTED = 2;
  PROPOSAL_STATE_REJECTED = 3;
  // The instrument moved past the version the proposal was made against.
  PROPOSAL_STATE_SUPERSEDED = 4;
}

// W1.9. What an agent asks for when it may not make the change itself. It
// never blocks the agent's run; staff decide later (W1.10).
message ProposeChangeRequest {
  string instrument_id = 1;
  int64 against_version = 2;
  ProposalOperation operation = 3;
  // The full amend, for PROPOSAL_OPERATION_AMEND.
  AmendInstrumentRequest amend = 4;
  // The existing instrument a stub is the same as, for MAP_STUB.
  string map_onto_instrument_id = 5;
  string source = 6;
  // Required: the agent's research, for the person who reviews it.
  string note = 7;
}

message ProposalRecord {
  string proposal_id = 1;
  string instrument_id = 2;
  int64 against_version = 3;
  ProposalOperation operation = 4;
  AmendInstrumentRequest amend = 5;
  string map_onto_instrument_id = 6;
  string source = 7;
  string note = 8;
  ChangeActor proposed_by = 9;
  int64 proposed_at_ns = 10;
  ProposalState state = 11;
  string decided_by_person_id = 12;
  int64 decided_at_ns = 13;
  string decision_note = 14;
}

// W1.10.
message ListProposalsRequest {
  // Zero means pending.
  ProposalState state = 1;
  int32 page_size = 2;
  string cursor = 3;
}

message ListProposalsReply {
  repeated ProposalRecord proposals = 1;
  string next_cursor = 2;
}

message DecideProposalRequest {
  string proposal_id = 1;
  bool accept = 2;
  string note = 3;
}

// W1.11. A stub minted from a miss is the same as an instrument the master
// already holds: its identifiers move onto that one, and the stub is retired.
message MapStubRequest {
  string stub_instrument_id = 1;
  string onto_instrument_id = 2;
  string source = 3;
  string note = 4;
}

// W1.13. What deployments asked for and the master did not hold, gathered by
// identifier set (W3.3 and W3.4 record each miss).
message MissEntry {
  string miss_id = 1;
  repeated Identifier identifiers = 2;
  AssetClass asset_class = 9;
  int64 count = 4;
  int32 deployment_count = 5;
  int64 first_seen_ns = 6;
  int64 last_seen_ns = 7;
  // The stub it minted or found, if it was escalated.
  string stub_instrument_id = 8;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 3;
}

message ListMissesRequest {
  AssetClass asset_class = 4;
  int32 page_size = 2;
  string cursor = 3;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 1;
}

message ListMissesReply {
  // Most wanted first.
  repeated MissEntry misses = 1;
  string next_cursor = 2;
}

// W1.14. The records with no asset class, for a delegation that assigns
// asset classes (W1.12) and refused for any other. What deployments reported
// in them is a lead, never a source.
message ListUnclassifiedRequest {
  int32 page_size = 1;
}

message ListUnclassifiedReply {
  // Instruments with no class, stubs minted from deployments' misses among
  // them, oldest first.
  repeated InstrumentRecord instruments = 1;
  // Misses no stub was minted for, with no class, most wanted first.
  repeated MissEntry misses = 2;
}

// W1.14. Set the class of one record that has none: an instrument, or a miss
// no stub was minted for; exactly one of the two is named, and `{id}` in the
// route is that one's ID. Any class the enum defines, whatever the
// delegation's classes; made directly, and nothing else about the record
// changes. Refused for a record that has a class and for a delegation that
// does not assign asset classes. The source and note are required, as on
// every agent write: which allowed source stated the class, and how.
message AssignClassRequest {
  string instrument_id = 1;
  string miss_id = 2;
  AssetClass asset_class = 3;
  string source = 4;
  string note = 5;
}

// The record with its class: the instrument at its next version, or the
// miss.
message AssignClassReply {
  InstrumentRecord instrument = 1;
  MissEntry miss = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// W3 — resolution
// ─────────────────────────────────────────────────────────────────────────────

// Why a resolution did not produce exactly one instrument.
enum MissReason {
  MISS_REASON_UNSPECIFIED = 0;

  // No instrument matched.
  MISS_REASON_NOT_FOUND = 1;

  // More than one matched. Reported as a miss rather than resolved by picking,
  // because picking would be wrong about half the time and would be silent.
  MISS_REASON_AMBIGUOUS = 2;
}

// Reverse resolution: identifiers to an instrument, as of a date.
message ResolveIdentifierRequest {
  // At least one. Matched strongest-first: a global scheme before a
  // source-scoped symbol.
  repeated Identifier identifiers = 1;

  // Reference time. The date the mapping is being asked about.
  int64 as_of_ns = 2;

  // Narrows a symbol match. Empty means unconstrained.
  string exchange_mic = 3;
  string currency = 4;

  // What the plugin's source states of the security, where it states it,
  // and nothing it would have to guess (principle 14). Kept on the record as
  // offers with the instance as their source, in force only when a person
  // accepts them (W3.1, contract v10). Unspecified, or empty, is not stated.
  AssetClass stated_asset_class = 5;
  // An ISO 4217 code.
  string stated_currency = 6;
  string stated_description = 7;
  // Its type within the stated class, where the source says it (contract
  // v11): a custodian's sweep fund is a money market fund.
  InstrumentType stated_instrument_type = 8;
}

message ResolveIdentifierReply {
  bool found = 1;
  string instrument_id = 2;
  // Set only when found is false.
  MissReason miss_reason = 3;

  // True when nothing matched and this resolve minted instrument_id, the
  // deployment's record for the set (W3.7, contract v10); found is true
  // alongside it. A later resolve of the same identifiers matches the
  // record, and is not minted. Until v10, true meant a placeholder.
  bool minted = 4;
}

// Forward resolution: an instrument identifier to its record.
message ResolveInstrumentRequest {
  string instrument_id = 1;
  int64 as_of_ns = 2;
}

message ResolveInstrumentReply {
  bool found = 1;
  InstrumentRecord instrument = 2;
}

// A resolution missed. A fact, not a request.
//
// The publisher reports what it held and continues. It does not ask for a mint,
// does not wait for one, and has no authority to perform one. Keeping the
// authority to create identity on the far side of an event boundary is what
// stops a misbehaving feed from filling the master with junk.
message MissingInstrumentDetectedEvent {
  // The namespace the miss occurred in, e.g. "snaptrade".
  string source = 1;

  // Unspecified when the publisher does not know it.
  AssetClass asset_class = 9;

  // Everything the publisher held at the miss. Enough for a reader to attempt a
  // pull against a global scheme, or to mint a stub carrying them.
  repeated Identifier identifiers = 3;

  // Reference time of the missed resolve. The reaction must target the mapping
  // effective then, not the mapping effective now.
  int64 as_of_ns = 4;

  string publisher_instance_id = 5;
  MissReason reason = 6;
  int64 observed_at_ns = 7;

  // The source's kind as reported, set only when it did not convert to an
  // asset class and `asset_class` is unspecified (contract v11;
  // spec/vendor-differences-have-a-place-in-the-contract, requirement 4).
  // For a person setting the class; never read.
  AsReported asset_class_as_reported = 10;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 2;

  // Once the deployment's placeholder its instrument store announced on this
  // topic (W3.7 until contract v10); a deployment's records are its own and
  // nothing is announced (decisions/030).
  reserved 8;
  reserved "placeholder_instrument_id";
}

// Reply to a pull of one instrument from the central authority.
message PullInstrumentReply {
  bool found = 1;
  InstrumentRecord instrument = 2;

  // On the instrument-pulled event: the deployment's record a person asked
  // about (W3.3), on which the instrument store keeps this record's values
  // as offers and adds its ID as an identifier, never replacing the
  // deployment's key (W3.5, contract v10). Until v10, the placeholder it
  // replaced.
  string for_instrument_id = 3;
}

// Reply to a pull resolving identifiers against the central authority.
message PullIdentifierReply {
  bool found = 1;
  InstrumentRecord instrument = 2;
  MissReason miss_reason = 3;
}

// The platform's surface for pairing a deployment's ID with an instrument
// (W3.4), which a deployment does not call from contract v10: one sharing an
// identifier in force on the date, or a stub minted from these identifiers
// for an administrator to complete. Idempotent per deployment ID: asking
// again answers the same pairing.
message EscalateInstrumentRequest {
  string source = 1;
  AssetClass asset_class = 7;
  repeated Identifier identifiers = 3;
  int64 as_of_ns = 4;
  string requesting_deployment_id = 5;

  // The deployment's ID for these identifiers.
  string placeholder_instrument_id = 6;

  // Once a string, and free text; retired for the enum
  // (sdk-contract/asset-class-is-an-enum). The name carries on above.
  reserved 2;
}

message EscalateInstrumentReply {
  InstrumentRecord instrument = 1;

  // False when the authority paired the deployment's ID with an instrument it
  // already held rather than minting one. The caller applies the record
  // either way; this is for the operator.
  bool minted = 2;

  // The deployment's ID it pairs with, echoed from the request.
  string replaces_instrument_id = 3;

  // True when the identifiers point at more than one instrument, or agree on
  // one identifier and contradict another of the same scheme. Nothing is
  // paired or minted, instrument is empty, and staff decide.
  bool conflict = 4;
}

// A record of the deployment's reached a new version (W3.5): minted, joined
// by an identifier, completed, merged, or answered by the platform.
message InstrumentAppliedEvent {
  InstrumentRecord instrument = 1;

  // False when nothing changed: a redelivery, or a version already held.
  bool applied = 2;

  int64 applied_at_ns = 3;
}

// A deployment's record was replaced by another (W3.8): from contract v10, a
// record a person merged into the one that stays (W3.13); before it, a
// placeholder by its INS- ID. Stores keyed by instrument move what they hold
// under it onto the one that stays (W3.9, W9.9); records of what was
// reported keep it.
message InstrumentReplacedEvent {
  // The record replaced.
  string replaced_instrument_id = 1;

  // What replaces it.
  InstrumentRecord instrument = 2;

  int64 replaced_at_ns = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// W3, contract v10 — a deployment completes its own records, at the dashboard
// ─────────────────────────────────────────────────────────────────────────────

// One record's values, set against the version it was read at (W3.10).
message InstrumentCompletion {
  string instrument_id = 1;

  // The record's version when it was read; a record changed since is refused
  // alone (REFUSAL_REASON_RECORD_CHANGED).
  int64 against_version = 2;

  // Each value with its source. A value already in force, sent again, is no
  // change.
  repeated InstrumentValue values = 3;

  // Why: required where a value changes one already held
  // (REFUSAL_REASON_REASON_REQUIRED); optional for filling a blank.
  string note = 4;
}

// W3.10. For a deployment admin, the person stamped on the envelope.
message CompleteInstrumentsRequest {
  // Up to 500, each its own result.
  repeated InstrumentCompletion completions = 1;
}

message InstrumentCompletionResult {
  string instrument_id = 1;

  // The record at its new version, when completed.
  InstrumentRecord instrument = 2;

  // When refused: the reason and each field, by its path in the completion
  // (`values[0].currency`, `values[1].source`, `note`, `against_version`).
  Refusal refusal = 3;

  // The refusal in words, for the person.
  string detail = 4;
}

message CompleteInstrumentsReply {
  // One per completion, in the request's order.
  repeated InstrumentCompletionResult results = 1;
}

// W3.11. For a deployment admin.
message ListInstrumentsToCompleteRequest {
  // Records complete as well; otherwise only those lacking something.
  bool include_complete = 1;

  // One record by its ID, as the page opening it reads it; empty for the
  // list.
  string instrument_id = 4;

  int32 page_size = 2;
  string cursor = 3;
}

// A record and what it lacks (W3.11).
message InstrumentToComplete {
  InstrumentRecord instrument = 1;

  // An asset class or a currency, which the book requires (W9.1); a
  // description; a symbol, where the record has a source that names one.
  repeated InstrumentField lacks = 2;

  // An asset class and a currency in force.
  bool complete_for_book = 3;

  // Complete for the book, a description, and a symbol where one exists.
  bool complete = 4;
}

// Identifiers that met more than one record, or an identifier another record
// carries (W3.1, W3.2, W3.10): not a match, and listed until a merge
// settles it (W3.13).
message InstrumentConflict {
  // The identifiers that disagree.
  repeated Identifier identifiers = 1;

  // The records they meet, each as it is now.
  repeated string instrument_ids = 2;

  // The plugin instance that reported it; empty where a person's completion
  // met it.
  string reported_by = 3;

  int64 first_seen_ns = 4;
  int64 last_seen_ns = 5;
}

// How many identifiers of a licensed scheme the deployment's records carry
// (W3.11): CUSIP Global Services counts toward its 500-identifier threshold.
message LicensedIdentifierCount {
  // `cusip`, `isin` or `sedol`.
  string scheme = 1;
  int64 count = 2;
}

message ListInstrumentsToCompleteReply {
  // Those the book cannot use first, then the rest lacking something.
  repeated InstrumentToComplete instruments = 1;
  string next_cursor = 2;

  // Every conflict not yet settled.
  repeated InstrumentConflict conflicts = 3;

  // Across the deployment, whatever the page.
  int64 incomplete_for_book = 4;
  int64 incomplete = 5;
  repeated LicensedIdentifierCount licensed_identifiers = 6;
}

// W3.12.
message ReadInstrumentHistoryRequest {
  string instrument_id = 1;
  int32 page_size = 2;
  string cursor = 3;
}

// One change a version made.
message InstrumentChange {
  InstrumentField field = 1;

  // For INSTRUMENT_FIELD_IDENTIFIER: which identifier.
  Identifier identifier = 2;

  // As text: an asset class by its name (`cash`), a currency, a
  // description, an identifier's value. Empty where there was none, or
  // where an identifier joined.
  string before = 3;
  string after = 4;

  string source = 5;
}

// One version of a deployment's record, append-only (W3.12).
message InstrumentVersion {
  string instrument_id = 1;
  int64 version = 2;

  // What made it: mint, join, complete, platform, merge, merged-into,
  // migrate. An open list a reader takes as data.
  string operation = 3;

  repeated InstrumentChange changes = 4;

  // The person, stamped by core; empty for a plugin's report or a
  // migration.
  string person = 5;

  // The plugin instance whose resolve made it, where one did.
  string instance_id = 6;

  string note = 7;
  int64 record_time_ns = 8;

  // For a merge, the other record: the one merged in, or the one this was
  // merged into.
  string merged_instrument_id = 9;

  // The delegation the person acted through, when they made the version
  // through a client rather than at the dashboard in a browser (W3.10,
  // W3.13, W6.20, contract v12), stamped from the command's envelope (W4.9);
  // and the client's registered name beside it. Both empty for a person at
  // the dashboard, a plugin's report and a migration.
  string acting_through_delegation = 10;
  string client_name = 11;
}

message ReadInstrumentHistoryReply {
  // Newest first.
  repeated InstrumentVersion versions = 1;
  string next_cursor = 2;
}

// W3.13. For a deployment admin, the person stamped on the envelope.
message MergeInstrumentsRequest {
  // The record that stays, and the version it was read at.
  string kept_instrument_id = 1;
  int64 kept_version = 2;

  // The record merged into it, replaced by it (W3.8).
  string merged_instrument_id = 3;
  int64 merged_version = 4;

  // Fields where both carry a value, they differ, and the merged record's
  // stands; any other differing field keeps the kept record's.
  repeated InstrumentField take_from_merged = 5;

  // Required: why they are one security.
  string note = 6;
}

message MergeInstrumentsReply {
  // The record that stays, at its new version.
  InstrumentRecord instrument = 1;
}

// W3.3. For a person at the dashboard; the conductor alone reaches the
// platform (decisions/011).
message AskPlatformForInstrumentRequest {
  // The deployment's record asked about.
  string instrument_id = 1;

  // The record's identifiers. The conductor sends the platform only the
  // open ones -- the global ID, a FIGI, an ISO 4217 code -- never a licensed
  // scheme's value nor a source-scoped symbol.
  repeated Identifier identifiers = 2;

  // The date the record's identifiers are asked about. Zero means now.
  int64 as_of_ns = 3;
}

message AskPlatformForInstrumentReply {
  // False when the platform could not be reached; `detail` says why, and
  // completing the record works without it.
  bool reachable = 1;

  // The platform holds a record by one of the identifiers asked with.
  bool found = 2;

  // Its record: its ID joins the deployment's record as an identifier, and
  // the rest is offered (W3.5).
  InstrumentRecord instrument = 3;

  string detail = 4;
}
