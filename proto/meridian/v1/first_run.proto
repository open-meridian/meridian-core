// A deployment's first run: what the wizard sends the first-run Job to test,
// and the configuration it applies.
//
// Derived from workflow W7 (installing a deployment and its first run). Every
// message here traces to a matrix row; see matrix/matrix.tsv.
//
// The governing idea: the dashboard asks and the first-run Job acts, and
// nothing keeps the Job's rights once first run ends (decisions/016). Every
// credential crosses the bus sealed to the Job's in-memory key, so the broker
// and every other participant see only ciphertext. None of this reaches the
// platform.

syntax = "proto3";

package meridian.v1;

// ─────────────────────────────────────────────────────────────────────────────
// W7.2 — whether this deployment's key is registered
// ─────────────────────────────────────────────────────────────────────────────

message EnrolmentStateRequest {}

// What the wizard shows before anything is redeemed, and the only thing it
// shows: the conductor holds the key and is what enrols, so it is what knows.
message EnrolmentState {
  string deployment_id = 1;

  bool enrolled = 2;

  // Of the public half, as the platform states it beside the deployment. An
  // administrator comparing the two is how a code somebody else spent is
  // noticed: the fingerprint on the platform is then one they have never
  // seen here.
  string fingerprint = 3;

  // Why not, when it is not: no code was given, the code expired, or it had
  // been spent. What the administrator does about each differs, so the
  // reason is carried rather than a bare false.
  string refusal_reason = 4;

  // The public half the conductor generated, as the wizard shows it
  // (spec/installation-and-first-run, requirement 8).
  //
  // Nothing on the routine path needs it: the conductor registers it itself
  // with an enrolment code, and nobody sees it. It is here for the path that
  // recovers, where somebody registers a key by hand on the platform -- so
  // that what they copy is a public half off a screen, rather than a keypair
  // they generated on a laptop with the private half left in a file
  // (decisions/017).
  string public_key_pem = 5;
}

// ─────────────────────────────────────────────────────────────────────────────
// W7.4 — the key credentials are sealed to
// ─────────────────────────────────────────────────────────────────────────────

message FirstRunSealingKeyRequest {}

// Made in memory when the Job starts, and never stored. A Job that restarts
// has a new one, and a credential sealed to the old one is refused, so the
// dashboard asks again and seals again.
message FirstRunSealingKey {
  // HPKE (RFC 9180): DHKEM(X25519, HKDF-SHA256), HKDF-SHA256,
  // ChaCha20-Poly1305. The raw 32-byte X25519 public key.
  bytes public_key = 1;

  // Names this key, so a sealed credential says which one it was sealed to.
  string key_id = 2;
}

// One credential, sealed to the Job's key. Only the Job can open it.
message SealedCredential {
  string key_id = 1;

  // HPKE's encapsulated key and the sealed value. The associated data is the
  // name of the field the credential fills, so one cannot be moved into
  // another's place.
  bytes encapsulated_key = 2;
  bytes ciphertext = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// W7.4, W7.5 — the answers
// ─────────────────────────────────────────────────────────────────────────────

// A Postgres server, and one role on it.
message DatabaseLogin {
  string host = 1;
  uint32 port = 2;
  string database = 3;
  string role = 4;
  SealedCredential password = 5;

  // As libpq names it; `verify-full` unless the administrator chose otherwise.
  string ssl_mode = 6;
}

// The runtime's database. The migrating role may create a table and the
// serving role may not; both may read and write. The test checks exactly
// that. The two may name the same server and database.
message RuntimeDatabaseAnswer {
  // The firm's own database: two logins it made, tested as they are.
  //
  // Fields 1 and 2 rather than inside the oneof below, because this is what
  // every deployment configured before 2026-09-23 answered with, and a
  // renumbering would make those unreadable for no gain.
  DatabaseLogin serving = 1;
  DatabaseLogin migrating = 2;

  // Or a database the deployment brings, which is what a fresh install has
  // and what somebody trying the product has (ruled 2026-09-23). Absent means
  // the two logins above.
  BroughtDatabase brought = 3;
}

// A Postgres the chart ships, started when somebody chooses it.
//
// It is rendered at zero replicas, and its claim comes from the StatefulSet's
// own volumeClaimTemplate -- so until this is chosen there is no claim and no
// disk, and when it is chosen the StatefulSet controller makes the claim
// rather than anything in the deployment (decisions/016). The wizard scales,
// which is a right the first-run Job already holds.
//
// For evaluation and development. It survives uninstalling the release, and it
// does not survive deleting the cluster or the namespace; nobody backs it up.
// A deployment somebody depends on points at a database they run themselves --
// their own Postgres, one in Docker, a managed one from a cloud -- and the
// wizard says all of that where the choice is made.
message BroughtDatabase {
  // What the runtime's two roles will be called. Their passwords are
  // generated in the cluster and never typed, so there is nothing here to
  // seal: a password nobody chose is a password nobody reuses.
  string serving_role = 1;
  string migrating_role = 2;

  // And the database they live in.
  string database = 3;
}

// How people sign in: one of three, each asking only about what the firm has
// (decisions/018). Nothing here names an identity server, because the
// deployment runs none -- it federates to the firm's provider, binds to their
// LDAP, or holds the accounts itself.
message LoginBackendAnswer {
  // The bundled identity server, with its version, database, egress ranges and
  // roles. Removed with it on 2026-09-25; never to be reused.
  reserved 1;
  reserved "bundled";

  oneof backend {
    OidcProviderAnswer oidc = 2;
    LdapDirectoryAnswer ldap = 3;
    LocalAccountAnswer local_account = 4;
  }
}

// The firm's own OpenID Connect provider. The dashboard federates to it and
// nothing of ours signs anybody in.
message OidcProviderAnswer {
  // Exactly as the provider states it in its discovery document: the
  // dashboard checks every token's `iss` against this string, and first run
  // reads the document before it passes the answer.
  string issuer = 1;
  string client_id = 2;

  // Absent for a public client, which PKCE makes safe.
  SealedCredential client_secret = 3;

  // The claim carrying a person's groups. Empty is `groups`.
  string groups_claim = 4;

  // Audiences besides the client id that an ID token may also name. Some
  // providers add the project the client belongs to, and a token naming an
  // audience not listed here is refused (OpenID Connect Core 3.1.3.7).
  repeated string trusted_audiences = 5;
}

// The firm's LDAP, bound to by the dashboard itself.
message LdapDirectoryAnswer {
  // A display name and a user object class, which configured the identity
  // server that used to broker LDAP. The filter below finds a person.
  reserved 1, 7;
  reserved "name", "user_object_class";

  // In order; the first that answers is used.
  repeated string servers = 2;

  // Upgrade an `ldap://` connection before anything is sent, so the bind and
  // every person's password are encrypted. An `ldaps://` address already is,
  // and asking for both is refused.
  bool start_tls = 3;

  // Where people are searched for, and who searches: an account that can
  // read people and their groups and nothing else.
  string base_dn = 4;
  string bind_dn = 5;
  SealedCredential bind_password = 6;

  // How a person is found from what they typed; `{}` is the name, escaped.
  // Empty is `(uid={})`.
  string user_filter = 8;
}

// An account this deployment holds, for a firm with no directory of its own:
// the first administrator's. First run hashes the password and the dashboard
// makes the account; nobody else ever sees the password.
message LocalAccountAnswer {
  string login_name = 1;
  string email = 2;
  string given_name = 3;
  string family_name = 4;
  SealedCredential initial_password = 5;
}

// The addresses a browser uses. In a cloud, from the listing's load balancer
// and DNS name; locally, `localhost` names the CLI port-forwards.
message AddressesAnswer {
  string dashboard_url = 1;

  // The identity server's own address. Removed with it; never to be reused.
  reserved 2;
  reserved "zitadel_url";
}

// Who holds deployment admin once the configuration is applied
// (spec/installation-and-first-run, requirement 13; decisions/017).
//
// Named here rather than claimed afterwards. Whoever answers this wizard has
// already chosen how people sign in, so a code standing between them and a
// permission they could take anyway is a ceremony; and where the deployment
// holds the account, the wizard was already asking for that administrator's
// login and password, so the same fact was established twice.
//
// What is written is an ordinary permission -- a user group naming this, and
// a permission from it to the built-in deployment-admin access group -- so it
// is audited by reading the same table as every other grant.
message AdministratorAnswer {
  oneof named {
    // A directory group whose members hold deployment admin. Onboarding then
    // stays a change in the firm's directory rather than in Meridian.
    //
    // Not checked against the directory, and the wizard says so rather than
    // implying otherwise: a provider asserts a person's groups inside their
    // own token rather than listing a directory's, and first run binds to
    // LDAP as an account that may read people, not enumerate every group. A
    // misspelled group is a deployment nobody can administer, recovered with
    // a claim code.
    string directory_group = 1;

    // The local account the wizard already creates, by its login.
    // Nothing is typed twice and nothing is matched later: the wizard makes
    // the account, so the deployment knows exactly whose it is.
    //
    // Naming an individual is possible only here. Everywhere else a person is
    // matched by the identity built at sign-in, which is the issuer and the
    // provider's subject joined, and nobody can state that before they have
    // signed in once ([[design/naming-a-person-before-they-sign-in]]).
    string local_account_login = 2;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// W7.2 — enrolling with a code entered in the wizard
// ─────────────────────────────────────────────────────────────────────────────

// A new enrolment code, handed to the conductor from the wizard's first page.
//
// Requirement 9: a code that expired or was already spent leaves a deployment
// running and unenrolled, and a new one is entered in the wizard with nothing
// reinstalled. It carries no session and can carry none -- a deployment with
// no key cannot sign, so nothing it might present could be checked, and the
// code is itself the credential, which is what it was designed to be.
//
// The reply is EnrolmentState: the same answer the wizard's first page already
// shows, so a retry and a page load cannot disagree about what happened.
message EnrolWithCodeRequest {
  string code = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// W7.4 — testing an answer
// ─────────────────────────────────────────────────────────────────────────────

message FirstRunCheckRequest {
  oneof answer {
    RuntimeDatabaseAnswer runtime_database = 1;
    LoginBackendAnswer login_backend = 2;
    AddressesAnswer addresses = 3;
    AdministratorAnswer administrator = 4;
  }
}

// A pass, or what failed. Each finding names the check and the fix, and never
// repeats a credential.
message FirstRunCheckReply {
  bool passed = 1;
  repeated string findings = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// W7.5 — applying the configuration
// ─────────────────────────────────────────────────────────────────────────────

// Every answer at once, each already tested. The Job tests them again before
// writing anything, because a test and an apply are separate moments.
message FirstRunConfiguration {
  RuntimeDatabaseAnswer runtime_database = 1;
  LoginBackendAnswer login_backend = 2;
  AddressesAnswer addresses = 3;

  // Required. A configuration that names nobody produces a deployment nobody
  // can administer, which is recoverable only with a claim code, so the Job
  // refuses it rather than writing it.
  AdministratorAnswer administrator = 4;
}

// What the Job did, step by step. Applying the same configuration again
// completes a partial one.
message FirstRunApplied {
  bool applied = 1;

  // Each step taken, in order: "secrets" (the database), "identity" (how
  // people sign in), "addresses", "restart", "rights released".
  repeated string steps = 2;

  // Why it stopped, when it did.
  string refusal_reason = 3;

  // Whether the Job has deleted its own binding. Only after every step
  // succeeded; until then the dashboard shows that the rights are still held.
  bool rights_released = 4;
}
