// Bringing a plugin into a deployment: its catalogue, and launching and
// stopping it.
//
// Derived from workflow W8 (spec/the-local-plugin-registry). Every message
// here traces to a matrix row; see matrix/matrix.tsv.
//
// A plugin arrives as an image, built on the developer's machine on a base
// image that carries a pinned SDK, and pushed through the dashboard into the
// deployment's own registry; its metadata arrives beside it. What it may do
// is extracted from that metadata when a deployment admin launches it, never
// written: its roles are a set from the fixed list in matrix/roles.tsv, and
// their grants are generated from the matrix (decisions/020). The conductor
// decides and records; the launcher only acts (decisions/019).

syntax = "proto3";

package meridian.v1;

// PluginDeclaration, which a plugin's SDK builds and its registration carries
// too, declared in meridian-schema's sidecar.proto (contract v11).
import "meridian/v1/sidecar.proto";
// A listing's prices (contract v27).
import "meridian/v1/amounts.proto";

// ─────────────────────────────────────────────────────────────────────────────
// W8.1 — an uploaded version
// ─────────────────────────────────────────────────────────────────────────────

// What a plugin says about itself, from `[tool.meridian]` in its
// pyproject.toml. Declarations for an administrator to approve, not grants.
message PluginMetadata {
  // Lowercase letters, digits and single hyphens, starting with a letter:
  // the name `meridian plugin new` gave it, and its repository in the
  // deployment's registry, plugins/<name>.
  string name = 1;
  // As its pyproject.toml has it. An uploaded version is never replaced.
  string version = 2;
  // A set, from matrix/roles.tsv, and never a component's name -- the
  // dashboard's among them (decisions/020). Empty is a plugin admitted with
  // no topics, as the reference plugin is.
  repeated string roles = 3;
  // Whether it serves a page through its sidecar (decisions/014).
  bool interface = 5;
  // The open-meridian version its base image carries, so an administrator
  // can see which plugins stand on a base that needs a fix.
  string sdk_version = 6;

  // What the version declares beside its roles (W8.1, contract v11): its
  // secret settings' names, what it does not carry, and the storage it asks
  // for. Read by the CLI from the built image, as the SDK builds it from the
  // plugin's code; shown in the catalogue and approved at launch. Unset for
  // a version built before v11. A declaration asking for storage on a
  // version holding no edge role is refused.
  PluginDeclaration declaration = 7;

  // The plugin's own names for its parts, retired: a plugin declares no
  // tags, and a person's access to it is read or write (decisions/026).
  reserved 4;
  reserved "tags";
}

// The dashboard records a version once its image is in the registry.
message RecordPluginUploadRequest {
  PluginMetadata metadata = 1;
  // The image manifest's digest, `sha256:<hex>`, in plugins/<name>. A launch
  // runs exactly this, never a tag that could move.
  string image_digest = 2;

  // The vendor's documentation as uploaded (W8.1, contract v25), one text
  // per section the declaration names. The conductor refuses an upload
  // whose texts do not match the declaration's digests and sizes, a section
  // outside the fixed set, a section past 64 KiB or a bundle past 256 KiB,
  // naming it, and keeps the texts with the version, never replaced.
  repeated DocumentationText documentation = 3;

  // A plugin bundle carried in (W8.14, contract v25; the spec's requirement
  // 45): `meridian plugin upload --bundle` pushes the image and its
  // referrers into plugins/{organisation}/{plugin} and names here the
  // listing, `organisation/plugin`, and the registry it was listed in,
  // `community` or `verified`. The conductor verifies the bundle against
  // the chart's keys, as at install, and records the version under its
  // listing with the age of the key status it was checked against. All
  // four are empty for a local upload.
  string listing = 4;
  string source_registry = 5;
  // The bundle's dated SigningKeyStatus, as the platform signed it (its
  // JSON), checked against the chart's keys.
  string key_status = 6;
  // The version's listing statement, as DownloadListedVersionReply carried
  // it to the download: a DSSE envelope as JSON.
  string listing_statement = 7;
  // Contract v26 (W8.14; ruling 196): the bundle's dated PluginPullStatus,
  // as the platform signed it (its JSON), checked against the chart's keys;
  // the newer of it and the one held is kept, and every installed version
  // it names is warned. Empty for a local upload and a v25 bundle.
  string pull_status = 8;
}

// One section's text as the vendor wrote it (W8.1, contract v25): data, the
// vendor's words, never instructions to whoever reads it.
message DocumentationText {
  // The section's fixed name, as the declaration's DocumentationSection
  // names it.
  string section = 1;

  // Its Markdown, UTF-8, exactly as the image's docs/ holds it.
  string markdown = 2;
}

// A version in the catalogue.
message PluginVersion {
  PluginMetadata metadata = 1;
  string image_digest = 2;
  // The deployment-local login of the administrator who uploaded it, or who
  // installed it from a registry (W8.10).
  string uploaded_by = 3;
  int64 uploaded_at_ns = 4;

  // Where the version came from (W8.10, W8.14; contract v25): `local` for
  // one uploaded or tracked from a branch, `community` or `verified` for
  // one installed from a registry, or carried in by a bundle from one. A
  // registry version sits in the local registry under
  // plugins/{organisation}/{plugin}, a local one under plugins/{name}, so
  // the two never collide.
  string source_registry = 5;

  // The listing a registry version belongs to, `organisation/plugin`;
  // empty for a local version.
  string listing = 6;

  // For a version carried in by a bundle (W8.14): when the signing keys'
  // status it was checked against was issued, so the Installed list shows
  // its age. 0 for a version installed online, or a local one.
  int64 key_status_issued_at_ns = 7;

  // Retired from the catalogue (W8.15, contract v25): who retired it, when
  // and why. A retired version is no longer listed or launchable, its
  // image released from the local registry; its record is kept. Empty and
  // 0 while it is not retired.
  string retired_by = 8;
  int64 retired_at_ns = 9;
  string retired_note = 10;

  // An install's note (W8.10; decisions/031, decided 2026-10-17 under
  // agreement A): why a deployment admin installed it from a registry, kept
  // with the install's record beside uploaded_by and shown with it. Empty
  // for a local upload and a bundle's, which carry none.
  string uploaded_note = 11;
}

// ─────────────────────────────────────────────────────────────────────────────
// W8.2 — the catalogue
// ─────────────────────────────────────────────────────────────────────────────

message PluginCatalogueRequest {}

// Every version uploaded and every launch, live or stopped.
message PluginCatalogue {
  repeated PluginVersion versions = 1;
  repeated PluginLaunch launches = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// W8.3 — launching
// ─────────────────────────────────────────────────────────────────────────────

// A deployment admin launches a version. The roles are the ones they were
// shown and approved, and the launch is refused unless they are exactly the
// version's metadata: an approval of something other than what runs is no
// approval.
message LaunchPluginRequest {
  string name = 1;
  string version = 2;
  // What it runs as, and what its sidecar's credential and grants are for.
  // Unique among the deployment's live plugins.
  string instance_id = 3;
  repeated string approved_roles = 4;
  // In the live shape, on a development deployment alone: the plugin runs
  // the files sent to it since, and the launcher refuses this anywhere else
  // (W8.3, spec/live-plugin-development).
  bool live = 6;

  // Why, kept with the launch's record (decisions/031; contract v17).
  // Through /mcp every launch carries one (W6.20).
  string note = 7;

  // Tags, retired with them (decisions/026).
  reserved 5;
  reserved "approved_tags";
}

enum PluginLaunchState {
  PLUGIN_LAUNCH_STATE_UNSPECIFIED = 0;
  // Recorded, and the launcher asked.
  PLUGIN_LAUNCH_STATE_LAUNCHED = 1;
  // Stopped by an administrator; its instance may be launched again.
  PLUGIN_LAUNCH_STATE_STOPPED = 2;
  // The launcher refused or failed, with the reason in `failure`.
  PLUGIN_LAUNCH_STATE_FAILED = 3;
}

// A launch, as the conductor records it.
message PluginLaunch {
  string instance_id = 1;
  string name = 2;
  string version = 3;
  string image_digest = 4;
  repeated string roles = 5;
  string launched_by = 7;
  int64 launched_at_ns = 8;
  PluginLaunchState state = 9;
  string stopped_by = 10;
  int64 stopped_at_ns = 11;
  string failure = 12;
  // Launched in the live shape (W8.3).
  bool live = 13;

  // The delegation the person who launched it acted through and its
  // client's name, and the same for the stop, as the dashboard stamped them
  // (contract v17). A launch or stop before v17 was made through the
  // terminal on a delegation that was not recorded: these are empty, and
  // the store keeps a gap record saying so (decisions/031).
  string acting_through_delegation = 14;
  string client_name = 15;
  string stopped_through_delegation = 16;
  string stopped_client_name = 17;

  // Why it was launched, as kept with the launch (contract v17): required
  // through /mcp; empty where none was given, and on every launch before
  // v17.
  string note = 18;

  // Why it was stopped, as kept with the stop (contract v17): required
  // through /mcp; empty while not stopped, where none was given, and on
  // every stop before v17.
  string stopped_note = 19;

  // The prepared change it was made from, where a person made it from one
  // (W6.27, W4.9; contract v20): empty otherwise, and before v20.
  string prepared_call_id = 20;
  // The same for the stop.
  string stopped_prepared_call_id = 21;

  // A deployment admin's keeping of the instance after its version was
  // pulled (W8.12, contract v25): unset while its version is not pulled,
  // or the pull is not yet acknowledged. The Summary's and the Installed
  // list's warning stands until the instance is stopped or this is set.
  PullAcknowledgement pull_acknowledgement = 22;

  // Tags, retired with them (decisions/026).
  reserved 6;
  reserved "tags";
}

// The conductor to the launcher: create this plugin, in the chart's plugin
// shape and no other.
message CreatePluginRequest {
  string instance_id = 1;
  // Always the deployment's own registry, by digest:
  // `localhost:<port>/plugins/<name>@sha256:<hex>`.
  string image = 2;
  repeated string roles = 3;
  bool interface = 5;
  // The chart's live shape rather than its plugin shape; refused by a
  // launcher on a deployment not installed for development.
  bool live = 6;

  // The version's declaration, as approved at launch (W8.3, contract v11):
  // the launcher gives the instance storage of its own where it asks for
  // it. Unset for a version uploaded with none, which gets storage by
  // holding an edge role, as before v11.
  PluginDeclaration declaration = 7;

  // The archive a deployment admin allowed the instance (W8.3, W8.7,
  // contract v16): the launcher gives it beside its storage, mounted at
  // MERIDIAN_ARCHIVE_DIR or, in a cloud, a bucket named in
  // MERIDIAN_ARCHIVE_BUCKET with a credential scoped to it. Unset or not
  // allowed, none.
  PluginArchive archive = 8;

  // Tags, retired with them (decisions/026).
  reserved 4;
  reserved "tags";
}

message CreatePluginReply {
  // The workload the launcher made, which it alone may later remove.
  string workload = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// W8.7 — an instance's archive, contract v16
// ─────────────────────────────────────────────────────────────────────────────

// A deployment admin allows an edge instance an archive, or changes its
// bound, from its Manage page; the conductor records it and restarts the
// instance through CreatePlugin carrying it.
message AllowArchiveRequest {
  string instance_id = 1;

  // The most bytes it may hold; 0 for no bound.
  uint64 most_bytes = 2;

  // Why, kept with the change's record (decisions/031; contract v17).
  // Through /mcp every change carries one (W6.20).
  string note = 3;
}

// A deployment admin withdraws it: the instance is restarted without it,
// and what it holds is kept until an admin removes it.
message WithdrawArchiveRequest {
  string instance_id = 1;

  // Why, kept with the change's record (decisions/031; contract v17).
  // Through /mcp every change carries one (W6.20).
  string note = 2;
}

// An instance's archive, as the conductor records it.
message PluginArchive {
  string instance_id = 1;

  // Allowed now; false once withdrawn.
  bool allowed = 2;

  // The most bytes it may hold; 0 for no bound.
  uint64 most_bytes = 3;

  // Who last allowed, changed or withdrew it, the deployment-local subject
  // the dashboard stamped, and when. Each is its own record (decisions/031).
  string updated_by = 4;
  int64 updated_at_ns = 5;

  // The delegation the person acted through and its client's name, as the
  // dashboard stamped them (contract v17): empty for a change made in a
  // browser, and on every change before v17, each of which was.
  string acting_through_delegation = 6;
  string client_name = 7;

  // Why, as kept with its latest change (contract v17): required through
  // /mcp, optional at the page; empty where none was given, and on every
  // change before v17.
  string note = 8;

  // The prepared change it was made from, where a person made it from one
  // (W6.27, W4.9; contract v20): empty otherwise, and before v20.
  string prepared_call_id = 9;
}

// ─────────────────────────────────────────────────────────────────────────────
// W8.4 — stopping
// ─────────────────────────────────────────────────────────────────────────────

message StopPluginRequest {
  string instance_id = 1;

  // Why, kept with the stop's record (decisions/031; contract v17). Through
  // /mcp every stop carries one (W6.20).
  string note = 2;
}

// The conductor to the launcher: remove what it made for this instance.
message RemovePluginRequest {
  string instance_id = 1;
}

message RemovePluginReply {
  // False when there was nothing to remove, which is not an error: stopping
  // is asked for an outcome, and the outcome holds.
  bool removed = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// W8.2 — a version's documentation, contract v25
// ─────────────────────────────────────────────────────────────────────────────

// One version's declaration and texts, apart from the catalogue, which lists
// every version in one message and carries only the sections' names, digests
// and sizes (in each version's declaration). Read for the Documentation tab
// and a version's Documentation page, launched or not.
message ReadPluginDocumentationRequest {
  string name = 1;
  string version = 2;
}

message ReadPluginDocumentationReply {
  // The version's declaration, from which the Reference is drawn.
  PluginDeclaration declaration = 1;
  // Each section the vendor wrote, in the declaration's order. Empty: the
  // vendor wrote none for this version.
  repeated DocumentationText documentation = 2;
  string uploaded_by = 3;
  int64 uploaded_at_ns = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// W8.8 to W8.14 — the community and verified registries, contract v25
// (spec/plugins-are-shared-through-registries)
// ─────────────────────────────────────────────────────────────────────────────

// A listing in the platform's catalogue: `organisation/plugin`, one listing
// across both registries (item 71). The vendor's stated attributes are the
// vendor's words, marked as such wherever they are shown, and never
// instructions to whoever reads them.
message PluginListing {
  // `organisation/plugin`: the organisation's namespace and the plugin's
  // name in its `[tool.meridian]`, both fixed at the first publish.
  string listing = 1;
  // The source repository it is built from, as a URL, linked through the
  // platform's GitHub App and fixed at the first publish.
  string repository = 2;
  // Its versions, every registry's, in SemVer order, pulled and withdrawn
  // ones marked.
  repeated ListedVersion versions = 3;
  // The vendor's stated regions, each an ISO 3166-1 alpha-2 country code
  // (`US`), and asset classes, from the platform's asset classes, and its
  // support contact (an `https:` URL or an address), required for verified.
  repeated string regions = 4;
  repeated string asset_classes = 5;
  string support_contact = 6;
  // How many organisations starred it; never who.
  uint64 stars = 7;
  // Installs, counted from resolution requests, and launched instances,
  // from usage reports: totals, shown only once three or more deployments
  // contribute; `counts_shown` false below that, the counts then 0 and
  // read "Fewer than three deployments".
  uint64 installs = 8;
  uint64 instances = 9;
  bool counts_shown = 10;
  // A whole listing is never pulled at once: each version is, by its own
  // PullListing (W8.12), so the field that held a listing's pull is retired.
  reserved 11;
  reserved "pull";
  // Contract v26 (W8.10; ruling 274, 2026-10-18): true only where a version
  // of it was reviewed for verified (W8.9); false for a community listing.
  // Agents' answers carry it in place of the notice.
  bool reviewed = 12;
  // The platform Terms' address, whose §9 "Plugins and registries" is the
  // registries' notice (ruling 278).
  string terms_url = 13;
  // Contract v26 (W8.10; ruling 306, 2026-10-18): the publishing
  // organisation's display name, filled in by the platform; Browse's
  // Publisher column reads it.
  string publisher = 14;
  // Contract v27 (W8.16; ruling 330, 2026-10-19): the support contact as two
  // fields, each validated as its kind, at least one required for
  // verified; support_contact is read as the one or the other during the
  // move, then retired.
  string support_url = 15;
  string support_email = 16;
  // Contract v27 (W8.20; spec/every-data-source-is-licensed-on-the-same-terms,
  // §3): the approved prices, one per dataset and meter (and per category
  // or professional status where its terms split them); never a proposal.
  repeated ListingPrice prices = 17;
  // Contract v28 (W8.16; sdk-contract/a-withdrawn-listing-names-its-successor-in-every-deployment):
  // the listing that replaces it, `<organisation>/<plugin>`; empty for none.
  // Additive: an older core ignores it.
  string replaced_by = 18;
}

// One version of a listing, in one registry.
message ListedVersion {
  string listing = 1;
  // SemVer 2.0, its release tag `v` and the version.
  string version = 2;
  // `community` or `verified`.
  string registry = 3;
  // What the builder built, by digest; the conductor installs this and
  // nothing else.
  string image_digest = 4;
  // The built image's metadata: roles, interface, SDK and declaration, its
  // documentation named by digest.
  PluginMetadata metadata = 5;
  // For verified, the roles the platform's review approved, from its
  // listing statement; a launch may approve no role beyond them. Empty for
  // community, whose roles are the declaration's, for the admin to approve.
  repeated string approved_roles = 6;
  // The version's floor: the contract version it declares, `v<N>`, which a
  // deployment's sidecar must serve.
  string schema_version = 7;
  // How it was built.
  PluginBuild build = 8;
  int64 listed_at_ns = 9;
  // Withdrawn by its vendor (W8.16): not offered for install or update,
  // still pullable by digest, with no warning to deployments running it.
  int64 withdrawn_at_ns = 10;
  // Its pull, unset while it is not pulled.
  PluginPull pull = 11;
  // Its place in the catalogue's sequence, which a pull after a sequence
  // reads from.
  uint64 sequence = 12;
  // The platform's signed listing statement (requirement 21), the same
  // document the image carries as an OCI referrer: a DSSE envelope as JSON
  // -- payloadType `application/vnd.in-toto+json`, payload the base64 of
  // an in-toto statement whose subject is image_digest and whose predicate
  // type is `https://open-meridian.dev/attestation/plugin-listing/v1`
  // (the registry, the time, and for verified the review and its approved
  // roles), and its signatures -- which the conductor verifies at download
  // and again at launch against the platform's keys the chart carries.
  // Empty only before the version is listed.
  string listing_statement = 13;
  // Contract v26 (W8.10; ruling 274): true for a verified version a person
  // reviewed (W8.9); false for community.
  bool reviewed = 14;
  // Contract v26 (W8.10; the v25 task's follow-ups): the vendor's texts,
  // one per section its declaration names by digest, so a listing's
  // Documentation tab before install draws them; checked against the
  // digests, never replaced.
  repeated DocumentationText documentation = 15;
}

// A build of a signed release tag by the platform's builder (W8.8; items 102,
// 103), followed by the CLI until the version is listed, queued for review
// or refused. A refused build carries no text of its own: why is the
// details of its findings at BUILD_FINDING_SEVERITY_BLOCKED. The repository
// and the builder are URLs.
message PluginBuild {
  string build_id = 1;
  string listing = 2;
  string version = 3;
  // `community` or `verified`, as the publish asked.
  string registry = 4;
  PluginBuildState state = 5;
  // What it was built from: the repository, the commit the tag pins, the
  // tag, and the fingerprint of the key that signed it.
  string repository = 6;
  string commit = 7;
  string tag = 8;
  string signer_fingerprint = 9;
  // The builder's identity, as its provenance names it.
  string builder = 10;
  // The image's digest once built; empty before.
  string image_digest = 11;
  // Each check's finding, in order: a refusal names the check that failed,
  // a warning is shown with the version.
  repeated BuildFinding findings = 12;
  // For community, the build's public log; empty for verified.
  string log_url = 13;
  int64 requested_at_ns = 14;
  int64 finished_at_ns = 15;
  // Contract v26 (W8.8; ruling 275): the platform's page for the build,
  // which `meridian plugin publish` prints; no client builds the address.
  string page_url = 16;
  // Contract v27 (W8.8; ruling 353): the display name the publish request
  // declared, shown on the publisher's row while it builds; empty from a CLI
  // before 0.1.50.
  string declared_title = 17;
}

enum PluginBuildState {
  PLUGIN_BUILD_STATE_UNSPECIFIED = 0;
  // Asked for, waiting for the builder.
  PLUGIN_BUILD_STATE_QUEUED = 1;
  // Checked out, verified and building, or being checked.
  PLUGIN_BUILD_STATE_BUILDING = 2;
  // Every automatic check passed and, for community, listed.
  PLUGIN_BUILD_STATE_LISTED = 3;
  // Every automatic check passed; a verified version waiting for review.
  PLUGIN_BUILD_STATE_IN_REVIEW = 4;
  // A check failed, named in findings; nothing is listed.
  PLUGIN_BUILD_STATE_REFUSED = 5;
}

// One automatic check's finding on a build (requirement 14).
message BuildFinding {
  // The check: the tag's signature, the repository and licence, the base
  // image, the dependency screen, a scan, the conformance suite, a cap, or
  // the declaration's and documentation's checks.
  string check = 1;
  BuildFindingSeverity severity = 2;
  // What it found, in words.
  string detail = 3;
}

enum BuildFindingSeverity {
  BUILD_FINDING_SEVERITY_UNSPECIFIED = 0;
  // Passed.
  BUILD_FINDING_SEVERITY_PASSED = 1;
  // Shown with the version; lists nothing less.
  BUILD_FINDING_SEVERITY_WARNING = 2;
  // Refused: nothing is listed.
  BUILD_FINDING_SEVERITY_BLOCKED = 3;
}

// A person's review of a verified version (W8.9), its decision its own
// record (decisions/031).
message PluginReview {
  string review_id = 1;
  string listing = 2;
  string version = 3;
  // Short when its roles and floor match the last approved version's,
  // full otherwise; never none.
  bool full = 4;
  PluginReviewDecision decision = 5;
  // The reviewer, a staff member holding REVIEW_PLUGINS, and when.
  string reviewer_person_id = 6;
  int64 decided_at_ns = 7;
  // What an approval approves: the roles and the floor.
  repeated string approved_roles = 8;
  string schema_version = 9;
  // The reason sent to the vendor.
  string reason = 10;
}

enum PluginReviewDecision {
  PLUGIN_REVIEW_DECISION_UNSPECIFIED = 0;
  // Waiting for a reviewer; an agent's proposal does not decide it.
  PLUGIN_REVIEW_DECISION_PENDING = 1;
  PLUGIN_REVIEW_DECISION_APPROVED = 2;
  // Lists nothing; the vendor fixes it in a new version.
  PLUGIN_REVIEW_DECISION_REFUSED = 3;
}

// An organisation's tag-signing key (W5.30): its public half only.
message SigningKeyRecord {
  string key_id = 1;
  // The organisation's namespace.
  string organisation = 2;
  // The organisation's name for the key.
  string name = 3;
  // The SSH public key, as `ssh-ed25519 AAAA...`, and its SHA-256
  // fingerprint as git and GitHub show it.
  string public_key = 4;
  string fingerprint = 5;
  int64 registered_at_ns = 6;
  string registered_by_person_id = 7;
  // A revocation: when, by whom, why, and the time after which nothing
  // built is trusted (item 74). 0 while it is active.
  int64 revoked_at_ns = 8;
  string revoked_by_person_id = 9;
  string revoke_reason = 10;
  int64 not_trusted_after_ns = 11;
}

// Every organisation's tag-signing keys, active and revoked, as a document
// the platform signs (requirement 26): the conductor pulls it with the
// catalogue and checks a version's signer against the latest it holds, and
// a bundle carries a dated copy.
message SigningKeyStatus {
  int64 issued_at_ns = 1;
  repeated SigningKeyRecord keys = 2;
  // The platform's signature over the document, checked against the
  // platform's public keys each chart release carries: base64 of an ECDSA
  // P-256 signature over DSSE's pre-authentication encoding (PAE) of the
  // payload type `application/vnd.open-meridian.signing-key-status+json`
  // and the body, this record's canonical JSON without `signature` -- the
  // DSSE convention in-toto and Sigstore use.
  string signature = 3;
}

// A pull of a listing or a version from the catalogue (W8.12), staff's act,
// its own record. A pull stops new installs and updates and warns installed
// copies; it never removes one.
message PluginPull {
  string listing = 1;
  // The one version pulled; never empty (W8.12).
  string version = 2;
  PullReasonKind kind = 3;
  // The reason, in words, as deployments and organisations are told it.
  string reason = 4;
  int64 pulled_at_ns = 5;
  // For a copyright notice's pull, the notice (W8.13).
  string notice_id = 6;
  // A restoration after a counter-notice (W8.13): when; 0 while it stands.
  int64 restored_at_ns = 7;
  // Contract v27 (W8.14; ruling 311): in a deployment's copy, the issue time
  // of the bundle's PluginPullStatus it came by; 0 for a pull learned at a
  // catalogue pull.
  int64 by_bundle_issued_at_ns = 8;
}

enum PullReasonKind {
  PULL_REASON_KIND_UNSPECIFIED = 0;
  // A breach of the Platform Terms.
  PULL_REASON_KIND_TERMS_BREACH = 1;
  // A copyright notice acted on (W8.13).
  PULL_REASON_KIND_COPYRIGHT_NOTICE = 2;
}

// A copyright notice under 17 U.S.C. §512, recorded by staff against a
// listing's versions (W8.13), with its counter-notice and what became of it.
// The sender's contact details are kept for staff and the publishing
// organisation alone.
message CopyrightNotice {
  string notice_id = 1;
  string listing = 2;
  // The versions, or digests, it names.
  repeated string versions = 3;
  repeated string image_digests = 4;
  // The date received, ISO 8601.
  string received_on = 5;
  // Each §512(c)(3) element present, by its paragraph, `i` to `vi`; a
  // notice missing one is incomplete and its sender told what is missing.
  repeated string elements_present = 6;
  bool complete = 7;
  string sender_name = 8;
  string sender_contact = 9;
  CopyrightNoticeState state = 10;
  // The counter-notice: the date received and each §512(g)(3) element
  // present, by its paragraph, `A` to `D`.
  string counter_received_on = 11;
  repeated string counter_elements_present = 12;
  // The restoration window, no sooner than 10 and no later than 14 business
  // days after the counter-notice, ISO 8601 dates.
  string restore_from = 13;
  string restore_until = 14;
  // A court action the sender filed, recorded by staff: the date, which
  // keeps the versions pulled.
  string court_action_on = 15;
}

enum CopyrightNoticeState {
  COPYRIGHT_NOTICE_STATE_UNSPECIFIED = 0;
  // Missing a §512(c)(3) element.
  COPYRIGHT_NOTICE_STATE_INCOMPLETE = 1;
  COPYRIGHT_NOTICE_STATE_RECORDED = 2;
  // Its versions pulled.
  COPYRIGHT_NOTICE_STATE_ACTED_ON = 3;
  // A counter-notice recorded; the restoration window open.
  COPYRIGHT_NOTICE_STATE_COUNTERED = 4;
  COPYRIGHT_NOTICE_STATE_RESTORED = 5;
}

// The plugin usage report (W5.19's carve-out; requirement 47): counts about
// each installed community or verified version, weekly. It names no person,
// account, instrument or local plugin.
message PluginUsageReport {
  // The week it covers, ISO 8601 dates, inclusive.
  string period_start = 1;
  string period_end = 2;
  repeated PluginUsageCount counts = 3;
}

// One installed registry version's counts over the week.
message PluginUsageCount {
  string listing = 1;
  string version = 2;
  string registry = 3;
  // Instances launched at the period's end.
  uint32 instances = 4;
  // People holding each level on any of its roles, at the period's end.
  uint32 people_read = 5;
  uint32 people_write = 6;
  uint32 people_admin = 7;
  // Seven daily counts, the period's first day first: operations its
  // sidecars carried, and page and tool requests.
  repeated uint64 daily_operations = 8;
  repeated uint64 daily_requests = 9;
}

// ── Platform HTTPS rows, CLI to platform (W8.8, W8.14, W5.30) ──────────────

// ── Platform HTTPS rows, the builder to platform (W8.8; decisions/022 as
// amended 2026-10-16, item 135): the builder presents its workflow's OIDC
// token and the build's one-time intake nonce. ─────────────────────────────

// The builder says it started: the build's public log, for community.
message RecordBuildStartedRequest {
  string build_id = 1;
  // The nonce the platform gave the build when it was asked for; spent at
  // the results.
  string intake_nonce = 2;
  string log_url = 3;
}

// The builder hands back what it built and what each check found -- one
// finding per check, the scan policy (plan Q4) applied in the builder -- and
// the platform checks them, then lists, queues for review or refuses. The
// provenance and the image's metadata are not in it: the platform reads
// them from the image's OCI 1.1 referrers, the builder's SLSA provenance
// and its plugin-metadata attestation
// (`https://open-meridian.dev/attestation/plugin-metadata/v1`).
message RecordBuildResultsRequest {
  string build_id = 1;
  string intake_nonce = 2;
  string image_digest = 3;
  repeated BuildFinding findings = 4;
}

message PublishPluginVersionRequest {
  // The organisation's namespace and the plugin's name.
  string organisation = 1;
  string plugin = 2;
  // `community` or `verified`.
  string registry = 3;
  // A repository linked through the platform's GitHub App, as its URL or
  // as owner/name; at a listing's first publish it becomes the listing's,
  // fixed, and is answered as a URL.
  string repository = 4;
  // The release tag, `v` and the SemVer version, signed by a registered,
  // active key of the organisation.
  string tag = 5;
  // Contract v27 (W8.8; ruling 353): the plugin's display name as the CLI
  // read it from the declaration, optional; the builder refuses the build
  // where the built image's declaration names another.
  string declared_title = 6;
}

message ReadPluginBuildRequest {
  string organisation = 1;
  string plugin = 2;
  string build_id = 3;
}

message RegisterSigningKeyRequest {
  string organisation = 1;
  string name = 2;
  string public_key = 3;
}

// The organisation's own keys, active and revoked (W5.30): its page and
// `meridian plugin key list`.
message ListSigningKeysRequest {
  string organisation = 1;
}

message ListSigningKeysReply {
  repeated SigningKeyRecord keys = 1;
  // Contract v26 (W5.30; ruling 262): the organisation's signing-key policy
  // in force.
  SigningKeyPolicy policy = 2;
}

// Which keys an organisation accepts (W5.30; ruling 262, 2026-10-18).
enum SigningKeyPolicy {
  // Read as any key.
  SIGNING_KEY_POLICY_UNSPECIFIED = 0;
  // Any SSH key git signs with: the default.
  SIGNING_KEY_POLICY_ANY = 1;
  // Hardware-backed keys only: `sk-ssh-ed25519@openssh.com`,
  // `sk-ecdsa-sha2-nistp256@openssh.com`.
  SIGNING_KEY_POLICY_HARDWARE_ONLY = 2;
  // Any key but a hardware-backed one.
  SIGNING_KEY_POLICY_DESKTOP_ONLY = 3;
}

// An Owner or Admin sets the organisation's signing-key policy (W5.30), a
// page act only. A tightening that would distrust registered keys is first
// answered with them listed and nothing changed; sent again with
// confirm_distrust, it sets each one's not_trusted_after to now, each its
// own record.
message SetSigningKeyPolicyRequest {
  string organisation = 1;
  SigningKeyPolicy policy = 2;
  string reason = 3;
  bool confirm_distrust = 4;
}

// The policy in force, each change its own record (decisions/031).
message SigningKeyPolicyRecord {
  string organisation = 1;
  SigningKeyPolicy policy = 2;
  int64 changed_at_ns = 3;
  string changed_by_person_id = 4;
  string reason = 5;
  // The keys a tightening distrusted, or would distrust where it was
  // answered as a warning (nothing changed then: changed_at_ns 0).
  repeated string distrusted_key_ids = 6;
}

message RevokeSigningKeyRequest {
  string organisation = 1;
  string key_id = 2;
  // Nothing built after it is trusted; at most now.
  int64 not_trusted_after_ns = 3;
  string reason = 4;
}

// ── Platform HTTPS rows, conductor to platform (W8.10, W8.11, W5.19) ───────

// The catalogue after a sequence: every listing changed since, with its
// versions, pulls and withdrawals, and the signing keys' status.
message PullCatalogueReply {
  repeated PluginListing listings = 1;
  // The latest sequence the answer holds, which the next pull reads after.
  uint64 sequence = 2;
  SigningKeyStatus key_status = 3;
  // Contract v26 (W8.10; ruling 274): the platform Terms' address, which
  // the install dialog's one line links.
  string terms_url = 4;
  // Contract v27 (W8.10; spec/starter-packs, requirement 14): every pack
  // whose catalogue record falls after the sequence asked, whole, at its
  // latest published revision; a v26 conductor ignores it.
  repeated PluginPack packs = 5;
}

// One resolution request per install or update (plan Q3), counted by the
// platform; also the CLI's bundle download (W8.14).
message DownloadListedVersionRequest {
  string listing = 1;
  string version = 2;
  string registry = 3;
}

message DownloadListedVersionReply {
  string image_digest = 1;
  // Where to pull it by digest: the repository in the platform's public
  // GitHub registry for community, in Artifact Registry for verified.
  string pull_from = 2;
  // For verified, a short-lived pull token; empty for community, whose
  // bytes are pulled anonymously.
  string pull_token = 3;
  int64 pull_token_expires_at_ns = 4;
  // The version's signed listing statement, as ListedVersion.listing_statement
  // carries it: a DSSE envelope as JSON. The conductor verifies it at
  // download and keeps it with the version for launch; the CLI's bundle
  // download verifies it and writes it into the bundle (W8.14), since a
  // verified version's statement is not a referrer the platform can push.
  string listing_statement = 5;
  // Contract v26 (W8.14; ruling 196): every pulled version in the catalogue,
  // dated and signed, which the CLI writes into the bundle.
  PluginPullStatus pull_status = 6;
}

// Every pulled version in the catalogue, as a document the platform signs
// (W8.14, contract v26), so an air-gapped deployment is warned of a pull by
// a later bundle: as SigningKeyStatus is for keys.
message PluginPullStatus {
  int64 issued_at_ns = 1;
  // Each pull standing or restored, by listing and version.
  repeated PluginPull pulls = 2;
  // The platform's signature: base64 of an ECDSA P-256 signature over
  // DSSE's pre-authentication encoding of the payload type
  // `application/vnd.open-meridian.plugin-pull-status+json` and the body,
  // this record's canonical JSON without `signature`.
  string signature = 3;
}

message ReportPluginUsageReply {
  int64 received_at_ns = 1;
}

// ── Platform HTTPS rows, a person or staff to platform (W8.9, W8.12, W8.13,
// W8.16, W5.32) ────────────────────────────────────────────────────────────

message ReviewPluginVersionRequest {
  string review_id = 1;
  PluginReviewDecision decision = 2;
  // On an approval, the roles approved, no wider than the declaration's.
  repeated string approved_roles = 3;
  string reason = 4;
}

// A person holding REVIEW_PLUGINS accepts or rejects an agent's proposal --
// a review, a pull, a copyright pull or a restoration (W8.9, W8.12, W8.13).
// Accepting makes the act as that person, its own record.
message DecideRegistryProposalRequest {
  string proposal_id = 1;
  bool accept = 2;
  string note = 3;
}

message DecideRegistryProposalReply {
  string proposal_id = 1;
  bool accepted = 2;
  int64 decided_at_ns = 3;
}

message PullListingRequest {
  string listing = 1;
  // One version, required: pulling a whole listing, or the several versions
  // a copyright notice names, is one request per version, each its own
  // record (decisions/031; W8.12, W8.13).
  string version = 2;
  PullReasonKind kind = 3;
  string reason = 4;
  // For a copyright notice's pull, the notice it acts on.
  string notice_id = 5;
}

message StarPluginRequest {
  string listing = 1;
  // True stars it, once per organisation; false takes the star back.
  bool starred = 2;
  // The organisation starring, one the person is an Owner or Admin of with
  // an enrolled deployment: a person may belong to several, and a star is
  // one per organisation.
  string organisation_id = 3;
}

message StarPluginReply {
  // Whether this organisation's star stands, and the listing's count.
  bool starred = 1;
  uint64 stars = 2;
}

message SetPluginAttributesRequest {
  string organisation = 1;
  string plugin = 2;
  repeated string regions = 3;
  repeated string asset_classes = 4;
  // Read during the move as support_url or support_email by its form;
  // refused beside either.
  string support_contact = 5;
  // Contract v27 (W8.16; ruling 330): an `https:` URL, and an address, each
  // refused INVALID_ARGUMENT naming it where it is not of its kind.
  string support_url = 6;
  string support_email = 7;
}

message WithdrawListedVersionRequest {
  string organisation = 1;
  string plugin = 2;
  string version = 3;
  string reason = 4;
}

message SetMayPublishRequest {
  string organisation = 1;
  string plugin = 2;
  string person_id = 3;
  // True grants the permission, false withdraws it.
  bool may_publish = 4;
}

message SetMayPublishReply {
  // Who holds it on the plugin now, beside the organisation's Owners and
  // Admins.
  repeated string person_ids = 1;
}

message RecordCopyrightNoticeRequest {
  string listing = 1;
  repeated string versions = 2;
  repeated string image_digests = 3;
  string received_on = 4;
  repeated string elements_present = 5;
  string sender_name = 6;
  string sender_contact = 7;
}

message RecordCounterNoticeRequest {
  string notice_id = 1;
  string received_on = 2;
  repeated string elements_present = 3;
}

message RecordCourtActionRequest {
  string notice_id = 1;
  string filed_on = 2;
}

message RestoreListedVersionRequest {
  string notice_id = 1;
  string reason = 2;
}

message SetCopyrightAgentFiledRequest {
  // True turns the process on, which needs every detail below; false turns
  // it off.
  bool filed = 1;
  string agent_name = 2;
  string agent_address = 3;
  string registration_number = 4;
  string registration_date = 5;
  string reason = 6;
}

message SetCopyrightAgentFiledReply {
  bool filed = 1;
  string agent_name = 2;
  string agent_address = 3;
  string registration_number = 4;
  string registration_date = 5;
  int64 changed_at_ns = 6;
  string changed_by_person_id = 7;
}

// ── Deployment bus rows, dashboard to conductor (W8.10 to W8.12, W8.15,
// W5.19) ────────────────────────────────────────────────────────────────────

// Browse and a listing's page, read from the conductor's latest copy of the
// catalogue, so the platform is never reached in a page's request.
message ListRegistryPluginsRequest {
  // Words matched against the listing's name and the vendor's text.
  string search = 1;
  // `community` or `verified`; empty for both.
  string registry = 2;
  // A role from matrix/roles.tsv; empty for any.
  string role = 3;
  // One listing, `organisation/plugin`, for its page; empty for the list.
  string listing = 4;
  int32 page_size = 5;
  string cursor = 6;
  // Pull the catalogue first ("Pull now"), then answer.
  bool pull_now = 7;
}

message ListRegistryPluginsReply {
  repeated PluginListing listings = 1;
  string next_cursor = 2;
  // When the conductor last pulled the catalogue.
  int64 catalogue_pulled_at_ns = 3;
}

// A deployment admin installs a listed version: resolved, pulled by digest
// into the local registry with its referrers, verified, and recorded. Install
// launches nothing.
message InstallPluginRequest {
  string listing = 1;
  string version = 2;
  string registry = 3;
  // Why, kept with the install's record. Through /mcp every install
  // carries one.
  string note = 4;
  // Contract v27 (W8.10, W8.18; spec/starter-packs, requirement 18): the pack
  // whose install made it, `organisation/pack`; empty for one listing's.
  string pack = 5;
}

// Moves an instance to a newer version from its source registry, or a local
// version's instance to a listed version of the same plugin (W8.11).
message UpdatePluginRequest {
  string instance_id = 1;
  string listing = 2;
  string version = 3;
  // The roles as approved, exactly the version's (for verified, its
  // platform-approved roles); a widening waits for this approval.
  repeated string approved_roles = 4;
  string note = 5;
}

// A deployment admin keeps an instance whose version was pulled (W8.12).
message AcknowledgePullRequest {
  string instance_id = 1;
  string note = 2;
}

// Kept on the launch, its own record.
message PullAcknowledgement {
  // The pull it acknowledges.
  PluginPull pull = 1;
  string acknowledged_by = 2;
  int64 acknowledged_at_ns = 3;
  string acting_through_delegation = 4;
  string client_name = 5;
  string note = 6;
}

// A deployment admin retires an uploaded or installed version (W8.15): it
// leaves the catalogue and its image is released, unless an instance runs it
// or a record names it, which refuses it naming them.
message RetirePluginVersionRequest {
  string name = 1;
  string version = 2;
  string note = 3;
}

// The plugin usage report's setting (W5.19): on by default.
message SetReportsPluginUsageRequest {
  bool reports_plugin_usage = 1;
  string reason = 2;
}

message ReportsPluginUsageSetting {
  bool reports_plugin_usage = 1;
}

// The Registries tab: the reports sent, the setting in force and the
// catalogue's age.
message ListPluginUsageReportsRequest {
  int32 page_size = 1;
  string cursor = 2;
}

message ListPluginUsageReportsReply {
  repeated SentPluginUsageReport reports = 1;
  string next_cursor = 2;
  bool reports_plugin_usage = 3;
  int64 catalogue_pulled_at_ns = 4;
}

// A plugin usage report the conductor sent, kept on the deployment as its
// own record.
message SentPluginUsageReport {
  int64 sent_at_ns = 1;
  // Whether the platform received it.
  bool received = 2;
  PluginUsageReport report = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// Contract v27: starter packs (W8.17 to W8.19; spec/starter-packs, its names
// approved 2026-10-19 with rulings 400 to 414)
// ─────────────────────────────────────────────────────────────────────────────

// A starter pack in the platform's catalogue: a curated list of listings for
// one kind of trading, never a merged plugin (336).
message PluginPack {
  // `organisation/pack`: the curator's namespace and the pack's DNS label,
  // fixed at its first publish.
  string pack = 1;
  // The curating organisation's display name.
  string curator = 2;
  // Its latest published revision, immutable.
  PackRevision revision = 3;
  // When its curator withdrew it; 0 while it stands.
  int64 withdrawn_at_ns = 4;
  // Its place in the catalogue's sequence.
  uint64 sequence = 5;
}

// A published revision of a pack, never changed afterwards (requirement 4).
message PackRevision {
  // From 1.
  uint64 revision = 1;
  string title = 2;
  // At most 280 characters.
  string description = 3;
  // From the platform's closed list of asset classes.
  repeated string asset_classes = 4;
  // In the curator's order.
  repeated PackMember members = 5;
  // The reviewer's note.
  string note = 6;
  int64 published_at_ns = 7;
}

// One member of a pack (requirement 3).
message PackMember {
  // `organisation/plugin`.
  string listing = 1;
  // `community` or `verified`, never local.
  string registry = 2;
  PackSelection selection = 3;
  // Its group label on the install sheet: "Data", "Brokers".
  string group = 4;
  // A listed version of the listing: the floor it tracks its latest above.
  string minimum_version = 5;
}

// How a member is offered on the install sheet (requirement 3; Debian's
// Depends, Recommends and Suggests).
enum PackSelection {
  PACK_SELECTION_UNSPECIFIED = 0;
  // Ticked and fixed.
  PACK_SELECTION_REQUIRED = 1;
  // Ticked; the deployment admin may untick it.
  PACK_SELECTION_PRESELECTED = 2;
  // Unticked; the deployment admin may tick it.
  PACK_SELECTION_CHOOSE = 3;
}

// W8.17: staff publish a pack's next revision after its review.
message PublishPluginPackRequest {
  string organisation = 1;
  string pack = 2;
  string title = 3;
  string description = 4;
  repeated string asset_classes = 5;
  repeated PackMember members = 6;
  string note = 7;
}

// W8.17: staff withdraw a pack, or restore one withdrawn.
message WithdrawPluginPackRequest {
  string organisation = 1;
  string pack = 2;
  // True restores a withdrawn pack.
  bool restore = 3;
  string note = 4;
}

// W8.18: Browse's pack view, read from the conductor's copy of the catalogue.
message ListRegistryPacksRequest {
  // Words matched against the pack's title and description.
  string search = 1;
  // One pack, `organisation/pack`; empty for the list.
  string pack = 2;
  int32 page_size = 3;
  string cursor = 4;
  // Pull the catalogue first, then answer.
  bool pull_now = 5;
}

message ListRegistryPacksReply {
  repeated PluginPack packs = 1;
  string next_cursor = 2;
  int64 catalogue_pulled_at_ns = 3;
}

// W8.18: install a pack, the ticked members one by one as a job.
message InstallPackRequest {
  string pack = 1;
  // The revision the sheet showed; another is refused FAILED_PRECONDITION
  // naming it.
  uint64 revision = 2;
  // The members ticked, by listing; a name not a member is refused
  // INVALID_ARGUMENT naming it before anything moves.
  repeated string members = 3;
  string note = 4;
}

// The pack job, and each member's outcome so far.
message PackInstall {
  string pack = 1;
  uint64 revision = 2;
  repeated PackMemberStatus members = 3;
}

// W8.19: a pack's page.
message ReadPackRequest {
  string pack = 1;
}

// An installed pack's status: the setup checklist (339).
message PackStatus {
  string pack = 1;
  // The revision installed, and the catalogue's latest.
  uint64 installed_revision = 2;
  uint64 latest_revision = 3;
  // Withdrawn by its curator.
  bool withdrawn = 4;
  repeated PackMemberStatus members = 5;
}

// One member's state in this deployment.
message PackMemberStatus {
  string listing = 1;
  string group = 2;
  // Installed here, and the latest offered at or above the minimum; empty
  // when none.
  string installed_version = 3;
  string latest_version = 4;
  PackMemberState state = 5;
  // Why, for failed, unavailable or not permitted, in words.
  string reason = 6;
  repeated string instance_ids = 7;
  // The instance's "Setting up" next step, in its words.
  string setup = 8;
  // The revision that added it, where after the installed one; the
  // revision that removed it, where it is no longer in the pack.
  uint64 added_by_revision = 9;
  uint64 removed_by_revision = 10;
}

enum PackMemberState {
  PACK_MEMBER_STATE_UNSPECIFIED = 0;
  PACK_MEMBER_STATE_NOT_INSTALLED = 1;
  PACK_MEMBER_STATE_INSTALLING = 2;
  PACK_MEMBER_STATE_FAILED = 3;
  PACK_MEMBER_STATE_INSTALLED = 4;
  PACK_MEMBER_STATE_LAUNCHED = 5;
  // No offered version at or above its minimum.
  PACK_MEMBER_STATE_UNAVAILABLE = 6;
  // Its floor not met, or a registry this deployment does not take.
  PACK_MEMBER_STATE_NOT_PERMITTED = 7;
}

// W8.19: update every launched member to its own latest.
message UpdatePackRequest {
  string pack = 1;
  string note = 2;
}

// W8.19: remove the deployment's pack record; no member is touched.
message RemovePackRequest {
  string pack = 1;
  string note = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// Contract v27: a listing's prices (W8.20;
// spec/every-data-source-is-licensed-on-the-same-terms, §3)
// ─────────────────────────────────────────────────────────────────────────────

// One price on a listing: one dataset's meter, and its category or
// professional status where the dataset's terms split by one.
message ListingPrice {
  // The catalogue key of the dataset it prices.
  string dataset = 1;
  LicenceMeter meter = 2;
  // For non-display split by category; unspecified otherwise.
  NonDisplayCategory category = 3;
  // For display split by professional status; unspecified otherwise.
  ProfessionalStatus professional = 4;
  Money amount = 5;
  PricePeriod period = 6;
  repeated PriceTier tiers = 7;
  TierMode tier_mode = 8;
  // Per person or per deployment, by the meter; unset for none.
  Money cap = 9;
  // ISO 8601: when an approved price takes effect.
  string effective_from = 10;
  // The notice the vendor gives of a change, in days.
  uint32 notice_days = 11;
}

// One tier: from and to count the meter's units, inclusive; to 0 is open.
message PriceTier {
  uint32 from = 1;
  uint32 to = 2;
  Money amount = 3;
}

enum PricePeriod {
  PRICE_PERIOD_UNSPECIFIED = 0;
  PRICE_PERIOD_MONTH = 1;
  PRICE_PERIOD_YEAR = 2;
}

enum TierMode {
  TIER_MODE_UNSPECIFIED = 0;
  // Each tier prices its own slice.
  TIER_MODE_BRACKET = 1;
  // The tier reached prices everything.
  TIER_MODE_WHOLE = 2;
}

// A display price's professional status, where the terms split by it.
enum ProfessionalStatus {
  PROFESSIONAL_STATUS_UNSPECIFIED = 0;
  PROFESSIONAL_STATUS_PROFESSIONAL = 1;
  PROFESSIONAL_STATUS_NON_PROFESSIONAL = 2;
}

// W8.20: a vendor's proposed prices, staff's to approve or reject.
message ListingPriceProposal {
  string proposal_id = 1;
  // `organisation/plugin`.
  string listing = 2;
  repeated ListingPrice prices = 3;
  ListingPriceProposalState state = 4;
  string note = 5;
  string proposed_by = 6;
  int64 proposed_at_ns = 7;
  string decided_by = 8;
  int64 decided_at_ns = 9;
  string decision_note = 10;
}

enum ListingPriceProposalState {
  LISTING_PRICE_PROPOSAL_STATE_UNSPECIFIED = 0;
  LISTING_PRICE_PROPOSAL_STATE_PROPOSED = 1;
  LISTING_PRICE_PROPOSAL_STATE_APPROVED = 2;
  LISTING_PRICE_PROPOSAL_STATE_REJECTED = 3;
}

// W8.20: an Owner or Admin proposes the listing's prices, whole.
message ProposeListingPricesRequest {
  string organisation = 1;
  string plugin = 2;
  repeated ListingPrice prices = 3;
  string note = 4;
}

// W8.20: staff approve or reject a proposal, with a note.
message ReviewListingPricesRequest {
  string proposal_id = 1;
  bool approve = 2;
  string note = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// Contract v27: a session's latency and a hop's data age (W4.16;
// spec/sessions-and-data-report-their-latency-and-quality, rulings 415 to 427)
// ─────────────────────────────────────────────────────────────────────────────

// 1 to 500 snapshots, every 10 seconds, to core's monitor.
message ReportLatencyRequest {
  repeated LatencySnapshot snapshots = 1;
}

message ReportLatencyReply {
  uint32 accepted = 1;
}

// One histogram snapshot over an interval: a session's metric, or a dataset's
// age at a hop.
message LatencySnapshot {
  int64 interval_start_ns = 1;
  int64 interval_ns = 2;
  // The session, by the plugin's own name for it; empty for a dataset's.
  string session = 3;
  // The dataset, `instance:key`, and the hop; empty and unspecified for a
  // session's.
  string dataset = 4;
  AgeHop hop = 5;
  LatencyMetric metric = 6;
  LatencyHistogram histogram = 7;
  LatencyCounters counters = 8;
  // The source's clock minus ours, corrected by half the round trip.
  int64 clock_skew_ns = 9;
  // The session's last message or heartbeat.
  int64 alive_at_ns = 10;
  // The absolute ceilings in force, as the plugin's settings hold them.
  LatencyCeilings ceilings = 11;
  // The reporting instance, stamped by its sidecar.
  string instance_id = 12;
}

enum LatencyMetric {
  LATENCY_METRIC_UNSPECIFIED = 0;
  // Round trip: FIX TestRequest to its Heartbeat, a WebSocket ping to its
  // pong, a REST call's duration.
  LATENCY_METRIC_RTT = 1;
  // Connectivity: placement sent to the venue's acknowledgement.
  LATENCY_METRIC_ORDER_ACK = 2;
  // Connectivity: the venue's transaction time to the fill received.
  LATENCY_METRIC_FILL_DELAY = 3;
  // A dataset's age at a hop.
  LATENCY_METRIC_AGE = 4;
}

// Where a dataset's age is measured.
enum AgeHop {
  AGE_HOP_UNSPECIFIED = 0;
  // The data plugin, on parsing the vendor's message: the feed delay.
  AGE_HOP_EDGE = 1;
  AGE_HOP_SIDECAR = 2;
  AGE_HOP_LAKE = 3;
  AGE_HOP_BUS = 4;
  AGE_HOP_ANALYTICS = 5;
  // The `ems`, at its pre-trade check.
  AGE_HOP_EMS_CHECK = 6;
  AGE_HOP_PAGE = 7;
}

// A sparse log-linear histogram, HdrHistogram's layout (ruling 416).
message LatencyHistogram {
  int64 lowest_ns = 1;
  // 2 in v27.
  uint32 significant_digits = 2;
  repeated LatencyBucket buckets = 3;
  int64 min_ns = 4;
  int64 max_ns = 5;
  // Values recorded in the interval.
  uint64 total = 6;
}

// One bucket with a count; empty buckets are not sent.
message LatencyBucket {
  uint32 bucket = 1;
  uint64 count = 2;
}

// A session's congestion in the interval.
message LatencyCounters {
  uint64 gaps = 1;
  uint64 resends = 2;
  uint64 reconnects = 3;
  uint64 rate_limited = 4;
  // Messages queued to send, at their peak.
  uint64 backlog_peak = 5;
}

// The plugin admin's session_ceilings for the connection, in force; 0 is no
// ceiling.
message LatencyCeilings {
  int64 rtt_p99_ns = 1;
  int64 order_ack_p99_ns = 2;
  int64 fill_delay_p99_ns = 3;
  int64 feed_delay_p99_ns = 4;
  int64 clock_skew_max_ns = 5;
  uint32 gaps_per_hour = 6;
  uint32 reconnects_per_hour = 7;
  uint32 backlog_max = 8;
}
