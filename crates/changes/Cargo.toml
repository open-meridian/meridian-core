[package]
name = "meridian-changes"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The change log each Meridian store keeps: its pages, its tail, its fence, and the log a store captures in Postgres"

[dependencies]
meridian-bus = { path = "../bus" }
meridian-clock.workspace = true
meridian-domain.workspace = true
postgres.workspace = true
prost.workspace = true
# Integrity at rest (step 3b): each change's digest, and the scrub's report.
sha2.workspace = true
serde_json.workspace = true
# The tail's pages, compressed (ruling 1062): LZ4's block format, in safe
# Rust, with no other dependency; the frame format is not needed.
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
tracing.workspace = true
# A store's pool's watch on its database's timeline (contract v30, stage C):
# each connection it opens reads the database's identity.
r2d2.workspace = true
# Internal TLS (ruling 1084): the one Postgres connector (`tls`).
rustls.workspace = true
tokio-postgres-rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
