[package]
name = "meridian-budget"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A component's working memory (stage M): its budget, each request's reservation, the overload refusal, fair shares per caller, and the shed line"

# Nothing of any component's: every component and the bus depend on this.
[dependencies]
tokio = { workspace = true }
tracing.workspace = true

# malloc_trim, to hand glibc's free memory back to the system (ruling 957;
# the resilience spec's section 10a). No allocator change (959).
[target.'cfg(target_env = "gnu")'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
