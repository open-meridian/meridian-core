[package]
name = "meridian-conductor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The deployment's end of the link to the platform: the key, the connection, and what it carries"

[dependencies]
meridian-clock.workspace = true
meridian-domain.workspace = true
meridian-bus = { path = "../bus" }
meridian-symbology = { path = "../symbology" }
prost.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
rand.workspace = true
reqwest.workspace = true
# A listed version's bytes checked against their digests as they are copied
# (oci.rs, contract v25). Already in the tree.
sha2.workspace = true
async-trait.workspace = true
tokio = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
