[package]
name = "meridian-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A deployment's components: the street store, the book of record, the lake, the instrument store, the conductor, the analytics component and a plugin's sidecar"

[lib]
name = "meridian_runtime"
path = "src/lib.rs"

[[bin]]
name = "meridian-street"
path = "src/bin/street.rs"

[[bin]]
name = "meridian-bor"
path = "src/bin/bor.rs"

[[bin]]
name = "meridian-lake"
path = "src/bin/lake.rs"

[[bin]]
name = "meridian-instrument"
path = "src/bin/instrument.rs"

[[bin]]
name = "meridian-sidecar"
path = "src/bin/sidecar.rs"

[[bin]]
name = "meridian-conductor"
path = "src/bin/conductor.rs"

[[bin]]
name = "meridian-dashboard"
path = "src/bin/dashboard.rs"

[[bin]]
name = "meridian-broker-config"
path = "src/bin/broker_config.rs"

[[bin]]
name = "meridian-first-run"
path = "src/bin/first_run.rs"

[[bin]]
name = "meridian-launcher"
path = "src/bin/launcher.rs"

# The analytics component (contract v26, W12): its own image's one binary.
[[bin]]
name = "meridian-analytics"
path = "src/bin/analytics.rs"


[dependencies]
meridian-clock.workspace = true
meridian-budget.workspace = true
meridian-bus = { path = "../bus" }
meridian-instrument = { path = "../instrument" }
meridian-street = { path = "../street" }
meridian-bor = { path = "../bor" }
meridian-lake = { path = "../lake" }
meridian-changes = { path = "../changes" }
meridian-conductor = { path = "../conductor" }
meridian-config = { path = "../config" }
meridian-dashboard = { path = "../dashboard" }
meridian-first-run = { path = "../first-run" }
meridian-analytics = { path = "../analytics" }
meridian-analytics-engine = { path = "../analytics-engine" }
axum.workspace = true
# A plugin's front door over TLS where internal TLS is on (ruling 1084):
# the connections axum's own server takes, behind a TLS handshake. Both in
# the tree already, through reqwest and axum.
tokio-rustls.workspace = true
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service", "http1", "http2"] }
meridian-sidecar = { path = "../sidecar" }
meridian-pb.workspace = true
meridian-domain.workspace = true
postgres.workspace = true
serde_json.workspace = true
# A writer's lease, a Kubernetes Lease in its own namespace (step 3b), over
# the in-cluster API with the pod's service account, as first run reaches it.
reqwest.workspace = true
rand.workspace = true
# The broker checks a launched plugin's password against a hash of it, so
# the configuration it reloads holds no password (the registry spec, decision 3).
bcrypt.workspace = true
# To have the broker, this process's own child, reload.
libc.workspace = true
prost.workspace = true
tonic.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
prost.workspace = true
# The lease's election over a simulated network, in virtual time, with
# links cut and held on a seeded schedule (ruling 1105).
turmoil = "0.6"
# turmoil's network seeded per run, so a seed is the same run every time.
rand = { version = "0.8", features = ["small_rng"] }
# Signing a deployment admin's assertion, as the dashboard does, and reading
# the plugin's scope stream, in the wiring test.
ed25519-dalek.workspace = true
tokio-stream.workspace = true
