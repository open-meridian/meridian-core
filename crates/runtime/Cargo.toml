[package]
name = "meridian-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A deployment's components: the street store, the instrument store, the conductor and a plugin's sidecar"

[lib]
name = "meridian_runtime"
path = "src/lib.rs"

[[bin]]
name = "meridian-street"
path = "src/bin/street.rs"

[[bin]]
name = "meridian-instrument"
path = "src/bin/instrument.rs"

[[bin]]
name = "meridian-sidecar"
path = "src/bin/sidecar.rs"

[[bin]]
name = "meridian-conductor"
path = "src/bin/conductor.rs"

[[bin]]
name = "meridian-dashboard"
path = "src/bin/dashboard.rs"

[[bin]]
name = "meridian-broker-config"
path = "src/bin/broker_config.rs"

[[bin]]
name = "meridian-first-run"
path = "src/bin/first_run.rs"

[[bin]]
name = "meridian-group-hook"
path = "src/bin/group_hook.rs"

[dependencies]
meridian-bus = { path = "../bus" }
meridian-instrument = { path = "../instrument" }
meridian-street = { path = "../street" }
meridian-conductor = { path = "../conductor" }
meridian-config = { path = "../config" }
meridian-dashboard = { path = "../dashboard" }
meridian-first-run = { path = "../first-run" }
meridian-group-hook = { path = "../group-hook" }
axum.workspace = true
meridian-sidecar = { path = "../sidecar" }
meridian-pb.workspace = true
meridian-domain.workspace = true
postgres.workspace = true
serde_json.workspace = true
prost.workspace = true
tonic.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
prost.workspace = true
