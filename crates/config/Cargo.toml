[package]
name = "meridian-config"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The conductor's configuration store: accounts, access and plugin settings a deployment admin authors"

[dependencies]
meridian-clock.workspace = true
rand.workspace = true
# Secret settings are sealed before they are written (crate::sealing).
chacha20poly1305.workspace = true
# The settings key is made in the cluster by a Job, with first run's narrow
# rights over one named Secret (decisions/016).
meridian-first-run = { path = "../first-run" }
meridian-access.workspace = true
meridian-bus = { path = "../bus" }
meridian-domain.workspace = true
meridian-pb.workspace = true
# The deployment's fixed roles and components, which an upload's are held to
# (decisions/020), compiled in as the sidecar's are.
meridian-sidecar = { path = "../sidecar" }
prost.workspace = true
# A version's documentation held to the digests its declaration names (W8.1,
# contract v25). Already in the tree.
sha2.workspace = true
hex.workspace = true
# What the conductor installs from a registry, verified offline against the
# platform's keys (registries::verify, contract v25): ECDSA P-256 over DSSE,
# the platform's canonical JSON. Each already in the tree.
ring.workspace = true
base64.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
postgres.workspace = true
r2d2.workspace = true
r2d2_postgres.workspace = true
tokio = { workspace = true }

[dev-dependencies]
async-trait.workspace = true
postgres.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
