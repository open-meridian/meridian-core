description = "The deployment's one address: sign-in, access, and the pages that administer it"

[dependencies]
meridian-access.workspace = true
meridian-bus = { path = "../bus" }
meridian-domain.workspace = true
meridian-first-run = { path = "../first-run" }
axum.workspace = true
http.workspace = true
openidconnect.workspace = true
ldap3.workspace = true
argon2.workspace = true
postgres.workspace = true
r2d2.workspace = true
r2d2_postgres.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
prost.workspace = true
rand.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
