# What `make advisories` checks, and every exception to it with its reason.
#
# Only advisories: licences and bans are other questions. An exception here is
# a decision, so each one names the advisory, why it does not reach us, and
# what would change that.

# One crate entered for the kernel by a ruling rather than as a convenience
# (plans/tickets-inside-a-deployment, Q7, ruled 2026-10-03):
# `unicode-normalization`, for the NFC every ticket's text is kept as and the
# NFKC its injection rules match on. Already in the tree through the URL
# parser; the rules themselves are plain matchers, with no regular-expression
# crate. Its advisories are checked here as every other crate's are.

[advisories]
# Unmaintained crates are reported by their direct dependents' advisories when
# they matter; failing the build on every one would make the gate noise.
unmaintained = "workspace"
ignore = [
    # The Marvin attack: a timing side channel that can recover an RSA
    # private key while decrypting or signing with it. `rsa` arrives through
    # openidconnect, which the dashboard uses only to verify ID-token
    # signatures with the directory's public keys: the dashboard holds no RSA
    # private key and never decrypts or signs with one, so the vulnerable path
    # is not reachable. No fixed release exists. Revisit if the dashboard ever
    # signs or decrypts with RSA, or when a fixed `rsa` ships.
    { id = "RUSTSEC-2023-0071", reason = "rsa is used by openidconnect only to verify signatures with public keys; no private-key operation is reachable" },
    # Timing variability in crypto-bigint's constant-time operations, which
    # matters only on secret integers. crypto-bigint 0.5 arrives through
    # elliptic-curve 0.13 (p256, p384, ecdsa), which openidconnect uses only
    # to verify ES256/ES384 ID-token signatures with the directory's public
    # keys: every value is public, and core signs nothing with an EC key (its
    # caller assertions are ed25519, dalek). The fix is crypto-bigint 0.7.6,
    # which the elliptic-curve 0.13 line cannot take. Revisit when
    # openidconnect moves to elliptic-curve 0.14, or if core ever signs with
    # an EC key.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 is reached only through openidconnect's ECDSA signature verification with public keys; no secret integer is reachable" },
]
