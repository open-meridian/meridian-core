# Core's stand-in as one plugin at the edge holding custody and operations,
# for `make e2e-plugin-area` (contract v17; plans/cores-plugin-area-is-at-
# parity-on-the-mcp): keeping two kinds of raw record, given the harness's
# archive as a deployment admin allows one, declaring a secret, the window
# settings, a table setting with an external account and an instrument
# column, and a setting serving both roles (e2e/plugin-page/archiving.py's
# area_registration); and reporting the account its connection reaches once
# registered, which the table's account column offers.
services:
  area:
    entrypoint: ["python", "-u", "/stand-in/stand_in.py"]
    volumes:
      - ${MERIDIAN_HARNESS_STAND_IN:?set MERIDIAN_HARNESS_STAND_IN to e2e/plugin-page, absolute}:/stand-in:ro
    environment:
      STAND_IN_ARCHIVE: "1"
      STAND_IN_AREA: "1"
      STAND_IN_REPORTS_AT_START: "1"
