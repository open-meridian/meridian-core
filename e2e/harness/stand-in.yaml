# Core's own stand-in plugin as the plugin harness's plugin, for
# `make harness-check`: an override of the `plugin` service, as a plugin's
# own e2e adds environment, a command or a volume with one of its own.
#
# The stand-in runs on the SDK's image with its script mounted; the path is
# absolute (MERIDIAN_HARNESS_STAND_IN), since a second compose file's
# relative paths resolve against the first file's directory.
services:
  plugin:
    entrypoint: ["python", "-u", "/stand-in/stand_in.py"]
    environment:
      # Report the accounts its connection reaches once registered, as a
      # connector does after its first read.
      STAND_IN_REPORTS_AT_START: "1"
    volumes:
      - ${MERIDIAN_HARNESS_STAND_IN:?set MERIDIAN_HARNESS_STAND_IN to e2e/plugin-page, absolute}:/stand-in:ro

  # And as the second plugin, an operations plugin's place (contract v8):
  # registered beside the first, opened at write once the admin is granted
  # it, writing nothing.
  plugin-2:
    entrypoint: ["python", "-u", "/stand-in/stand_in.py"]
    volumes:
      - ${MERIDIAN_HARNESS_STAND_IN:?set MERIDIAN_HARNESS_STAND_IN to e2e/plugin-page, absolute}:/stand-in:ro
