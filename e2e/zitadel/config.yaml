# Zitadel's configuration for `make e2e-dashboard`, mounted at start.
#
# One entry: the system API user that `meridian-group-hook setup` signs a
# credential for, exactly as the chart configures in a cluster. The end-to-end
# run therefore exercises the credential a deployment actually uses, rather
# than the first instance's one-shot token beside it.
#
# The key pair here is test-only, generated for this directory, and
# authenticates against no instance that exists.
SystemAPIUsers:
  - meridian-setup:
      Path: /zitadel-config/system-user.pub
      Memberships:
        - MemberType: System
          Roles:
            - IAM_OWNER
            - ORG_OWNER
