# Core's lake stand-ins for `make e2e-lake` and `make e2e-recorded` (contract
# v18; e2e/lake/stand_in.py): a data plugin serving the lake from an exchange file,
# and two reading plugins, one entitled and one never; and from contract v19
# an ems desk hearing trades and quotes.
services:
  coin:
    entrypoint: ["python", "-u", "/stand-in/stand_in.py"]
    volumes:
      - ${MERIDIAN_HARNESS_STAND_IN:?set MERIDIAN_HARNESS_STAND_IN to e2e/lake, absolute}:/stand-in:ro
      - ${STAND_IN_EXCHANGES:?set STAND_IN_EXCHANGES to the exchanges replayed, absolute}:/exchanges:ro
    environment:
      STAND_IN_LAKE: data
      STAND_IN_EXCHANGES: /exchanges
  book:
    entrypoint: ["python", "-u", "/stand-in/stand_in.py"]
    volumes:
      - ${MERIDIAN_HARNESS_STAND_IN}:/stand-in:ro
    environment:
      STAND_IN_LAKE: reader
  other:
    entrypoint: ["python", "-u", "/stand-in/stand_in.py"]
    volumes:
      - ${MERIDIAN_HARNESS_STAND_IN}:/stand-in:ro
    environment:
      STAND_IN_LAKE: reader
  desk:
    entrypoint: ["python", "-u", "/stand-in/stand_in.py"]
    volumes:
      - ${MERIDIAN_HARNESS_STAND_IN}:/stand-in:ro
    environment:
      STAND_IN_LAKE: desk
  # Contract v28: a signal plugin escalating a close's quality (W10.12).
  lens:
    entrypoint: ["python", "-u", "/stand-in/stand_in.py"]
    volumes:
      - ${MERIDIAN_HARNESS_STAND_IN}:/stand-in:ro
    environment:
      STAND_IN_LAKE: signal
  # The harness's master answers JPY nine seconds late, past the resolve's eight-second bounded ask and within the
  # conductor's ten-second request (contract v24;
  # v20's five-second sidecar call before it; the 2026-10-11 ruling): a slow master mints nothing, and a later
  # resolve finds it.
  platform:
    environment:
      HARNESS_PLATFORM_SLOW: JPY=9
