[workspace]
resolver = "2"
members = ["crates/bus", "crates/sidecar", "crates/instrument", "crates/street", "crates/symbology", "crates/conductor", "crates/runtime", "crates/domain", "crates/access", "crates/config", "crates/dashboard", "crates/first-run"]

[workspace.package]
edition = "2021"
rust-version = "1.90"
# AGPL, because the deployment runtime is the product. A permissive licence on
# this would let somebody run it as a service without returning anything, and
# the network clause is the whole reason to choose this family.
license = "AGPL-3.0-or-later"

# The wire schema is pinned to an exact commit. Bumping it is a deliberate,
# reviewable change rather than something that drifts in on a rebuild -- a
# schema change lands in every consumer as one arc or it is not landed.
[workspace.dependencies]
meridian-pb = { git = "https://github.com/open-meridian/meridian-schema.git", rev = "d66e06bd82e3cb8db5b1af1d389e159343a8179c" }
# The domain messages, generated here from proto/ rather than taken from the
# schema: they are the runtime's own traffic past the sidecar.
meridian-domain = { path = "crates/domain" }
meridian-access = { path = "crates/access" }
meridian-config = { path = "crates/config" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"

# The broker the bus runs on, per decision 010. Pinned to a minor version like
# every other dependency a customer inherits.
# Its defaults, with aws-lc-rs where they name ring: one TLS provider in the
# tree, or rustls cannot choose and panics at the first handshake that does
# not name one (see ldap3 below).
async-nats = { version = "0.47", default-features = false, features = [
  "server_2_10", "server_2_11", "server_2_12", "service", "aws-lc-rs",
  "jetstream", "nkeys", "crypto", "object-store", "kv", "websockets", "nuid",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tonic = "0.13"
# The dashboard's HTTP server. Already in the tree through tonic, which is
# built on it, so naming it adds no dependency.
axum = "0.8"
# OpenID Connect for the dashboard's sign-in: pure Rust, verifying ID tokens
# itself, over the reqwest client above rather than its own. No SAML: a firm
# whose single sign-on speaks only SAML puts a maintained broker in front of
# their deployment and is then an ordinary provider (decisions/018).
openidconnect = { version = "4", default-features = false }
# LDAP for the dashboard's other sign-in route, bound directly rather than
# brokered by an identity server we run (decisions/018). Pure Rust, and in the
# same place as the client above: a protocol translated at the boundary, which
# is what the workspace rule asks for. It is not a third-party type reaching
# the kernel's domain model, which is what that rule forbids -- a line this
# repository drew in the wrong place once, and drawing it there is what made a
# whole identity server look necessary.
# aws-lc-rs, the provider reqwest's rustls feature brings, so there is one in
# the tree. This named `ring` until 2026-09-25, on the belief that ring was
# reqwest's; it is not, so both were compiled in, rustls could not choose a
# default, and the first ldaps:// handshake panicked -- every sign-in and
# every wizard check on the LDAP branch, over the encrypted address the wizard
# itself suggests. Every test had used ldap://.
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-aws-lc-rs"] }
http = "1"
# HMAC-SHA256. Already in the tree through ed25519 and oauth2.
# Hashing the passwords of accounts a deployment holds itself (decisions/018).
# Argon2id, RustCrypto, pure Rust, in the same family as the primitives below.
# `std` for the PHC string form, which carries its own salt and parameters so
# changing those later does not invalidate rows written before the change.
argon2 = { version = "0.5", features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Signing the assertion a deployment presents on every request. Implementing
# Ed25519 by hand would be the wrong kind of independence; this is the reference
# implementation of the standard.
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
base64 = "0.22"
ring = "0.17"
# Seals a credential to the first-run Job, so the broker and everything else
# on the bus see ciphertext (spec/installation-and-first-run, ruling 4).
# RFC 9180, and a pure-Rust implementation.
hpke = { version = "0.12", default-features = false, features = ["x25519", "alloc"] }
rand = "0.8"
prost = "0.13"

# The client a deployment calls the platform with. rustls rather than the
# system TLS stack, so the container needs no OpenSSL headers and the build
# stays a pinned toolchain and nothing else. Redirects are followed by hand, so
# the built-in policy is switched off where the client is constructed. Streams,
# so a sidecar's front door passes a page through without holding it.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "stream"] }

# A trait with an async method has to be boxed to be usable behind `dyn`, and
# the transport is behind `dyn` so a test can answer without a network.
async-trait = "0.1"

# The instrument store. A synchronous driver on purpose: the bus already runs
# request handlers on a blocking pool, so a store that blocks is the shape that
# fits, and an async trait here would be boxed futures at every call site.
postgres = "0.19"
r2d2 = "0.8"
r2d2_postgres = "0.18"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
debug = false
