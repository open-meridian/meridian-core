# A deployment's runtime, locally.
#
# Postgres and the runtime. No platform service, and that is not an omission.
# Describing the platform here would be a second description of it that drifts
# from the one in meridian-platform, and the runtime starting without it is the
# behaviour under test rather than a degraded mode.
#
# The two projects meet on a shared network. Either may create it, so neither
# has to come up first.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      # Not 15433: that is the platform's, and two databases on one port is a
      # confusing afternoon.
      - "15434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [meridian]

  # The bus, per decision 010. Core NATS rather than JetStream: at-most-once is
  # what 007 fixed, and durability arrives with the workflow that demands it.
  nats:
    image: nats:2.10-alpine
    # dev.conf is permissions.conf plus this repository's test identities,
    # generated by `make test-broker` and never committed. A deployment gets
    # permissions.conf, which has no such user in it.
    command: ["-c", "/etc/nats/dev.conf", "-DV"]
    environment:
      # Development passwords, and obviously so. A deployment's come from a
      # secret, one per identity, mounted into that container alone.
      MERIDIAN_NATS_RUNTIME: runtime-dev-only
      MERIDIAN_NATS_CUSTODY_1: custody-1-dev-only
      MERIDIAN_NATS_CUSTODY_2: custody-2-dev-only
      MERIDIAN_NATS_DASHBOARD_1: dashboard-1-dev-only
      MERIDIAN_NATS_TESTS: tests-dev-only
    volumes:
      # Generated from the grant table, never edited: the grant table is the
      # policy and this is the broker saying the same thing.
      - ./deploy/nats:/etc/nats:ro
    ports:
      # Not 4222: a developer with another NATS on this machine should not have
      # to stop it to run these tests.
      - "14222:4222"
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [meridian]

  # The street store. Its own process, its own database credential, and no key:
  # it does not talk to the platform, which is why it cannot.
  street:
    build:
      context: .
      target: runtime
    command: ["meridian-street"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      MERIDIAN_STREET_DATABASE_URL: ${MERIDIAN_STREET_DATABASE_URL:-postgres://meridian:meridian@postgres:5432/meridian}
      MERIDIAN_BROKER_URL: nats://runtime:runtime-dev-only@nats:4222
      MERIDIAN_INSTANCE_ID: street-1
      RUST_LOG: ${RUST_LOG:-info}
    networks: [meridian]

  # The instrument store. A store and a bus, and nothing else: no key, no platform
  # address, no network beyond the broker. Decision 011 moved all three to the
  # conductor below.
  instrument:
    build:
      context: .
      target: runtime
    command: ["meridian-instrument"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      MERIDIAN_DATABASE_URL: postgres://meridian:meridian@postgres:5432/meridian
      MERIDIAN_BROKER_URL: nats://runtime:runtime-dev-only@nats:4222
      MERIDIAN_INSTANCE_ID: instrument-1
      RUST_LOG: ${RUST_LOG:-info}
    networks: [meridian]

  # The conductor. The key, the platform connection, and nothing else: no database,
  # because what the platform published can be fetched again.
  conductor:
    build:
      context: .
      target: runtime
    command: ["meridian-conductor"]
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      # The configuration store: what a deployment admin authors. Its tables
      # are prefixed config_, so it can share a schema with the other stores.
      MERIDIAN_CONFIG_DATABASE_URL: ${MERIDIAN_CONFIG_DATABASE_URL:-postgres://meridian:meridian@postgres:5432/meridian}
      MERIDIAN_BROKER_URL: nats://runtime:runtime-dev-only@nats:4222
      MERIDIAN_KEY_PATH: /var/lib/meridian/key.pem
      MERIDIAN_PLATFORM_ADDRESS: ${MERIDIAN_PLATFORM_ADDRESS:-http://site:8000}
      MERIDIAN_DEPLOYMENT_ID: ${MERIDIAN_DEPLOYMENT_ID:-}
      MERIDIAN_INSTANCE_ID: conductor-1
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - runtime-keys:/var/lib/meridian
    networks: [meridian]

  # A plugin's sidecar. One per plugin, and the plugin joins this container's
  # network namespace rather than the other way round, because the sidecar
  # binds loopback and holds the broker credential.
  sidecar:
    build:
      context: .
      target: runtime
    command: ["meridian-sidecar"]
    depends_on:
      nats:
        condition: service_started
    environment:
      MERIDIAN_DEPLOYMENT_ID: ${MERIDIAN_DEPLOYMENT_ID:-DEP-local}
      MERIDIAN_BROKER_URL: nats://custody-1:custody-1-dev-only@nats:4222
      MERIDIAN_PLUGIN_INSTANCE_ID: ${MERIDIAN_PLUGIN_INSTANCE_ID:-custody-1}
      MERIDIAN_PLUGIN_ROLE: ${MERIDIAN_PLUGIN_ROLE:-custody}
      MERIDIAN_PLUGIN_TAGS: ${MERIDIAN_PLUGIN_TAGS:-}
      MERIDIAN_INSTANCE_ID: sidecar-custody-1
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./deploy/grants.example.json:/etc/meridian/grants.json:ro
    networks: [meridian]

  # The Python SDK against a sidecar, which is the only check that the two
  # implementations of the sidecar surface agree.
  #
  # network_mode puts this container in the runtime's network namespace rather
  # than beside it on a network. That is not a convenience: the sidecar binds
  # loopback, because a sidecar reachable from another host is a way around the
  # boundary it enforces, so a plugin has to share the namespace. In Kubernetes
  # that is a container in the same pod, and this is the compose equivalent.
  interop:
    profiles: [interop]
    image: meridian-python-interop
    depends_on:
      sidecar:
        condition: service_started
    environment:
      MERIDIAN_SIDECAR_ADDRESS: 127.0.0.1:9191
    network_mode: "service:sidecar"

  # The gates that need services. Not a build stage, because a build stage has
  # no database, and a lightweight substitute for one is exactly what must not
  # exist.
  tests:
    profiles: [tests]
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: base
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MERIDIAN_TEST_DATABASE_URL: postgres://meridian:meridian@postgres:5432/meridian
      MERIDIAN_TEST_BROKER_URL: nats://tests:tests-dev-only@nats:4222
      # The runtime's own identity, narrowed to what the registry says its
      # components publish and subscribe to.
      MERIDIAN_TEST_BROKER_URL_RUNTIME: nats://runtime:runtime-dev-only@nats:4222
      # A plugin's sidecar, with only what the custody role may do. The tests
      # that matter most use this one and expect to be refused.
      MERIDIAN_TEST_BROKER_URL_CUSTODY: nats://custody-1:custody-1-dev-only@nats:4222
      # A second instance of the same role, which is what per-instance
      # credentials are for: the two may not speak as each other.
      MERIDIAN_TEST_BROKER_URL_CUSTODY_TWO: nats://custody-2:custody-2-dev-only@nats:4222
      MERIDIAN_TEST_PLATFORM_ADDRESS: ${MERIDIAN_PLATFORM_ADDRESS:-http://site:8000}
      MERIDIAN_TEST_DEPLOYMENT_ID: ${MERIDIAN_DEPLOYMENT_ID:-}
      # Read-only, and the same key the runtime generated. The end-to-end test
      # has to prove itself to the platform exactly as the runtime does, so it
      # signs with the key that was registered rather than one of its own.
      MERIDIAN_TEST_KEY_PATH: /var/lib/meridian/key.pem
      CARGO_TARGET_DIR: /tmp/target
    volumes:
      - runtime-keys:/var/lib/meridian:ro
    networks: [meridian]

volumes:
  runtime-keys:

networks:
  meridian:
    name: meridian
    external: true
