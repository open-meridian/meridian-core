# A deployment's runtime, locally.
#
# Postgres and the runtime. No platform service, and that is not an omission.
# Describing the platform here would be a second description of it that drifts
# from the one in meridian-platform, and the runtime starting without it is the
# behaviour under test rather than a degraded mode.
#
# The two projects meet on a shared network. Either may create it, so neither
# has to come up first.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      # Not 15433: that is the platform's, and two databases on one port is a
      # confusing afternoon.
      - "15434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      meridian:
        # "postgres" is ambiguous on the shared network whenever the
        # platform's own database is up beside this one: both answer to it,
        # and a lookup returns either. This name is only ever this one, so
        # every connection in this file uses it.
        aliases: [core-postgres]

  # The bus, per decision 010. Core NATS rather than JetStream: at-most-once is
  # what 007 fixed, and durability arrives with the workflow that demands it.
  nats:
    image: nats:2.10-alpine
    # dev.conf is permissions.conf plus this repository's test identities,
    # generated by `make test-broker` and never committed. A deployment gets
    # permissions.conf, which has no such user in it.
    command: ["-c", "/etc/nats/dev.conf", "-DV"]
    environment:
      # Development passwords, and obviously so. A deployment's come from a
      # secret, one per identity, mounted into that container alone.
      MERIDIAN_NATS_RUNTIME: runtime-dev-only
      MERIDIAN_NATS_CUSTODY_1: custody-1-dev-only
      MERIDIAN_NATS_CUSTODY_2: custody-2-dev-only
      MERIDIAN_NATS_DASHBOARD_1: dashboard-1-dev-only
      MERIDIAN_NATS_FIRST_RUN: first-run-dev-only
      MERIDIAN_NATS_TESTS: tests-dev-only
    volumes:
      # Generated from the grant table, never edited: the grant table is the
      # policy and this is the broker saying the same thing.
      - ./deploy/nats:/etc/nats:ro
    ports:
      # Not 4222: a developer with another NATS on this machine should not have
      # to stop it to run these tests.
      - "14222:4222"
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [meridian]

  # The street store. Its own process, its own database credential, and no key:
  # it does not talk to the platform, which is why it cannot.
  street:
    build:
      context: .
      target: runtime
    command: ["meridian-street"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      MERIDIAN_STREET_DATABASE_URL: ${MERIDIAN_STREET_DATABASE_URL:-postgres://meridian:meridian@core-postgres:5432/meridian}
      MERIDIAN_BROKER_URL: nats://runtime:runtime-dev-only@nats:4222
      MERIDIAN_INSTANCE_ID: street-1
      RUST_LOG: ${RUST_LOG:-info}
    networks: [meridian]

  # The instrument store. A store and a bus, and nothing else: no key, no platform
  # address, no network beyond the broker. Decision 011 moved all three to the
  # conductor below.
  instrument:
    build:
      context: .
      target: runtime
    command: ["meridian-instrument"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      MERIDIAN_DATABASE_URL: postgres://meridian:meridian@core-postgres:5432/meridian
      MERIDIAN_BROKER_URL: nats://runtime:runtime-dev-only@nats:4222
      MERIDIAN_INSTANCE_ID: instrument-1
      RUST_LOG: ${RUST_LOG:-info}
    networks: [meridian]

  # The conductor. The key, the platform connection, and nothing else: no database,
  # because what the platform published can be fetched again.
  conductor:
    build:
      context: .
      target: runtime
    command: ["meridian-conductor"]
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      # The configuration store: what a deployment admin authors. Its tables
      # are prefixed config_, so it can share a schema with the other stores.
      MERIDIAN_CONFIG_DATABASE_URL: ${MERIDIAN_CONFIG_DATABASE_URL:-postgres://meridian:meridian@core-postgres:5432/meridian}
      MERIDIAN_BROKER_URL: nats://runtime:runtime-dev-only@nats:4222
      MERIDIAN_KEY_PATH: /var/lib/meridian/key.pem
      MERIDIAN_PLATFORM_ADDRESS: ${MERIDIAN_PLATFORM_ADDRESS:-http://site:8000}
      MERIDIAN_DEPLOYMENT_ID: ${MERIDIAN_DEPLOYMENT_ID:-}
      MERIDIAN_INSTANCE_ID: conductor-1
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - runtime-keys:/var/lib/meridian
    networks: [meridian]

  # The dashboard: the one address staff use. No key and no database of its
  # own; it reads who may do what from the conductor over the broker, as the
  # instance dashboard-1 with the admin role's grants.
  dashboard:
    build:
      context: .
      target: runtime
    command: ["meridian-dashboard"]
    depends_on:
      nats:
        condition: service_started
    environment:
      MERIDIAN_BROKER_URL: nats://dashboard-1:dashboard-1-dev-only@nats:4222
      MERIDIAN_INSTANCE_ID: dashboard-1
      MERIDIAN_DASHBOARD_LISTEN: 0.0.0.0:8080
      MERIDIAN_DASHBOARD_URL: ${MERIDIAN_DASHBOARD_URL:-http://localhost:8088}
      # A directory to sign in against. Unset here, so the dashboard serves and
      # says nobody can sign in; the e2e target sets it to the bundled Zitadel.
      MERIDIAN_OIDC_ISSUER: ${MERIDIAN_OIDC_ISSUER:-}
      MERIDIAN_OIDC_CLIENT_ID: ${MERIDIAN_OIDC_CLIENT_ID:-}
      # Zitadel names the client's project in every ID token's audience.
      MERIDIAN_OIDC_TRUSTED_AUDIENCES: ${MERIDIAN_OIDC_TRUSTED_AUDIENCES:-}
      # Or the firm's LDAP, bound by the dashboard itself (decisions/018).
      # Unset here as the issuer above is: the e2e target sets one or the
      # other, and the dashboard refuses to start with both.
      MERIDIAN_LDAP_SERVERS: ${MERIDIAN_LDAP_SERVERS:-}
      MERIDIAN_LDAP_BASE_DN: ${MERIDIAN_LDAP_BASE_DN:-}
      MERIDIAN_LDAP_BIND_DN: ${MERIDIAN_LDAP_BIND_DN:-}
      MERIDIAN_LDAP_BIND_PASSWORD: ${MERIDIAN_LDAP_BIND_PASSWORD:-}
      # Or accounts this deployment holds itself, the branch for a firm with
      # no directory at all. Unset here as the two above are; the dashboard
      # refuses to start with more than one configured.
      MERIDIAN_LOCAL_ACCOUNTS_DATABASE_URL: ${MERIDIAN_LOCAL_ACCOUNTS_DATABASE_URL:-}
      MERIDIAN_LOCAL_ACCOUNT_NAME: ${MERIDIAN_LOCAL_ACCOUNT_NAME:-}
      MERIDIAN_LOCAL_ACCOUNT_PASSWORD_HASH: ${MERIDIAN_LOCAL_ACCOUNT_PASSWORD_HASH:-}
      MERIDIAN_LOCAL_ACCOUNT_DISPLAY_NAME: ${MERIDIAN_LOCAL_ACCOUNT_DISPLAY_NAME:-}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${MERIDIAN_DASHBOARD_PORT:-8088}:8080"
    networks: [meridian]

  # A plugin's sidecar. One per plugin, and the plugin joins this container's
  # network namespace rather than the other way round, because the sidecar
  # binds loopback and holds the broker credential.
  sidecar:
    build:
      context: .
      target: runtime
    command: ["meridian-sidecar"]
    depends_on:
      nats:
        condition: service_started
    environment:
      MERIDIAN_DEPLOYMENT_ID: ${MERIDIAN_DEPLOYMENT_ID:-DEP-local}
      MERIDIAN_BROKER_URL: nats://custody-1:custody-1-dev-only@nats:4222
      MERIDIAN_PLUGIN_INSTANCE_ID: ${MERIDIAN_PLUGIN_INSTANCE_ID:-custody-1}
      MERIDIAN_PLUGIN_ROLE: ${MERIDIAN_PLUGIN_ROLE:-custody}
      MERIDIAN_PLUGIN_TAGS: ${MERIDIAN_PLUGIN_TAGS:-}
      MERIDIAN_INSTANCE_ID: sidecar-custody-1
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # The harness's own grants: the role it launches a plugin as belongs to
      # that plugin, not to core, and core ships only the roles it launches
      # itself.
      - ./deploy/nats/dev-grants.json:/etc/meridian/grants.json:ro
    networks: [meridian]

  # The Python SDK against a sidecar, which is the only check that the two
  # implementations of the sidecar surface agree.
  #
  # network_mode puts this container in the runtime's network namespace rather
  # than beside it on a network. That is not a convenience: the sidecar binds
  # loopback, because a sidecar reachable from another host is a way around the
  # boundary it enforces, so a plugin has to share the namespace. In Kubernetes
  # that is a container in the same pod, and this is the compose equivalent.
  interop:
    profiles: [interop]
    image: meridian-python-interop
    depends_on:
      sidecar:
        condition: service_started
    environment:
      MERIDIAN_SIDECAR_ADDRESS: 127.0.0.1:9191
    network_mode: "service:sidecar"

  # The gates that need services. Not a build stage, because a build stage has
  # no database, and a lightweight substitute for one is exactly what must not
  # exist.
  tests:
    profiles: [tests]
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: base
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MERIDIAN_TEST_DATABASE_URL: postgres://meridian:meridian@core-postgres:5432/meridian
      MERIDIAN_TEST_BROKER_URL: nats://tests:tests-dev-only@nats:4222
      # The firm's directory, which the dashboard now binds to itself rather
      # than having an identity server broker for it (decisions/018).
      MERIDIAN_TEST_LDAP_URL: ldap://ldap:1389
      # The runtime's own identity, narrowed to what the registry says its
      # components publish and subscribe to.
      MERIDIAN_TEST_BROKER_URL_RUNTIME: nats://runtime:runtime-dev-only@nats:4222
      # A plugin's sidecar, with only what the custody role may do. The tests
      # that matter most use this one and expect to be refused.
      MERIDIAN_TEST_BROKER_URL_CUSTODY: nats://custody-1:custody-1-dev-only@nats:4222
      # A second instance of the same role, which is what per-instance
      # credentials are for: the two may not speak as each other.
      MERIDIAN_TEST_BROKER_URL_CUSTODY_TWO: nats://custody-2:custody-2-dev-only@nats:4222
      MERIDIAN_TEST_PLATFORM_ADDRESS: ${MERIDIAN_PLATFORM_ADDRESS:-http://site:8000}
      MERIDIAN_TEST_DEPLOYMENT_ID: ${MERIDIAN_DEPLOYMENT_ID:-}
      # Read-only, and the same key the runtime generated. The end-to-end test
      # has to prove itself to the platform exactly as the runtime does, so it
      # signs with the key that was registered rather than one of its own.
      MERIDIAN_TEST_KEY_PATH: /var/lib/meridian/key.pem
      CARGO_TARGET_DIR: /tmp/target
    volumes:
      - runtime-keys:/var/lib/meridian:ro
    networks: [meridian]

  # ── make e2e-dashboard ────────────────────────────────────────────────────
  #
  # The dashboard's sign-in against a real, self-hosted Zitadel, brokering a
  # test LDAP directory, with the group hook between them and a stand-in for
  # the one platform call a claim makes. Everything here is a local test value
  # for an instance that lives for one run; none of it is a deployment's.
  # Nothing publishes a host port: every caller is on the network, and the
  # issuer is the name the dashboard and the tokens both use.

  # The bundled Zitadel, as the chart installs it: its own database and its
  # own login role inside the deployment's Postgres (spec, requirement 6).
  # Init creates both with the admin credential; Zitadel then runs as its own
  # role.
  zitadel:
    profiles: [e2e]
    image: ghcr.io/zitadel/zitadel:v4.17.3
    # Root, to write the first instance's tokens onto the bootstrap volume.
    user: "0"
    command:
      ["start-from-init", "--masterkeyFromEnv", "--tlsMode", "disabled",
       "--config", "/zitadel-config/config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Zitadel's documented example key. A deployment's is created once as a
      # Secret and never regenerated.
      ZITADEL_MASTERKEY: MasterkeyNeedsToHave32Characters
      ZITADEL_LOG_LEVEL: info
      # The issuer: http://zitadel:8080, the same string inside the network,
      # in discovery, and in every token.
      ZITADEL_EXTERNALDOMAIN: zitadel
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      # The default refuses webhook targets on private addresses, which is
      # where the group hook lives. Narrowed to the metadata range only.
      ZITADEL_HTTPCLIENT_DENYLIST: "169.254.0.0/16"
      ZITADEL_DATABASE_POSTGRES_HOST: core-postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel-dev-only
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: meridian
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: meridian
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_EXISTINGDATABASE: meridian
      ZITADEL_FIRSTINSTANCE_ORG_NAME: E2E
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: zitadel-admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: "Password1!"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      # A machine admin whose token the bootstrap uses, and the login client
      # whose token drives sign-ins through the session API as Login v2 does.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: admin-sa
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Admin SA
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Login Client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /bootstrap/login-client.pat
      # Login v2, so an authorisation request is finished through the v2 API.
      # The UI itself is not run: the test drives that API as the UI would.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://zitadel-login:3000/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://zitadel-login:3000/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://zitadel-login:3000/ui/v2/login/logout?post_logout_redirect=
    volumes:
      - e2e-bootstrap:/bootstrap
      # The system API user setup signs its credential for, as the chart
      # configures in a cluster.
      - ./e2e/zitadel:/zitadel-config:ro
    networks: [meridian]

  # A firm's LDAP directory, for Zitadel to broker. memberOf is switched on
  # and the tree loaded by the make target, because the overlay has to be in
  # place before the groups are written for it to maintain memberOf.
  ldap:
    profiles: [e2e]
    image: bitnamilegacy/openldap:2.6
    environment:
      LDAP_ROOT: dc=example,dc=org
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: ldap-admin-dev-only
      LDAP_SKIP_DEFAULT_TREE: "yes"
    volumes:
      - ./e2e/dashboard/ldap:/e2e-ldap:ro
    networks: [meridian]

  # The group hook, with the signing keys Zitadel returned when the bootstrap
  # made its two targets, and the dashboard's project in Zitadel. Started before
  # the bootstrap and waiting for it, because Zitadel refuses a target whose
  # host does not resolve, and the key exists only once the target does.
  group-hook:
    profiles: [e2e]
    build:
      context: .
      target: runtime
    entrypoint:
      - sh
      - -c
      - >-
        until [ -s /bootstrap/token-signing-key ] && [ -s /bootstrap/project-id ]; do sleep 1; done;
        MERIDIAN_GROUP_HOOK_INTENT_SIGNING_KEY="$$(cat /bootstrap/intent-signing-key)"
        MERIDIAN_GROUP_HOOK_TOKEN_SIGNING_KEY="$$(cat /bootstrap/token-signing-key)"
        MERIDIAN_GROUP_HOOK_PROJECT_ID="$$(cat /bootstrap/project-id)"
        exec meridian-group-hook
    environment:
      MERIDIAN_GROUP_HOOK_LISTEN: 0.0.0.0:8090
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - e2e-bootstrap:/bootstrap:ro
    networks: [meridian]

  # The chart's setup Job, run here with files for output: the dashboard's
  # project, client and roles, the LDAP provider, and the hook's targets and
  # executions, through Zitadel's API, idempotently. The same code a
  # customer's cluster runs, so this run tests it.
  zitadel-setup:
    profiles: [e2e]
    build:
      context: .
      target: runtime
    command: ["meridian-group-hook", "setup"]
    environment:
      MERIDIAN_ZITADEL_API_URL: http://zitadel:8080
      MERIDIAN_ZITADEL_SYSTEM_USER: meridian-setup
      MERIDIAN_ZITADEL_SYSTEM_USER_KEY_FILE: /zitadel-config/system-user.key
      # What Zitadel checks the credential's audience against: the issuer it
      # states, which here is its own name on this network.
      MERIDIAN_ZITADEL_ISSUER: http://zitadel:8080
      MERIDIAN_DASHBOARD_REDIRECT_URI: http://dashboard:8080/callback
      MERIDIAN_GROUP_HOOK_URL: http://group-hook:8090
      MERIDIAN_ZITADEL_ROLES: e2e-staff
      MERIDIAN_ZITADEL_DEV_MODE: "true"
      MERIDIAN_LDAP_NAME: Firm LDAP
      MERIDIAN_LDAP_SERVERS: ldap://ldap:1389
      MERIDIAN_LDAP_BASE_DN: ou=people,dc=example,dc=org
      MERIDIAN_LDAP_BIND_DN: cn=admin,dc=example,dc=org
      MERIDIAN_LDAP_BIND_PASSWORD: ldap-admin-dev-only
      MERIDIAN_SETUP_OUTPUT: files:/bootstrap
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - e2e-bootstrap:/bootstrap
      - ./e2e/zitadel:/zitadel-config:ro
    networks: [meridian]

  # What only the test needs, after setup: people made in Zitadel, and the
  # identifiers the runner looks for.
  zitadel-bootstrap:
    profiles: [e2e]
    image: python:3.12-alpine
    command: ["python", "-u", "/e2e/bootstrap.py"]
    environment:
      ZITADEL: http://zitadel:8080
    volumes:
      - ./e2e/dashboard:/e2e:ro
      - e2e-bootstrap:/bootstrap
    networks: [meridian]

  # The one platform call a claim makes, answered: one known code, once.
  # The real platform does not serve it yet.
  fake-platform:
    profiles: [e2e]
    image: python:3.12-alpine
    command: ["python", "-u", "/e2e/fake_platform.py"]
    environment:
      E2E_CLAIM_CODE: E2E-7KQ2-MX4P
      E2E_DEPLOYMENT_ID: DEP-e2e
      E2E_PLATFORM_ADDRESS: http://fake-platform:8000
    volumes:
      - ./e2e/dashboard:/e2e:ro
    networks: [meridian]

  # A browser, as far as the dashboard can tell, and Login v2, as far as
  # Zitadel can: a cookie jar that follows the dashboard's redirects, and the
  # session API that finishes each sign-in.
  e2e-runner:
    profiles: [e2e]
    image: python:3.12-alpine
    entrypoint: ["python", "-u", "/e2e/runner.py"]
    environment:
      ZITADEL: http://zitadel:8080
      DASHBOARD: http://dashboard:8080
      GROUP_HOOK: http://group-hook:8090
      FAKE_PLATFORM: http://fake-platform:8000
      E2E_CLAIM_CODE: E2E-7KQ2-MX4P
    volumes:
      - ./e2e/dashboard:/e2e:ro
      - e2e-bootstrap:/bootstrap:ro
      - e2e-state:/state
    networks: [meridian]

  # ── First run, without a cluster ────────────────────────────────────────────
  #
  # An install that was given nothing: no database, no directory, no broker
  # credential of its own, no key. What stands in for a cluster is a
  # Kubernetes API serving only the five calls first run may make, and a
  # platform serving only the two a deployment makes while being set up.

  fr-pki:
    profiles: [first-run]
    image: alpine/openssl:3.3.2
    # The API server a pod reaches is TLS, and the code under test verifies
    # it against the CA its service account carries. So the harness makes one.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        test -s /pki/tls.crt && exit 0
        # A CA, and a serving certificate it signs: a cluster's own shape, and
        # the client refuses a CA presented as the server it is verifying.
        openssl req -x509 -newkey rsa:2048 -nodes -days 30 \
          -subj "/CN=e2e-ca" -keyout /pki/ca.key -out /pki/ca.crt
        openssl req -newkey rsa:2048 -nodes -subj "/CN=fr-kube" \
          -keyout /pki/tls.key -out /pki/tls.csr
        printf 'subjectAltName=DNS:fr-kube\n' > /pki/ext.cnf
        openssl x509 -req -in /pki/tls.csr -CA /pki/ca.crt -CAkey /pki/ca.key \
          -CAcreateserial -days 30 -extfile /pki/ext.cnf -out /pki/tls.crt
        printf 'e2e-token' > /pki/token
        printf 'meridian' > /pki/namespace
    volumes:
      - fr-pki:/pki
    networks: [meridian]

  fr-kube:
    profiles: [first-run]
    image: python:3.12-alpine
    command: ["python", "-u", "/e2e/kube.py"]
    depends_on:
      fr-pki:
        condition: service_completed_successfully
    volumes:
      - ./e2e/first-run:/e2e:ro
      - fr-pki:/pki:ro
    networks: [meridian]

  fr-platform:
    profiles: [first-run]
    image: python:3.12-alpine
    command: ["python", "-u", "/e2e/platform.py"]
    environment:
      E2E_DEPLOYMENT_ID: DEP-first-run
      E2E_PLATFORM_ADDRESS: http://fr-platform:8000
      E2E_ENROLMENT_CODE: ENR-E2E-FIRST-RUN
      E2E_FIRST_RUN_CODE: FR-E2E-CODE
      E2E_FIRST_ADMIN_CODE: ADMIN-E2E-CODE
    volumes:
      - ./e2e/first-run:/e2e:ro
    networks: [meridian]

  # The database the wizard is going to be told about: two roles, one that may
  # create a table and one that may not.
  fr-database:
    profiles: [first-run]
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        export PGPASSWORD=meridian
        psql -h core-postgres -U meridian -d meridian -v ON_ERROR_STOP=0 \
          -c "create database firstrun" \
          -c "create database firstrun_zitadel" \
          -c "create role firstrun_app login password 'first-run-dev-only'" \
          -c "create role firstrun_migrate login password 'first-run-dev-only'" \
          -c "create role firstrun_zitadel login password 'first-run-dev-only'" || true
        psql -h core-postgres -U meridian -d firstrun -v ON_ERROR_STOP=1 \
          -c "revoke create on schema public from public" \
          -c "grant usage on schema public to firstrun_app" \
          -c "grant create, usage on schema public to firstrun_migrate"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [meridian]

  # The conductor, with no database: its configuration is in memory until the
  # wizard applies one, which is the only way the wizard can run at all.
  conductor-first-run:
    profiles: [first-run]
    build:
      context: .
      target: runtime
    command: ["meridian-conductor"]
    environment:
      MERIDIAN_DEPLOYMENT_ID: DEP-first-run
      MERIDIAN_PLATFORM_ADDRESS: http://fr-platform:8000
      MERIDIAN_ENROLMENT_CODE: ENR-E2E-FIRST-RUN
      MERIDIAN_KEY_PATH: /var/lib/meridian/key.pem
      MERIDIAN_BROKER_URL: nats://runtime:runtime-dev-only@nats:4222
      MERIDIAN_INSTANCE_ID: conductor-first-run
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      nats:
        condition: service_started
      fr-platform:
        condition: service_started
    volumes:
      - fr-keys:/var/lib/meridian
    networks: [meridian]

  dashboard-first-run:
    profiles: [first-run]
    build:
      context: .
      target: runtime
    command: ["meridian-dashboard"]
    environment:
      MERIDIAN_DASHBOARD_URL: http://dashboard-first-run:8080
      MERIDIAN_BROKER_URL: nats://dashboard-1:dashboard-1-dev-only@nats:4222
      MERIDIAN_INSTANCE_ID: dashboard-1
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      nats:
        condition: service_started
    networks: [meridian]

  first-run:
    profiles: [first-run]
    build:
      context: .
      target: runtime
    command: ["meridian-first-run"]
    environment:
      MERIDIAN_INSTANCE_ID: first-run
      MERIDIAN_BROKER_URL: nats://first-run:first-run-dev-only@nats:4222
      # What a pod finds, pointed at the stand-in.
      KUBERNETES_SERVICE_HOST: fr-kube
      KUBERNETES_SERVICE_PORT: "8443"
      MERIDIAN_FIRST_RUN_DATABASE_SECRET: first-run-database
      MERIDIAN_FIRST_RUN_ZITADEL_DATABASE_SECRET: first-run-zitadel-database
      MERIDIAN_FIRST_RUN_OIDC_SECRET: first-run-dashboard-oidc
      MERIDIAN_FIRST_RUN_LDAP_SECRET: first-run-ldap-bind
      MERIDIAN_FIRST_RUN_ADDRESSES_SECRET: first-run-addresses
      MERIDIAN_FIRST_RUN_EGRESS_POLICY: first-run-egress
      MERIDIAN_FIRST_RUN_BINDING: first-run
      MERIDIAN_FIRST_RUN_RESTART: first-run-conductor,first-run-dashboard
      MERIDIAN_FIRST_RUN_BUNDLED_IDENTITY: first-run-zitadel,first-run-zitadel-login
      # Whether there is one to set up. The names above are given whether or
      # not it was rendered, so they say nothing about it.
      MERIDIAN_FIRST_RUN_BUNDLED_DIRECTORY: "true"
      # The database this chart can bring. In a cluster the Job scales a
      # StatefulSet and then connects to it; here the stand-in Kubernetes
      # records the scale and this points at a Postgres that is already
      # running, so what is proven is the part that cannot be faked -- the
      # databases, the roles and the grants it makes, and whether the URLs it
      # writes can actually be connected with.
      MERIDIAN_FIRST_RUN_BROUGHT_WORKLOAD: first-run-database
      MERIDIAN_FIRST_RUN_BROUGHT_HOST: core-postgres
      MERIDIAN_FIRST_RUN_BROUGHT_PORT: "5432"
      MERIDIAN_FIRST_RUN_BROUGHT_SUPERUSER: meridian
      MERIDIAN_FIRST_RUN_BROUGHT_SUPERUSER_PASSWORD: meridian
      MERIDIAN_FIRST_RUN_BROUGHT_SERVING_PASSWORD: brought-serving-dev-only
      MERIDIAN_FIRST_RUN_BROUGHT_MIGRATING_PASSWORD: brought-migrating-dev-only
      MERIDIAN_FIRST_RUN_BROUGHT_ZITADEL_PASSWORD: brought-zitadel-dev-only
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      fr-kube:
        condition: service_started
      nats:
        condition: service_started
    volumes:
      - fr-pki:/var/run/secrets/kubernetes.io/serviceaccount:ro
    networks: [meridian]

  accounts-runner:
    profiles: [e2e]
    image: python:3.12-alpine
    entrypoint: ["python", "-u", "/e2e/accounts_runner.py"]
    environment:
      DASHBOARD: http://dashboard:8080
      E2E_CLAIM_CODE: ${E2E_CLAIM_CODE:-E2E-7KQ2-MX4P}
      E2E_LOCAL_ACCOUNT_NAME: ada
      E2E_LOCAL_ACCOUNT_PASSWORD: Password1!
      E2E_STATE: /state
    volumes:
      - ./e2e/dashboard:/e2e:ro
      - dashboard-e2e-state:/state
    networks: [meridian]

  ldap-runner:
    profiles: [e2e]
    image: python:3.12-alpine
    entrypoint: ["python", "-u", "/e2e/ldap_runner.py"]
    environment:
      DASHBOARD: http://dashboard:8080
      E2E_CLAIM_CODE: ${E2E_CLAIM_CODE:-E2E-CLAIM-CODE}
      E2E_STATE: /state
    volumes:
      - ./e2e/dashboard:/e2e:ro
      - dashboard-e2e-state:/state
    networks: [meridian]

  fr-runner:
    profiles: [first-run]
    image: python:3.12-alpine
    entrypoint: ["python", "-u", "/e2e/runner.py"]
    environment:
      DASHBOARD: http://dashboard-first-run:8080
      PLATFORM: http://fr-platform:8000
      KUBE: http://fr-kube:8080
      E2E_FIRST_RUN_CODE: FR-E2E-CODE
      E2E_FIRST_ADMIN_CODE: ADMIN-E2E-CODE
      E2E_DATABASE_PASSWORD: first-run-dev-only
      # What the brought route should end up with, for the runner to connect
      # with and for it to check nothing privileged was written.
      E2E_BROUGHT_HOST: core-postgres
      E2E_BROUGHT_SERVING_PASSWORD: brought-serving-dev-only
      E2E_BROUGHT_MIGRATING_PASSWORD: brought-migrating-dev-only
      E2E_BROUGHT_ZITADEL_PASSWORD: brought-zitadel-dev-only
      E2E_SUPERUSER_PASSWORD: meridian
      E2E_DB_ROUTE: ${E2E_DB_ROUTE:-external}
      # Which directory signs people in: the bundled Zitadel, or the firm's
      # own provider with the bundle still rendered and switched off.
      E2E_BACKEND: ${E2E_BACKEND:-bundled}
    volumes:
      - ./e2e/first-run:/e2e:ro
    networks: [meridian]

volumes:
  fr-pki:
  fr-keys:
  runtime-keys:
  e2e-bootstrap:
  e2e-state:
  dashboard-e2e-state:

networks:
  meridian:
    name: meridian
    external: true
