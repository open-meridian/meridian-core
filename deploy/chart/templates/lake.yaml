{{- include "meridian-runtime.require" . -}}
{{- include "meridian-runtime.oneWriter" (dict "top" $ "component" "lake" "what" "lake" "values" .Values.lake) -}}
{{- /* Rulings 957, 958: a whole number from 1 to 8, or nothing renders. */ -}}
{{- $answers := .Values.lake.maxConcurrentAnswers -}}
{{- if not (regexMatch "^[1-8]$" (toString $answers)) -}}
{{- fail (printf "lake.maxConcurrentAnswers is %v; a whole number from 1 to 8, how many whole answers the lake builds at once" $answers) -}}
{{- end -}}
{{- /* Ruling 972: a whole number of bytes above 0, or nothing renders. */ -}}
{{- $mmap := .Values.lake.mallocMmapThreshold -}}
{{- $whole := false -}}
{{- if kindIs "string" $mmap -}}
{{- $whole = regexMatch "^[1-9][0-9]*$" $mmap -}}
{{- else if or (kindIs "float64" $mmap) (kindIs "int64" $mmap) (kindIs "int" $mmap) -}}
{{- $whole = and (gt (float64 $mmap) 0.0) (eq (float64 (int64 $mmap)) (float64 $mmap)) -}}
{{- end -}}
{{- if not $whole -}}
{{- fail (printf "lake.mallocMmapThreshold is %v; a whole number of bytes above 0, the size from which glibc maps an allocation of its own" $mmap) -}}
{{- end -}}
{{/*
  The lake (W10, contract v18): what sources say about entities -- prices
  and bars a data plugin records, read by the reading roles under the deployment's
  licences, entitlements and priority. Its own Deployment, tag and store
  beside the street's and the book's, sharing no key, join or transaction
  with either (decisions/012, decisions/032).

  One writer per partition. Every batch takes its dataset's head in
  Postgres, and the rollout never surges, as the book's does, so an upgrade
  never runs an old writer beside a new one over the same partition.

  No key and no platform address: licensed data never leaves the deployment
  (spec/the-lake, requirement 14).
*/}}
{{- define "meridian-runtime.lake.deployment" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian-runtime.fullname" . }}-lake
  labels:
    meridian.dev/component: lake
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  replicas: {{ include "meridian-runtime.memberCount" (dict "top" $ "component" "lake" "values" .Values.lake) }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- include "meridian-runtime.memberStrategy" (dict "top" $ "component" "lake" "values" .Values.lake) | nindent 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      meridian.dev/component: lake
  template:
    metadata:
      labels:
        {{- include "meridian-runtime.labels" . | nindent 8 }}
        meridian.dev/component: lake
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "meridian-runtime.memberPlacement" (dict "top" $ "component" "lake" "values" $.Values.lake) | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: lake
          image: "{{ .Values.image.repository }}:{{ .Values.lake.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["meridian-lake"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: MERIDIAN_INSTANCE_ID
              value: {{ include "meridian-runtime.fullname" . }}-lake
            {{- include "meridian-runtime.memberEnv" (dict "top" $ "component" "lake" "values" $.Values.lake) | nindent 12 }}
            # The deployment each change of its log is made in (step 3a,
            # the change log's origin; ruling 1049).
            - name: MERIDIAN_DEPLOYMENT_ID
              value: {{ .Values.deployment.id | quote }}
            # The hot layer's bounds, in MiB (step 3a).
            - name: MERIDIAN_LAKE_HOT_LATEST_MIB
              value: {{ .Values.lake.hotLayer.latestMiB | quote }}
            - name: MERIDIAN_LAKE_HOT_LISTINGS_MIB
              value: {{ .Values.lake.hotLayer.listingsMiB | quote }}
            # The analytics component, whose reads for a job are its
            # client's (contract v26, W12.2).
            - name: MERIDIAN_ANALYTICS_INSTANCE_ID
              value: {{ include "meridian-runtime.fullname" . }}-analytics
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            # Its working memory (stage M), less the hot layer's bounds and
            # the held answers' 64 MiB; glibc's arenas, and its mmap
            # threshold (ruling 972), as every component's.
            {{- include "meridian-runtime.memoryEnv" (dict "top" $ "container" "lake" "values" .Values.lake "resources" .Values.resources "heldMiB" (add 64 .Values.lake.hotLayer.latestMiB .Values.lake.hotLayer.listingsMiB) "name" "lake") | nindent 12 }}
            # How many whole answers it builds at once (rulings 957, 958).
            - name: MERIDIAN_LAKE_MAX_CONCURRENT_ANSWERS
              value: {{ .Values.lake.maxConcurrentAnswers | int | quote }}
            - name: MERIDIAN_LAKE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.lake.database.existingSecret | default (include "meridian-runtime.databaseSecret" $) }}
                  key: {{ .Values.lake.database.key | default .Values.database.key }}
            - name: MERIDIAN_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "meridian-runtime.brokerSecret" $ }}
                  key: {{ include "meridian-runtime.runtimeBrokerKey" (dict "Values" .Values "key" .Values.broker.lakeKey) }}
            {{- include "meridian-runtime.readyEnv" . | nindent 12 }}
            {{- with (include "meridian-runtime.internalTlsEnv" .) }}{{ . | nindent 12 }}{{- end }}
            {{- with (include "meridian-runtime.databaseCaEnv" .) }}{{ . | nindent 12 }}{{- end }}
          {{- include "meridian-runtime.readyProbe" . | nindent 10 }}
          volumeMounts:
            {{- include "meridian-runtime.readyMount" . | nindent 12 }}
            {{- with (include "meridian-runtime.internalTlsMount" .) }}{{ . | nindent 12 }}{{- end }}
            {{- with (include "meridian-runtime.databaseCaMount" .) }}{{ . | nindent 12 }}{{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- include "meridian-runtime.readyVolume" . | nindent 8 }}
        {{- with (include "meridian-runtime.internalTlsVolume" .) }}{{ . | nindent 8 }}{{- end }}
        {{- with (include "meridian-runtime.databaseCaVolume" .) }}{{ . | nindent 8 }}{{- end }}
{{- end -}}
{{ include "meridian-runtime.lake.deployment" . }}
{{- /* Its reader members (contract v30, stage B; spec section 5): the same
       Deployment in a reads-only mode, `lake.readers` of them. */}}
{{ include "meridian-runtime.readers" (dict "top" $ "component" "lake" "values" .Values.lake "readUrl" "MERIDIAN_LAKE_READ_DATABASE_URL" "rendered" (include "meridian-runtime.lake.deployment" .)) }}
{{ include "meridian-runtime.memberBudget" (dict "top" $ "component" "lake" "values" $.Values.lake) }}
