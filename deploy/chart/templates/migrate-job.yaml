{{- include "meridian-runtime.require" . -}}
{{/*
  The schema, applied once per release before the new version serves.

  One Job per release revision, rather than an init container and rather than a
  hook. An init container runs per pod, so N replicas starting together race to
  apply the same migration, and a pod that restarts at 3am migrates a
  customer's database because it restarted.

  A hook was the first answer and cannot stay one. A pre-install hook has to
  succeed before any ordinary resource exists, and on a fresh install the
  database is not configured yet: the wizard writes it, and the wizard is
  served by the dashboard, which a hook would be waiting in front of
  (spec/installation-and-first-run, requirement 6). So this waits instead. A
  container whose Secret has no key yet does not start and starts when it
  appears, which is the whole of the waiting.

  What the hook gave up is ordering: the components come up while this runs.
  They verify the schema rather than applying it and refuse to serve one they
  do not recognise, so the window is a readiness failure that clears, never a
  wrong answer.

  An administrator whose delivery tooling does not honour hooks runs the same
  image with `migrate` themselves; the runtime refuses to serve against a
  schema it does not recognise, so a missed migration is a refusal with a
  sentence rather than a wrong answer.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "meridian-runtime.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  # No deadline: this may wait for a database the wizard has not configured
  # yet, and a deadline would count that wait as failure.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "meridian-runtime.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{/*
        Each component migrates its own schema, in its own container, at the
        version being released. Init containers for the configuration store and
        the street store, and the instrument store's in the main one, so all
        three must succeed for the release to proceed and the order is stated
        rather than raced. The conductor's migration needs a database and no key.
      */}}
      initContainers:
        - name: conductor
          image: "{{ .Values.image.repository }}:{{ .Values.conductor.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["meridian-conductor", "migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: MERIDIAN_CONFIG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migrate.configSecret | default .Values.migrate.existingSecret | default .Values.conductor.database.existingSecret | default (include "meridian-runtime.databaseSecret" $) }}
                  key: {{ .Values.migrate.configKey | default .Values.conductor.database.key | default (include "meridian-runtime.migrateKey" $) }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: street
          image: "{{ .Values.image.repository }}:{{ .Values.street.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["meridian-street", "migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: MERIDIAN_STREET_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migrate.streetSecret | default .Values.migrate.existingSecret | default .Values.street.database.existingSecret | default (include "meridian-runtime.databaseSecret" $) }}
                  key: {{ .Values.migrate.streetKey | default .Values.street.database.key | default (include "meridian-runtime.migrateKey" $) }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: instrument
          image: "{{ .Values.image.repository }}:{{ .Values.instrument.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["meridian-instrument", "migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            {{/*
              The migrating credential, which is not the serving one: a
              component needs no right to alter a table. Defaults to the
              serving secret so a deployment that has not separated them still
              works, and says so rather than pretending they are separate.
            */}}
            - name: MERIDIAN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migrate.existingSecret | default (include "meridian-runtime.databaseSecret" $) }}
                  key: {{ include "meridian-runtime.migrateKey" $ }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
