{{- include "meridian-runtime.require" . -}}
{{- if .Values.dashboard.enabled }}
{{/*
  Not required, because a deployment nobody has set up does not know it yet:
  the address is one of the things the wizard asks for. What needs it is a
  directory, which sends people back to it after signing in, and the dashboard
  refuses to serve a directory without one rather than guessing.
*/}}
{{- if gt (int .Values.dashboard.replicaCount) 1 }}
{{- fail "dashboard.replicaCount must be 1: sessions live in the dashboard's memory, and a second replica would sign people out at random" }}
{{- end }}
{{/*
  The dashboard: the one address a firm's staff use. It signs people in
  through the firm's directory, holds no deployment key and no database, and
  reads who may do what from the conductor over the broker, as the instance
  dashboard.instanceId with the admin role's grants.
  spec/deployment-dashboard-and-access.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian-runtime.fullname" . }}-dashboard
  labels:
    meridian.dev/component: dashboard
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      meridian.dev/component: dashboard
  template:
    metadata:
      labels:
        {{- include "meridian-runtime.labels" . | nindent 8 }}
        meridian.dev/component: dashboard
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.dashboard.image.tag | default .Values.image.tag }}"
          args: ["meridian-dashboard"]
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MERIDIAN_INSTANCE_ID
              value: {{ .Values.dashboard.instanceId | quote }}
            - name: MERIDIAN_DASHBOARD_LISTEN
              value: "0.0.0.0:8080"
            {{- $addresses := .Values.identity.bundled.addressesSecretName }}
            {{- if .Values.dashboard.url }}
            - name: MERIDIAN_DASHBOARD_URL
              value: {{ .Values.dashboard.url | quote }}
            {{- else }}
            # What the wizard was told, rather than a value nobody has set yet.
            # Optional, because a deployment nobody has configured has no
            # address and serves its wizard without one.
            - name: MERIDIAN_DASHBOARD_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $addresses }}
                  key: dashboard-url
                  optional: true
            {{- end }}
            - name: MERIDIAN_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "meridian-runtime.brokerSecret" $ }}
                  key: {{ .Values.dashboard.brokerKey | default .Values.dashboard.instanceId }}
            {{- if .Values.identity.bundled.enabled }}
            {{- $oidc := printf "%s-dashboard-oidc" (include "meridian-runtime.fullname" .) }}
            # The bundled Zitadel: its external address is the issuer, and the
            # client and the audience it adds come from its setup Job.
            {{- if .Values.zitadel.zitadel.configmapConfig.ExternalDomain }}
            - name: MERIDIAN_OIDC_ISSUER
              value: {{ include "meridian-runtime.zitadelIssuer" . | quote }}
            {{- else }}
            # The address the wizard gave Zitadel, which is what Zitadel puts
            # in every token it issues.
            - name: MERIDIAN_OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ $addresses }}
                  key: issuer
                  optional: true
            {{- end }}
            # Optional, and that is what makes first run possible: the client
            # exists only once the setup Job has made one, which cannot happen
            # before somebody has configured Zitadel's database in the wizard.
            # Without these the dashboard starts and serves that wizard; a
            # required key would leave it unable to start at all
            # (spec/installation-and-first-run, requirement 6).
            - name: MERIDIAN_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc }}
                  key: client-id
                  optional: true
            - name: MERIDIAN_OIDC_TRUSTED_AUDIENCES
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc }}
                  key: trusted-audiences
                  optional: true
            # `groups` unless the wizard was told otherwise: right for Entra
            # ID, Okta and Zitadel, and wrong for a provider that puts them
            # under another name. It was hardcoded here until 2026-09-23, so
            # the answer the wizard collected reached nothing.
            - name: MERIDIAN_OIDC_GROUPS_CLAIM
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc }}
                  key: groups-claim
                  optional: true
            {{- else }}
            {{- with .Values.dashboard.oidc }}
            {{- if .issuer }}
            - name: MERIDIAN_OIDC_ISSUER
              value: {{ .issuer | quote }}
            - name: MERIDIAN_OIDC_CLIENT_ID
              value: {{ .clientId | quote }}
            - name: MERIDIAN_OIDC_GROUPS_CLAIM
              value: {{ .groupsClaim | default "groups" | quote }}
            {{- with .trustedAudiences }}
            - name: MERIDIAN_OIDC_TRUSTED_AUDIENCES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .existingSecret }}
            - name: MERIDIAN_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .secretKey | default "client-secret" }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
          # Ready only while the records are fresh: a dashboard that cannot read
          # who may do what is taken out rather than sending people to a
          # refusal. Alive is only that it answers at all, so a stale one is
          # not restarted into the same outage.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridian-runtime.fullname" . }}-dashboard
  labels:
    meridian.dev/component: dashboard
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    meridian.dev/component: dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
