{{- include "meridian-runtime.require" . -}}
{{- if .Values.dashboard.enabled }}
{{/*
  Not required, because a deployment nobody has set up does not know it yet:
  the address is one of the things the wizard asks for. What needs it is a
  directory, which sends people back to it after signing in, and the dashboard
  refuses to serve a directory without one rather than guessing.
*/}}
{{- if gt (int .Values.dashboard.replicaCount) 1 }}
{{- fail "dashboard.replicaCount must be 1: sessions live in the dashboard's memory, and a second replica would sign people out at random" }}
{{- end }}
{{/*
  The dashboard: the one address a firm's staff use. It signs people in
  through the firm's directory, holds no deployment key and no database, and
  reads who may do what from the conductor over the broker, as the instance
  dashboard.instanceId with the admin role's grants.
  spec/deployment-dashboard-and-access.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian-runtime.fullname" . }}-dashboard
  labels:
    meridian.dev/component: dashboard
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      meridian.dev/component: dashboard
  template:
    metadata:
      labels:
        {{- include "meridian-runtime.labels" . | nindent 8 }}
        meridian.dev/component: dashboard
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.dashboard.image.tag | default .Values.image.tag }}"
          args: ["meridian-dashboard"]
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MERIDIAN_INSTANCE_ID
              value: {{ .Values.dashboard.instanceId | quote }}
            - name: MERIDIAN_DASHBOARD_LISTEN
              value: "0.0.0.0:8080"
            {{- $addresses := .Values.firstRun.addressesSecretName }}
            {{- if .Values.dashboard.url }}
            - name: MERIDIAN_DASHBOARD_URL
              value: {{ .Values.dashboard.url | quote }}
            {{- else }}
            # What the wizard was told, rather than a value nobody has set yet.
            # Optional, because a deployment nobody has configured has no
            # address and serves its wizard without one.
            - name: MERIDIAN_DASHBOARD_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $addresses }}
                  key: dashboard-url
                  optional: true
            {{- end }}
            # The first administrator's account, where this deployment holds
            # it rather than a directory (decisions/018). Written by first run
            # as a hash; the dashboard makes the account at its next start if
            # it is not there. Optional on every key, because the other two
            # branches write none of them.
            - name: MERIDIAN_LOCAL_ACCOUNT_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ $addresses }}
                  key: local-account-name
                  optional: true
            - name: MERIDIAN_LOCAL_ACCOUNT_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ $addresses }}
                  key: administrator-password-hash
                  optional: true
            - name: MERIDIAN_LOCAL_ACCOUNT_DISPLAY_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ $addresses }}
                  key: administrator-display-name
                  optional: true
            # Whether this deployment holds its accounts at all, which first
            # run says; and where, which is the database every deployment has,
            # as the role the components serve as. The address alone decides
            # nothing, because every branch has one.
            - name: MERIDIAN_LOCAL_ACCOUNTS
              valueFrom:
                secretKeyRef:
                  name: {{ $addresses }}
                  key: local-accounts
                  optional: true
            - name: MERIDIAN_LOCAL_ACCOUNTS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "meridian-runtime.databaseSecret" $ }}
                  key: {{ .Values.database.key }}
                  optional: true
            # The firm's LDAP, bound by this dashboard itself
            # (decisions/018). Written by first run into the Secret the chart
            # names for it; optional on every key, because the other two
            # branches write none of them.
            {{- $ldap := .Values.firstRun.directorySecretName | default (printf "%s-ldap-bind" (include "meridian-runtime.fullname" .)) }}
            - name: MERIDIAN_LDAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: {{ $ldap }}
                  key: servers
                  optional: true
            - name: MERIDIAN_LDAP_BASE_DN
              valueFrom:
                secretKeyRef:
                  name: {{ $ldap }}
                  key: base-dn
                  optional: true
            - name: MERIDIAN_LDAP_BIND_DN
              valueFrom:
                secretKeyRef:
                  name: {{ $ldap }}
                  key: bind-dn
                  optional: true
            - name: MERIDIAN_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ldap }}
                  key: password
                  optional: true
            - name: MERIDIAN_LDAP_USER_FILTER
              valueFrom:
                secretKeyRef:
                  name: {{ $ldap }}
                  key: user-filter
                  optional: true
            - name: MERIDIAN_LDAP_START_TLS
              valueFrom:
                secretKeyRef:
                  name: {{ $ldap }}
                  key: start-tls
                  optional: true
            - name: MERIDIAN_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "meridian-runtime.brokerSecret" $ }}
                  key: {{ .Values.dashboard.brokerKey | default .Values.dashboard.instanceId }}
            {{/*
              The firm's own provider (decisions/018). Two ways it is known:
              the wizard writes it into this Secret, which is the ordinary
              route, or an administrator set it in values, which is the one
              that survives without a wizard. Values win, because somebody
              chose them on purpose.
            */}}
            {{- $oidc := printf "%s-dashboard-oidc" (include "meridian-runtime.fullname" .) }}
            {{- if .Values.dashboard.oidc.issuer }}
            - name: MERIDIAN_OIDC_ISSUER
              value: {{ .Values.dashboard.oidc.issuer | quote }}
            - name: MERIDIAN_OIDC_CLIENT_ID
              value: {{ .Values.dashboard.oidc.clientId | quote }}
            - name: MERIDIAN_OIDC_GROUPS_CLAIM
              value: {{ .Values.dashboard.oidc.groupsClaim | default "groups" | quote }}
            {{- with .Values.dashboard.oidc.trustedAudiences }}
            - name: MERIDIAN_OIDC_TRUSTED_AUDIENCES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.dashboard.oidc.existingSecret }}
            - name: MERIDIAN_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dashboard.oidc.existingSecret }}
                  key: {{ .Values.dashboard.oidc.secretKey | default "client-secret" }}
            {{- end }}
            {{- else }}
            {{/*
              Optional on every key, and that is what makes first run
              possible: none of them exists until somebody has been through
              the wizard, and a required key would leave the dashboard unable
              to start and therefore unable to serve the wizard that fills
              them (spec/installation-and-first-run, requirement 6).
            */}}
            - name: MERIDIAN_OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ $addresses }}
                  key: issuer
                  optional: true
            - name: MERIDIAN_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc }}
                  key: client-id
                  optional: true
            - name: MERIDIAN_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc }}
                  key: client-secret
                  optional: true
            - name: MERIDIAN_OIDC_TRUSTED_AUDIENCES
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc }}
                  key: trusted-audiences
                  optional: true
            # `groups` unless the wizard was told otherwise: right for Entra
            # ID and Okta, and wrong for a provider that puts them under
            # another name.
            - name: MERIDIAN_OIDC_GROUPS_CLAIM
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc }}
                  key: groups-claim
                  optional: true
            {{- end }}
            {{/*
              Plugins' pages, each on its own host below the dashboard's
              (decisions/021), sent to that instance's sidecar at the Service
              named for it. `{instance}` is filled in per request, never here.
            */}}
            - name: MERIDIAN_PLUGIN_FRONT_DOOR
              value: {{ printf "http://%s-sidecar-{instance}.%s.svc.cluster.local:%v" (include "meridian-runtime.fullname" .) .Release.Namespace .Values.sidecar.frontDoorPort | quote }}
            - name: MERIDIAN_DASHBOARD_SIGNING_KEY_DIR
              value: /etc/meridian/dashboard-signing
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
          # Read when first needed and kept once found, so the Job finishing
          # after this started needs no restart. Mounted whole for the same
          # reason: a subPath mount never sees an update.
          volumeMounts:
            - name: dashboard-signing
              mountPath: /etc/meridian/dashboard-signing
              readOnly: true
          # Ready only while the records are fresh: a dashboard that cannot read
          # who may do what is taken out rather than sending people to a
          # refusal. Alive is only that it answers at all, so a stale one is
          # not restarted into the same outage.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        # The private half, which only this pod mounts.
        - name: dashboard-signing
          secret:
            secretName: {{ include "meridian-runtime.fullname" . }}-dashboard-signing
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridian-runtime.fullname" . }}-dashboard
  labels:
    meridian.dev/component: dashboard
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    meridian.dev/component: dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
