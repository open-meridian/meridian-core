{{- include "meridian-runtime.require" . -}}
{{/*
  The analytics component (contract v26, W12): a coordinator that compiles
  a job, resolves its inputs on the client's behalf and answers, and a pool
  of workers taking units from the queue group they share. Its own image
  (meridian-analytics), from the same commit as the runtime's, and its own
  credential on the broker: its rows, and its own coordinator-to-worker
  topic, which no other credential carries.

  Stateless: no database, no key, no volume but readiness. A restart loses
  the jobs in flight and the answers held, and a client runs its job again
  (the one-API spec's Q12). Every copy, coordinator and worker, is one
  instance on the bus, `<release>-analytics`: the queue group their topics
  share, and the publisher the lake reads a job's client from.

  Always rendered: the broker's generated configuration names the
  component's credential whatever the values say, and a deployment's
  templates bind to its models (the first release's §1).
*/}}
{{- /* A sidecar renews its standing jobs every 20 seconds (W12.4), so a
       lease under 30 lets a job held lapse between two renewals. */}}
{{- if lt (int .Values.analytics.standing.leaseSeconds) 30 -}}
{{- fail (printf "analytics.standing.leaseSeconds is %v: a sidecar renews its standing jobs every 20 seconds, so the lease is 30 or more" .Values.analytics.standing.leaseSeconds) -}}
{{- end -}}
{{- if lt (int .Values.analytics.standing.most) 1 -}}
{{- fail "analytics.standing.most is under 1: a coordinator holds one standing job or more" -}}
{{- end }}
{{- $full := include "meridian-runtime.fullname" . }}
{{- range $part := list "coordinator" "worker" }}
{{- $values := index $.Values.analytics $part }}
{{- /* One of each by default, two of each in the HA profile (section 11). */}}
{{- $copies := include "meridian-runtime.copies" (dict "top" $ "value" $values.replicaCount "what" (printf "analytics.%s.replicaCount" $part)) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-analytics-{{ $part }}
  labels:
    meridian.dev/component: analytics-{{ $part }}
    {{- include "meridian-runtime.labels" $ | nindent 4 }}
spec:
  replicas: {{ $copies }}
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian-runtime.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      meridian.dev/component: analytics-{{ $part }}
  template:
    metadata:
      labels:
        {{- include "meridian-runtime.labels" $ | nindent 8 }}
        meridian.dev/component: analytics-{{ $part }}
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "meridian-runtime.nodeTolerations" $ | nindent 6 }}
      {{- if gt (int $copies) 1 }}
      {{- include "meridian-runtime.spread" (dict "top" $ "component" (printf "analytics-%s" $part)) | nindent 6 }}
      {{- end }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: analytics-{{ $part }}
          image: "{{ $.Values.analytics.image.repository | default (replace "meridian-runtime" "meridian-analytics" $.Values.image.repository) }}:{{ $.Values.analytics.image.tag | default $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: ["meridian-analytics", "{{ $part }}"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: MERIDIAN_INSTANCE_ID
              value: {{ $full }}-analytics
            - name: RUST_LOG
              value: {{ $.Values.logLevel | quote }}
            # Its working memory (stage M; the resilience spec's section 10a),
            # and glibc's arenas and mmap threshold, as every component's.
            {{- include "meridian-runtime.memoryEnv" (dict "top" $ "container" (printf "analytics-%s" $part) "values" $values "resources" $values.resources "heldMiB" 0 "name" "analytics") | nindent 12 }}
            {{- if gt (int (include "meridian-runtime.jetstreamReplicas" $)) 0 }}
            # The units' work queue on JetStream (step 3b).
            - name: MERIDIAN_ANALYTICS_UNITS
              value: jetstream
            {{- end }}
            - name: MERIDIAN_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "meridian-runtime.brokerSecret" $ }}
                  key: {{ if $.Values.broker.existingSecret }}{{ $.Values.broker.analyticsKey }}{{ else }}analytics{{ end }}
            {{- if eq $part "coordinator" }}
            - name: MERIDIAN_ANALYTICS_INLINE_MS
              value: {{ $.Values.analytics.inlineMs | quote }}
            - name: MERIDIAN_ANALYTICS_PRICE_DEADLINE_MS
              value: {{ $.Values.analytics.priceDeadlineMs | quote }}
            # Contract v30 (W12.4): standing jobs held by a sidecar's
            # renewals within the lease, at most so many a coordinator; and
            # this coordinator's name among the others, its pod's, which a
            # standing job's key is placed on (rendezvous hashing).
            - name: MERIDIAN_ANALYTICS_STANDING_LEASE_SECONDS
              value: {{ $.Values.analytics.standing.leaseSeconds | quote }}
            - name: MERIDIAN_ANALYTICS_STANDING_MOST
              value: {{ $.Values.analytics.standing.most | quote }}
            - name: MERIDIAN_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
            {{- include "meridian-runtime.readyEnv" $ | nindent 12 }}
            {{- with (include "meridian-runtime.internalTlsEnv" $) }}{{ . | nindent 12 }}{{- end }}
          {{- include "meridian-runtime.readyProbe" $ | nindent 10 }}
          volumeMounts:
            {{- include "meridian-runtime.readyMount" $ | nindent 12 }}
            {{- with (include "meridian-runtime.internalTlsMount" $) }}{{ . | nindent 12 }}{{- end }}
          resources:
            {{- toYaml $values.resources | nindent 12 }}
      volumes:
        {{- include "meridian-runtime.readyVolume" $ | nindent 8 }}
        {{- with (include "meridian-runtime.internalTlsVolume" $) }}{{ . | nindent 8 }}{{- end }}
{{- if gt (int $copies) 1 }}
{{ include "meridian-runtime.budget" (dict "top" $ "component" (printf "analytics-%s" $part)) }}
{{- end }}
{{- end }}
