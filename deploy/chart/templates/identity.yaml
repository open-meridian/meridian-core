{{- include "meridian-runtime.require" . -}}
{{- if .Values.identity.bundled.enabled }}
{{/*
  The bundled Zitadel's part of this chart (spec, rulings 14 to 16). Zitadel
  itself is its own chart, a dependency; this is what Meridian adds around it:
  the version check, the master key, the two Secrets the setup Job fills, the
  Job and the only permissions it holds, the group hook, and the policies
  saying who may reach what.
*/}}
{{- $minimum := "4.17.3" }}
{{- $z := .Values.zitadel }}
{{- $tag := $z.image.tag | default "" }}
{{- if not $tag }}
{{- fail "zitadel.image.tag is not set. The bundled Zitadel's version is yours to choose and to change; this chart never picks one for you (ruling 16)." }}
{{- end }}
{{- if ne $tag ($z.login.image.tag | default "") }}
{{- fail (printf "zitadel.login.image.tag must equal zitadel.image.tag (%s): Zitadel and its login page are one version" $tag) }}
{{- end }}
{{- if not (semverCompare (printf ">=%s" $minimum) (trimPrefix "v" $tag)) }}
{{- fail (printf "this Meridian release needs Zitadel %s or newer, and zitadel.image.tag is %s. It will not upgrade Zitadel for you: back up Zitadel's database, then set both tags to v%s or newer" $minimum $tag $minimum) }}
{{- end }}
{{- $domain := $z.zitadel.configmapConfig.ExternalDomain | default "" }}
{{- if not $domain }}
{{- fail "zitadel.zitadel.configmapConfig.ExternalDomain is not set: it is Zitadel's public host, and the dashboard's issuer" }}
{{- end }}
{{- if not .Values.dashboard.enabled }}
{{- fail "identity.bundled.enabled needs dashboard.enabled: the bundled Zitadel exists to sign people in to the dashboard" }}
{{- end }}
{{- if not .Values.identity.bundled.egress.allowCidrs }}
{{- fail "identity.bundled.egress.allowCidrs is empty. List where Zitadel may connect besides the group hook and DNS -- its database, and the LDAP directory if any -- or it can reach neither" }}
{{- end }}
{{- $ldap := .Values.identity.bundled.ldap }}
{{- if and $ldap.enabled (or (not $ldap.servers) (not $ldap.baseDn) (not $ldap.bindDn) (not $ldap.bindPasswordSecret)) }}
{{- fail "identity.bundled.ldap needs servers, baseDn, bindDn and bindPasswordSecret" }}
{{- end }}
{{- $full := include "meridian-runtime.fullname" . }}
{{- $zitadel := printf "%s-zitadel" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $oidc := printf "%s-dashboard-oidc" $full }}
{{- $hook := printf "%s-group-hook" $full }}
{{- $system := .Values.identity.bundled.systemUserSecretName }}
{{- $masterkey := lookup "v1" "Secret" .Release.Namespace $z.zitadel.masterkeySecretName }}
---
# Made once and never regenerated: a new key would leave Zitadel's database
# unreadable in part. Kept when the release is uninstalled.
#
# A hook ahead of Zitadel's own (its init and setup run at weights 1 and 2),
# because they read it before any ordinary resource exists. On an upgrade it
# is recreated with the key it already held, read back through lookup.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $z.zitadel.masterkeySecretName }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  masterkey: {{ if $masterkey }}{{ index $masterkey.data "masterkey" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
{{- range $name := list $oidc $hook }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $name }}
---
# Filled by the setup Job, which may update these and nothing else. Made here
# because RBAC cannot narrow `create` to a name; rendered with what it already
# holds, so an upgrade never empties it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- if and $existing $existing.data }}
data:
  {{- toYaml $existing.data | nindent 2 }}
{{- end }}
{{- end }}
---
# Zitadel's own init and setup, run by us rather than by its chart's hooks.
#
# Its chart runs both as pre-install and pre-upgrade hooks, and a hook must
# succeed before any ordinary resource exists. On a fresh install Zitadel's
# database is not configured until somebody has been through the first-run
# wizard, which the dashboard serves, which a hook would be waiting in front
# of: the install would deadlock on itself
# (spec/installation-and-first-run, requirement 6). So its hooks are turned
# off in values and this waits instead. A container whose Secret has no key
# yet does not start, and starts when the key appears.
#
# `init` creates the schema in the database the administrator made, and
# `setup` creates the first instance. Both are init containers, so the order
# is Kubernetes' rather than a retry loop's, and the Job holds no permissions
# at all: what setup needs to administer Zitadel afterwards is the system
# user's key, which the chart made and Zitadel already trusts.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}-identity-bootstrap-{{ .Release.Revision }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "meridian-runtime.labels" . | nindent 8 }}
        meridian.dev/component: identity-bootstrap
    spec:
      restartPolicy: OnFailure
      # No security context of ours: this runs Zitadel's own image, which has
      # its own user, and forcing runAsNonRoot with no uid stopped it starting
      # once already. An OpenShift override belongs in Zitadel's values, where
      # its other containers read it.
      initContainers:
        # The schema, inside the database the administrator made for Zitadel.
        # Its own role owns that database and may not make another, so this is
        # the only part of Zitadel's `init` that can run here.
        - name: init
          image: "{{ $z.image.repository }}:{{ $tag }}"
          imagePullPolicy: {{ $z.image.pullPolicy | default "IfNotPresent" }}
          args: ["init", "zitadel", "--config", "/config/zitadel-config-yaml"]
          env:
            {{- toYaml $z.env | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      containers:
        - name: setup
          image: "{{ $z.image.repository }}:{{ $tag }}"
          imagePullPolicy: {{ $z.image.pullPolicy | default "IfNotPresent" }}
          args:
            - setup
            - --masterkeyFromEnv
            - --config
            - /config/zitadel-config-yaml
            - --steps
            - /config/zitadel-config-yaml
          env:
            - name: ZITADEL_MASTERKEY
              valueFrom:
                secretKeyRef:
                  name: {{ $z.zitadel.masterkeySecretName }}
                  key: masterkey
            {{- toYaml $z.env | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $zitadel }}-config-yaml
{{- $existing := lookup "v1" "Secret" .Release.Namespace $system }}
{{- $pair := genSelfSignedCert "meridian-setup" nil nil 3650 }}
---
# The system API user's key pair, made once by this chart.
#
# Zitadel's first instance mints an administrator token exactly once, and a
# deployment that loses it cannot administer its own directory: the only way
# back is an empty database, which the first trial of the bootstrap Job proved
# by losing one. A system API user has no such moment. Zitadel holds the public
# half in its configuration, setup signs a short-lived JWT with the private
# half whenever it runs, and losing a token means signing another.
#
# Wrapped in a self-signed certificate rather than a bare public key, which is
# what Zitadel recommends for exactly this: a Secret holds both halves and the
# certificate is what gets mounted.
#
# Kept when the release goes, and rendered with what it already holds, because
# regenerating the pair would leave Zitadel trusting a key nothing has.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $system }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ if $existing }}{{ index $existing.data "tls.crt" }}{{ else }}{{ $pair.Cert | b64enc }}{{ end }}
  tls.key: {{ if $existing }}{{ index $existing.data "tls.key" }}{{ else }}{{ $pair.Key | b64enc }}{{ end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-identity-setup
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
---
# The setup Job's only permissions: read and update the two Secrets it fills.
# Not create, not list, not any other Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $full }}-identity-setup
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $oidc | quote }}, {{ $hook | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $full }}-identity-setup
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $full }}-identity-setup
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $full }}-identity-setup
  apiGroup: rbac.authorization.k8s.io
---
# Sets Zitadel up for the dashboard on every install and upgrade,
# idempotently. It alone holds Zitadel's admin token, for as long as it runs.
#
# Not a post-install hook: Helm runs those only once everything is ready, and
# the dashboard and the group hook cannot be ready until this has written
# their Secrets. So it runs beside the rollout, waits for Zitadel, and the two
# start as soon as their Secrets fill. Named for the revision because a Job's
# template cannot change in place; each is removed an hour after it ends.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}-identity-setup-{{ .Release.Revision }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "meridian-runtime.labels" . | nindent 8 }}
        meridian.dev/component: identity-setup
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $full }}-identity-setup
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: setup
          image: "{{ .Values.image.repository }}:{{ .Values.dashboard.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["meridian-group-hook", "setup"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: MERIDIAN_ZITADEL_API_URL
              value: "http://{{ $zitadel }}:8080"
            - name: MERIDIAN_ZITADEL_HOST
              value: {{ $domain | quote }}
            # A file rather than an env reference: Zitadel writes the token
            # with a trailing newline, and the file is read and trimmed once
            # it appears rather than failing the pod while it does not.
            - name: MERIDIAN_ZITADEL_SYSTEM_USER
              value: meridian-setup
            - name: MERIDIAN_ZITADEL_SYSTEM_USER_KEY_FILE
              value: /var/run/zitadel/tls.key
            # What Zitadel checks the credential's audience against: the
            # issuer it states, never the address this dials.
            - name: MERIDIAN_ZITADEL_ISSUER
              value: {{ include "meridian-runtime.zitadelIssuer" . | quote }}
            # First run can sit at the wizard for as long as the administrator
            # takes, and Zitadel's database is configured there. So this waits
            # an hour for the key rather than the three minutes an already
            # configured deployment needs.
            - name: MERIDIAN_SETUP_WAIT_SECONDS
              value: "3600"
            - name: MERIDIAN_DASHBOARD_REDIRECT_URI
              value: {{ printf "%s/callback" (trimSuffix "/" .Values.dashboard.url) | quote }}
            - name: MERIDIAN_GROUP_HOOK_URL
              value: "http://{{ $hook }}:8090"
            # Zitadel refuses an http redirect address unless the client is in
            # development mode: on only when the dashboard is served over http,
            # which is a developer's machine and nowhere else.
            - name: MERIDIAN_ZITADEL_DEV_MODE
              value: {{ hasPrefix "http://" .Values.dashboard.url | quote }}
            - name: MERIDIAN_ZITADEL_ROLES
              value: {{ join "," .Values.identity.bundled.roles | quote }}
            {{- if $ldap.enabled }}
            - name: MERIDIAN_LDAP_NAME
              value: {{ $ldap.name | quote }}
            - name: MERIDIAN_LDAP_SERVERS
              value: {{ join "," $ldap.servers | quote }}
            - name: MERIDIAN_LDAP_START_TLS
              value: {{ $ldap.startTls | quote }}
            - name: MERIDIAN_LDAP_BASE_DN
              value: {{ $ldap.baseDn | quote }}
            - name: MERIDIAN_LDAP_BIND_DN
              value: {{ $ldap.bindDn | quote }}
            - name: MERIDIAN_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ldap.bindPasswordSecret }}
                  key: {{ $ldap.bindPasswordKey }}
            - name: MERIDIAN_LDAP_USER_OBJECT_CLASS
              value: {{ $ldap.userObjectClass | quote }}
            - name: MERIDIAN_LDAP_USER_FILTER
              value: {{ $ldap.userFilter | quote }}
            {{- end }}
            - name: MERIDIAN_SETUP_OUTPUT
              value: "secrets:{{ $oidc }},{{ $hook }}"
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
          volumeMounts:
            - name: system-user
              mountPath: /var/run/zitadel
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: system-user
          secret:
            secretName: {{ $system }}
            optional: true
---
# The group hook: Zitadel's Actions v2 target. Holds its targets' signing
# keys, reaches nothing, and is reached only by Zitadel.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $hook }}
  labels:
    meridian.dev/component: group-hook
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      meridian.dev/component: group-hook
  template:
    metadata:
      labels:
        {{- include "meridian-runtime.labels" . | nindent 8 }}
        meridian.dev/component: group-hook
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: group-hook
          image: "{{ .Values.image.repository }}:{{ .Values.dashboard.image.tag | default .Values.image.tag }}"
          args: ["meridian-group-hook"]
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8090
          env:
            {{- range $key, $var := dict "intent-signing-key" "MERIDIAN_GROUP_HOOK_INTENT_SIGNING_KEY" "token-signing-key" "MERIDIAN_GROUP_HOOK_TOKEN_SIGNING_KEY" "project-id" "MERIDIAN_GROUP_HOOK_PROJECT_ID" }}
            - name: {{ $var }}
              valueFrom:
                secretKeyRef:
                  name: {{ $hook }}
                  key: {{ $key }}
            {{- end }}
            - name: MERIDIAN_SAML_GROUPS_ATTRIBUTE
              value: {{ .Values.identity.bundled.saml.groupsAttribute | quote }}
            - name: MERIDIAN_SAML_USERNAME_ATTRIBUTE
              value: {{ .Values.identity.bundled.saml.usernameAttribute | quote }}
            - name: MERIDIAN_SAML_GIVEN_NAME_ATTRIBUTE
              value: {{ .Values.identity.bundled.saml.givenNameAttribute | quote }}
            - name: MERIDIAN_SAML_FAMILY_NAME_ATTRIBUTE
              value: {{ .Values.identity.bundled.saml.familyNameAttribute | quote }}
            - name: MERIDIAN_SAML_EMAIL_ATTRIBUTE
              value: {{ .Values.identity.bundled.saml.emailAttribute | quote }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $hook }}
  labels:
    meridian.dev/component: group-hook
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    meridian.dev/component: group-hook
  ports:
    - name: http
      port: 8090
      targetPort: http
---
# The hook is on the access path: what it writes becomes people's groups. So
# only Zitadel may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $hook }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      meridian.dev/component: group-hook
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zitadel
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: start
      ports:
        - port: 8090
  # Nothing: the hook calls nobody.
  egress: []
---
# Zitadel's server may call the group hook, DNS, and the addresses you listed
# -- its database and directory -- and nothing else. This is what bounds the
# narrowed webhook deny list. Only the server (component "start"): Zitadel's
# own init and setup jobs carry the same name, and its setup writes a Secret
# through the Kubernetes API, which this would cut off.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $zitadel }}-egress
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: start
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              meridian.dev/component: group-hook
      ports:
        - port: 8090
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        {{- range .Values.identity.bundled.egress.allowCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
{{- end }}
