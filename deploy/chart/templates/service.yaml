{{- include "meridian-runtime.require" . -}}
# Where a plugin pod dials.
#
# One port and nothing else. The runtime serves no HTTP: it reaches the platform
# outbound and needs nothing inbound except this.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridian-runtime.fullname" . }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: sidecar
      port: {{ .Values.sidecar.port }}
      targetPort: sidecar
