{{- include "meridian-runtime.require" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian-runtime.fullname" . }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "meridian-runtime.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: replica
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: MERIDIAN_DEPLOYMENT_ID
              value: {{ .Values.deployment.id | quote }}
            - name: MERIDIAN_PLATFORM_ADDRESS
              value: {{ .Values.platform.address | quote }}
            - name: MERIDIAN_KEY_PATH
              value: /etc/meridian/key.pem
            - name: MERIDIAN_SIDECAR_ADDRESS
              value: {{ .Values.sidecar.address | quote }}
            - name: MERIDIAN_PLUGIN_INSTANCE_ID
              value: {{ .Values.sidecar.plugin.instanceId | quote }}
            - name: MERIDIAN_PLUGIN_ROLE
              value: {{ .Values.sidecar.plugin.role | quote }}
            - name: MERIDIAN_PLUGIN_TAGS
              value: {{ join "," .Values.sidecar.plugin.tags | quote }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: MERIDIAN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.key }}
          # No port. The sidecar binds loopback, so a plugin reaches it by
          # running as a second container in this pod and sharing the network
          # namespace. A containerPort would advertise something no pod outside
          # this one can reach, and a Service in front of it would put the
          # boundary on the network, which is what it exists to prevent.
          volumeMounts:
            # One directory holding both files, because the runtime reads them
            # from fixed paths there. Two volumes cannot do it: mounting the
            # grants file inside the key's mount is a mount onto a mount, and
            # the container refuses to start with a message about directories.
            #
            # Read-only, because the replica only generates a key when it has
            # none, and in a cluster it always has one: you made it.
            - name: config
              mountPath: /etc/meridian
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: {{ .Values.key.existingSecret }}
                  items:
                    - key: {{ .Values.key.key }}
                      path: key.pem
              {{- if .Values.grants.existingConfigMap }}
              - configMap:
                  name: {{ .Values.grants.existingConfigMap }}
                  items:
                    - key: {{ .Values.grants.key }}
                      path: grants.json
              {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
