{{- include "meridian-runtime.require" . -}}
{{- if .Values.database.brought.enabled }}
{{/*
  A Postgres the deployment can bring, for a firm evaluating this and for a
  developer on a laptop.

  Rendered at zero replicas and started only if somebody chooses it in the
  wizard. That is what keeps decisions/016: at zero there is no claim and no
  disk, because the claim comes from the StatefulSet's own volumeClaimTemplate
  and the StatefulSet controller makes it when it scales. Nothing in the
  deployment creates a resource in its own cluster; the first-run Job scales,
  which is a right it already holds.

  A StatefulSet rather than a Deployment with a claim beside it, for that
  reason alone: a claim rendered next to a Deployment exists whether or not
  anybody wanted a database.

  It carries no `helm.sh/resource-policy: keep`, deliberately. The data is
  already safe from `helm uninstall` twice over -- the claim comes from the
  volumeClaimTemplate, so Helm never created it and never deletes it, and
  Kubernetes retains a StatefulSet's claims when the StatefulSet goes. Keeping
  the StatefulSet as well would only mean a Postgres still running after
  somebody removed Meridian, which is not what removing it should leave
  behind. Installing again re-binds the same disk: the claim's name is made
  from the StatefulSet's, so there is one to find.

  The passwords beside it are kept, because the roles inside that retained
  database still hold them.

  This is not what a firm runs its books on, and the wizard says so where it
  is chosen. A database the chart owns is a database whose backups are
  whoever remembers. `database.brought.enabled=false` renders none of it.
*/}}
{{- $full := include "meridian-runtime.fullname" . }}
{{- $name := printf "%s-database" $full }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-passwords" $name) }}
{{- $held := dict }}
{{- if $existing }}{{ $held = ($existing.data | default dict) }}{{ end }}
{{- $standbys := int (include "meridian-runtime.databaseStandbys" .) }}
{{- /* Its record-read replicas (contract v30, stage C): members past the
       primary and its standbys, asynchronous, tagged nosync and nofailover. */}}
{{- $readReplicas := int (include "meridian-runtime.databaseReadReplicas" .) }}
{{- $live := lookup "apps/v1" "StatefulSet" .Release.Namespace $name }}
{{/*
  Two ways to run it (step 3b; spec/a-deployment-scales-out-and-fails-over-
  by-configuration section 4, question 4). Alone, as it always has, from
  postgres:16-alpine, restarted on its volume (the tolerant default and the
  desktop). Or under Patroni, from database.brought.patroniImage -- the same
  Postgres with Patroni and pgBackRest -- as a primary and
  database.brought.standbys standbys, each on its own volume, a quorum of
  either synchronous and strict (ANY 1; contract v30, stage C), so losing one
  neither stalls nor slows a commit and a primary cut off from both cannot
  acknowledge one alone; Patroni keeps its state in this namespace's
  ConfigMaps and the members' labels, under a namespaced Role (no CRD, no
  cluster-wide right: decisions/016), and the Service follows the primary's
  label. Once a database has run under Patroni it stays under it, standbys
  or none: its data directory is Patroni's.
*/}}
{{- $wasPatroni := eq (dig "spec" "template" "metadata" "labels" "meridian.dev/database-manager" "" (default (dict) $live)) "patroni" }}
{{- $patroni := or (gt $standbys 0) (gt $readReplicas 0) $wasPatroni }}
{{- /* Moving under Patroni from alone, in the first of two upgrades (see
       the StatefulSet's replicas): member 0 runs alone, so nothing waits
       for a synchronous standby it does not have yet -- strict, every
       commit would wait, and the connections waiting filled the server. */}}
{{- $running := dig "spec" "replicas" 0 (default (dict) $live) }}
{{- $converting := and (gt (int $running) 0) (gt (add $standbys $readReplicas) 0) (not $wasPatroni) }}
{{- $synchronous := ternary 0 $standbys $converting }}
{{- $scope := $name | trunc 63 | trimSuffix "-" }}
{{- $archive := include "meridian-runtime.walArchive" . }}
{{- /* Internal TLS (tls.internal; ruling 1084): served from the chart's
       certificate, copied where the server's user alone reads its key, and
       every remote connection held to TLS. */}}
{{- $tls := .Values.tls.internal.enabled }}
---
# Made once and kept. These and the disk beside them are a pair, and the
# reason is Postgres's: POSTGRES_PASSWORD is read by initdb on an empty data
# directory and ignored on one that already holds a database. So a superuser
# password regenerated over a surviving disk is a database nothing can open --
# not the components, and not the Job that would repair them.
#
# Which is why this is kept, and why it is generated rather than fixed. A
# default password would be one printed in a public chart and used by every
# install; the network policy beside this is not a reason to publish one.
#
# Deleting this Secret while keeping the disk is the one combination that
# breaks, and it is recoverable only from inside the pod, where the socket
# admits the postgres user without one:
#
#   kubectl exec -n <ns> <release>-meridian-runtime-database-0 -- \
#     psql -U postgres -c "alter user postgres password '<the new one>'"
#
# Nobody types these and nobody is shown them: the wizard offers a database,
# the Job makes the roles with them, and the URLs it writes are what the
# components read.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-passwords
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  superuser: {{ index $held "superuser" | default (randAlphaNum 32 | b64enc) }}
  serving: {{ index $held "serving" | default (randAlphaNum 32 | b64enc) }}
  migrating: {{ index $held "migrating" | default (randAlphaNum 32 | b64enc) }}
  # Patroni's REST API's, which members ask each other for their positions
  # and the chart's start-up asks to hold the dynamic settings to the
  # chart's. Made beside the others on any install, used under Patroni.
  patroni: {{ index $held "patroni" | default (randAlphaNum 32 | b64enc) }}
  # The WAL archive's passphrase (backup.walArchive, ruling 1084), unless
  # backup.walArchive.cipherSecret names the administrator's own. Made on
  # any install, used where the archive is on, and carried sealed in every
  # backup with the rest of this Secret.
  archive: {{ index $held "archive" | default (randAlphaNum 64 | b64enc) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    meridian.dev/component: database
    {{- if $patroni }}
    # The primary alone: Patroni labels each member with its role, and moves
    # the label with a failover, so every store's next connection reaches
    # the promoted primary at the same address.
    meridian.dev/database-role: primary
    {{- end }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    {{- if $archive }}
    # pgBackRest's server on the primary, which the backup Job takes base
    # backups through, over TLS with the chart's certificates.
    - name: archive
      port: 8432
      targetPort: 8432
    {{- end }}
{{- if $patroni }}
---
# Every member by its own name (`<name>-0.<name>-members`), which Patroni's
# standbys stream from and its members' REST APIs answer at.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-members
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    meridian.dev/component: database
  ports:
    - name: postgres
      port: 5432
    - name: patroni
      port: 8008
{{- if $tls }}
{{- range $i := until 3 }}
---
# Member {{ $i }} by a name of its own (`<name>-{{ $i }}.<namespace>.svc`), which its
# certificate carries: Patroni's members reach each other's REST API by it
# over TLS, each verified by that name (ruled 2026-11-08). A Service per
# member, because a StatefulSet's pods have DNS names only under the
# Service it was made with, which here is the primary's.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-{{ $i }}
  labels:
    {{- include "meridian-runtime.labels" $ | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "meridian-runtime.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    meridian.dev/component: database
    statefulset.kubernetes.io/pod-name: {{ $name }}-{{ $i }}
  ports:
    - name: patroni
      port: 8008
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
---
# Patroni's one right: its own state, in this namespace's ConfigMaps
# (`<name>-leader`, `-config`, `-sync`, `-failover`), and its members' role
# labels. Namespaced; nothing cluster-wide (decisions/016).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
---
# How Patroni runs this database: the static half. Its timing is set for
# the database tier, a primary lost answered for within 30 s (ruling 1048):
# its leader key lasts `ttl` (Patroni's least, 20 s) unrenewed, renewed every
# `loop_wait` (2 s). The dynamic half -- synchronous, strict, the timings --
# lives in Patroni's ConfigMap once it has started, and is held to these
# values by every member's start (files/database.sh).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-patroni
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
data:
  database.sh: |
    {{- .Files.Get "files/database.sh" | nindent 4 }}
  {{- range $i := until $readReplicas }}
  # A record-read replica (contract v30, stage C): its own Patroni tags,
  # laid over the static half by database.sh for this member alone.
  read-replica-{{ $name }}-{{ add 1 $standbys $i }}: |
    tags:
      nosync: true
      nofailover: true
  {{- end }}
  patroni.yml: |
    scope: {{ $scope }}
    restapi:
      listen: 0.0.0.0:8008
    kubernetes:
      use_endpoints: false
      bypass_api_service: false
      scope_label: meridian.dev/database-scope
      role_label: meridian.dev/database-role
      leader_label_value: primary
      follower_label_value: replica
      standby_leader_label_value: primary
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        meridian.dev/component: database
    bootstrap:
      dcs:
        {{- include "meridian-runtime.patroniDynamic" (dict "top" . "standbys" $synchronous) | nindent 8 }}
      # Page checksums on every database made here (step 3b, 5j): Postgres
      # 16 makes none by default.
      initdb:
        - data-checksums
        - encoding: UTF8
    postgresql:
      listen: 0.0.0.0:5432
      data_dir: /var/lib/postgresql/data/pgdata
      bin_dir: /usr/local/bin
      pgpass: /tmp/pgpass
      {{- if or $archive $tls }}
      parameters:
        {{- if $archive }}
        # The WAL archived off the cluster by whichever member is primary,
        # each segment as it fills or after backup.walArchive.timeoutSeconds
        # (step 3b, section 4): local settings, which Patroni lays over its
        # dynamic ones.
        archive_mode: "on"
        archive_command: pgbackrest --stanza=meridian archive-push %p
        archive_timeout: {{ .Values.backup.walArchive.timeoutSeconds | default 60 | int }}
        {{- end }}
        {{- if $tls }}
        # Internal TLS (ruling 1084): the chart's certificate, copied by
        # database.sh where the server's user alone reads its key.
        ssl: "on"
        ssl_cert_file: /run/meridian-tls/tls.crt
        ssl_key_file: /run/meridian-tls/tls.key
        ssl_ca_file: /run/meridian-tls/ca.crt
        {{- end }}
      {{- end }}
      authentication:
        superuser:
          username: postgres
        replication:
          username: postgres
          {{- if $tls }}
          # A standby streams from its primary over TLS, the primary
          # verified against the internal CA. By its chain, not its name:
          # members reach each other by their pods' addresses, which no
          # certificate names.
          sslmode: verify-ca
          sslrootcert: /run/meridian-tls/ca.crt
          {{- end }}
        rewind:
          username: postgres
          {{- if $tls }}
          sslmode: verify-ca
          sslrootcert: /run/meridian-tls/ca.crt
          {{- end }}
      pg_hba:
        - local all all trust
        - host all all 127.0.0.1/32 trust
        {{- if $tls }}
        # Over TLS or not at all, from anywhere but this pod.
        - hostnossl all all 0.0.0.0/0 reject
        - hostnossl all all ::/0 reject
        - hostnossl replication all 0.0.0.0/0 reject
        - hostssl replication postgres 0.0.0.0/0 scram-sha-256
        - hostssl all all 0.0.0.0/0 scram-sha-256
        - hostssl all all ::/0 scram-sha-256
        {{- else }}
        - host replication postgres 0.0.0.0/0 scram-sha-256
        - host all all 0.0.0.0/0 scram-sha-256
        - host all all ::/0 scram-sha-256
        {{- end }}
{{- end }}
{{- if and $tls (not $patroni) }}
---
# Who may connect, alone and over TLS (tls.internal; ruling 1084): the
# server's own pod as the image's initdb admits it, and everyone else over
# TLS or not at all.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-hba
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
data:
  pg_hba.conf: |
    local all all trust
    host all all 127.0.0.1/32 trust
    host all all ::1/128 trust
    local replication all trust
    host replication all 127.0.0.1/32 trust
    host replication all ::1/128 trust
    hostnossl all all all reject
    hostnossl replication all all reject
    hostssl all all all scram-sha-256
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  # Zero until the wizard says otherwise. Every other component in this chart
  # waits at a Secret key; this one waits at a replica count, because what it
  # waits for is a choice rather than a credential.
  #
  # And zero only on the way in. The wizard's Job scales this to one when
  # somebody chooses it, so a later `helm upgrade` that rendered zero again
  # would stop the database underneath a running deployment -- the chart
  # undoing a choice it asked somebody to make. Reading the live count keeps
  # it. `lookup` answers nothing when there is no cluster to ask, which is
  # every `helm template` and every dry run, and zero is the right answer
  # there because that is what a fresh install gets.
  #
  # Once chosen, its members: the primary and database.brought.standbys
  # (step 3b), so turning the profile up or down is a scale.
  #
  # The database moves under Patroni in two upgrades: this one moves member
  # 0, alone; a second with the same values adds its standbys, which clone
  # from it. `meridian upgrade-deployment` runs both under one approval, the
  # second once this one has rolled out and member 0 is ready. With helm
  # directly, wait for `kubectl rollout status statefulset/<db>` and upgrade
  # again with the same values (NOTES.txt says so). In one upgrade, the
  # standbys started before member 0 was moved, and the first of them made
  # a new, empty cluster that the Service then followed (step 3b part 3,
  # found by e2e-cluster-reconfigure).
  replicas: {{ if gt (int $running) 0 }}{{ if $converting }}1{{ else }}{{ add 1 $standbys $readReplicas }}{{ end }}{{ else }}0{{ end }}
  serviceName: {{ $name }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      meridian.dev/component: database
  template:
    metadata:
      {{- if $archive }}
      # The database's own container for `kubectl exec`, beside the archive's.
      annotations:
        kubectl.kubernetes.io/default-container: postgres
      {{- end }}
      # Not the release's version: postgres is the same image whichever
      # release this is, and a label that changes restarts it (see _helpers).
      labels:
        {{- include "meridian-runtime.unversionedLabels" . | nindent 8 }}
        meridian.dev/component: database
        {{- if $patroni }}
        meridian.dev/database-manager: patroni
        meridian.dev/database-scope: {{ $scope }}
        {{- end }}
    spec:
      {{- if $patroni }}
      serviceAccountName: {{ $name }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if gt (add $standbys $readReplicas) 0 }}
      {{- include "meridian-runtime.spread" (dict "top" . "component" "database") | nindent 6 }}
      {{- end }}
      {{- else }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.zones (not .Values.affinity) }}
      # Within the zones named, as its standbys would be: its volume is made
      # on the node it first runs on, and a database turned up to standbys
      # later is held to the zones.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      {{- toYaml .Values.zones | nindent 22 }}
      {{- end }}
      {{- end }}
      containers:
        - name: postgres
          {{- /* The archive's pgBackRest is in the image Patroni runs in,
                 so a database archiving its WAL runs from it, alone or not. */}}
          image: {{ if or $patroni $archive }}{{ .Values.database.brought.patroniImage | quote }}{{ else }}{{ .Values.database.brought.image | quote }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if $patroni }}
          command: ["/bin/sh", "/etc/patroni/database.sh"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PATRONI_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PATRONI_KUBERNETES_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: PATRONI_KUBERNETES_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Where the other members reach this one: its standbys stream
            # from it by its pod's address, and Patroni asks its REST API
            # there too -- or, with internal TLS, by its own Service's name,
            # over TLS, its certificate verified by that name against the
            # internal CA (ruled 2026-11-08). Patroni asks the other members
            # with the same CA (its ctl cacert).
            - name: PATRONI_POSTGRESQL_CONNECT_ADDRESS
              value: "$(POD_IP):5432"
            {{- if $tls }}
            - name: PATRONI_RESTAPI_CONNECT_ADDRESS
              value: "$(POD_NAME).{{ .Release.Namespace }}.svc.cluster.local:8008"
            - name: PATRONI_RESTAPI_CERTFILE
              value: /run/meridian-tls/tls.crt
            - name: PATRONI_RESTAPI_KEYFILE
              value: /run/meridian-tls/tls.key
            - name: PATRONI_CTL_CACERT
              value: /run/meridian-tls/ca.crt
            {{- else }}
            - name: PATRONI_RESTAPI_CONNECT_ADDRESS
              value: "$(POD_IP):8008"
            {{- end }}
            - name: PATRONI_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-passwords
                  key: superuser
            - name: PATRONI_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-passwords
                  key: superuser
            - name: PATRONI_REWIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-passwords
                  key: superuser
            - name: PATRONI_RESTAPI_USERNAME
              value: patroni
            - name: PATRONI_RESTAPI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-passwords
                  key: patroni
            - name: PATRONI_DYNAMIC
              value: {{ include "meridian-runtime.patroniDynamic" (dict "top" . "standbys" $synchronous) | fromYaml | toJson | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- if $archive }}
            {{- include "meridian-runtime.walArchiveEnv" . | nindent 12 }}
            {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
            - name: patroni
              containerPort: 8008
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8008
              {{- if $tls }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8008
              {{- if $tls }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: patroni
              mountPath: /etc/patroni
              readOnly: true
            {{- if $tls }}
            - name: internal-tls-server
              mountPath: /etc/meridian-internal-tls-server
              readOnly: true
            {{- end }}
            {{- if $archive }}
            - name: socket
              mountPath: /var/run/postgresql
            {{- include "meridian-runtime.walArchiveMounts" (dict "top" . "role" "database") | nindent 12 }}
            {{- end }}
          resources:
            {{- include "meridian-runtime.databaseResources" . | nindent 12 }}
          {{- else }}
          {{- if $tls }}
          # Internal TLS (ruling 1084): the chart's certificate copied where
          # the server's user alone reads its key, as Postgres requires of
          # one, then the image's own entrypoint.
          command:
            - /bin/sh
            - -c
            - >-
              mkdir -p /run/meridian-tls &&
              cp /etc/meridian-internal-tls-server/ca.crt /etc/meridian-internal-tls-server/tls.crt /etc/meridian-internal-tls-server/tls.key /run/meridian-tls/ &&
              chmod 0600 /run/meridian-tls/tls.key &&
              { [ "$(id -u)" != 0 ] || chown -R postgres:postgres /run/meridian-tls; } &&
              exec docker-entrypoint.sh "$@"
            - --
          {{- end }}
          # Its connections counted from what this chart deploys
          # (databaseMaxConnections, ruled 2026-11-08), not Postgres's 100.
          args:
            - postgres
            - -c
            - max_connections={{ include "meridian-runtime.databaseMaxConnections" . }}
            {{- if $archive }}
            # Archiving its WAL (backup.walArchive): the image's own
            # entrypoint and server, told to archive through pgBackRest.
            - -c
            - archive_mode=on
            - -c
            - archive_command=pgbackrest --stanza=meridian archive-push %p
            - -c
            - archive_timeout={{ .Values.backup.walArchive.timeoutSeconds | default 60 | int }}
            {{- end }}
            {{- if $tls }}
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/run/meridian-tls/tls.crt
            - -c
            - ssl_key_file=/run/meridian-tls/tls.key
            - -c
            - ssl_ca_file=/run/meridian-tls/ca.crt
            - -c
            - hba_file=/etc/meridian-hba/pg_hba.conf
            {{- end }}
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-passwords
                  key: superuser
            # Its own, so the databases the Job makes are made beside it
            # rather than inside the one it connects through.
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- /* Said only on a StatefulSet made with it: a pod template
                   changed under an upgrade restarts the database beneath
                   the migration Job (see _helpers), and on a volume already
                   made it would change nothing. */}}
            {{- $initdb := not $live }}
            {{- range (dig "spec" "template" "spec" "containers" (list) (default (dict) $live)) }}
            {{- range (.env | default list) }}
            {{- if eq .name "POSTGRES_INITDB_ARGS" }}{{ $initdb = true }}{{ end }}
            {{- end }}
            {{- end }}
            {{- if $initdb }}
            # Page checksums on a database made here (step 3b, 5j), read
            # only by initdb on an empty volume: one made before keeps what
            # it had, and `meridian upgrade-deployment --enable-checksums`
            # turns them on (ruling 1058).
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            {{- end }}
            {{- if $archive }}
            {{- include "meridian-runtime.walArchiveEnv" . | nindent 12 }}
            {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- if $tls }}
            - name: internal-tls-server
              mountPath: /etc/meridian-internal-tls-server
              readOnly: true
            - name: hba
              mountPath: /etc/meridian-hba
              readOnly: true
            {{- end }}
            {{- if $archive }}
            - name: socket
              mountPath: /var/run/postgresql
            {{- include "meridian-runtime.walArchiveMounts" (dict "top" . "role" "database") | nindent 12 }}
            {{- end }}
          resources:
            {{- include "meridian-runtime.databaseResources" . | nindent 12 }}
          {{- end }}
        {{- if $archive }}
        # Beside the server (backup.walArchive): pgBackRest's own server,
        # which the backup Job takes base backups through over TLS, and the
        # archive's stanza made, or moved to a database made again, once
        # this member is primary (files/archive.sh). Its own process, so a
        # backup never runs inside the database's container.
        - name: archive
          image: {{ .Values.database.brought.patroniImage | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/etc/archive/archive.sh"]
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- if eq .Values.backup.walArchive.store "volume" }}
            - name: MERIDIAN_ARCHIVE_DIRECTORY
              value: /backups{{ .Values.backup.walArchive.path }}
            {{- end }}
            {{- include "meridian-runtime.walArchiveEnv" . | nindent 12 }}
          ports:
            - name: archive
              containerPort: 8432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: socket
              mountPath: /var/run/postgresql
            - name: archive-script
              mountPath: /etc/archive
              readOnly: true
            - name: archive-tls
              mountPath: /etc/archive-tls
              readOnly: true
            {{- include "meridian-runtime.walArchiveMounts" (dict "top" . "role" "database") | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
        {{- end }}
      {{- if or $patroni $archive $tls }}
      volumes:
        {{- if $patroni }}
        - name: patroni
          configMap:
            name: {{ $name }}-patroni
        {{- end }}
        {{- with (include "meridian-runtime.internalTlsServerVolume" (dict "top" . "server" "database")) }}{{ . | nindent 8 }}{{- end }}
        {{- if and $tls (not $patroni) }}
        - name: hba
          configMap:
            name: {{ $name }}-hba
        {{- end }}
        {{- if $archive }}
        - name: socket
          emptyDir: {}
        - name: archive-script
          configMap:
            name: {{ $full }}-pgbackrest
            items:
              - key: archive.sh
                path: archive.sh
        - name: archive-tls
          secret:
            secretName: {{ $name }}-tls
        {{- include "meridian-runtime.walArchiveVolumes" (dict "top" . "role" "database") | nindent 8 }}
        {{- end }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.database.brought.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.brought.size | quote }}
---
# Reached by this deployment's own components and by nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      meridian.dev/component: database
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 5432
    {{- if $archive }}
    # pgBackRest's server: the backup Job alone, taking a base backup.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              meridian.dev/component: backup
      ports:
        - port: 8432
    {{- end }}
    {{- if $patroni }}
    # Patroni's REST API: its own members, asking each other's positions,
    # and the replica scrub Job, re-cloning a standby whose copy is bad
    # (database-replicas.yaml).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              meridian.dev/component: database
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              meridian.dev/component: database-scrub
      ports:
        - port: 8008
    {{- end }}
{{- if gt $standbys 0 }}
{{ include "meridian-runtime.budget" (dict "top" . "component" "database") }}
{{- end }}
{{- end }}
