{{- range .Values.sidecars }}
{{- $top := $ }}
{{- with .plugin }}
{{- if and .existingSecret (eq .existingSecret $top.Values.broker.existingSecret) }}
{{- fail "a plugin's existingSecret is the broker secret: envFrom would give the plugin every component's broker credential, which the sidecar holds so that the plugin does not" }}
{{- end }}
{{- if and .existingSecret $top.Values.key.existingSecret (eq .existingSecret $top.Values.key.existingSecret) }}
{{- fail "a plugin's existingSecret is the deployment's key secret: the conductor is the only component that may hold the key" }}
{{- end }}
{{- end }}
{{- $full := include "meridian-runtime.fullname" $top }}
{{- include "meridian-runtime.plugin" (dict
      "top" $top
      "name" (printf "%s-sidecar-%s" $full .instanceId)
      "instance" .instanceId
      "roles" (join "," (.roles | default list))
      "brokerSecret" (include "meridian-runtime.brokerSecret" $top)
      "brokerKey" .instanceId
      "plugin" .plugin
      "imageTag" .imageTag
      "launched" false) }}
---
{{- end }}
