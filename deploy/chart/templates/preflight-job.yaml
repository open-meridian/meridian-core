{{- include "meridian-runtime.require" . -}}
{{- if .Values.preflight.enabled }}
{{/*
  The upgrade preflight (H1, ruling 586; kernel/an-upgrade-is-checked-before-
  it-is-applied): the release being installed checks the deployment it is
  about to change, and changes nothing.

  A pre-upgrade hook, so it runs from the new image after Helm renders the
  release and before any resource changes, and a blocked check -- a schema
  newer than this release, a database or a bus answer past its limit, a
  database that does not answer within three minutes -- fails the hook, which
  stops the upgrade with nothing changed: `helm upgrade`, `meridian
  upgrade-deployment` and a GitOps tool honouring hooks alike. A warning
  passes and is said. The wait is because this pod is new at every upgrade,
  and a new pod's first connections can be refused until the database's
  NetworkPolicy admits it, as k3s's controller does for a moment (CI run
  40423226625); and because a database member just made answers nobody
  through its Service until it is ready, as after the upgrade that moves the
  database under Patroni; every component waits for its database the same way.
  Its pod carries the release's labels, which that policy admits. It
  connects as the database serves now, over internal TLS only where the
  server serves it today (databaseServesTls in _helpers.tpl): an upgrade
  turning internal TLS on had it mount a CA that the same upgrade makes
  after this hook, so it waited on the mount until it failed, and would
  then have asked TLS of a server offering none yet. Its report
  is one JSON object, the last line of its log: a blocked run's Job stays
  until the next upgrade's hook replaces it, so why it stopped can be read;
  one that passed goes when it succeeds, as every hook here does.

  Never on install: a fresh install has nothing to check, and its database is
  not configured until the wizard writes it.

  It holds no RBAC and reaches no API: its database sessions are read-only
  (`default_transaction_read_only`), on the serving credential, never the
  migrating one; what it reads of backups is a directory listing of the
  chart's own backup volume, mounted read-only, where the chart brings that
  volume; and of the database's own volume, where that is a node's
  directory, only the size and free space of the filesystem it is on, the
  volume mounted read-only and no file of it opened. Its report names
  stores, sizes and counts, never an account or a person.
*/}}
{{- $b := .Values.backup | default dict }}
{{- /* Backups as they are now, as internal TLS below: where a cluster
       answers (every namespace has its `default` ServiceAccount), only if
       their claim is there already -- an upgrade turning backups on makes
       it after this hook, which would wait on mounting it as on the CA,
       and finds none written yet. With nothing to ask (`helm template`),
       as the values say. */}}
{{- $claimNow := true }}
{{- if lookup "v1" "ServiceAccount" .Release.Namespace "default" }}
{{- $claimNow = lookup "v1" "PersistentVolumeClaim" .Release.Namespace ($b.existingClaim | default (printf "%s-backup" (include "meridian-runtime.fullname" .))) }}
{{- end }}
{{- $backups := and $b.recipient (or $b.path $b.existingClaim) $claimNow }}
{{- /* The database's own volume, mounted read-only so the check reads the
       free space of the filesystem it is on (item 211): a `local-path`
       volume and the like is a directory of its node's disk, held to no
       size, so its declared size says nothing about what a migration has
       room for (the dev deployment's database, 23.1 GiB on a 20Gi volume
       with 30 GiB free, was blocked at 116%). Mounting it holds this pod to
       the database's node, so only where all of this is so, and otherwise
       the check judges the declared size as it always has:
       - a cluster answers and the claim is there (as backups, above);
       - the claim's provisioner makes a node's directory; a volume of any
         other kind is never mounted, so the hook never waits on one that
         only one node or one pod may hold, and a provisioner not named is
         judged as before;
       - the database is one member, and it is the only database brought:
         under Patroni member 0 may be a standby, and the check has one
         volume's size and judges every database it reaches by it;
       - its pod is running and ready and not being deleted: this pod is
         named to that pod's node (nodeName), where the volume is, so it
         reads the database's own directory whether or not the volume
         names its node, never an empty one of the same path elsewhere;
         a pod so named starts on a cordoned node, and a node that is not
         ready has no ready pod.
       Nothing of the cluster's is read, only the namespace's: the node and
       the PersistentVolume would say more, but a lookup that is forbidden
       fails the whole render, and whoever upgrades a deployment may hold
       rights in its namespace alone.
       What remains: a node lost or filled after this is rendered and
       before the pod starts fails the hook, and so the upgrade, with
       nothing changed; upgrading again judges it afresh.
       The check itself tells a filesystem that is the volume's own from a
       node's disk, by its size; this only says where mounting is safe. */}}
{{- $nodeDirectories := list "rancher.io/local-path" "docker.io/hostpath" "k8s.io/minikube-hostpath" "microk8s.io/hostpath" "openebs.io/local" }}
{{- $data := "" }}
{{- $dataNode := "" }}
{{- if and .Values.database.brought.enabled (not (include "meridian-runtime.extraDatabases" . | fromJsonArray)) }}
{{- $database := printf "%s-database" (include "meridian-runtime.fullname" .) }}
{{- $claim := default (dict) (lookup "v1" "PersistentVolumeClaim" .Release.Namespace (printf "data-%s-0" $database)) }}
{{- $annotations := dig "metadata" "annotations" (dict) $claim }}
{{- $provisioner := index $annotations "volume.kubernetes.io/storage-provisioner" | default (index $annotations "volume.beta.kubernetes.io/storage-provisioner") | default "" }}
{{- $members := dig "spec" "replicas" 0 (default (dict) (lookup "apps/v1" "StatefulSet" .Release.Namespace $database)) | int }}
{{- if and (has $provisioner $nodeDirectories) (eq $members 1) }}
{{- $pod := default (dict) (lookup "v1" "Pod" .Release.Namespace (printf "%s-0" $database)) }}
{{- $podReady := false }}
{{- range dig "status" "conditions" (list) $pod }}
{{- if and (eq .type "Ready") (eq .status "True") }}{{ $podReady = true }}{{ end }}
{{- end }}
{{- $on := dig "spec" "nodeName" "" $pod }}
{{- if and $podReady (eq (dig "status" "phase" "" $pod) "Running") (not (dig "metadata" "deletionTimestamp" "" $pod)) $on }}
{{- $data = printf "data-%s-0" $database }}
{{- $dataNode = $on }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Internal TLS as the database serves it now, not as this upgrade
       will make it (see above). */}}
{{- $tls := dict "top" . "on" (include "meridian-runtime.databaseServesTls" . | eq "true") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "meridian-runtime.fullname" . }}-preflight
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "10"
    # Gone once it passes; a blocked one kept until the next upgrade's hook
    # replaces it, or a day after it finished, so its report can be read.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  # A check that cannot finish in five minutes is not a check: the upgrade
  # stops rather than waits.
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        meridian.dev/component: preflight
        {{- include "meridian-runtime.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- if $dataNode }}
      # Beside the database, whose volume it reads (see above).
      nodeName: {{ $dataNode | quote }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: preflight
          image: "{{ .Values.image.repository }}:{{ .Values.conductor.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["meridian-conductor", "preflight"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            {{/* The serving credentials, each optional: a deployment whose
                 wizard has not configured its database has none, and is said
                 to have nothing to check. */}}
            - name: MERIDIAN_CONFIG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.conductor.database.existingSecret | default (include "meridian-runtime.databaseSecret" $) }}
                  key: {{ .Values.conductor.database.key | default .Values.database.key }}
                  optional: true
            - name: MERIDIAN_STREET_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.street.database.existingSecret | default (include "meridian-runtime.databaseSecret" $) }}
                  key: {{ .Values.street.database.key | default .Values.database.key }}
                  optional: true
            - name: MERIDIAN_BOR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bor.database.existingSecret | default (include "meridian-runtime.databaseSecret" $) }}
                  key: {{ .Values.bor.database.key | default .Values.database.key }}
                  optional: true
            - name: MERIDIAN_LAKE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.lake.database.existingSecret | default (include "meridian-runtime.databaseSecret" $) }}
                  key: {{ .Values.lake.database.key | default .Values.database.key }}
                  optional: true
            - name: MERIDIAN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | default (include "meridian-runtime.databaseSecret" $) }}
                  key: {{ .Values.database.key }}
                  optional: true
            {{- if .Values.dashboard.enabled }}
            - name: MERIDIAN_DASHBOARD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "meridian-runtime.databaseSecret" $ }}
                  key: {{ .Values.database.key }}
                  optional: true
            {{- end }}
            {{- if .Values.database.brought.enabled }}
            # The database this chart brings: its volume and its memory
            # limit, which the check measures it against.
            - name: MERIDIAN_PREFLIGHT_DATABASE_VOLUME
              value: {{ .Values.database.brought.size | quote }}
            {{- if $data }}
            # Where its volume is mounted, to read the filesystem it is on.
            - name: MERIDIAN_PREFLIGHT_DATABASE_FILESYSTEM
              value: /database-volume
            {{- end }}
            # And the connections it will allow once this upgrade is
            # applied, which the memory is judged by.
            - name: MERIDIAN_PREFLIGHT_DATABASE_MAX_CONNECTIONS
              value: {{ include "meridian-runtime.databaseMaxConnections" . | quote }}
            {{- with (include "meridian-runtime.databaseMemoryLimit" .) }}
            - name: MERIDIAN_PREFLIGHT_DATABASE_MEMORY
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if $backups }}
            - name: MERIDIAN_PREFLIGHT_BACKUP_CONFIGURED
              value: "true"
            {{- if $b.path }}
            - name: MERIDIAN_PREFLIGHT_BACKUPS
              value: /backups
            {{- end }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- with (include "meridian-runtime.internalTlsClientEnv" $tls) }}{{ . | nindent 12 }}{{- end }}
            {{- with (include "meridian-runtime.databaseCaEnv" $) }}{{ . | nindent 12 }}{{- end }}
          {{- if or (and $backups $b.path) $tls.on .Values.database.caSecret $data }}
          volumeMounts:
            {{- if $data }}
            - name: database-volume
              mountPath: /database-volume
              readOnly: true
            {{- end }}
            {{- if and $backups $b.path }}
            - name: backups
              mountPath: /backups
              readOnly: true
            {{- end }}
            {{- with (include "meridian-runtime.internalTlsClientMount" $tls) }}{{ . | nindent 12 }}{{- end }}
            {{- with (include "meridian-runtime.databaseCaMount" $) }}{{ . | nindent 12 }}{{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or (and $backups $b.path) $tls.on .Values.database.caSecret $data }}
      volumes:
        {{- if $data }}
        - name: database-volume
          persistentVolumeClaim:
            claimName: {{ $data }}
            readOnly: true
        {{- end }}
        {{- if and $backups $b.path }}
        {{/* Only the chart's own backup volume, a node directory every pod
             may share; a claim of the administrator's own may be one that
             only one pod at a time can hold, which a hook must never wait on. */}}
        - name: backups
          persistentVolumeClaim:
            claimName: {{ printf "%s-backup" (include "meridian-runtime.fullname" .) }}
            readOnly: true
        {{- end }}
        {{- with (include "meridian-runtime.internalTlsClientVolume" $tls) }}{{ . | nindent 8 }}{{- end }}
        {{- with (include "meridian-runtime.databaseCaVolume" $) }}{{ . | nindent 8 }}{{- end }}
      {{- end }}
{{- end }}
