{{- include "meridian-runtime.require" . -}}
{{- if .Values.dashboard.enabled }}
{{/*
  The only thing in this deployment that may change the cluster, and only
  until somebody has configured it (decisions/016).

  The wizard asks; this acts. It is a Job rather than a component, its Role
  names every resource it may touch, it may create none of them, and when the
  configuration is applied it deletes its own RoleBinding and exits. A
  deployment that is already configured starts it, finds its work done, gives
  the rights up and exits, so installing the same release twice leaves nothing
  holding them.
*/}}
{{- $full := include "meridian-runtime.fullname" . }}
{{- $name := printf "%s-first-run" $full }}
{{- $database := include "meridian-runtime.databaseSecret" . }}
{{- $oidc := printf "%s-dashboard-oidc" $full }}
{{- $ldap := .Values.firstRun.directorySecretName | default (printf "%s-ldap-bind" $full) }}
{{- $addresses := .Values.firstRun.addressesSecretName }}
{{- $restart := list (printf "%s-conductor" $full) (printf "%s-dashboard" $full) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
---
# Every resource by name, and `create` on none of them. The Secrets are made
# empty by the chart precisely so that this can be true: RBAC cannot narrow
# `create` to a name, so a Job allowed to create Secrets could create any.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $database | quote }}, {{ $oidc | quote }}, {{ $ldap | quote }}, {{ $addresses | quote }}]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ range $i, $d := $restart }}{{ if $i }}, {{ end }}{{ $d | quote }}{{ end }}]
    verbs: ["get", "patch"]
{{- if .Values.database.brought.enabled }}
  # Starting the database this chart brings, if somebody chooses it. Named,
  # like everything else here, and scale only: the StatefulSet exists at zero
  # replicas and the wizard turns it on. Creating is not among these verbs,
  # and the claim comes from the StatefulSet's own template rather than from
  # anything this Job does (decisions/016).
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    resourceNames: [{{ printf "%s-database" (include "meridian-runtime.fullname" .) | quote }}]
    verbs: ["get", "patch"]
{{- end }}
  # Deleting exactly one binding: its own. This is what makes "gives up its
  # rights" a thing that happens rather than a thing that was meant.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-{{ .Release.Revision }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "meridian-runtime.labels" . | nindent 8 }}
        meridian.dev/component: first-run
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $name }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: first-run
          image: "{{ .Values.image.repository }}:{{ .Values.dashboard.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["meridian-first-run"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: MERIDIAN_INSTANCE_ID
              value: first-run
            # Its own broker credential, not the runtime's: what the wizard
            # seals reaches this Job and nothing else (ruling 5).
            - name: MERIDIAN_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "meridian-runtime.brokerSecret" $ }}
                  key: {{ .Values.firstRun.brokerKey }}
            # Every name it may touch, from the chart, because the Role names
            # the same ones.
            - name: MERIDIAN_FIRST_RUN_DATABASE_SECRET
              value: {{ $database | quote }}
            - name: MERIDIAN_FIRST_RUN_OIDC_SECRET
              value: {{ $oidc | quote }}
            - name: MERIDIAN_FIRST_RUN_LDAP_SECRET
              value: {{ $ldap | quote }}
            - name: MERIDIAN_FIRST_RUN_ADDRESSES_SECRET
              value: {{ $addresses | quote }}
            - name: MERIDIAN_FIRST_RUN_BINDING
              value: {{ $name | quote }}
            - name: MERIDIAN_FIRST_RUN_RESTART
              value: {{ join "," $restart | quote }}
{{- if .Values.database.brought.enabled }}
            # The database this chart can bring, and the passwords it makes
            # for the roles that will live in it. Read from this Job's own
            # environment rather than sealed over the bus, because nobody
            # types them and they never travel: what would be protected in
            # transit never leaves the cluster.
            - name: MERIDIAN_FIRST_RUN_BROUGHT_WORKLOAD
              value: {{ printf "%s-database" (include "meridian-runtime.fullname" .) | quote }}
            - name: MERIDIAN_FIRST_RUN_BROUGHT_HOST
              value: {{ printf "%s-database.%s.svc.cluster.local" (include "meridian-runtime.fullname" .) .Release.Namespace | quote }}
            - name: MERIDIAN_FIRST_RUN_BROUGHT_PORT
              value: "5432"
            - name: MERIDIAN_FIRST_RUN_BROUGHT_SUPERUSER
              value: postgres
            - name: MERIDIAN_FIRST_RUN_BROUGHT_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-database-passwords" (include "meridian-runtime.fullname" .) | quote }}
                  key: superuser
            - name: MERIDIAN_FIRST_RUN_BROUGHT_SERVING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-database-passwords" (include "meridian-runtime.fullname" .) | quote }}
                  key: serving
            - name: MERIDIAN_FIRST_RUN_BROUGHT_MIGRATING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-database-passwords" (include "meridian-runtime.fullname" .) | quote }}
                  key: migrating
{{- end }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
