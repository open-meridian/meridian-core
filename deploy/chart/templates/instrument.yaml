{{- include "meridian-runtime.require" . -}}
{{- include "meridian-runtime.oneWriter" (dict "top" $ "component" "instrument" "what" "instrument store" "values" .Values.instrument) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian-runtime.fullname" . }}-instrument
  labels:
    meridian.dev/component: instrument
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  replicas: {{ include "meridian-runtime.memberCount" (dict "top" $ "component" "instrument" "values" .Values.instrument) }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- if include "meridian-runtime.leased" (dict "top" $ "component" "instrument" "values" .Values.instrument) }}
  {{- include "meridian-runtime.memberStrategy" (dict "top" $ "component" "instrument" "values" .Values.instrument) | nindent 2 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      meridian.dev/component: instrument
  template:
    metadata:
      labels:
        {{- include "meridian-runtime.labels" . | nindent 8 }}
        meridian.dev/component: instrument
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "meridian-runtime.memberPlacement" (dict "top" $ "component" "instrument" "values" $.Values.instrument) | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: instrument
          image: "{{ .Values.image.repository }}:{{ .Values.instrument.image.tag | default .Values.image.tag }}"
          args: ["meridian-instrument"]
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: MERIDIAN_INSTANCE_ID
              value: {{ include "meridian-runtime.fullname" . }}-instrument
            {{- include "meridian-runtime.memberEnv" (dict "top" $ "component" "instrument" "values" $.Values.instrument) | nindent 12 }}
            # The deployment each change of its log is made in (step 3a,
            # the change log's origin; ruling 1049).
            - name: MERIDIAN_DEPLOYMENT_ID
              value: {{ .Values.deployment.id | quote }}
            # The hot layer's bound, in MiB (step 3a).
            - name: MERIDIAN_INSTRUMENT_HOT_RECORDS_MIB
              value: {{ .Values.instrument.hotLayer.recordsMiB | quote }}
            # The analytics component, whose resolves are read-only
            # (contract v28's fourth amendment, W3.1).
            - name: MERIDIAN_ANALYTICS_INSTANCE_ID
              value: {{ include "meridian-runtime.fullname" . }}-analytics
            - name: MERIDIAN_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "meridian-runtime.brokerSecret" $ }}
                  # Its own credential, not the runtime's (contract v20): it reads
                  # the plugin catalogue by its own column in the contract.
                  key: {{ if .Values.broker.existingSecret }}{{ .Values.broker.instrumentKey }}{{ else }}instrument{{ end }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: MERIDIAN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ (include "meridian-runtime.databaseSecret" $) }}
                  key: {{ .Values.database.key }}
            {{- include "meridian-runtime.readyEnv" . | nindent 12 }}
            {{- with (include "meridian-runtime.internalTlsEnv" .) }}{{ . | nindent 12 }}{{- end }}
          {{- include "meridian-runtime.readyProbe" . | nindent 10 }}
          # No port. Everything this component says goes over the broker, so
          # nothing outside its pod needs to reach it. A Service in front of it
          # would be a second way in that nothing asks for.
          # No other volume. The key and the platform address moved to the
          # conductor with the connection that used them (decisions/011), and
          # what this component learns, it learns on the bus; the one it mounts
          # is where it says it is ready.
          volumeMounts:
            {{- include "meridian-runtime.readyMount" . | nindent 12 }}
            {{- with (include "meridian-runtime.internalTlsMount" .) }}{{ . | nindent 12 }}{{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- include "meridian-runtime.readyVolume" . | nindent 8 }}
        {{- with (include "meridian-runtime.internalTlsVolume" .) }}{{ . | nindent 8 }}{{- end }}
{{ include "meridian-runtime.memberBudget" (dict "top" $ "component" "instrument" "values" $.Values.instrument) }}
