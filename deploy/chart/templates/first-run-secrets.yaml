{{- include "meridian-runtime.require" . -}}
{{/*
  The Secrets the first-run wizard fills, made here and left empty.

  A fresh install has none of this: the database and the directory are what
  the wizard learns, and until somebody has been through it there is nothing
  to put in them (spec/installation-and-first-run, requirement 6). They exist
  from the start all the same, because:

  - a container whose Secret is missing a key does not start, and starts when
    the key appears. That is the whole of how a component waits, and it needs
    no code of ours.
  - RBAC cannot narrow `create` to a name. Making them here is what lets the
    Job that fills them hold `update` on exactly these and `create` on nothing
    (decisions/016).

  Rendered with whatever they already hold, and kept when the release goes, so
  an upgrade never empties a configured deployment and an uninstall never
  discards the credentials a customer's database is reached with.

  Named by the administrator instead, they are the administrator's to make and
  this renders nothing.
*/}}
{{- $full := include "meridian-runtime.fullname" . }}
{{- $names := list }}
{{- if not .Values.database.existingSecret }}
{{- $names = append $names (dict "name" (printf "%s-database" $full) "key" "url") }}
{{- end }}
{{- if .Values.dashboard.enabled }}
{{/*
  Where a browser reaches this deployment, and what Zitadel calls itself.
  Written by first run rather than rendered from values, because the wizard is
  what learns them: a value here would be a second place the same fact lives,
  and the one nobody edited would win on the next upgrade.
*/}}
{{- $names = append $names (dict "name" .Values.identity.bundled.addressesSecretName "key" "dashboard-url") }}
{{- end }}
{{- if and .Values.identity.bundled.enabled .Values.identity.bundled.databaseSecretName }}
{{- $names = append $names (dict "name" .Values.identity.bundled.databaseSecretName "key" "dsn") }}
{{- end }}
{{- range $secret := $names }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $secret.name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret.name }}
  labels:
    {{- include "meridian-runtime.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    # What fills it, and with which key, so somebody reading `kubectl get
    # secret` knows whether a deployment has been through first run.
    meridian.dev/first-run-key: {{ $secret.key | quote }}
type: Opaque
{{- if and $existing $existing.data }}
data:
  {{- toYaml $existing.data | nindent 2 }}
{{- end }}
{{- end }}
