{{- if include "meridian-runtime.generatedKey" . }}
{{- include "meridian-runtime.require" . -}}
{{/*
  Make this deployment's key, inside the cluster, before anything starts.

  `public-key` writes a key pair when the volume has none and prints only the
  public half. The private half stays in the volume the conductor mounts, which
  is the whole point: a key generated anywhere else has been in a file, a shell
  history and a backup before it arrives.

  Nobody reads the public half from this job's log any more: the conductor
  registers it with the enrolment code (W5.24), and the wizard shows its
  fingerprint. So the job goes once it has succeeded, rather than staying as a
  finished Job from the install for the life of the deployment; one that
  failed stays, and the install with it, to be read.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "meridian-runtime.fullname" . }}-key
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-20"
    # Kept when the release goes. A deleted claim is a key nobody can recover
    # and a deployment identity that has to be registered again.
    "helm.sh/resource-policy": keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.key.storage.className }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.key.storage.size }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "meridian-runtime.fullname" . }}-key
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "meridian-runtime.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: key
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The binary first: the image has no entrypoint, so every container
          # here names the one it runs. This said `public-key` alone and could
          # never have started; the path is only reached with key.generate,
          # which no install had used until first run made it the default way
          # a deployment gets a key.
          args: ["meridian-conductor", "public-key"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: MERIDIAN_KEY_PATH
              value: /var/lib/meridian/key.pem
          volumeMounts:
            - name: key
              mountPath: /var/lib/meridian
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: key
          persistentVolumeClaim:
            claimName: {{ include "meridian-runtime.fullname" . }}-key
{{- end }}
