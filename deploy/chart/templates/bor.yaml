{{- include "meridian-runtime.require" . -}}
{{- include "meridian-runtime.oneWriter" (dict "top" $ "component" "bor" "what" "book of record" "values" .Values.bor) -}}
{{/*
  The book of record (W9): the firm's own positions, breaks and figures, an
  append-only journal per account partition and the projections rebuilt from
  it. Its own Deployment and tag beside the street store's, sharing no key,
  join or transaction with it (decisions/012).

  One writer per partition. Every command takes its partition's lock in
  Postgres, and the rollout never surges -- the old one stops before the new
  one starts, as the conductor's does (not Recreate: Helm 4's server-side
  apply cannot change an existing Deployment to it) -- so an upgrade never
  runs an old writer beside a new one over the same journal (W9.8).

  No key and no platform address: what it runs reaches the platform by way
  of the instrument store, as the street store's does.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian-runtime.fullname" . }}-bor
  labels:
    meridian.dev/component: bor
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  replicas: {{ include "meridian-runtime.memberCount" (dict "top" $ "component" "bor" "values" .Values.bor) }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- include "meridian-runtime.memberStrategy" (dict "top" $ "component" "bor" "values" .Values.bor) | nindent 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      meridian.dev/component: bor
  template:
    metadata:
      labels:
        {{- include "meridian-runtime.labels" . | nindent 8 }}
        meridian.dev/component: bor
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "meridian-runtime.memberPlacement" (dict "top" $ "component" "bor" "values" $.Values.bor) | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bor
          image: "{{ .Values.image.repository }}:{{ .Values.bor.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["meridian-bor"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: MERIDIAN_INSTANCE_ID
              value: {{ include "meridian-runtime.fullname" . }}-bor
            {{- include "meridian-runtime.memberEnv" (dict "top" $ "component" "bor" "values" $.Values.bor) | nindent 12 }}
            # The deployment each change of its log is made in (step 3a,
            # the change log's origin; ruling 1049).
            - name: MERIDIAN_DEPLOYMENT_ID
              value: {{ .Values.deployment.id | quote }}
            # The hot layer's bound, in MiB (step 3a).
            - name: MERIDIAN_BOR_HOT_BOOKS_MIB
              value: {{ .Values.bor.hotLayer.booksMiB | quote }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.bor.mallocArenaMax }}
            - name: MALLOC_ARENA_MAX
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.bor.snapshotInterval }}
            - name: MERIDIAN_BOR_SNAPSHOT_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            - name: MERIDIAN_BOR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bor.database.existingSecret | default (include "meridian-runtime.databaseSecret" $) }}
                  key: {{ .Values.bor.database.key | default .Values.database.key }}
            - name: MERIDIAN_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "meridian-runtime.brokerSecret" $ }}
                  key: {{ include "meridian-runtime.runtimeBrokerKey" (dict "Values" .Values "key" .Values.broker.borKey) }}
            {{- include "meridian-runtime.readyEnv" . | nindent 12 }}
            {{- with (include "meridian-runtime.internalTlsEnv" .) }}{{ . | nindent 12 }}{{- end }}
          {{- include "meridian-runtime.readyProbe" . | nindent 10 }}
          volumeMounts:
            {{- include "meridian-runtime.readyMount" . | nindent 12 }}
            {{- with (include "meridian-runtime.internalTlsMount" .) }}{{ . | nindent 12 }}{{- end }}
          resources:
            {{- toYaml (.Values.bor.resources | default .Values.resources) | nindent 12 }}
      volumes:
        {{- include "meridian-runtime.readyVolume" . | nindent 8 }}
        {{- with (include "meridian-runtime.internalTlsVolume" .) }}{{ . | nindent 8 }}{{- end }}
{{ include "meridian-runtime.memberBudget" (dict "top" $ "component" "bor" "values" $.Values.bor) }}
