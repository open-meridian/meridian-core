{{- include "meridian-runtime.require" . -}}
{{- include "meridian-runtime.oneWriter" (dict "component" "street" "what" "street store" "values" .Values.street) -}}
{{/*
  The street store. Its own Deployment and its own image tag, which is the whole
  point of the split: the instrument store holds what the platform can send again, this
  holds statements nothing can reconstruct, and tying their versions together
  made every instrument-store change inherit the street store's caution.

  No key and no platform address. It does not talk to the platform, so it
  cannot, and what it runs reaches the platform by way of the instrument store.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian-runtime.fullname" . }}-street
  labels:
    meridian.dev/component: street
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  replicas: {{ include "meridian-runtime.memberCount" (dict "component" "street" "values" .Values.street) }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- if include "meridian-runtime.leased" (dict "component" "street" "values" .Values.street) }}
  {{- include "meridian-runtime.memberStrategy" (dict "component" "street" "values" .Values.street) | nindent 2 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      meridian.dev/component: street
  template:
    metadata:
      labels:
        {{- include "meridian-runtime.labels" . | nindent 8 }}
        meridian.dev/component: street
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "meridian-runtime.memberPlacement" (dict "top" $ "component" "street" "values" $.Values.street) | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: street
          image: "{{ .Values.image.repository }}:{{ .Values.street.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["meridian-street"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: MERIDIAN_INSTANCE_ID
              value: {{ include "meridian-runtime.fullname" . }}-street
            {{- include "meridian-runtime.memberEnv" (dict "top" $ "component" "street" "values" $.Values.street) | nindent 12 }}
            # The deployment each change of its log is made in (step 3a,
            # the change log's origin; ruling 1049).
            - name: MERIDIAN_DEPLOYMENT_ID
              value: {{ .Values.deployment.id | quote }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: MERIDIAN_STREET_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.street.database.existingSecret | default (include "meridian-runtime.databaseSecret" $) }}
                  key: {{ .Values.street.database.key | default .Values.database.key }}
            - name: MERIDIAN_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "meridian-runtime.brokerSecret" $ }}
                  key: {{ include "meridian-runtime.runtimeBrokerKey" (dict "Values" .Values "key" .Values.broker.streetKey) }}
            {{- include "meridian-runtime.readyEnv" . | nindent 12 }}
          {{- include "meridian-runtime.readyProbe" . | nindent 10 }}
          volumeMounts:
            {{- include "meridian-runtime.readyMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- include "meridian-runtime.readyVolume" . | nindent 8 }}
{{ include "meridian-runtime.memberBudget" (dict "top" $ "component" "street" "values" $.Values.street) }}
