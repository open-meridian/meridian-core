{{- include "meridian-runtime.require" . -}}
{{/*
  The street store. Its own Deployment and its own image tag, which is the whole
  point of the split: the replica holds what the platform can send again, this
  holds statements nothing can reconstruct, and tying their versions together
  made every replica change inherit the street store's caution.

  No key and no platform address. It does not talk to the platform, so it
  cannot, and what it runs reaches the platform by way of the replica.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian-runtime.fullname" . }}-street
  labels:
    meridian.dev/component: street
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.street.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      meridian.dev/component: street
  template:
    metadata:
      labels:
        {{- include "meridian-runtime.labels" . | nindent 8 }}
        meridian.dev/component: street
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: street
          image: "{{ .Values.image.repository }}:{{ .Values.street.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["meridian-street"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: MERIDIAN_INSTANCE_ID
              value: {{ include "meridian-runtime.fullname" . }}-street
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: MERIDIAN_STREET_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.street.database.existingSecret | default .Values.database.existingSecret }}
                  key: {{ .Values.street.database.key | default .Values.database.key }}
            - name: MERIDIAN_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.broker.existingSecret }}
                  key: {{ .Values.broker.streetKey }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
