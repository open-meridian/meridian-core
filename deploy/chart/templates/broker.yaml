{{- include "meridian-runtime.require" . -}}
{{- if not .Values.broker.existingSecret }}
{{/*
  The broker this deployment's components meet on, brought by the chart.

  Every other hand-written Secret went when the wizard arrived; this was the
  last one, and it was the hardest, because a broker is not only a password:
  it is a server, its permissions, and one credential per component and plugin
  instance (spec/installation-and-first-run, and decisions/010).

  So the chart makes the passwords, once, and keeps them; and the broker
  generates its own permissions at start, from the instances it was
  configured with and the contract compiled into the runtime image
  (decisions/020), using the same binary the repository generates the
  committed file with. A chart that computed the same thing in templates
  would be the second policy the generator exists to avoid.

  An administrator who runs their own broker names it in broker.existingSecret
  and none of this renders.
*/}}
{{- $full := include "meridian-runtime.fullname" . }}
{{- $name := printf "%s-broker" $full }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $servers := int (include "meridian-runtime.brokerReplicas" .) }}
{{- $jetstream := int (include "meridian-runtime.jetstreamReplicas" .) }}
{{/*
  One server, or three as a NATS cluster (step 3b; spec/a-deployment-scales-
  out-and-fails-over-by-configuration section 4, question 6): every client
  given every server by its own name, so it reconnects to the majority when
  one is lost. Deliveries in flight at a lost server are lost and caught up
  by sequence, as designed; the order path is request-reply, acknowledged
  after commit. With three, JetStream at three replicas keeps the analytics
  units' work queue, and nothing else (decisions/024).
*/}}
{{/*
  The servers' set is named by what it keeps on disk (step 3b part 3): a
  StatefulSet's volume claims cannot change in place, so the set with
  JetStream's volumes is a set of its own, <name>-jetstream, and turning
  JetStream on or off (resilience.profile, broker.jetstream.replicas) is
  Helm making the one set and removing the other in the same upgrade,
  which `meridian upgrade-deployment --set` drives: no manual step. The
  client Service follows the set by its label, and each server is named
  under its own set's members. Deliveries in flight across the change are
  caught up by sequence and requests not answered are asked again, as for
  a lost server (section 4). The set without JetStream has no volumes. The
  JetStream set's volumes go with it: a return
  to JetStream starts it afresh, its streams made again, and never on the
  state its servers kept before, which they could not agree on again (CI
  44556229125). Writes the stream still held at the switch were never
  answered, and their plugins ask again (section 4).
*/}}
{{- $set := $name }}
{{- if gt $jetstream 0 }}{{ $set = printf "%s-jetstream" $name }}{{ end }}
{{- $members := printf "%s-members.%s.svc.cluster.local" $set .Release.Namespace }}
{{- $address := printf "%s.%s.svc.cluster.local:4222" $name .Release.Namespace }}
{{- if gt $servers 1 }}
{{- $each := list }}
{{- range $i := until $servers }}
{{- $each = append $each (printf "%s-%d.%s:4222" $set $i $members) }}
{{- end }}
{{- $address = join "," $each }}
{{- end }}
{{- $held := dict }}
{{- if $existing }}{{ $held = ($existing.data | default dict) }}{{ end }}
{{/*
  One credential per instance, never per role: two plugins sharing a role
  could otherwise publish as each other. The list is the components, the
  dashboard where it runs, first run where it runs, and every sidecar. The
  instrument store holds its own (contract v20): it reads the plugin
  catalogue by its own column in the contract, not the runtime's.
*/}}
{{- /* The analytics component holds its own too (contract v26, W12). */}}
{{- $users := list "runtime" "instrument" "analytics" }}
{{- if .Values.dashboard.enabled }}
{{- $users = append $users (.Values.dashboard.brokerKey | default .Values.dashboard.instanceId) }}
{{- $users = append $users .Values.firstRun.brokerKey }}
{{- end }}
{{- if and .Values.launcher.enabled .Values.registry.enabled }}
{{- $users = append $users .Values.launcher.instanceId }}
{{- end }}
{{- range .Values.sidecars }}
{{- $users = append $users .instanceId }}
{{- end }}
{{/*
  Decided once, here, and used by both Secrets below: generating in each would
  give the broker one password and its components another, and a deployment
  whose components cannot connect to their own bus.
*/}}
{{/*
  Each starts with a letter. The broker reads its configuration's variables as
  values rather than strings, so a password that begins like a number -- `12`,
  `8.5x`, `4KB9...` -- is a number followed by garbage, and the broker refuses
  to start: every component with it, on the install that drew it. About one
  install in six did, found by the first run of the cluster suite on a fresh
  cluster. A letter first always reads as a string; the rest is still random.
*/}}
{{- $passwords := dict }}
{{- range $user := $users }}
{{- if $user }}
{{- $_ := set $passwords $user (index $held (printf "%s-password" $user) | default (printf "%s%s" (randAlpha 1) (randAlphaNum 31) | b64enc)) }}
{{- end }}
{{- end }}
{{- /* The servers' own, for their routes to each other: a cluster no
       client credential can join. Made on any install, used with three. */}}
{{- $routes := index $held ".routes" | default (printf "%s%s" (randAlpha 1) (randAlphaNum 31) | b64enc) }}
---
# Made once and kept: a regenerated password is a deployment that cannot hear
# itself until every component restarts. Each entry is a whole connection
# string, because that is what a component reads.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  .routes: {{ $routes }}
{{- range $user, $password := $passwords }}
  {{ $user }}-password: {{ $password }}
  {{ $user }}: {{ printf "nats://%s:%s@%s" $user (b64dec $password) $address | b64enc }}
{{- end }}
---
# What the broker reads its passwords from. The generated configuration names
# the variables and never holds a password, so it is a file nobody has to
# protect.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-passwords
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  MERIDIAN_NATS__ROUTES: {{ $routes }}
{{- /* Each server's route, whole, with the cluster's credential: the
       broker's configuration names these variables and never holds one. */}}
{{- range $i := until $servers }}
  {{ printf "MERIDIAN_NATS__ROUTE_%d" $i }}: {{ printf "nats-route://routes:%s@%s-%d.%s:6222" (b64dec $routes) $set $i $members | b64enc }}
{{- end }}
{{- range $user, $password := $passwords }}
  {{ printf "MERIDIAN_NATS_%s" (upper (replace "-" "_" $user)) }}: {{ $password }}
{{- end }}
---
# Which instances this deployment launched, for the generator to make a
# credential for. The contract decides what each may do, by its roles; this
# says who exists. The dashboard is a component, with its own credential.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-instances
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
data:
  instances.json: |
    {
      "instances": [
        {{- $entries := list }}
        {{- if .Values.dashboard.enabled }}
        {{- $entries = append $entries (dict "instance_id" (.Values.dashboard.brokerKey | default .Values.dashboard.instanceId) "component" "dashboard") }}
        {{- end }}
        {{- if and .Values.launcher.enabled .Values.registry.enabled }}
        {{- $entries = append $entries (dict "instance_id" .Values.launcher.instanceId "component" "launcher") }}
        {{- end }}
        {{- range .Values.sidecars }}
        {{- $entries = append $entries (dict "instance_id" .instanceId "roles" (.roles | default list)) }}
        {{- end }}
        {{- range $i, $entry := $entries }}{{ if $i }},{{ end }}
        {{ toJson $entry }}
        {{- end }}
      ]
    }
---
# Credentials for plugins launched after install (W8.3), one key pair per
# instance, which the broker's own process writes and a launched sidecar
# reads its connection string from (spec/the-local-plugin-registry, decision
# 3). Made here, empty, so a Role can name it: RBAC cannot narrow `create` to
# a name. Kept with what it holds, as the credentials above are.
#
# Its keys are the broker's, never the release's. Where Helm applies
# server-side (Helm 4), the chart states none the broker also owns: Helm
# then owns none of those, an upgrade leaves each as the broker wrote it,
# and the revision's manifest carries no such credential. Rendered from what
# the Secret held, as this was, a revision kept each plugin's credential as
# it was that day, and a rollback to it was refused once one had been made
# again: `helm rollback` applies the stored manifest, and the broker owns
# the field with another value (the dev deployment's revision 69,
# 2026-11-20).
#
# Revisions still carry credentials in two cases, both below: every one a
# client-side merge was rendered for (a Helm 3's), and under server-side
# apply a key that is Helm's alone.
#
# Where Helm merges client-side, a manifest that stops stating the keys
# would delete them, so there they are still rendered as held, unchanged.
# Which it is cannot be asked of Helm, so it is read two ways, and the keys
# are left out only where both say server-side:
#
#   - the Secret: Helm's server-side apply leaves an `Apply` entry in its
#     managed fields, and a client-side merge never does. Helm's own entry
#     only: one that owns the release annotation
#     (`meta.helm.sh/release-name`), which Helm states on everything it
#     applies. Another manager's server-side apply (`kubectl apply
#     --server-side` of a label) leaves an `Apply` entry too, over a release
#     Helm still merges client-side;
#   - the client: Helm 4 or later, by its version. Helm 3 only ever merges
#     client-side, whatever applied the release before it; and a version
#     that does not read as one is taken for a client-side merge, where
#     stating every key deletes nothing.
#
# A Helm 4 told to merge client-side (`--server-side=false`), or upgrading
# straight after a Helm 3 did, over a Secret Helm once applied server-side,
# is not told apart from one applying server-side: there a key the manifest
# before stated is deleted. `meridian upgrade-deployment` never passes that
# flag.
#
# And one key is still stated under server-side apply: one whose field is
# Helm's alone. A forced apply (`--force-conflicts`, which `meridian
# upgrade-deployment` passes) over a plugin stopped and launched again while
# the upgrade ran takes the field from the broker; released, a field with no
# other owner is deleted, under a plugin that read its credential when its
# pod started. So it is stated as held, and stays Helm's until the plugin is
# stopped, when the broker takes the key out. Stated from what the Secret
# held when the upgrade was rendered, so for such a key the revision carries
# the credential, and one made again between the render and the apply is put
# back as it was.
{{- $launched := lookup "v1" "Secret" .Release.Namespace (printf "%s-launched" $name) | default dict }}
{{- $applied := false }}
{{- $helms := dict }}
{{- $others := dict }}
{{- range (dig "metadata" "managedFields" list $launched) }}
{{- $owned := dig "fieldsV1" "f:data" dict . }}
{{- $release := hasKey (dig "fieldsV1" "f:metadata" "f:annotations" dict .) "f:meta.helm.sh/release-name" }}
{{- if and (eq (.operation | default "") "Apply") $release }}
{{- $applied = true }}
{{- range $field, $_ := $owned }}{{ $_ := set $helms $field true }}{{ end }}
{{- else }}
{{- range $field, $_ := $owned }}{{ $_ := set $others $field true }}{{ end }}
{{- end }}
{{- end }}
{{- $client := .Capabilities.HelmVersion.Version | default "" }}
{{- $four := false }}
{{- if regexMatch "^v?[0-9]+\\.[0-9]+\\.[0-9]+" $client }}
{{- $four = semverCompare ">=4.0.0-0" $client }}
{{- end }}
{{- $serverSide := and $applied $four }}
{{- $stated := dict }}
{{- range $key, $value := ($launched.data | default dict) }}
{{- $field := printf "f:%s" $key }}
{{- if or (not $serverSide) (and (hasKey $helms $field) (not (hasKey $others $field))) }}
{{- $_ := set $stated $key $value }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-launched
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- if $stated }}
data:
  {{- toYaml $stated | nindent 2 }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
---
# What the broker's own process may do: read the Deployments the launcher
# made, to learn which plugins exist and with which roles, and write the one
# Secret above. It creates nothing, and touches no other Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ printf "%s-launched" $name | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  # The current set's servers alone, never the set an upgrade is removing.
  selector:
    app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    meridian.dev/component: broker
    meridian.dev/broker-set: {{ $set }}
  ports:
    - name: client
      port: 4222
      targetPort: 4222
---
# Each server by its own name, which clients are given and the servers'
# routes reach each other at.
apiVersion: v1
kind: Service
metadata:
  name: {{ $set }}-members
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Each server's name resolves before it is ready (step 3d): a server is
  # ready only once its routes and JetStream's metadata group hold, which
  # needs the other servers' names first. Clients reconnect past one not
  # ready, as past one lost.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    meridian.dev/component: broker
    meridian.dev/broker-set: {{ $set }}
  ports:
    - name: client
      port: 4222
    - name: cluster
      port: 6222
---
# A StatefulSet (step 3b), so each server has a name its routes and its
# clients reach. With JetStream (three servers), each server keeps the
# analytics units' work queue and its own Raft state on a volume of its own
# (the NATS chart's way for a stream at three): a server restarted, one at a
# time as an upgrade rolls them, rejoins with what it held. Without, nothing
# is kept on disk.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $set }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  replicas: {{ $servers }}
  serviceName: {{ $set }}-members
  podManagementPolicy: Parallel
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- if gt $jetstream 0 }}
  # JetStream's volumes are deleted with the set, and kept while it is
  # scaled: `meridian upgrade-deployment` deletes any left by a
  # set that went before this.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  {{- end }}
  # The set without volumes keeps the selector it was made with (a
  # selector cannot change in place); the set with them is selected by its
  # name as well.
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      meridian.dev/component: broker
      {{- if ne $set $name }}
      meridian.dev/broker-set: {{ $set }}
      {{- end }}
  template:
    metadata:
      labels:
        {{- include "meridian-runtime.labels" . | nindent 8 }}
        meridian.dev/component: broker
        meridian.dev/broker-set: {{ $set }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ $name }}
      {{- include "meridian-runtime.nodeTolerations" . | nindent 6 }}
      {{- if gt $servers 1 }}
      {{- include "meridian-runtime.spread" (dict "top" . "component" "broker") | nindent 6 }}
      {{- end }}
      initContainers:
        # The broker itself, from its own image, whose version is yours: a
        # single static binary, copied where this pod's own process can run
        # it as its child.
        - name: nats-server
          image: {{ .Values.broker.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["cp", "/usr/local/bin/nats-server", "/opt/nats/nats-server"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: nats-server
              mountPath: /opt/nats
      containers:
        # The permissions, from the contract compiled into this image, the
        # instances above and the plugins launched since, written by the same
        # binary this repository generates its committed copy with; and the
        # broker, run as that process's child so a launch reloads it without
        # a restart (spec/the-local-plugin-registry). The
        # configuration lives and dies with the pod, and holds no password:
        # the chart's instances' are read from the environment, a launched
        # plugin's is checked against a hash. It states the broker's
        # `max_payload: 1MB` explicitly, the limit the bus reads and every
        # paged answer is budgeted under (the plugin catalogue's 512 KiB
        # page), never left to the broker's default.
        - name: broker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - meridian-broker-config
            - serve
            - --nats
            - /opt/nats/nats-server
            - --instances
            - /etc/meridian/instances/instances.json
            - --out
            - /etc/nats/nats.conf
            - --secret
            - {{ $name }}-launched
            - --broker
            - {{ $address }}
            # The broker's bounds (stage M; the resilience spec's section
            # 10a): each client's pending bytes, the largest message, and
            # JetStream's memory.
            - --max-pending
            - {{ (.Values.broker.limits | default dict).maxPending | default "64MB" | toString | quote }}
            - --max-payload
            - {{ (.Values.broker.limits | default dict).maxPayload | default "1MB" | toString | quote }}
            - --jetstream-memory
            - {{ (.Values.broker.jetstream | default dict).maxMemory | default "16MB" | toString | quote }}
            {{- if gt $servers 1 }}
            # Its routes to the other servers, its own included (a server
            # ignores its route to itself), each named by the variable
            # holding it with the cluster's credential.
            - --cluster
            - {{ $name | quote }}
            {{- range $i := until $servers }}
            - --route
            - {{ printf "MERIDIAN_NATS__ROUTE_%d" $i }}
            {{- end }}
            {{- end }}
            {{- if gt $jetstream 0 }}
            # JetStream for the analytics units' work queue and, in ha, the
            # lake's write-ahead stream (contract v30, stage E), on this
            # server's own volume, at most this much of it.
            - --jetstream
            - {{ include "meridian-runtime.jetstreamFileStore" . | quote }}
            - --jetstream-store
            - /data/jetstream
            {{- end }}
            {{- if .Values.tls.internal.enabled }}
            # Every client and route over TLS, or not at all,
            # with the chart's certificate for the broker's names.
            - --tls
            - /etc/meridian-internal-tls-server
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: {{ $name }}-passwords
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: MERIDIAN_BROKER_SERVER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: client
              containerPort: 4222
            {{- if gt $servers 1 }}
            - name: cluster
              containerPort: 6222
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/nats
            - name: instances
              mountPath: /etc/meridian/instances
              readOnly: true
            - name: nats-server
              mountPath: /opt/nats
              readOnly: true
            {{- if gt $jetstream 0 }}
            - name: jetstream
              mountPath: /data/jetstream
            {{- end }}
            {{- if .Values.tls.internal.enabled }}
            - name: internal-tls-server
              mountPath: /etc/meridian-internal-tls-server
              readOnly: true
            {{- end }}
          # Ready means ready (step 3d, decided 2026-11-14): the server's own
          # full health check -- its routes, and with JetStream its place in
          # the metadata group, current with its leader -- read on the pod's
          # own loopback, where its monitoring alone listens. Found in the
          # reconfigure run: a third server outside the metadata group while
          # the switch to ha said every member ready, and the lake's
          # write-ahead stream, kept on three, could not be placed for six
          # minutes. NATS's /healthz says only that a server is current with
          # its leader, so its place in the group is read from the group as
          # the server holds it (/raftz): in CI 43539633884 all three said
          # ok with one outside. A server that does not come right within
          # its start's bound, 180 s, is started again; so is one that came
          # right and then stays unhealthy past its liveness bound, 300 s
          # (CI 44556229125: a server passed its start once, then said a
          # consumer was "not current: group node unhealthy" at every check
          # for over 30 minutes, and with no liveness probe nothing
          # restarted it). Started again, a server keeps its name, so its
          # Raft peer, and its volume, so the JetStream state it kept: it
          # rejoins as itself and catches up from the others, and a restart
          # clears nothing. The bound is above anything a server comes back
          # from on its own: in CI a whole set moved to ha is ready within
          # about 75 s of the upgrade, a server killed is back within 180 s,
          # a roll of all three ends within 300 s and the others stay
          # healthy through it; and restarted at 300 s and given its 180 s
          # to start, a server is back inside the 10 minutes `meridian
          # upgrade-deployment` waits for. The set starts its servers in
          # parallel and each name resolves before it is ready, so no server
          # waits on another's readiness to start.
          startupProbe:
            exec:
              command: {{ include "meridian-runtime.brokerHealthz" . }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            exec:
              command: {{ include "meridian-runtime.brokerHealthz" . }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: {{ include "meridian-runtime.brokerHealthz" . }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          emptyDir: {}
        - name: nats-server
          emptyDir: {}
        - name: instances
          configMap:
            name: {{ $name }}-instances
        {{- with (include "meridian-runtime.internalTlsServerVolume" (dict "top" . "server" "broker")) }}{{ . | nindent 8 }}{{- end }}
  {{- if gt $jetstream 0 }}
  volumeClaimTemplates:
    - metadata:
        name: jetstream
      spec:
        accessModes: [ReadWriteOnce]
        {{- with (.Values.broker.jetstream | default dict).storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ (.Values.broker.jetstream | default dict).size | default "1Gi" | quote }}
  {{- end }}
---
# Reached by this deployment's own components and by nothing else. A broker a
# plugin could reach directly is a bus with its enforcement bypassed
# (decisions/009, decisions/010).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      meridian.dev/component: broker
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 4222
    # The servers' routes: from each other alone, never a plugin's pod.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              meridian.dev/component: broker
      ports:
        - port: 6222
{{- if gt $servers 1 }}
{{ include "meridian-runtime.budget" (dict "top" . "component" "broker") }}
{{- end }}
{{- end }}
