{{- include "meridian-runtime.require" . -}}
{{- if and .Values.launcher.enabled .Values.registry.enabled (not .Values.broker.existingSecret) }}
{{/*
  The launcher: the one long-running component that may change the cluster,
  and only this much (decisions/019, amending 016). It answers the conductor
  alone -- the broker admits nobody else to its two topics -- and creates a
  plugin's Deployment in the chart's own plugin shape, from the deployment's
  own registry by digest, and removes only what it made. It holds no key, no
  database, and no right to anything but Deployments in this namespace, and
  the claims that are edge plugins' storage, which it makes and never deletes
  (decisions/028).
*/}}
{{- $full := include "meridian-runtime.fullname" . }}
{{- $name := printf "%s-launcher" $full }}
{{- $broker := include "meridian-runtime.brokerSecret" . }}
{{/*
  The shape a launched plugin runs in: the same definition sidecar.yaml
  renders the chart's own plugins with, its instance, image and roles left
  as placeholders the launcher fills in once it has checked them. So a
  launched plugin and a configured one cannot drift apart.
*/}}
{{- $shape := include "meridian-runtime.plugin" (dict
      "top" .
      "name" (printf "%s-plugin-__INSTANCE__" $full)
      "instance" "__INSTANCE__"
      "roles" "__ROLES__"
      "brokerSecret" (printf "%s-launched" $broker)
      "brokerKey" "__INSTANCE__.url"
      "plugin" (dict "image" "__IMAGE__")
      "imageTag" ""
      "launched" true) }}
{{/*
  An edge plugin's shape and the claim it mounts (decisions/028): the same
  definition with its instance's storage, and the claim filled in with the
  instance and the plugin's name once both are checked.
*/}}
{{- $storage := "" }}
{{- $claim := "" }}
{{- if .Values.pluginStorage.enabled }}
{{- $storage = include "meridian-runtime.plugin" (dict
      "top" .
      "name" (printf "%s-plugin-__INSTANCE__" $full)
      "instance" "__INSTANCE__"
      "roles" "__ROLES__"
      "brokerSecret" (printf "%s-launched" $broker)
      "brokerKey" "__INSTANCE__.url"
      "plugin" (dict "image" "__IMAGE__")
      "imageTag" ""
      "launched" true
      "storage" true) }}
{{- $claim = include "meridian-runtime.pluginStorage" (dict
      "top" .
      "instance" "__INSTANCE__"
      "launched" true
      "plugin" "__PLUGIN__") }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-template
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
data:
  plugin.json: {{ $shape | fromYaml | toJson | quote }}
  {{- if .Values.pluginStorage.enabled }}
  plugin-storage.json: {{ $storage | fromYaml | toJson | quote }}
  claim.json: {{ $claim | fromYaml | toJson | quote }}
  {{- end }}
  {{- if .Values.development }}
  {{- /*
    The live shape (spec/live-plugin-development), on a development
    deployment alone: the same definition, with the live folder, the dev
    runner and the sidecar's development endpoint. Not rendered anywhere
    else, so no launcher elsewhere has it to make.
  */}}
  {{- $live := include "meridian-runtime.plugin" (dict
        "top" .
        "name" (printf "%s-plugin-__INSTANCE__" $full)
        "instance" "__INSTANCE__"
        "roles" "__ROLES__"
        "brokerSecret" (printf "%s-launched" $broker)
        "brokerKey" "__INSTANCE__.url"
        "plugin" (dict "image" "__IMAGE__")
        "imageTag" ""
        "launched" true
        "live" true) }}
  plugin-live.json: {{ $live | fromYaml | toJson | quote }}
  {{- if .Values.pluginStorage.enabled }}
  {{- $liveStorage := include "meridian-runtime.plugin" (dict
        "top" .
        "name" (printf "%s-plugin-__INSTANCE__" $full)
        "instance" "__INSTANCE__"
        "roles" "__ROLES__"
        "brokerSecret" (printf "%s-launched" $broker)
        "brokerKey" "__INSTANCE__.url"
        "plugin" (dict "image" "__IMAGE__")
        "imageTag" ""
        "launched" true
        "live" true
        "storage" true) }}
  plugin-live-storage.json: {{ $liveStorage | fromYaml | toJson | quote }}
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
---
# Deployments in this namespace, and an edge plugin's storage claim, made and
# read but never deleted (decisions/028), and nothing else: no Secret, no
# Service, no NetworkPolicy, no Role. RBAC cannot narrow `create` to a name,
# so the launcher narrows itself -- it creates only from the templates above
# and deletes only what carries its label -- and where the cluster has
# ValidatingAdmissionPolicy, the cluster holds it to that too (below).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "delete"]
  {{- if .Values.pluginStorage.enabled }}
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    meridian.dev/component: launcher
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      meridian.dev/component: launcher
  template:
    metadata:
      labels:
        {{- include "meridian-runtime.labels" . | nindent 8 }}
        meridian.dev/component: launcher
      annotations:
        # A new template is a new launcher, so it never fills in an old one.
        checksum/template: {{ printf "%s%s%s" $shape $storage $claim | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: launcher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["meridian-launcher"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: MERIDIAN_INSTANCE_ID
              value: {{ .Values.launcher.instanceId | quote }}
            - name: MERIDIAN_LAUNCHER_TEMPLATE
              value: /etc/meridian/launcher/plugin.json
            {{- if .Values.development }}
            # A development deployment: the launcher makes the live shape
            # when asked, and refuses it anywhere else
            # (spec/live-plugin-development).
            - name: MERIDIAN_DEVELOPMENT
              value: "true"
            - name: MERIDIAN_LAUNCHER_LIVE_TEMPLATE
              value: /etc/meridian/launcher/plugin-live.json
            {{- end }}
            {{- if .Values.pluginStorage.enabled }}
            # An edge plugin's shape and its claim (decisions/028), and which
            # roles are the edge's.
            - name: MERIDIAN_LAUNCHER_STORAGE_TEMPLATE
              value: /etc/meridian/launcher/plugin-storage.json
            - name: MERIDIAN_LAUNCHER_CLAIM_TEMPLATE
              value: /etc/meridian/launcher/claim.json
            - name: MERIDIAN_LAUNCHER_EDGE_ROLES
              value: {{ include "meridian-runtime.edgeRoles" . | quote }}
            {{- if .Values.development }}
            - name: MERIDIAN_LAUNCHER_LIVE_STORAGE_TEMPLATE
              value: /etc/meridian/launcher/plugin-live-storage.json
            {{- end }}
            {{- end }}
            # The only registry a launched plugin's image may come from.
            - name: MERIDIAN_REGISTRY_ADDRESS
              value: {{ printf "localhost:%v" .Values.registry.hostPort | quote }}
            - name: MERIDIAN_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $broker }}
                  key: {{ .Values.launcher.instanceId }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- include "meridian-runtime.readyEnv" . | nindent 12 }}
          {{- include "meridian-runtime.readyProbe" . | nindent 10 }}
          volumeMounts:
            - name: template
              mountPath: /etc/meridian/launcher
              readOnly: true
            {{- include "meridian-runtime.readyMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- include "meridian-runtime.readyVolume" . | nindent 8 }}
        - name: template
          configMap:
            name: {{ $name }}-template
{{- if .Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy" }}
---
# Where the cluster can say so itself (Kubernetes 1.30 and later): whatever
# the launcher's account does to a Deployment, or a claim it makes, it is one
# the launcher made.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["deployments"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["persistentvolumeclaims"]
  matchConditions:
    - name: the-launcher
      expression: >-
        request.userInfo.username ==
        "system:serviceaccount:{{ .Release.Namespace }}:{{ $name }}"
  validations:
    - expression: >-
        request.operation == "DELETE"
        ? has(oldObject.metadata.labels) &&
          oldObject.metadata.labels[?"meridian.dev/launched"].orValue("") == "true"
        : has(object.metadata.labels) &&
          object.metadata.labels[?"meridian.dev/launched"].orValue("") == "true"
      message: the launcher touches only the Deployments it launched and the storage it made
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
{{- end }}
{{- end }}
