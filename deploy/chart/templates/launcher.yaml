{{- include "meridian-runtime.require" . -}}
{{- if and .Values.launcher.enabled .Values.registry.enabled (not .Values.broker.existingSecret) }}
{{/*
  The launcher: the one long-running component that may change the cluster,
  and only this much (decisions/019, amending 016). It answers the conductor
  alone -- the broker admits nobody else to its two topics -- and creates a
  plugin's Deployment in the chart's own plugin shape, from the deployment's
  own registry by digest, and removes only what it made. It holds no key, no
  database, and no right to anything but Deployments in this namespace, and
  the claims that are edge plugins' storage, which it makes and never deletes
  (decisions/028).
*/}}
{{- $full := include "meridian-runtime.fullname" . }}
{{- $name := printf "%s-launcher" $full }}
{{- $broker := include "meridian-runtime.brokerSecret" . }}
{{/*
  The shape a launched plugin runs in: the same definition sidecar.yaml
  renders the chart's own plugins with, its instance, image and roles left
  as placeholders the launcher fills in once it has checked them. So a
  launched plugin and a configured one cannot drift apart.
*/}}
{{- $shape := include "meridian-runtime.plugin" (dict
      "top" .
      "name" (printf "%s-plugin-__INSTANCE__" $full)
      "instance" "__INSTANCE__"
      "roles" "__ROLES__"
      "brokerSecret" (printf "%s-launched" $broker)
      "brokerKey" "__INSTANCE__.url"
      "plugin" (dict "image" "__IMAGE__")
      "imageTag" ""
      "launched" true) }}
{{/*
  An edge plugin's shape and the claim it mounts (decisions/028): the same
  definition with its instance's storage, and the claim filled in with the
  instance and the plugin's name once both are checked.
*/}}
{{- $storage := "" }}
{{- $claim := "" }}
{{- if .Values.pluginStorage.enabled }}
{{- $storage = include "meridian-runtime.plugin" (dict
      "top" .
      "name" (printf "%s-plugin-__INSTANCE__" $full)
      "instance" "__INSTANCE__"
      "roles" "__ROLES__"
      "brokerSecret" (printf "%s-launched" $broker)
      "brokerKey" "__INSTANCE__.url"
      "plugin" (dict "image" "__IMAGE__")
      "imageTag" ""
      "launched" true
      "storage" true) }}
{{- $claim = include "meridian-runtime.pluginStorage" (dict
      "top" .
      "instance" "__INSTANCE__"
      "launched" true
      "plugin" "__PLUGIN__") }}
{{- end }}
{{/*
  What an allowed instance is given beside its storage (contract v16,
  W8.7): its archive, merged by the launcher into the plugin's container
  when the conductor's CreatePlugin carries one allowed.
*/}}
{{- $archive := include "meridian-runtime.archiveShape" . }}
{{/*
  The shape of an instance launched with shards or a standby pod (step 3d;
  the resilience spec's section 7): the same definition as several pods,
  each sidecar given the shard count and run under its instance's own
  account, `<fullname>-shards-<instance>`, which the launcher makes with a
  Role naming that instance's shards' Leases alone, and the Leases (item
  31). Rendered for one shard; the launcher sets the pods and the count the
  launch asked. Only where a store runs a standby: shards and standby pods
  are configuration, as every standby is (ruling 1052). Elsewhere the
  launcher has no shape for them, and refuses such a launch saying so.
*/}}
{{- $leased := false -}}
{{- range $component := list "lake" "bor" "instrument" "street" "conductor" -}}
{{- if include "meridian-runtime.leased" (dict "top" $ "component" $component "values" (index $.Values $component)) -}}
{{- $leased = true -}}
{{- end -}}
{{- end -}}
{{- $shards := "" -}}
{{- if $leased -}}
{{- $shards = include "meridian-runtime.plugin" (dict
      "top" .
      "name" (printf "%s-plugin-__INSTANCE__" $full)
      "instance" "__INSTANCE__"
      "roles" "__ROLES__"
      "brokerSecret" (printf "%s-launched" $broker)
      "brokerKey" "__INSTANCE__.url"
      "plugin" (dict "image" "__IMAGE__")
      "imageTag" ""
      "launched" true
      "shards" 1
      "standby" true) -}}
{{- end }}
{{/*
  And where edge plugins keep storage, the same shape mounting the
  instance's shared storage, a folder per shard; the claim it mounts,
  `shared-claim.json`; and the pod that copies an instance's own claim
  into its `shard-0/` once, before its first launch as several pods (step
  3d, checkpoint 5, item 30).
*/}}
{{- $shardsStorage := "" -}}
{{- $sharedClaim := "" -}}
{{- $storageCopy := "" -}}
{{- if and $shards .Values.pluginStorage.enabled -}}
{{- $shardsStorage = include "meridian-runtime.plugin" (dict
      "top" .
      "name" (printf "%s-plugin-__INSTANCE__" $full)
      "instance" "__INSTANCE__"
      "roles" "__ROLES__"
      "brokerSecret" (printf "%s-launched" $broker)
      "brokerKey" "__INSTANCE__.url"
      "plugin" (dict "image" "__IMAGE__")
      "imageTag" ""
      "launched" true
      "shards" 1
      "standby" true
      "storage" true) -}}
{{- $sharedClaim = include "meridian-runtime.sharedStorage" (dict
      "top" .
      "instance" "__INSTANCE__"
      "plugin" "__PLUGIN__") -}}
{{- $storageCopy = include "meridian-runtime.storageCopy" . -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-template
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
data:
  plugin.json: {{ $shape | fromYaml | toJson | quote }}
  {{- if $shards }}
  plugin-shards.json: {{ $shards | fromYaml | toJson | quote }}
  {{- end }}
  {{- if .Values.pluginStorage.enabled }}
  plugin-storage.json: {{ $storage | fromYaml | toJson | quote }}
  claim.json: {{ $claim | fromYaml | toJson | quote }}
  {{- end }}
  {{- if $archive }}
  archive.json: {{ $archive | fromYaml | toJson | quote }}
  {{- end }}
  {{- if $shardsStorage }}
  plugin-shards-storage.json: {{ $shardsStorage | fromYaml | toJson | quote }}
  shared-claim.json: {{ $sharedClaim | fromYaml | toJson | quote }}
  storage-copy.json: {{ $storageCopy | fromYaml | toJson | quote }}
  {{- end }}
  {{- if .Values.development }}
  {{- /*
    The live shape (spec/live-plugin-development), on a development
    deployment alone: the same definition, with the live folder, the dev
    runner and the sidecar's development endpoint. Not rendered anywhere
    else, so no launcher elsewhere has it to make.
  */}}
  {{- $live := include "meridian-runtime.plugin" (dict
        "top" .
        "name" (printf "%s-plugin-__INSTANCE__" $full)
        "instance" "__INSTANCE__"
        "roles" "__ROLES__"
        "brokerSecret" (printf "%s-launched" $broker)
        "brokerKey" "__INSTANCE__.url"
        "plugin" (dict "image" "__IMAGE__")
        "imageTag" ""
        "launched" true
        "live" true) }}
  plugin-live.json: {{ $live | fromYaml | toJson | quote }}
  {{- if .Values.pluginStorage.enabled }}
  {{- $liveStorage := include "meridian-runtime.plugin" (dict
        "top" .
        "name" (printf "%s-plugin-__INSTANCE__" $full)
        "instance" "__INSTANCE__"
        "roles" "__ROLES__"
        "brokerSecret" (printf "%s-launched" $broker)
        "brokerKey" "__INSTANCE__.url"
        "plugin" (dict "image" "__IMAGE__")
        "imageTag" ""
        "launched" true
        "live" true
        "storage" true) }}
  plugin-live-storage.json: {{ $liveStorage | fromYaml | toJson | quote }}
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
---
# Deployments in this namespace, and an edge plugin's storage claim, made and
# read but never deleted (decisions/028); and where the launcher has a shape
# for shards and standby pods, an instance's own account, Role and binding
# and its shards' Leases (item 31) -- the Leases made, never deleted -- and
# nothing else: no Secret, no Service, no NetworkPolicy. It holds no
# `escalate` and no `bind`: a Role it makes grants only what it holds itself,
# its Lease right. RBAC cannot narrow `create` to a name, so the launcher
# narrows itself -- it creates only from the templates above and deletes only
# what carries its label -- and where the cluster has
# ValidatingAdmissionPolicy, the cluster holds it to that too (below).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    # patch: a launched plugin's entitled datasets written as an annotation
    # the broker reads (contract v18, W10.1).
    verbs: ["create", "get", "list", "delete", "patch"]
  {{- if .Values.pluginStorage.enabled }}
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get"]
  {{- end }}
  {{- if $shards }}
  # An instance of several pods' own account, its Role naming its shards'
  # Leases alone, and their binding (item 31).
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "get", "update", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "update", "delete"]
  # Read alone: a stopped instance's pods, ended before their account is
  # removed, so each sidecar releases its shard's Lease with a live token
  # (review c5b L5, c5b2 H1).
  # And where edge plugins keep storage, the one pod it makes, which copies
  # an instance's own storage claim into its shared storage once (item 30):
  # made, read and removed, held by its policy below to exactly the chart's
  # shape.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: {{ if $shardsStorage }}["list", "create", "get", "delete"]{{ else }}["list"]{{ end }}
  {{- end }}
  {{- if or $shards (include "meridian-runtime.leased" (dict "top" $ "component" "launcher" "values" .Values.launcher)) }}
  # One launcher launches (step 3b): with a standby, its lease says which.
  # And an instance of several pods' Leases, made before its pods and never
  # deleted (item 31); held, so the Role it makes grants nothing it lacks.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    meridian.dev/component: launcher
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  replicas: {{ include "meridian-runtime.memberCount" (dict "top" $ "component" "launcher" "values" .Values.launcher) }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- if include "meridian-runtime.leased" (dict "top" $ "component" "launcher" "values" .Values.launcher) }}
  {{- include "meridian-runtime.memberStrategy" (dict "top" $ "component" "launcher" "values" .Values.launcher) | nindent 2 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian-runtime.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      meridian.dev/component: launcher
  template:
    metadata:
      labels:
        {{- include "meridian-runtime.labels" . | nindent 8 }}
        meridian.dev/component: launcher
      annotations:
        # A new template is a new launcher, so it never fills in an old one.
        checksum/template: {{ printf "%s%s%s%s%s%s%s%s" $shape $storage $claim $archive $shards $shardsStorage $sharedClaim $storageCopy | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      {{- include "meridian-runtime.memberPlacement" (dict "top" $ "component" "launcher" "values" $.Values.launcher "account" true) | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: launcher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["meridian-launcher"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: MERIDIAN_INSTANCE_ID
              value: {{ .Values.launcher.instanceId | quote }}
            {{- include "meridian-runtime.memberEnv" (dict "top" $ "component" "launcher" "values" $.Values.launcher "account" true) | nindent 12 }}
            - name: MERIDIAN_LAUNCHER_TEMPLATE
              value: /etc/meridian/launcher/plugin.json
            {{- if $shards }}
            # An instance launched with shards or a standby pod (step 3d),
            # where the deployment runs standbys.
            - name: MERIDIAN_LAUNCHER_SHARDS_TEMPLATE
              value: /etc/meridian/launcher/plugin-shards.json
            {{- end }}
            {{- if $shardsStorage }}
            # Its shape keeping storage, the shared claim it mounts and the
            # pod that copies an instance's own claim into it (item 30).
            - name: MERIDIAN_LAUNCHER_SHARDS_STORAGE_TEMPLATE
              value: /etc/meridian/launcher/plugin-shards-storage.json
            - name: MERIDIAN_LAUNCHER_SHARED_CLAIM_TEMPLATE
              value: /etc/meridian/launcher/shared-claim.json
            - name: MERIDIAN_LAUNCHER_STORAGE_COPY_TEMPLATE
              value: /etc/meridian/launcher/storage-copy.json
            {{- end }}
            {{- if .Values.development }}
            # A development deployment: the launcher makes the live shape
            # when asked, and refuses it anywhere else
            # (spec/live-plugin-development).
            - name: MERIDIAN_DEVELOPMENT
              value: "true"
            - name: MERIDIAN_LAUNCHER_LIVE_TEMPLATE
              value: /etc/meridian/launcher/plugin-live.json
            {{- end }}
            {{- if .Values.pluginStorage.enabled }}
            # An edge plugin's shape and its claim (decisions/028), and which
            # roles are the edge's.
            - name: MERIDIAN_LAUNCHER_STORAGE_TEMPLATE
              value: /etc/meridian/launcher/plugin-storage.json
            - name: MERIDIAN_LAUNCHER_CLAIM_TEMPLATE
              value: /etc/meridian/launcher/claim.json
            - name: MERIDIAN_LAUNCHER_EDGE_ROLES
              value: {{ include "meridian-runtime.edgeRoles" . | quote }}
            {{- if .Values.development }}
            - name: MERIDIAN_LAUNCHER_LIVE_STORAGE_TEMPLATE
              value: /etc/meridian/launcher/plugin-live-storage.json
            {{- end }}
            {{- end }}
            {{- if $archive }}
            # What an instance a deployment admin allowed an archive is given
            # beside its storage (W8.7, contract v16).
            - name: MERIDIAN_LAUNCHER_ARCHIVE_TEMPLATE
              value: /etc/meridian/launcher/archive.json
            {{- end }}
            # The only registry a launched plugin's image may come from.
            - name: MERIDIAN_REGISTRY_ADDRESS
              value: {{ printf "localhost:%v" .Values.registry.hostPort | quote }}
            - name: MERIDIAN_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $broker }}
                  key: {{ .Values.launcher.instanceId }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            # Its working memory (stage M; the resilience spec's section 10a),
            # and glibc's arenas and mmap threshold, as every component's.
            {{- include "meridian-runtime.memoryEnv" (dict "top" $ "container" "launcher" "values" .Values.launcher "resources" .Values.resources "heldMiB" 0 "name" "launcher") | nindent 12 }}
            {{- include "meridian-runtime.readyEnv" . | nindent 12 }}
            {{- with (include "meridian-runtime.internalTlsEnv" .) }}{{ . | nindent 12 }}{{- end }}
          {{- include "meridian-runtime.readyProbe" . | nindent 10 }}
          volumeMounts:
            - name: template
              mountPath: /etc/meridian/launcher
              readOnly: true
            {{- include "meridian-runtime.readyMount" . | nindent 12 }}
            {{- with (include "meridian-runtime.internalTlsMount" .) }}{{ . | nindent 12 }}{{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- include "meridian-runtime.readyVolume" . | nindent 8 }}
        {{- with (include "meridian-runtime.internalTlsVolume" .) }}{{ . | nindent 8 }}{{- end }}
        - name: template
          configMap:
            name: {{ $name }}-template
{{- if .Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy" }}
{{- $own := printf "%s-shards-" $full }}
{{- $pluginImages := printf "localhost:%v/plugins/" .Values.registry.hostPort }}
{{- $copyFsGroup := (.Values.podSecurityContext | default dict).fsGroup | default .Values.pluginStorage.fsGroup }}
{{- $accounts := list (quote "") (quote "default") }}
{{- with .Values.pluginArchive.serviceAccount }}
{{- $accounts = append $accounts (quote .) }}
{{- end }}
---
# Where the cluster can say so itself (Kubernetes 1.30 and later): whatever
# the launcher's account does to a Deployment, a claim, or an instance's own
# account, Role or binding (item 31), it is one the launcher made, and of
# exactly the shape it makes. Its shards' Leases are held by a policy of
# their own (shard-leases.yaml).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["deployments"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["persistentvolumeclaims", "serviceaccounts"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["roles", "rolebindings"]
      # The pod that copies an instance's own storage into its shared
      # storage (item 30), the one pod it makes.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["pods"]
  matchConditions:
    - name: the-launcher
      expression: >-
        request.userInfo.username ==
        "system:serviceaccount:{{ .Release.Namespace }}:{{ $name }}"
  variables:
    # The instance an object is made for, by its label -- an instance's name
    # alone, a host label, else none (review c5b L3: it is read into a
    # pattern) -- and that instance's own account (item 31):
    # `<fullname>-shards-<instance>`.
    - name: labelled
      expression: >-
        request.operation == "DELETE" || !has(object.metadata.labels)
        ? "" : object.metadata.labels[?"meridian.dev/instance"].orValue("")
    - name: instance
      expression: >-
        variables.labelled.matches("^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$")
        ? variables.labelled : ""
    - name: own
      expression: >-
        {{ $own | quote }} + variables.instance
  validations:
    # Made by the launcher, as it was before a write and is after it: an
    # update never makes another's its own (review c5b L1).
    - expression: >-
        (
          (request.operation == "CREATE" ||
           (has(oldObject.metadata.labels) &&
            oldObject.metadata.labels[?"meridian.dev/launched"].orValue("") == "true")) &&
          (request.operation == "DELETE" ||
           (has(object.metadata.labels) &&
            object.metadata.labels[?"meridian.dev/launched"].orValue("") == "true"))
        )
      message: the launcher touches only the Deployments it launched and the storage it made
    # Which account a launched plugin's pods run as (step 3d; review of
    # 95d68904, S2): Kubernetes asks nobody whether a pod may use an
    # account, so the launcher's Deployments are held to the ones the chart
    # gives it -- none (the namespace's default, which holds no right), its
    # instance's own account for an instance of several pods (item 31: the
    # members' is the stores' alone), and the archive's where one is set.
    - expression: >-
        request.operation == "DELETE" ||
        request.resource.resource != "deployments" ||
        !has(object.spec.template.spec.serviceAccountName) ||
        object.spec.template.spec.serviceAccountName in
        [{{ $accounts | join ", " }}] ||
        (variables.instance != "" &&
         object.spec.template.spec.serviceAccountName == variables.own)
      message: a launched plugin runs under no account, its instance's shards account or the archive's
    # Under its instance's own account the lease right is the sidecar's
    # alone, never the plugin's: nothing mounts the token by default, and no
    # container but the sidecar mounts a volume that carries one.
    - expression: >-
        request.operation == "DELETE" ||
        request.resource.resource != "deployments" ||
        !has(object.spec.template.spec.serviceAccountName) ||
        !object.spec.template.spec.serviceAccountName.startsWith({{ $own | quote }}) ||
        (
          has(object.spec.template.spec.automountServiceAccountToken) &&
          object.spec.template.spec.automountServiceAccountToken == false &&
          (!has(object.spec.template.spec.initContainers) ||
           object.spec.template.spec.initContainers.all(c, !has(c.volumeMounts) ||
             c.volumeMounts.all(m,
               !has(object.spec.template.spec.volumes) ||
               !object.spec.template.spec.volumes.exists(v,
                 v.name == m.name && has(v.projected) && has(v.projected.sources) &&
                 v.projected.sources.exists(s, has(s.serviceAccountToken)))))) &&
          !has(object.spec.template.spec.ephemeralContainers) &&
          object.spec.template.spec.containers.all(c,
            c.name == "sidecar" || !has(c.volumeMounts) ||
            c.volumeMounts.all(m,
              !has(object.spec.template.spec.volumes) ||
              !object.spec.template.spec.volumes.exists(v,
                v.name == m.name && has(v.projected) && has(v.projected.sources) &&
                v.projected.sources.exists(s, has(s.serviceAccountToken)))))
        )
      message: under its instance's shards account the token is mounted in the sidecar's container alone
    # The one pod the launcher makes (item 30): its instance's copy of its
    # own storage claim, read only, into its shared storage, exactly as the
    # chart's storage-copy shape -- a plugin image from the deployment's own
    # registry by digest, as the launcher launches, running the SDK's
    # `meridian-storage copy` alone (PO items 86 and 88), no account's
    # token, no secret, no host's namespace, and those two claims of the
    # instance its label names; run once, its user the plugin's own or the
    # cluster's (no uid pinned), nothing added to its container and nothing
    # run beside its command (review c5c M1, L1). The one pod it deletes
    # is a copy pod, to make one again (review c5c L2). What the cluster's
    # own admission adds to every pod before this policy reads it is let be
    # (review c5c2fold H1): DefaultTolerationSeconds' not-ready and
    # unreachable tolerations alone, and a globalDefault PriorityClass's
    # name, never a system- one. Its confinement is the chart's and no other
    # (review c5c2fold L1): RuntimeDefault seccomp at the pod, nothing of the
    # container's own, no extra groups, sysctls, claims or affinity, its
    # mounts whole.
    - expression: >-
        request.resource.resource != "pods" ||
        (
          request.operation == "DELETE" &&
          has(oldObject.metadata.labels) &&
          oldObject.metadata.labels[?"meridian.dev/component"].orValue("") == "storage-copy" &&
          oldObject.metadata.name.startsWith({{ printf "%s-storage-copy-" $full | quote }})
        ) ||
        (
          request.operation == "CREATE" &&
          variables.instance != "" &&
          object.metadata.name == {{ printf "%s-storage-copy-" $full | quote }} + variables.instance &&
          object.metadata.labels[?"meridian.dev/component"].orValue("") == "storage-copy" &&
          object.spec.restartPolicy == "Never" &&
          has(object.spec.securityContext) &&
          !has(object.spec.securityContext.seLinuxOptions) &&
          !has(object.spec.securityContext.appArmorProfile) &&
          has(object.spec.securityContext.seccompProfile) &&
          object.spec.securityContext.seccompProfile.type == "RuntimeDefault" &&
          !has(object.spec.securityContext.supplementalGroups) &&
          !has(object.spec.securityContext.sysctls) &&
          {{- if $copyFsGroup }}
          (!has(object.spec.securityContext.fsGroup) ||
           object.spec.securityContext.fsGroup == {{ $copyFsGroup | int64 }}) &&
          {{- else }}
          !has(object.spec.securityContext.fsGroup) &&
          {{- end }}
          !has(object.spec.nodeName) && !has(object.spec.affinity) && !has(object.spec.resourceClaims) &&
          (!has(object.spec.tolerations) || object.spec.tolerations.all(t,
            has(t.key) && t.key in ["node.kubernetes.io/not-ready", "node.kubernetes.io/unreachable"] &&
            has(t.operator) && t.operator == "Exists" && has(t.effect) && t.effect == "NoExecute" &&
            !has(t.value))) &&
          (!has(object.spec.priorityClassName) || !object.spec.priorityClassName.startsWith("system-")) &&
          !has(object.spec.runtimeClassName) &&
          !has(object.spec.hostUsers) &&
          !has(object.spec.containers[0].lifecycle) &&
          !has(object.spec.containers[0].livenessProbe) && !has(object.spec.containers[0].readinessProbe) &&
          !has(object.spec.containers[0].startupProbe) && !has(object.spec.containers[0].workingDir) &&
          has(object.spec.automountServiceAccountToken) &&
          object.spec.automountServiceAccountToken == false &&
          (!has(object.spec.serviceAccountName) || object.spec.serviceAccountName == "default") &&
          !has(object.spec.initContainers) && !has(object.spec.ephemeralContainers) &&
          (!has(object.spec.hostNetwork) || !object.spec.hostNetwork) &&
          (!has(object.spec.hostPID) || !object.spec.hostPID) &&
          (!has(object.spec.hostIPC) || !object.spec.hostIPC) &&
          size(object.spec.containers) == 1 &&
          object.spec.containers[0].image.matches({{ printf "^%s[a-z]([-a-z0-9]{0,61}[a-z0-9])?@sha256:[0-9a-f]{64}$" $pluginImages | quote }}) &&
          !has(object.spec.containers[0].args) &&
          object.spec.containers[0].command == ["meridian-storage", "copy",
            {{ printf "%s-storage-" $full | quote }} + variables.instance] &&
          !has(object.spec.containers[0].env) && !has(object.spec.containers[0].envFrom) &&
          has(object.spec.containers[0].securityContext) &&
          has(object.spec.containers[0].securityContext.allowPrivilegeEscalation) &&
          object.spec.containers[0].securityContext.allowPrivilegeEscalation == false &&
          (!has(object.spec.containers[0].securityContext.privileged) ||
           !object.spec.containers[0].securityContext.privileged) &&
          (!has(object.spec.containers[0].securityContext.capabilities) ||
           !has(object.spec.containers[0].securityContext.capabilities.add)) &&
          !has(object.spec.containers[0].securityContext.seccompProfile) &&
          !has(object.spec.containers[0].securityContext.seLinuxOptions) &&
          !has(object.spec.containers[0].securityContext.appArmorProfile) &&
          (!has(object.spec.containers[0].securityContext.procMount) ||
           object.spec.containers[0].securityContext.procMount == "Default") &&
          has(object.spec.containers[0].securityContext.readOnlyRootFilesystem) &&
          object.spec.containers[0].securityContext.readOnlyRootFilesystem == true &&
          has(object.spec.volumes) && size(object.spec.volumes) == 2 &&
          object.spec.volumes.exists(v, v.name == "from" && has(v.persistentVolumeClaim) &&
            v.persistentVolumeClaim.claimName == {{ printf "%s-storage-" $full | quote }} + variables.instance &&
            has(v.persistentVolumeClaim.readOnly) && v.persistentVolumeClaim.readOnly == true) &&
          object.spec.volumes.exists(v, v.name == "to" && has(v.persistentVolumeClaim) &&
            v.persistentVolumeClaim.claimName == {{ printf "%s-shared-storage-" $full | quote }} + variables.instance) &&
          has(object.spec.containers[0].volumeMounts) &&
          object.spec.containers[0].volumeMounts.all(m,
            !has(m.subPath) && !has(m.subPathExpr) && !has(m.mountPropagation) &&
            ((m.name == "from" && has(m.readOnly) && m.readOnly == true) || m.name == "to"))
        )
      message: the launcher's one pod copies its instance's own storage into its shared storage, as the chart's shape
    # An instance's own account (item 31), of exactly the shape the launcher
    # makes: the Role's one rule, `get` and `update` on Leases named
    # `<instance>-shard-<n>` alone, the instance read from its label; the
    # binding of that Role to the account of the same name alone; and the
    # account carrying no secret. Each named `<fullname>-shards-<instance>`.
    - expression: >-
        request.operation == "DELETE" ||
        request.resource.resource != "roles" ||
        (
          variables.instance != "" &&
          object.metadata.name == variables.own &&
          has(object.rules) && size(object.rules) == 1 &&
          object.rules[0].apiGroups == ["coordination.k8s.io"] &&
          object.rules[0].resources == ["leases"] &&
          size(object.rules[0].verbs) == 2 &&
          "get" in object.rules[0].verbs && "update" in object.rules[0].verbs &&
          !has(object.rules[0].nonResourceURLs) &&
          has(object.rules[0].resourceNames) && size(object.rules[0].resourceNames) > 0 &&
          object.rules[0].resourceNames.all(lease,
            lease.matches("^" + variables.instance + "-shard-[0-9]+$"))
        )
      message: the launcher's Role grants get and update on its instance's shard Leases alone
    - expression: >-
        request.operation == "DELETE" ||
        request.resource.resource != "rolebindings" ||
        (
          variables.instance != "" &&
          object.metadata.name == variables.own &&
          object.roleRef.apiGroup == "rbac.authorization.k8s.io" &&
          object.roleRef.kind == "Role" &&
          object.roleRef.name == variables.own &&
          has(object.subjects) && size(object.subjects) == 1 &&
          object.subjects[0].kind == "ServiceAccount" &&
          object.subjects[0].name == variables.own &&
          has(object.subjects[0].namespace) &&
          object.subjects[0].namespace == {{ .Release.Namespace | quote }}
        )
      message: the launcher's RoleBinding binds its instance's shards Role to the same-named account alone
    - expression: >-
        request.operation == "DELETE" ||
        request.resource.resource != "serviceaccounts" ||
        (
          variables.instance != "" &&
          object.metadata.name == variables.own &&
          (!has(object.secrets) || size(object.secrets) == 0) &&
          (!has(object.imagePullSecrets) || size(object.imagePullSecrets) == 0)
        )
      message: the launcher's ServiceAccount carries no secrets
    # Its annotations, an archive's workload identity alone (review c5b L2;
    # the launcher's IDENTITY_ANNOTATIONS).
    - expression: >-
        request.operation == "DELETE" ||
        request.resource.resource != "serviceaccounts" ||
        !has(object.metadata.annotations) ||
        object.metadata.annotations.all(key, key in [
          "iam.gke.io/gcp-service-account",
          "eks.amazonaws.com/role-arn",
          "eks.amazonaws.com/audience",
          "eks.amazonaws.com/sts-regional-endpoints",
          "eks.amazonaws.com/token-expiration",
          "azure.workload.identity/client-id",
          "azure.workload.identity/tenant-id",
          "azure.workload.identity/service-account-token-expiration"])
      message: the launcher's ServiceAccount carries workload-identity annotations alone
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "meridian-runtime.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
{{- end }}
{{- end }}
{{ include "meridian-runtime.memberBudget" (dict "top" $ "component" "launcher" "values" $.Values.launcher "account" true) }}
