# Everything a deployment needs, and nothing describing the platform's shape.
#
# Three values are required and have no defaults worth guessing. The chart
# refuses to render without them rather than installing something that starts
# and cannot work.

image:
  repository: ghcr.io/open-meridian/meridian-runtime
  # Pin a commit tag in anything you care about. `latest` moves under you.
  tag: latest
  pullPolicy: IfNotPresent

platform:
  # The one address. Not a region, not a list, not a failover order: the
  # platform is allowed to grow and move without this changing.
  address: https://open-meridian.com

deployment:
  # Given to you when you register this deployment on the platform.
  id: ""

  # The one-time code an install carries in place of a key (W5.24). The
  # conductor generates this deployment's key, registers the public half with
  # this code, and spends it; nobody handles either half, and nothing copies a
  # key out of a log into a form.
  #
  # Single use and a day long. After it is spent this value does nothing, and a
  # deployment that never spent one is given another on the platform.
  #
  # A marketplace listing asks for it in its form, so it arrives as a value
  # here. Where that is not wanted, name a secret holding it instead.
  enrolmentCode: ""
  enrolmentCodeSecret: ""
  enrolmentCodeKey: code

database:
  # A secret holding the connection URL, so it is not in your values file and
  # not in Helm's release history.
  #
  # Empty means this chart makes one, named after the release and left empty
  # for the first-run wizard to fill. Components wait for it rather than
  # failing, so an install before anybody has configured a database is a
  # deployment waiting at its wizard rather than a failed release.
  existingSecret: ""
  key: url

key:
  # Let the instrument store make its own key, inside the cluster, in a volume only it
  # mounts.
  #
  # This is the way that keeps the claim the product makes: the private half
  # never leaves the deployment. Generating one on a laptop and putting it in a
  # secret puts it in a file, a shell history and a backup before it ever
  # arrives.
  #
  # A job runs before the instrument store and prints the public half to its log:
  #
  #   kubectl logs job/<release>-meridian-runtime-key
  #
  # Register that with the platform. Until you do, the instrument store runs and its
  # calls are refused, which is the honest order: a key cannot be registered
  # before it exists.
  #
  # Never written into Helm's release history: the job writes it to a volume,
  # and nothing reads it back out.
  # On by default, because it is how a deployment gets a key without anybody
  # handling one: the conductor makes its own and enrols the public half with
  # the code the install carried (W5.24). An administrator with a key already
  # names it in existingSecret instead, and then this must be off.
  generate: true
  storage:
    size: 64Mi
    # Empty uses the cluster's default. Name one if your default is not
    # suitable for something this small and this important.
    className: ""

  # Or supply one yourself, in PKCS#8 PEM, which is what a firm holding keys in
  # a vault or a cloud KMS will want. Mutually exclusive with generate.
  existingSecret: ""
  key: key.pem

# What the pod runs as.
#
# Empty by default, and that is the portable answer rather than a lax one. A
# fixed uid is refused by OpenShift, which assigns each namespace its own
# range, so a chart that pins one does not install there at all. The image runs
# as a non-root user already, and a cluster with its own policy applies it here
# without this chart arguing.
#
# Set it if your cluster expects you to:
#   podSecurityContext:
#     runAsNonRoot: true
#     runAsUser: 10001
#     fsGroup: 10001
podSecurityContext: {}

# Applying the schema, once per release, before the new version serves.
#
# The runtime verifies rather than applies on start, so this is not optional:
# without it a fresh install starts and refuses to serve, naming the command it
# needs.
migrate:
  # A credential that may alter tables, which the serving one should not be.
  # Empty means use the database secret above, which is honest about the two
  # not being separated rather than implying they are.
  existingSecret: ""
  key: ""

  # The street store's, when its schema lives somewhere else. Empty falls back to the
  # settings above, and then to the street store's own serving credential.
  streetSecret: ""
  streetKey: ""

  # The configuration store's, likewise.
  configSecret: ""
  configKey: ""

  # A failed migration should stop the release rather than retry into it.
  backoffLimit: 0

# Each component is its own Deployment with its own tag, which is what makes
# "upgrade one without the others" a values change rather than a redesign.
# Empty means image.tag, so a deployment that moves everything together still
# names one version.
instrument:
  replicaCount: 1
  image:
    tag: ""

conductor:
  replicaCount: 1
  image:
    # Its own tag, so the component that talks to the platform can be moved
    # without touching either store. Empty falls back to image.tag.
    tag: ""
  # The configuration store's database, or the same one as the others: its
  # tables are prefixed config_, so sharing a schema is supported. Empty falls
  # back to the database secret above.
  database:
    existingSecret: ""
    key: ""

street:
  replicaCount: 1
  image:
    tag: ""
  # Its own database, or the same one. Two schemas on one server is supported
  # and two components sharing a table is not, which is a rule the credentials
  # should enforce rather than the code remember.
  database:
    existingSecret: ""
    key: ""

# The dashboard: the one address staff use. Signs people in through the firm's
# directory over OpenID Connect; a SAML or LDAP directory is brokered by a
# bundled Zitadel (not yet in this chart). One replica: sessions live in memory.
#
# Off until its sign-in has run end to end against a real directory
# (kernel/dashboard-sign-in-and-access); turning it on needs `url`.
dashboard:
  # On, because a deployment with no dashboard has no way to be set up: the
  # wizard is what a fresh install serves, and every address, database and
  # directory it holds is answered there (spec/installation-and-first-run,
  # requirement 5).
  enabled: true
  replicaCount: 1
  image:
    tag: ""
  # Where people reach it, https in any real deployment. Cookies are marked
  # Secure whenever it is.
  # Where people reach this dashboard, which is where a directory sends them
  # back to. Empty until the wizard asks for it; a deployment with a directory
  # and no address refuses to serve rather than guessing one.
  url: ""
  # Its identity on the broker, launched with the admin role's grants. The key
  # in the broker secret defaults to the instance identifier, as a sidecar's does.
  instanceId: dashboard-1
  brokerKey: ""
  oidc:
    # The directory. Empty means nobody can sign in, which the dashboard says.
    issuer: ""
    clientId: ""
    # A confidential client's secret, when the directory issued one. A public
    # client needs none: every sign-in uses PKCE.
    existingSecret: ""
    secretKey: client-secret
    groupsClaim: groups
    # Audiences besides clientId that an ID token may also name, and nothing
    # else is accepted. Empty for most directories; for Zitadel, the id of the
    # project the client belongs to, which it adds to every token.
    trustedAudiences: []

# A bundled Zitadel, for a firm with no directory of its own or one that speaks
# only SAML or LDAP (spec, rulings 9, 10, 14 to 16). Off by default: most firms
# point dashboard.oidc at the directory they already run.
#
# Turning it on needs, from you:
#   - zitadel.image.tag and zitadel.login.image.tag: the Zitadel version, the
#     same in both. Yours to set and yours to change; a Meridian upgrade never
#     changes it, and refuses to render when it needs a newer one.
#   - zitadel.zitadel.configmapConfig.ExternalDomain: Zitadel's public host.
#   - a Secret named meridian-zitadel-database, key `dsn`: a Postgres
#     connection string for a database and login role you made for Zitadel.
#     Zitadel never holds your Postgres superuser.
#   - identity.bundled.egress.allowCidrs: where Zitadel may connect besides the
#     group hook and DNS -- its database, and the LDAP directory if any.
# The Job that turns the wizard's answers into this deployment's
# configuration, and the only thing here that may change the cluster. It runs
# with the dashboard, gives up its rights when the configuration is applied,
# and exits; a deployment already configured finds its work done and exits.
firstRun:
  # Its own key in the broker secret, never the runtime's: what the wizard
  # seals is sealed to this Job, and a shared credential would let any
  # component receive it.
  brokerKey: first-run

identity:
  bundled:
    enabled: false
    # Roles on the dashboard's Zitadel project, standing in for groups for
    # people you make in Zitadel itself.
    roles: []
    # A directory Zitadel brokers over LDAP. Automatic update is always on and
    # memberOf always mapped: without either, a removed group lingers.
    ldap:
      enabled: false
      name: Directory
      servers: []            # ldaps://ldap.firm.example:636
      startTls: false
      baseDn: ""
      bindDn: ""
      # A Secret holding the bind password.
      bindPasswordSecret: ""
      bindPasswordKey: password
      userObjectClass: inetOrgPerson
      userFilter: uid
    # SAML attribute names the group hook reads, when SAML is brokered.
    saml:
      groupsAttribute: groups
      usernameAttribute: uid
      givenNameAttribute: givenName
      familyNameAttribute: sn
      emailAttribute: email
    egress:
      allowCidrs: []
    # The Secret holding Zitadel's own Postgres URL, under the key `dsn`. Made
    # by this chart and left empty for the first-run wizard to fill, because a
    # fresh install has no database for Zitadel yet. Its database and role are
    # still yours to make (ruling 16); what the wizard fills in is how to reach
    # them. It must match what zitadel.env names below.
    databaseSecretName: meridian-zitadel-database
    # The key pair this chart makes for the system API user Zitadel trusts.
    # Setup signs a short-lived credential with the private half whenever it
    # runs, so nothing here is minted once and lost forever: Zitadel's own
    # first-instance token is, which is why setup does not use it. Zitadel
    # reads the public half through the mount in zitadel.extraVolumes below,
    # so the two names have to agree.
    systemUserSecretName: meridian-identity-system-user
    # Where a browser reaches this deployment, written by first run and read by
    # the dashboard, by Zitadel and by the setup Job. Its name is a value
    # because Zitadel's own env references it below, and those are values.
    addressesSecretName: meridian-addresses

# The bundled Zitadel's own chart. Only what Meridian needs is set here; any of
# Zitadel's chart values may be added.
zitadel:
  image:
    tag: ""
  login:
    image:
      tag: ""
  # Its database and role are yours to make, so its init job does only the
  # part its own role can: Zitadel's schema inside the database it owns. The
  # rest of init -- the database, the role, their grants -- would need your
  # Postgres superuser.
  # Zitadel's own init and setup run as Helm hooks, and a hook has to succeed
  # before any ordinary resource exists. On a fresh install its database is not
  # configured until somebody has been through the first-run wizard, which the
  # dashboard serves, so a hook would be waiting in front of the thing that
  # unblocks it. Both are turned off here and run instead as our own Job, which
  # waits (templates/identity.yaml).
  #
  # The setup job has no enabled flag, so it is annotated as a test hook: it
  # renders, and nothing but `helm test` would ever run it.
  initJob:
    enabled: false
  setupJob:
    annotations:
      helm.sh/hook: test
      helm.sh/hook-delete-policy: before-hook-creation
  # Zitadel's own security context is kept: its image names its user rather
  # than numbering it, so Kubernetes can only verify it is non-root through the
  # uid its chart pins. On OpenShift, which assigns each namespace its own
  # range and refuses a pinned uid, set runAsUser and fsGroup to null here and
  # in securityContext, and the platform's numeric uid does the same job.
  # Zitadel's chart names its kubectl image after the cluster's Kubernetes
  # version, and not every version has an image (alpine/k8s:1.28.8 does not).
  # Pinned to one that exists.
  tools:
    kubectl:
      image:
        tag: "1.31.0"
  env:
    - name: ZITADEL_DATABASE_POSTGRES_DSN
      valueFrom:
        secretKeyRef:
          name: meridian-zitadel-database
          key: dsn
    # Zitadel refuses webhook targets on private addresses, and the group hook
    # is on one. Narrowed to link-local only; the NetworkPolicy on Zitadel's
    # egress is what limits it back to the hook, its database and directory.
    - name: ZITADEL_HTTPCLIENT_DENYLIST
      value: "169.254.0.0/16"
    # What Zitadel calls itself, which it puts in every token it issues. The
    # wizard is what learns it, so these come from what first run wrote rather
    # than from configmapConfig below; an administrator who set the address
    # there keeps it, because a value present wins over an absent key.
    - name: ZITADEL_EXTERNALDOMAIN
      valueFrom:
        secretKeyRef:
          name: meridian-addresses
          key: zitadel-external-domain
          optional: true
    - name: ZITADEL_EXTERNALPORT
      valueFrom:
        secretKeyRef:
          name: meridian-addresses
          key: zitadel-external-port
          optional: true
    - name: ZITADEL_EXTERNALSECURE
      valueFrom:
        secretKeyRef:
          name: meridian-addresses
          key: zitadel-external-secure
          optional: true
  # Where Zitadel reads the system API user's certificate from. Its name is
  # identity.bundled.systemUserSecretName above.
  extraVolumes:
    - name: system-user
      secret:
        secretName: meridian-identity-system-user
  extraVolumeMounts:
    - name: system-user
      mountPath: /system-user
      readOnly: true
  zitadel:
    # Made once by this chart and never regenerated: it encrypts the directory
    # credentials and signing keys in Zitadel's database, which is unreadable
    # in part without it. Back it up apart from the database.
    masterkeySecretName: meridian-zitadel-masterkey
    configmapConfig:
      # The one credential that administers this Zitadel. A system API user
      # rather than the first instance's token, which Zitadel mints once and
      # never again: losing it would leave the directory unadministrable with
      # an empty database as the only way back.
      #
      # System membership, because this Zitadel serves exactly one deployment
      # and exists to be configured by it. The roles are what setup needs to
      # make the project, its application and the directory connection, and
      # SYSTEM_OWNER is deliberately not among them.
      SystemAPIUsers:
        - meridian-setup:
            Path: /system-user/tls.crt
            Memberships:
              - MemberType: System
                Roles:
                  - IAM_OWNER
                  - ORG_OWNER
      ExternalDomain: ""
      ExternalPort: 443
      ExternalSecure: true
      TLS:
        Enabled: false

# The broker the components and sidecars meet on, per decision 010. One secret
# holding one credential per identity, each mounted into that container alone:
# a plugin can route to the broker and has nothing to present.
broker:
  # A broker this deployment already has, holding a credential per component
  # under the keys below. Empty means this chart brings one, makes the
  # credentials once and keeps them, and generates its permissions from the
  # grant table at start -- which is what leaves an install with no Secret for
  # anybody to write by hand.
  existingSecret: ""

  # The bundled broker's own image. Its version is yours, as Zitadel's is.
  image: nats:2.10-alpine
  instrumentKey: instrument
  conductorKey: conductor
  streetKey: street

# A sidecar per plugin, each with the identity it is launched with. The key in
# the broker secret is the instance identifier, so adding a plugin is adding a
# credential and an entry here.
#
# sidecars:
#   - instanceId: <the identifier you launch this plugin as>
#     role: <the role it is launched with, from your grant table>
#     tags: []
#     # The plugin, as a second container in this sidecar's pod. Optional: a
#     # sidecar with no plugin runs alone. Adding or removing an entry here is
#     # one Deployment created or deleted, and nothing else restarts.
#     plugin:
#       image: ghcr.io/open-meridian/meridian-snaptrade:<commit>
#       pullPolicy: IfNotPresent
#       imagePullSecret: ""        # for a private registry
#       args: []
#       env: {}                    # non-secret configuration, name: value
#       existingSecret: ""         # the vendor's credentials, made by you
#       resources: {}              # defaults to the runtime's own
sidecars: []


resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

logLevel: info

sidecar:
  # Where a plugin dials its sidecar, on loopback. A plugin runs as a second
  # container in its sidecar's pod, which is what sharing a network namespace
  # means here; a plugin in its own pod cannot reach this, and should not be
  # able to.
  #
  # Changing the host here opens the boundary to anything that can route to the
  # pod. The runtime warns when it is not loopback.
  address: 127.0.0.1:9191

  # Who this sidecar serves. Assigned here, at launch, never declared by the
  # plugin: a plugin that named its own role would be choosing its own
  # privileges. Together with the grant table these decide its topic access.
  #
  # Left empty, the plugin's registration is refused for having no grants, which
  # is the right way for an unconfigured deployment to fail.
  plugin:
    instanceId: ""
    role: ""
    tags: []

grants:
  # A ConfigMap holding the grant table: which roles this deployment admits and
  # what each may publish and subscribe to. Absent, nothing registers, which is
  # the right default for a file that decides access.
  existingConfigMap: ""
  key: grants.json

nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
