# Everything a deployment needs, and nothing describing the platform's shape.
#
# Three values are required and have no defaults worth guessing. The chart
# refuses to render without them rather than installing something that starts
# and cannot work.

image:
  repository: ghcr.io/open-meridian/meridian-runtime
  # Pin a commit tag in anything you care about. `latest` moves under you.
  tag: latest
  pullPolicy: IfNotPresent

platform:
  # Where the platform is. Empty is the platform, which is what every
  # deployment wants and what nobody should have to write down.
  #
  # Set it only to reach a different one -- a staging platform while somebody
  # is testing a change to the platform itself. It is an override in the same
  # way the deployment identifier and the enrolment code are values: something
  # an install carries when it has to, and leaves alone when it does not.
  #
  # The one address either way. Not a region, not a list, not a failover
  # order: the platform is allowed to grow and move without this changing.
  address: ""

deployment:
  # Given to you when you register this deployment on the platform.
  id: ""

  # The one-time code an install carries in place of a key (W5.24). The
  # conductor generates this deployment's key, registers the public half with
  # this code, and spends it; nobody handles either half, and nothing copies a
  # key out of a log into a form.
  #
  # Single use and a day long. After it is spent this value does nothing, and a
  # deployment that never spent one is given another on the platform.
  #
  # A marketplace listing asks for it in its form, so it arrives as a value
  # here. Where that is not wanted, name a secret holding it instead.
  enrolmentCode: ""
  enrolmentCodeSecret: ""
  enrolmentCodeKey: code

database:
  # A secret holding the connection URL, so it is not in your values file and
  # not in Helm's release history.
  #
  # Empty means this chart makes one, named after the release and left empty
  # for the first-run wizard to fill. Components wait for it rather than
  # failing, so an install before anybody has configured a database is a
  # deployment waiting at its wizard rather than a failed release.
  existingSecret: ""
  key: url
  # A Secret holding the private CA of a database somebody else runs, at
  # its `ca.crt` (ruled 2026-11-08): every connection to the database is
  # then over TLS or not at all, its server verified against that CA by the
  # name in the URL (sslmode verify-full). Empty, a database somebody else
  # runs is verified against the public roots, or the internal CA where
  # tls.internal is on.
  caSecret: ""

  # A Postgres this chart can bring, for evaluating the product and for a
  # laptop. Rendered at zero replicas: until somebody chooses it in the
  # wizard there is no claim, no disk and no database, and choosing it is a
  # scale rather than a creation (decisions/016).
  #
  # Not what a firm runs its books on. It survives uninstalling the release
  # and it does not survive deleting the cluster or the namespace, nobody
  # backs it up, and the wizard says all of that where it is offered. Off
  # renders none of it, and a deployment pointed at a database somebody else
  # runs never starts it.
  brought:
    enabled: true
    image: postgres:16-alpine
    size: 20Gi
    # The cluster's default provisioner, whatever it is.
    storageClassName: ""
    # The bundled Postgres's own requests and limits (v27 stage E): every
    # store's tables and the lake's rows in one server want more than the
    # shared `resources` a component gets, and the dev deployment's database
    # sat near that limit. Empty takes the shared `resources`.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    # Standbys beside the primary (step 3b; spec/a-deployment-scales-out-
    # and-fails-over-by-configuration section 4): 0, the tolerant default,
    # one database restarted on its volume; or 2, a primary and two standbys
    # under Patroni, each on its own volume and node, one synchronous and
    # strict, so the book's, the street store's, the instrument store's and
    # the configuration's commits survive the primary (RPO 0) and a primary
    # lost is answered for within 30 s (ruling 1048). By the profile: 0
    # tolerant, 2 ha. Patroni keeps its state in this namespace's ConfigMaps.
    # A firm running Postgres for production names an external managed one
    # with its provider's synchronous standby instead (database.existingSecret).
    # standbys:
    # Its max_connections, counted from what this chart deploys (ruled
    # 2026-11-08): each store member's pool of 8 and 2 beside it, writer,
    # standby and a rollout's surge; each dashboard copy's 4 and 1; 6 for
    # jobs; 4 kept for the superuser and Patroni; a quarter over that. 82
    # tolerant, 213 ha. Set it to override; below what the pods hold is
    # refused. Each connection may take work_mem (4 MiB) under load, which
    # the preflight counts against the memory limit above.
    # maxConnections:
    # The image the members run under Patroni: postgres:16-alpine's server
    # with Patroni and pgBackRest (deploy/database). Once a database has run
    # under Patroni it keeps this image, standbys or none.
    patroniImage: ghcr.io/open-meridian/meridian-postgres:latest
    # With standbys, the members compared (step 3b part 4): on this
    # schedule a Job reads each store's log on every member, digest by
    # digest, and a standby whose copy differs from the primary's, or whose
    # page fails its checksum, is an IntegrityFinding in that store, named.
    # With `reclone` it is re-cloned from the primary through Patroni's
    # REST API with Patroni's credential, which this Job alone of the
    # deployment's workloads is given, and compared again. The primary is
    # never re-cloned here. Empty schedule for none.
    replicaScrub:
      schedule: "40 3 * * *"
      reclone: true

key:
  # Let the instrument store make its own key, inside the cluster, in a volume only it
  # mounts.
  #
  # This is the way that keeps the claim the product makes: the private half
  # never leaves the deployment. Generating one on a laptop and putting it in a
  # secret puts it in a file, a shell history and a backup before it ever
  # arrives.
  #
  # A job runs once, at install, before anything that mounts the key, and
  # makes it in the volume; it is removed once it succeeds. The conductor
  # registers the public half with the enrolment code, and the wizard shows
  # its fingerprint. To read the public half itself:
  #
  #   kubectl exec deploy/<release>-meridian-runtime-conductor -- meridian-conductor public-key
  #
  # Never written into Helm's release history: the job writes it to a volume,
  # and nothing reads it back out.
  # On by default, because it is how a deployment gets a key without anybody
  # handling one: the conductor makes its own and enrols the public half with
  # the code the install carried (W5.24). An administrator with a key already
  # names it in existingSecret instead, and then this must be off.
  generate: true
  storage:
    size: 64Mi
    # Empty uses the cluster's default. Name one if your default is not
    # suitable for something this small and this important.
    className: ""

  # Or supply one yourself, in PKCS#8 PEM, which is what a firm holding keys in
  # a vault or a cloud KMS will want. Mutually exclusive with generate.
  existingSecret: ""
  key: key.pem

# What the pod runs as.
#
# Empty by default, and that is the portable answer rather than a lax one. A
# fixed uid is refused by OpenShift, which assigns each namespace its own
# range, so a chart that pins one does not install there at all. The image runs
# as a non-root user already, and a cluster with its own policy applies it here
# without this chart arguing.
#
# Set it if your cluster expects you to:
#   podSecurityContext:
#     runAsNonRoot: true
#     runAsUser: 10001
#     fsGroup: 10001
podSecurityContext: {}

# The upgrade preflight (H1): before an upgrade changes anything, the release
# being installed checks the deployment -- the database's disk, memory and
# connections against their limits, the largest bus answer against the
# broker's 1 MiB payload limit, each store's schema and the stored templates
# against this release, each pending migration additive or named, the
# launched plugins, the newest backup -- and stops the upgrade on a blocked
# check, nothing changed. A pre-upgrade hook, read-only, holding no RBAC
# (templates/preflight-job.yaml). Off only for tooling that cannot wait on
# a hook; `meridian-conductor preflight` runs the same checks by hand.
preflight:
  enabled: true

# Applying the schema, once per release, before the new version serves.
#
# The runtime verifies rather than applies on start, so this is not optional:
# without it a fresh install starts and refuses to serve, naming the command it
# needs.
migrate:
  # A credential that may alter tables, which the serving one should not be.
  # Empty means use the database secret above, which is honest about the two
  # not being separated rather than implying they are.
  existingSecret: ""
  key: ""

  # The street store's, when its schema lives somewhere else. Empty falls back to the
  # settings above, and then to the street store's own serving credential.
  streetSecret: ""
  streetKey: ""

  # The configuration store's, likewise.
  configSecret: ""
  configKey: ""

  # The book of record's, likewise.
  borSecret: ""
  borKey: ""

  # The lake's, likewise.
  lakeSecret: ""
  lakeKey: ""

  # A failed migration should stop the release rather than retry into it.
  backoffLimit: 0

# How many old ReplicaSets each Deployment keeps: enough to roll back to the
# last few releases, and no more. Kubernetes keeps ten by default, and four
# upgrades of a development deployment left 26 ReplicaSets for six
# Deployments, growing by one per Deployment per upgrade (task
# kernel/upgrading-a-deployment-in-place). chart-check refuses a Deployment
# that does not say this.
revisionHistoryLimit: 3

# Each component is its own Deployment with its own tag, which is what makes
# "upgrade one without the others" a values change rather than a redesign.
# Empty means image.tag, so a deployment that moves everything together still
# names one version.
# Step 3b (spec/a-deployment-scales-out-and-fails-over-by-configuration
# sections 1 to 3, 11; plan Track 5): every count is a value, small by
# default (ruling 1047). With a component's `standby` at 1, it runs a warm
# standby beside its writer: the same image, holding no lease and serving
# nothing, following the writer's change log, which takes the writer's
# lease when it lapses and fences the old writer by its partitions' epoch.
# The lease is a coordination.k8s.io/v1 Lease in this namespace (the
# members' one right); the epoch, kept by the store that is the record, is
# the fence. A standby is ready while its lag is under `readyLagMs`.
#
# `resilience.profile` turns every count on at once (section 11, question
# 23): `tolerant`, the default, one member of everything, healed by
# Kubernetes restarting it within the tolerant bounds (ruling 1056); `ha`, a
# standby per writer, the brought database with two standbys under Patroni,
# the broker at three with JetStream at three, the dashboard and analytics at
# two. Each count below that says "by the profile" is left unset here so the
# profile decides it; set it to override the profile either way. `ha` needs
# the key in key.existingSecret (ruling 1074). The profile is what is
# configured, never a claim: `meridian status --profile` reads what runs.
resilience:
  profile: tolerant

leases:
  # How often a writer renews its lease, and a standby looks at it.
  renewSeconds: 2
  # How long a lease lasts unrenewed: a standby takes it after this.
  durationSeconds: 6

# The zones members spread over (topology.kubernetes.io/zone), and are kept
# within; empty, as by default, spreads over nodes only.
zones: []

instrument:
  replicaCount: 1
  # How often its writer re-reads its record, at low priority (step 3b,
  # integrity at rest): every row and digest checked, the journal's chain
  # followed, each finding kept as an IntegrityFinding. 0 for never.
  scrub:
    intervalDays: 7
  # A warm standby (step 3b): 0 or 1, by the profile (0 tolerant, 1 ha).
  # standby:
  # A standby's readiness bound: its lag behind the writer's change log.
  readyLagMs: 5000
  image:
    tag: ""
  # The hot layer (step 3a): records by ID and what each became, answered
  # from the store's memory, bounded in MiB, the least recently read
  # evicted first.
  hotLayer:
    recordsMiB: 32

conductor:
  replicaCount: 1
  # How often its writer re-reads its record, at low priority (step 3b,
  # integrity at rest): every row and digest checked, the journal's chain
  # followed, each finding kept as an IntegrityFinding. 0 for never.
  scrub:
    intervalDays: 7
  # A warm standby (step 3b): 0 or 1, by the profile. It needs the key in
  # key.existingSecret.
  # standby:
  readyLagMs: 5000
  image:
    # Its own tag, so the component that talks to the platform can be moved
    # without touching either store. Empty falls back to image.tag.
    tag: ""
  # The configuration store's database, or the same one as the others: its
  # tables are prefixed config_, so sharing a schema is supported. Empty falls
  # back to the database secret above.
  database:
    existingSecret: ""
    key: ""

street:
  replicaCount: 1
  # How often its writer re-reads its record, at low priority (step 3b,
  # integrity at rest): every row and digest checked, the journal's chain
  # followed, each finding kept as an IntegrityFinding. 0 for never.
  scrub:
    intervalDays: 7
  # standby: by the profile, 0 or 1
  readyLagMs: 5000
  image:
    tag: ""
  # Its own database, or the same one. Two schemas on one server is supported
  # and two components sharing a table is not, which is a rule the credentials
  # should enforce rather than the code remember.
  database:
    existingSecret: ""
    key: ""

# The book of record (W9). One replica: every command takes its partition's
# lock, so a second would wait rather than help, and the rollout never surges
# so an upgrade never runs two writers. Its tables are prefixed book_, so it
# may share a schema with the others; its own database is supported and
# kept apart from the street's by the credential.
bor:
  replicaCount: 1
  # How often its writer re-reads its record, at low priority (step 3b,
  # integrity at rest): every row and digest checked, the journal's chain
  # followed, each finding kept as an IntegrityFinding. 0 for never.
  scrub:
    intervalDays: 7
  # standby: by the profile, 0 or 1
  readyLagMs: 5000
  image:
    tag: ""
  database:
    existingSecret: ""
    key: ""
  # The book replays an account's journal for each command and each dated
  # read, so it needs more room than the other components (approved
  # 2026-10-15, after a development pod at 256Mi was OOMKilled). Replaces
  # the shared `resources` for the book alone.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # glibc's allocator arenas, at most this many: a burst of requests answered
  # on many threads otherwise keeps an arena's memory per thread resident.
  mallocArenaMax: 2
  # How many entries an account's journal grows by between snapshots of its
  # book (contract v25, W9.10): a command or a dated read replays the journal
  # from the latest snapshot, never from the account's first entry. One is
  # taken when a command or (from v26) a read replays this many, and at the
  # book's start for every account past it with none current. The default is
  # from core's replay benchmark; 10 to 100000.
  snapshotInterval: 1000
  # The hot layer (step 3a): each account's book at its head, answered from
  # the book's memory, bounded in MiB, the least recently read evicted
  # first, within its 512 MiB.
  hotLayer:
    booksMiB: 128

# The lake (W10, contract v18). One replica: every batch takes its dataset's
# head in Postgres, so a second would wait rather than help, and the rollout
# never surges. Its tables are prefixed lake_, so it may share a schema with
# the others; its own database is supported, and kept apart by the
# credential.
lake:
  replicaCount: 1
  # How often its writer re-reads its record, at low priority (step 3b,
  # integrity at rest): every row and digest checked, the journal's chain
  # followed, each finding kept as an IntegrityFinding. 0 for never.
  scrub:
    intervalDays: 7
  # standby: by the profile, 0 or 1
  readyLagMs: 5000
  image:
    tag: ""
  # glibc's allocator arenas, at most this many, as the book's: a chain
  # page's reads answered on many threads otherwise kept an arena's memory
  # per thread resident (ruling 808; found on dev at 690 to 830 MiB of the
  # lake's 1 GiB). The capacity bench's chain page at eight at once held
  # 441 MiB resident with the default and 121 MiB with 2, the same live
  # heap (~62 MiB at its peak).
  mallocArenaMax: 2
  # glibc maps an allocation of this many bytes or more of its own, and
  # unmaps it when it is freed (ruling 972). Left to glibc, the threshold
  # rises with the first large allocation freed, up to 32 MiB, and a whole
  # answer's vectors are then carved from the arenas, where freeing them
  # keeps them resident: on dev the lake reached 825 MB to 1 GiB in a
  # startup burst while holding about 250 MiB live (2026-10-31). Fixed at
  # 128 KiB, the probe's burst of eight chain readers peaked at 381 to 393
  # MiB resident, not 848, in the same time.
  mallocMmapThreshold: 131072
  # How many reads' whole answers the lake builds at once, 1 to 8 (rulings
  # 957, 958). A read answered in pages builds its whole answer once, at
  # its first page, copying its rows several times on the way: a chain's
  # statistics, about 25,000 rows, peaked near 80 MiB each, and eight
  # readers at once took dev's lake past its 1 GiB (2026-10-31). A read
  # past the most waits for one to finish. 1 where the lake's memory is
  # tight -- a limit under 512 MiB -- at the cost of readers waiting longer
  # in a burst; more only with a limit raised to match.
  maxConcurrentAnswers: 2
  # The hot layer (step 3a; spec/one-data-access-model section 3): what the
  # lake answers from its own memory, Postgres the record, each layer
  # bounded in MiB, the least recently read evicted first, within the
  # lake's 1 GiB (ruling 808). latestMiB: each dataset's latest rows per
  # subject, what a live page reads. listingsMiB: a chain's series per
  # underlying and dataset. Raising the lake's memory limit is not the fix
  # for a layer that does not fit; a smaller bound is (808).
  hotLayer:
    latestMiB: 64
    listingsMiB: 32
  database:
    existingSecret: ""
    key: ""

# The analytics component (contract v26, W12): a coordinator and a pool of
# workers, its own image from the same commit, its own credential.
# Stateless, so either scales by its replica count; the coordinator answers
# jobs and computes a unit too large to send, the workers compute the rest.
# One of each by default (the v26 plan's question 245), sized from v26's
# first benchmark (crates/analytics-engine/BENCHMARK.md): a 500-position
# account's 500-day VaR and ES reads, hashes and computes in about a quarter
# of a second on one core, and its inputs (25 MB written out) are held
# while it runs; a 1,000-account batch holds about ten times that.
analytics:
  image:
    # Empty is image.repository's, named meridian-analytics where it names
    # meridian-runtime: ghcr.io/open-meridian/meridian-analytics beside the
    # published runtime, meridian-analytics:local beside a local build.
    repository: ""
    tag: ""
  coordinator:
    # By the profile: 1 tolerant, 2 ha.
    # replicaCount:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 2Gi
  worker:
    # By the profile: 1 tolerant, 2 ha.
    # replicaCount:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 2Gi
  # How long a job may take and still be answered in the reply; past it the
  # job finishes later and its client is told (the one-API spec's Q5).
  inlineMs: 2000
  # How long a routed pricing plugin has to answer a batch before the
  # figures through it are not evaluated (W12.3, requirement 22).
  priceDeadlineMs: 5000

# Installed for development (spec/live-plugin-development, ruling 2): it may
# run plugin code as it is being written, which nobody has reviewed, and every
# dashboard page says so. Set at install -- `meridian up --development`, or a
# sandbox's own values -- never by a customer's listing, and never switched on
# from the dashboard.
development: false

# How people and the CLI reach this deployment from outside the cluster: a
# standard Ingress, off by default (templates/ingress.yaml). The listing turns
# it on from the buyer's domain; `meridian up` as `meridian.localhost` where the
# cluster has an ingress controller, and port-forwards where it has none.
ingress:
  enabled: false
  # The IngressClass to use; empty for the cluster's default.
  className: ""
  # The name people use, e.g. meridian.firm.example. Each plugin's page is on
  # a name below it, `<instance>.plugins.<host>`, so it cannot be an address.
  host: ""
  # Passed through, and merged over the upload limits set for nginx-ingress
  # and the HTTPS-only entrypoint set for Traefik.
  annotations: {}
  # Plain HTTP, on the controller's port 80. Off: the Ingress serves HTTPS
  # alone, and renders only with tls.secretName set, since an MCP client signs
  # in over nothing else (task kernel/a-development-deployment-serves-https,
  # ruling 3). On only for testing: the cluster tests reach Traefik on :80.
  #
  # Off, each controller is kept to HTTPS its own way. Traefik, Rancher
  # Desktop's and k3s's, by the router.entrypoints annotation naming
  # `websecure`, which the chart sets. nginx-ingress redirects plain HTTP to
  # HTTPS of its own accord once an Ingress has TLS (its ssl-redirect, on by
  # default). Any other controller: set what it reads in `annotations` above.
  plainHttp: false
  tls:
    # A Secret holding the certificate for `host`. Required unless plainHttp
    # is on. `meridian up` writes one for a name under `.localhost`, from the
    # machine's own certificate authority; any other name's is the operator's.
    secretName: ""
    # One for `*.plugins.<host>`, a wildcard; empty uses secretName's, which
    # then has to cover both.
    pluginsSecretName: ""

# TLS on the deployment's own paths inside the cluster (ruling 1084): every
# store's, the dashboard's and the Jobs' connections to the database this
# chart brings, every component's and sidecar's to the broker, the brokers'
# routes to each other, Patroni's standbys streaming from their primary, and
# the dashboard's requests to each plugin's front door. Off by default: the
# desktop's one node has none of these paths on a network.
#
# On, the chart makes a CA of its own and each server's certificate from it
# (kept across upgrades, as the WAL archive's are), gives every client the
# CA's certificate, and a plaintext connection is refused, not merely
# discouraged: the database admits TLS alone (pg_hba's hostssl, every other
# remote line rejected), the broker refuses a client that does not speak it,
# and a front door serves nothing in the clear. A database somebody else runs
# (database.brought.enabled false, or another chosen in the wizard) is then
# reached over TLS too, verified against the public roots and this CA: one
# that offers no TLS is refused. Patroni's REST API is served over TLS
# alone, and its members and the members' comparison Job reach it by each
# member's own name, verified against this CA (ruled 2026-11-08).
tls:
  internal:
    enabled: false

# The dashboard: the one address staff use. Signs people in through the firm's
# directory over OpenID Connect; a SAML or LDAP directory is brokered by a
# directory that speaks it. Browser sessions, plugin pages' sessions and
# sign-ins in flight are kept in the dashboard's own tables, so a restart
# leaves them standing and any copy answers any of them.
#
# On. It was off until its sign-in had run end to end against a real
# directory, and that is now what `make e2e-dashboard` proves on every run.
dashboard:
  # On, because a deployment with no dashboard has no way to be set up: the
  # wizard is what a fresh install serves, and every address, database and
  # directory it holds is answered there (spec/installation-and-first-run,
  # requirement 5).
  enabled: true
  # Copies, by the profile (1 tolerant, 2 ha): stateless, each reading the
  # same sessions and sign-ins in flight from the dashboard's tables.
  # replicaCount:
  image:
    tag: ""
  # Where people reach it, https in any real deployment. Cookies are marked
  # Secure whenever it is.
  # Where people reach this dashboard, which is where a directory sends them
  # back to. Empty until the wizard asks for it; a deployment with a directory
  # and no address refuses to serve rather than guessing one.
  url: ""
  # Its identity on the broker, launched with the admin role's grants. The key
  # in the broker secret defaults to the instance identifier, as a sidecar's does.
  instanceId: dashboard-1
  brokerKey: ""
  oidc:
    # The directory. Empty means nobody can sign in, which the dashboard says.
    issuer: ""
    clientId: ""
    # A confidential client's secret, when the directory issued one. A public
    # client needs none: every sign-in uses PKCE.
    existingSecret: ""
    secretKey: client-secret
    groupsClaim: groups
    # Audiences besides clientId that an ID token may also name, and nothing
    # else is accepted. Empty for most directories; some name a project or
    # project the client belongs to, which it adds to every token.
    trustedAudiences: []


broker:
  # A broker this deployment already has, holding a credential per component
  # under the keys below. Empty means this chart brings one, makes the
  # credentials once and keeps them, and generates its permissions from the
  # contract at start -- which is what leaves an install with no Secret for
  # anybody to write by hand.
  existingSecret: ""

  # The bundled broker's own image. Its version is yours.
  image: nats:2.10-alpine
  instrumentKey: instrument
  conductorKey: conductor
  streetKey: street
  borKey: bor
  lakeKey: lake
  analyticsKey: analytics
  # JetStream's volume on each server, where JetStream runs (its replicas by
  # the profile: 0 tolerant, 3 ha): the analytics units' work queue and the
  # servers' Raft state, kept on file so a server restarted rejoins with
  # what it held. No volume without JetStream.
  jetstream:
    size: 1Gi
    storageClassName: ""
    # What JetStream holds in memory on each server (stage M; section 10a).
    maxMemory: 16MB
  # The broker's bounds (stage M; section 10a; approved 2026-11-09): a
  # client that stops reading is cut off alone, as a slow consumer, once
  # maxPending bytes wait for it, and every other keeps its deliveries; the
  # largest message is maxPayload, the 1 MiB every paged answer is budgeted
  # under -- never raised to fit an answer: page it.
  limits:
    maxPending: 64MB
    maxPayload: 1MB

# What first run writes, and what reads it. These are Secret names rather than
# values: the wizard fills them in the cluster, and the chart names them so
# that the Job may write those and nothing else.
firstRun:
  # Its own key in the broker secret, never the runtime's: what the wizard
  # seals is sealed to this Job, and a shared credential would let any
  # component receive it.
  brokerKey: first-run
  # Where a browser reaches this deployment, who administers it, and -- where
  # the deployment holds the account itself -- that administrator's login and
  # password hash. Never a password: there is no key for one.
  addressesSecretName: meridian-addresses
  # The firm's LDAP, where they have one: the servers, the base, the bind and
  # how a person is found. The dashboard binds to it directly (decisions/018).
  directorySecretName: ""

# A sidecar per plugin, each with the identity it is launched with. The key in
# the broker secret is the instance identifier, so adding a plugin is adding a
# credential and an entry here.
#
# sidecars:
#   - instanceId: <the identifier you launch this plugin as>
#     # One or more roles from the contract's fixed list (decisions/020): confirmation,
#     # compliance, connectivity, custody, data, ems, oms, operations, portfolio,
#     # reporting, servicing, settlement, signal. What they may do is the
#     # contract's, compiled into the runtime; none is a plugin admitted with
#     # no topics. A name that is not a role stops the broker from starting.
#     roles: []
#     # The plugin, as a second container in this sidecar's pod. Optional: a
#     # sidecar with no plugin runs alone. Adding or removing an entry here is
#     # one Deployment created or deleted, and nothing else restarts.
#     plugin:
#       image: ghcr.io/open-meridian/meridian-snaptrade:<commit>
#       pullPolicy: IfNotPresent
#       imagePullSecret: ""        # for a private registry
#       args: []
#       env: {}                    # non-secret configuration, name: value
#       existingSecret: ""         # the vendor's credentials, made by you
#       resources: {}              # defaults to the runtime's own
sidecars: []

# The deployment's own plugin registry, which `meridian plugin upload` sends a
# plugin to and the cluster pulls launched plugins from
# (spec/the-local-plugin-registry).
registry:
  enabled: true
  image: registry:2.8.3
  storage: 10Gi
  # Empty is the cluster's default storage class.
  storageClassName: ""
  # The port each node's pull-through proxy listens on, on 127.0.0.1 only, and
  # what a launched plugin's image is named with: localhost:<hostPort>/...
  # Unique on a cluster: two deployments on one cluster need two ports.
  hostPort: 5000

# The community and verified registries (contract v25,
# spec/plugins-are-shared-through-registries). What a deployment installs
# from them is verified offline by the conductor against the platform's
# public keys, carried here by each chart release: the current one and the
# next, so the platform's key can rotate without a gap (requirement 23). Each
# an ECDSA P-256 public key as PEM. Empty, nothing is installed from a
# registry: the Browse tab says the deployment reaches none. The release
# fills them; an install changes them only to follow a published rotation.
# v26: the platform's current key (SHA-256 of its PEM 69c1961a...), the
# registry's signing key at open-meridian.com.
registries:
  # The registries this deployment takes, any of `community` and `verified`
  # (spec/starter-packs, requirement 26; ruling 616). Empty takes both. A
  # version from a registry not taken is refused at install, and a starter
  # pack's member from one reads "Not permitted here" and cannot be ticked.
  # Changed, like every value, with `meridian upgrade-deployment -f`.
  taken: []
  platformKeys:
    - |
      -----BEGIN PUBLIC KEY-----
      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEYM0/p11OyeOPd/Wxgpt0yNiY74kY
      CavdxXGp4OQ2EJvgQBJfLQm4DG2uWK3eIlP1NBy1ez3L7tuAnvT8TiIWeg==
      -----END PUBLIC KEY-----

# What launches the plugins a deployment admin uploads and approves (W8.3),
# creating each a Deployment in the chart's plugin shape and nothing else
# (decisions/019). On with the registry it launches from, and with the broker
# this chart brings, which gives it a credential and learns what it launched.
launcher:
  enabled: true
  instanceId: launcher-1
  # A standby launcher (step 3b): 0 or 1, by the profile; it launches only
  # once it holds the lease.
  # standby:

# Storage for a plugin at the edge (decisions/028): a plugin holding an edge
# role (confirmation, connectivity, custody, data, reporting, servicing, settlement) keeps an
# external party's raw records -- a venue's messages, a custodian's
# statements, what it sent a regulator -- and its working state, and rebuilds
# from them after a restart. Each such instance gets a volume of its own, one
# PersistentVolumeClaim, `<release>-meridian-runtime-storage-<instance>`,
# mounted in its plugin's container alone at the path MERIDIAN_STORAGE_DIR
# names. No other plugin's pod may mount it, which an admission policy holds
# where the cluster has ValidatingAdmissionPolicy.
#
# Stopping a plugin keeps its storage, and launching the same plugin as the
# same instance mounts it again; launching another plugin as that instance is
# refused while it is kept. Nothing in the deployment deletes one, uninstalling
# included: removing it is an administrator's act, against the records a firm
# must keep. Encryption at rest and backups are the storage class's and the
# cluster's, as for the database.
pluginStorage:
  enabled: true
  # Each instance's, requested once when it is made; a larger value applies
  # to instances made after it changes.
  size: 5Gi
  # Empty is the cluster's default storage class.
  storageClassName: ""
  # The group a fresh volume is made writable by, so a plugin running as a
  # non-root user can write it. Empty where the cluster assigns its own, as
  # OpenShift does; podSecurityContext.fsGroup, when set, wins.
  fsGroup: 65532

# An archive for an edge plugin's older records (contract v16;
# spec/an-edge-plugins-older-records-move-to-the-archive): past a kind's
# window, a plugin moves its raw records here rather than deleting them, at
# its admin's choice. Setting one of these allows no instance an archive by
# itself: a deployment admin allows each, with a bound or none, on the
# plugin's Manage page (W8.7), and the launcher restarts the instance with it.
# None set, the default: nothing is archived, and records past their window
# are kept in storage.
#
# On a local or on-premises deployment, a directory on the node (`path`, a NAS
# export or a second disk mounted there; what `meridian up --archive <path>`
# sets), made into a volume of its own, `<release>-meridian-runtime-archive`;
# or a claim already made on such storage (`existingClaim`). Each allowed
# instance mounts its own directory of it, named for the instance, at the path
# MERIDIAN_ARCHIVE_DIR names, in the plugin's container alone, its bound in
# MERIDIAN_ARCHIVE_MOST_BYTES where the deployment admin gave one; an admission
# policy holds every pod to its own directory where the cluster can. Kept on
# uninstall, never deleted by the deployment, and a local archive cannot lock:
# a hold needing records that cannot be altered is refused, not claimed.
#
# In a cloud, `bucket`: the URL of a bucket in the provider's cold class
# (s3://, gs://, or an Azure container URL), each allowed instance its own
# prefix, named in MERIDIAN_ARCHIVE_BUCKET; `serviceAccount` is the account
# whose workload identity is scoped to that bucket, which an allowed
# instance's pod runs as, so no key is ever handed to a plugin. `objectLock`
# says the bucket was made with object lock in compliance mode, which alone
# lets a hold need records that cannot be altered.
pluginArchive:
  path: ""
  existingClaim: ""
  # The volume made from `path`, requested once.
  size: 100Gi
  bucket: ""
  serviceAccount: ""
  objectLock: false

# Backups of this deployment (task kernel/a-deployment-is-backed-up-and-restored):
# a CronJob that writes one file per run, `<release>-<UTC time>.meridian-backup`,
# holding everything a restore needs that is not the cluster's own -- the
# keys the deployment's secrets are sealed with and its components trust,
# every credential the chart keeps, the deployment's key, these values
# (without the enrolment code), and the database this chart brings, dumped
# with every table's row count. A database somebody else runs is left to
# its provider's own backups and is not dumped.
#
# Sealed with age to `recipient`, whose private half is the administrator's
# and never in the cluster: the cluster cannot read its own backups, and a
# copied backup reveals nothing. `meridian backup key` makes a pair; restore
# with `meridian restore <file> --identity <file>`, into a namespace holding
# no deployment. Nothing renders until `recipient` and a place to write are
# both set; there is no unencrypted backup.
#
# On a local cluster, `path` is a directory on the node: on Rancher Desktop,
# one under your Mac's home folder, which the VM mounts and a reset of
# Rancher Desktop keeps (a path inside the VM is wiped with it). Or name a
# claim already made on storage that outlives the cluster (`existingClaim`).
backup:
  # Cron, in the cluster's time zone. Empty: none scheduled, and `meridian
  # backup` still takes one when asked.
  schedule: ""
  # The age public key (`age1...`) each backup is sealed to.
  recipient: ""
  path: ""
  existingClaim: ""
  # The volume made from `path`, requested once.
  size: 20Gi
  # How many of this release's backups to keep; the oldest beyond it are
  # removed once a new one is written, and never after a failure.
  keep: 14
  # Whether the database is dumped. Empty: the database this chart brings
  # is, and one somebody else runs is not, left to its provider's own
  # backups and availability. `true` dumps either (an external one as its
  # migrating role, with a pg_dump no older than its server: name an image
  # that has one); `false` dumps none. The keys, the values and the
  # manifest are backed up whichever.
  database: ""
  # pg_dump at the brought database's major version, and age.
  image: ghcr.io/open-meridian/meridian-backup:latest
  # The brought database's write-ahead log archived off the cluster, for a
  # restore to any time since the oldest backup kept (step 3b; spec/a-
  # deployment-scales-out-and-fails-over-by-configuration sections 4 and 9).
  # pgBackRest, in database.brought.patroniImage: the database archives
  # each WAL segment as it fills, or after timeoutSeconds, whichever is
  # first; each backup the schedule or `meridian backup` takes adds a full
  # base backup beside its sealed file, and the newest backup.keep of those
  # are kept with the WAL they need. Restored by `meridian restore
  # --to-time`. Off by default, so a desktop keeps no archive (ruling 1058).
  # It needs backup.recipient and a place for the backups: its base backups
  # are taken with them, and its passphrase travels sealed in them.
  walArchive:
    enabled: false
    # Where the archive is kept: `volume`, beside the sealed backups
    # (backup.path or backup.existingClaim) under `path`; or an object
    # store, at `path` in `bucket`: `s3` (or a store speaking its API, at
    # `endpoint`), `gcs` or `azure` (`bucket` is its container).
    store: volume
    path: /wal-archive
    bucket: ""
    # s3: the store's address and region (s3.<region>.amazonaws.com and
    # <region> on AWS). gcs and azure: empty for the cloud's own.
    endpoint: ""
    region: ""
    # A Secret holding the store's credentials: s3 `key` and `secret`; gcs
    # `key`, a service account's JSON; azure `account` and `key`. Empty for
    # s3 or gcs: the pod's own identity (an IAM role or workload identity).
    existingSecret: ""
    # The archive is always encrypted, AES-256-CBC, with a passphrase this
    # Secret holds as `pass` (ruling 1084). Empty: the chart makes one and
    # keeps it beside the database's passwords, and every backup carries it
    # sealed, so a restore into a new cluster reads the archive.
    cipherSecret: ""
    # s3: the customer-managed key (an AWS KMS key's ID or ARN) the store
    # encrypts each object with (SSE-KMS). Empty: the bucket's own default.
    # On gcs and azure a customer-managed key is the bucket's or the
    # storage account's setting, made there.
    kmsKeyId: ""
    # The longest a committed transaction waits to be archived: what a
    # restore into a new cluster can lose (the region row asks 5 minutes).
    timeoutSeconds: 60


resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

logLevel: info

# Each component's working memory (stage M; the resilience spec's section
# 10a; approved 2026-11-09): a component's budget is its container's memory
# limit times budgetPercent, less its hot layer's and held answers' bounds,
# and every request reserves its working memory against it before it runs;
# with the budget full a request waits briefly, then is refused
# RESOURCE_EXHAUSTED with REFUSAL_REASON_OVERLOADED and a retry-after.
# Above shedPercent of its limit a component cancels its largest request in
# flight with the same refusal, so the kernel's OOM killer never fires. A
# configuration that leaves a component nothing to answer with is refused
# before it is applied. Raising a limit is not the fix for a component that
# refuses (808); lowering the bound that holds the memory is.
memory:
  budgetPercent: 80
  shedPercent: 90

sidecar:
  # Where a plugin dials its sidecar, on loopback. A plugin runs as a second
  # container in its sidecar's pod, which is what sharing a network namespace
  # means here; a plugin in its own pod cannot reach this, and should not be
  # able to.
  #
  # Changing the host here opens the boundary to anything that can route to the
  # pod. The runtime warns when it is not loopback.
  address: 127.0.0.1:9191
  # Where the dashboard sends a person's requests for the plugin's page
  # (decisions/014, 021). Off loopback, since the dashboard is another pod,
  # and closed by a NetworkPolicy to everything but the dashboard's pods. The
  # plugin's own page stays on loopback, where only its sidecar reaches it.
  frontDoorPort: 9292
  # Each plugin's own share at its sidecar (stage M; section 10a; approved
  # 2026-11-09): at most inFlight requests at once, requestsPerSecond with a
  # burst of a second's worth, and answerMiB of answers held or paged in
  # flight for it. Past any of them only that plugin is refused,
  # RESOURCE_EXHAUSTED with REFUSAL_REASON_RATE_LIMITED and a retry-after; a
  # bulk act counts as one request. A sidecars[] entry's own `limits`
  # overrides these for that plugin. Above what a data plugin's relaunch
  # asks (71 reads in two minutes on dev, 2026-11-09), until the throughput
  # bench sets the floor.
  limits:
    inFlight: 32
    requestsPerSecond: 200
    answerMiB: 64

nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
