apiVersion: v2
name: meridian-runtime
description: A Meridian deployment -- its instrument store, street store, conductor and plugin sidecars
type: application

# The chart's own version, and the application's. They move independently: a
# fix to a template is not a new runtime.
version: 0.1.0
appVersion: "0.1.0"

# The Kubernetes it runs on (rulings 935, 936): 1.33 and newer, every minor a
# major managed cloud still supports, extended support included. CI runs
# every scenario on the k3s release dev runs (the Makefile's
# KUBERNETES_VERSION) and the base install on each other minor in that
# window. Helm refuses an install or upgrade on an older cluster before it
# changes anything. The `-0` admits the pre-release suffixes managed clusters
# report (1.33.2-eks-...).
kubeVersion: ">=1.33.0-0"

home: https://github.com/open-meridian/meridian-core
sources:
  - https://github.com/open-meridian/meridian-core
