apiVersion: v2
name: meridian-runtime
description: A Meridian deployment -- its instrument store, street store, conductor and plugin sidecars
type: application

# The chart's own version, and the application's. They move independently: a
# fix to a template is not a new runtime.
version: 0.1.0
appVersion: "0.1.0"

home: https://github.com/open-meridian/meridian-core
sources:
  - https://github.com/open-meridian/meridian-core

# The bundled Zitadel (spec, rulings 14 to 16): Zitadel's own chart, pinned and
# vendored under charts/, so rendering needs no network. Off unless
# identity.bundled.enabled. Its image version is not this pin: the deployment
# admin sets it in zitadel.image.tag, and nothing else changes it.
dependencies:
  - name: zitadel
    version: 10.0.6
    repository: https://charts.zitadel.com
    condition: identity.bundled.enabled

