# The plugin harness: the smallest deployment a plugin is proven against.
#
# A development deployment, for a plugin's own end-to-end check, and never a
# way to run one: no platform, a development dashboard, and nothing kept
# (`down -v`). See README.md beside this file for the runner's commands and
# the stores' line formats.
#
# It ships as its own image, ghcr.io/open-meridian/meridian-harness, files
# only, published at each commit with the runtime image of the same commit
# and tag; the runtime image carries none of it. A plugin copies it out of
# the harness image pinned beside the runtime it runs, and passes that
# runtime in MERIDIAN_RUNTIME_IMAGE: this file never guesses its own tag.
#
# This file is the deployment; the plugins are not in it. `harness.py
# compose` writes a second file for any number of plugins -- a sidecar and
# the plugin for each, the broker configured for all their roles -- and every
# compose command names both:
#
#     docker compose -p <project> -f compose.yaml -f plugins.yaml ...
#
# Its own project and network, and no published port: it runs beside core's
# gates and another plugin's harness without either noticing. Name the
# project (`-p`) after the plugin, so two never share one.
#
# No password is written here or anywhere in the harness. `keys` draws every
# one at random when the run starts -- the database's, each broker user's,
# and the admin's, whose Argon2id hash the dashboard is given at its start --
# into the `secrets` volume, which only core's own services and the runner
# mount, and which `down -v` removes.
#
# The one variable every compose command needs, `down` and `run` included:
#   MERIDIAN_RUNTIME_IMAGE   the runtime image, by tag and digest, of the
#                            commit this harness was published at

name: meridian-harness

# The deployment's components, one image.
x-runtime: &runtime
  image: ${MERIDIAN_RUNTIME_IMAGE:?set MERIDIAN_RUNTIME_IMAGE to the runtime image of the harness's commit}
  networks: [harness]
  entrypoint: ["sh", "-c"]

services:
  # Every key and password of the run, drawn once, before anything that reads
  # one starts, and kept for as long as the volumes are: a password drawn
  # again would no longer open the account or database made with the first.
  #
  # The dashboard's signing key, as the chart's Job makes it (the private
  # half where the dashboard reads it, the public half under its key id where
  # the sidecar does), and the key secret settings are sealed with, in
  # `keys`. The passwords in `secrets`: each a letter and then hex, because
  # the broker reads a value beginning like a number as a number, and a
  # database URL carries it as it is. The admin's hash is Argon2id at the
  # dashboard's defaults, in the PHC form it reads.
  keys:
    image: alpine/openssl:3.3.2
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /keys/signing /keys/public /keys/settings /secrets/nats /secrets/admin
        if [ ! -f /keys/signing/key-id ]; then
          id=harness-$$(openssl rand -hex 4)
          openssl genpkey -algorithm ed25519 -out /keys/signing/private-key.pem
          openssl pkey -in /keys/signing/private-key.pem -pubout -out /keys/public/$$id.pem
          printf %s "$$id" > /keys/signing/key-id
        fi
        [ -s /keys/settings/key ] || openssl rand -out /keys/settings/key 32
        drawn() { printf 'h%s' "$$(openssl rand -hex 24)"; }
        [ -s /secrets/postgres ] || drawn > /secrets/postgres
        for user in runtime first-run dashboard-1 $${MERIDIAN_HARNESS_BROKER_USERS:?generate plugins.yaml with harness.py compose}; do
          [ -s "/secrets/nats/$$user" ] || drawn > "/secrets/nats/$$user"
        done
        if [ ! -s /secrets/admin/hash ]; then
          drawn > /secrets/admin/password
          salt=$$(openssl rand -hex 16)
          key=$$(openssl kdf -keylen 32 -kdfopt pass:"$$(cat /secrets/admin/password)" -kdfopt hexsalt:$$salt \
            -kdfopt iter:2 -kdfopt memcost:19456 -kdfopt lanes:1 ARGON2ID | tr -d :)
          b64() { xxd -r -p | base64 | tr -d '=\n'; }
          printf '$$argon2id$$v=19$$m=19456,t=2,p=1$$%s$$%s' \
            "$$(printf %s "$$salt" | b64)" "$$(printf %s "$$key" | b64)" > /secrets/admin/hash
        fi
        chmod -R a+rX /keys /secrets
    volumes:
      - keys:/keys
      - secrets:/secrets
    networks: [harness]

  postgres:
    image: postgres:16-alpine
    depends_on:
      keys:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD_FILE: /secrets/postgres
      POSTGRES_DB: meridian
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - secrets:/secrets:ro
    networks: [harness]

  # The broker's configuration, generated from the contract the image
  # carries for the plugin instances and their roles, as a bundled broker
  # generates its own (decisions/020). The instances are plugins.yaml's,
  # which `harness.py compose` writes. A role the contract does not know
  # stops the run here, naming it.
  broker-config:
    <<: *runtime
    command:
      - |
        set -e
        printf '%s\n' "$${MERIDIAN_HARNESS_INSTANCES:?generate plugins.yaml with harness.py compose}" > /nats/instances.json
        meridian-broker-config --instances /nats/instances.json --out /nats/harness.conf
    volumes:
      - broker:/nats

  # The configuration names a variable for each user's password, and holds
  # none: MERIDIAN_NATS_<USER>, upper case, `-` as `_`.
  nats:
    image: nats:2.10-alpine
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        for drawn in /secrets/nats/*; do
          user=$$(basename "$$drawn" | tr a-z A-Z | tr - _)
          export "MERIDIAN_NATS_$$user=$$(cat "$$drawn")"
        done
        exec nats-server -c /etc/nats/harness.conf
    depends_on:
      broker-config:
        condition: service_completed_successfully
      keys:
        condition: service_completed_successfully
    volumes:
      - broker:/etc/nats:ro
      - secrets:/secrets:ro
    networks: [harness]

  # Every store's schema, once, before anything serves: a component verifies
  # the schema at start and refuses one it does not recognise.
  migrate:
    <<: *runtime
    command:
      - |
        set -e
        db=postgres://meridian:$$(cat /secrets/postgres)@postgres:5432/meridian
        export MERIDIAN_DATABASE_URL=$$db MERIDIAN_STREET_DATABASE_URL=$$db MERIDIAN_BOR_DATABASE_URL=$$db \
          MERIDIAN_CONFIG_DATABASE_URL=$$db MERIDIAN_LOCAL_ACCOUNTS_DATABASE_URL=$$db
        meridian-instrument migrate && meridian-street migrate && meridian-bor migrate \
          && meridian-conductor migrate && meridian-dashboard migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - secrets:/secrets:ro

  street:
    <<: *runtime
    command:
      - |
        set -e
        broker=$$(cat /secrets/nats/runtime); db=$$(cat /secrets/postgres)
        export MERIDIAN_BROKER_URL=nats://runtime:$$broker@nats:4222
        export MERIDIAN_STREET_DATABASE_URL=postgres://meridian:$$db@postgres:5432/meridian
        exec meridian-street
    depends_on: &serving
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    environment:
      MERIDIAN_INSTANCE_ID: street-1
    volumes:
      - secrets:/secrets:ro

  # The book of record (W9, contract v8): what an operations plugin writes,
  # and five roles read and hear.
  bor:
    <<: *runtime
    command:
      - |
        set -e
        broker=$$(cat /secrets/nats/runtime); db=$$(cat /secrets/postgres)
        export MERIDIAN_BROKER_URL=nats://runtime:$$broker@nats:4222
        export MERIDIAN_BOR_DATABASE_URL=postgres://meridian:$$db@postgres:5432/meridian
        exec meridian-bor
    depends_on: *serving
    environment:
      MERIDIAN_INSTANCE_ID: bor-1
    volumes:
      - secrets:/secrets:ro

  instrument:
    <<: *runtime
    command:
      - |
        set -e
        broker=$$(cat /secrets/nats/runtime); db=$$(cat /secrets/postgres)
        export MERIDIAN_BROKER_URL=nats://runtime:$$broker@nats:4222
        export MERIDIAN_DATABASE_URL=postgres://meridian:$$db@postgres:5432/meridian
        exec meridian-instrument
    depends_on: *serving
    environment:
      MERIDIAN_INSTANCE_ID: instrument-1
    volumes:
      - secrets:/secrets:ro

  # No platform: its address resolves nowhere, which a conductor tolerates,
  # and a deployment's records are its own (contract v10), so every row a
  # plugin records names a record the deployment minted.
  # The deployment's admin is named here, as first run names one (W7.6): the
  # dashboard's local account below, made at its start.
  conductor:
    <<: *runtime
    command:
      - |
        set -e
        broker=$$(cat /secrets/nats/runtime); db=$$(cat /secrets/postgres)
        export MERIDIAN_BROKER_URL=nats://runtime:$$broker@nats:4222
        export MERIDIAN_CONFIG_DATABASE_URL=postgres://meridian:$$db@postgres:5432/meridian
        exec meridian-conductor
    depends_on: *serving
    environment:
      MERIDIAN_PLATFORM_ADDRESS: http://no-platform.invalid
      MERIDIAN_DEPLOYMENT_ID: DEP-harness
      MERIDIAN_INSTANCE_ID: conductor-1
      MERIDIAN_ADMINISTRATOR_LOGIN: local|harness
      MERIDIAN_SETTINGS_KEY_DIR: /keys/settings
    volumes:
      - keys:/keys:ro
      - secrets:/secrets:ro

  # A development deployment's dashboard (MERIDIAN_DEVELOPMENT): every page
  # says so, and a plugin's developer settings are shown and accepted. It
  # holds the harness's one account, made at its start from the hash `keys`
  # drew this run, as the chart's dashboard is given first run's.
  dashboard:
    <<: *runtime
    command:
      - |
        set -e
        broker=$$(cat /secrets/nats/dashboard-1); db=$$(cat /secrets/postgres)
        hash=$$(cat /secrets/admin/hash)
        export MERIDIAN_BROKER_URL=nats://dashboard-1:$$broker@nats:4222
        export MERIDIAN_LOCAL_ACCOUNTS_DATABASE_URL=postgres://meridian:$$db@postgres:5432/meridian
        export MERIDIAN_LOCAL_ACCOUNT_PASSWORD_HASH="$$hash"
        exec meridian-dashboard
    depends_on: *serving
    environment:
      MERIDIAN_INSTANCE_ID: dashboard-1
      MERIDIAN_DASHBOARD_LISTEN: 0.0.0.0:8080
      MERIDIAN_DASHBOARD_URL: http://dashboard:8080
      MERIDIAN_DEVELOPMENT: "true"
      MERIDIAN_LOCAL_ACCOUNTS: "on"
      MERIDIAN_LOCAL_ACCOUNT_NAME: harness
      MERIDIAN_LOCAL_ACCOUNT_DISPLAY_NAME: Harness Admin
      MERIDIAN_PLUGIN_FRONT_DOOR: http://sidecar-{instance}:9292
      MERIDIAN_DASHBOARD_SIGNING_KEY_DIR: /keys/signing
    volumes:
      - keys:/keys:ro
      - secrets:/secrets:ro

  # The runner: what a person would do in the dashboard, as the harness's
  # admin, signing in with the password `keys` drew. `run --rm -T runner
  # <command>`; harness.py says the commands. It acts on the first plugin
  # plugins.yaml lists unless told `--instance`.
  runner:
    profiles: [runner]
    image: python:3.12-alpine
    entrypoint: ["python", "-u", "/harness/harness.py"]
    environment:
      MERIDIAN_HARNESS_DASHBOARD: http://dashboard:8080
      MERIDIAN_HARNESS_ADMIN: harness
      MERIDIAN_HARNESS_ADMIN_PASSWORD_FILE: /secrets/admin/password
    volumes:
      - ./harness.py:/harness/harness.py:ro
      - secrets:/secrets:ro
      # What an MCP client keeps between commands (`mcp connect`): its token
      # pair and what a call saved, for the run alone.
      - runner-state:/state
    networks: [harness]

  # A store, printed by name as stable, sorted lines: `run --rm -T store
  # street` or `store book` (README.md has their formats). Whoever reads a
  # store here needs no database user, file or query of their own.
  store:
    profiles: [runner]
    image: postgres:16-alpine
    entrypoint:
      - sh
      - -c
      - |
        set -e
        case "$${1:-}" in
          street|book) ;;
          *) echo "store takes the name of a store: street or book" >&2; exit 2 ;;
        esac
        PGPASSWORD=$$(cat /secrets/postgres)
        export PGPASSWORD
        exec psql -h postgres -U meridian -d meridian -At -v ON_ERROR_STOP=1 -f "/harness/$$1.sql"
      - store
    volumes:
      - ./street.sql:/harness/street.sql:ro
      - ./book.sql:/harness/book.sql:ro
      - secrets:/secrets:ro
    networks: [harness]

volumes:
  keys:
  broker:
  secrets:
  runner-state:

networks:
  harness:
