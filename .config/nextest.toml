# cargo-nextest, which tools/run-tests.sh runs every test binary under
# (ruling 1104; step 3b part 4).

[profile.default]
# Each binary's results in JUnit, which run-tests copies out for the
# checks' test reports.
junit = { path = "junit.xml", store-success-output = false, store-failure-output = true }
failure-output = "immediate-final"
fail-fast = true

# CI's: a test that fails is run once more, and one that then passes is
# reported flaky in its JUnit (`flakyFailure`), which the checks flag
# (tools/ci-flaky.py). A test that fails twice fails the run.
[profile.ci]
retries = 1
junit = { path = "junit.xml", store-success-output = false, store-failure-output = true }
failure-output = "immediate-final"
fail-fast = true

# The book's snapshot tests share one process's lock under libtest
# (crates/bor/tests/postgres.rs, REBUILDS): under nextest each test is its
# own process, so its binary's tests run one at a time instead.
[test-groups]
book-rebuilds = { max-threads = 1 }
lake-speed = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(meridian-bor) & binary(postgres)'
test-group = 'book-rebuilds'

# The lake's speed check (crates/lake/tests/postgres.rs,
# a_chains_latest_loads_one_row_per_series) runs alone: in its own group, and
# needing every test thread, so none of the lake's other Postgres tests share
# the database's time with it -- a rate it measured beside them was theirs
# too (CI 42895485994: 598 rows a second recorded against its 600, then
# 23,222 read against its 25,000). Its figures are printed on every run,
# passing or not, and kept in its JUnit, which CI keeps.
[[profile.default.overrides]]
filter = 'package(meridian-lake) & binary(postgres) & test(=a_chains_latest_loads_one_row_per_series)'
test-group = 'lake-speed'
threads-required = 'num-test-threads'
success-output = 'immediate'
junit = { store-success-output = true }
