# Publishing the runtime image, and beside it the plugin harness image and the chart.
#
# Separate from `ci`, and not a step inside it, because they answer different
# questions. `ci` says whether the commit is sound and blocks a merge. This
# takes a commit that already passed and makes it something a customer can pull.
#
# It runs on the merge to `main`, and `ci` does not run again first (the product
# owner, 2026-10-14). A change lands through a pull request whose `ci` checks
# are required, whose branch must be up to date with main, and which merges
# with a merge commit, so the merge's tree is the tree those checks passed.
# Each job checks out the commit the branch carried, the merge's second parent,
# and refuses a merge whose tree differs from it: the tags below then name the
# commit other repositories pin, and nothing is published that the gates have
# not seen. A run by hand publishes the commit it is given.
#
# Two architectures, built natively rather than emulated. This runs in a
# customer's cluster, and that cluster is as likely to be arm64 as not: Graviton,
# an Apple laptop, anything ordered in the last three years. An amd64-only image
# fails at the first command in the README, which is how this was found.
#
# Built by ci, not here (ruling 1071): the run that tests the tree main will
# hold builds the release candidate on a native runner of each architecture,
# stamped <series>.<ci run number>+<commit>, tests both, and tags them
# tested-<tree> once green; this promotes them. The chart's version is the
# release the images say, so a chart and its images are one build. (Until
# 1071 the release was numbered by this workflow's runs, up to 0.1.342; it is
# numbered by ci's from then, about 0.1.400 on, a one-time jump.)

name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/open-meridian/meridian-runtime
  # The analytics component's image (contract v26, W12): Dockerfile's
  # `analytics` stage, from the same build, pushed and tagged beside the
  # runtime's, so the chart names both by one commit.
  ANALYTICS: ghcr.io/open-meridian/meridian-analytics

jobs:
  # The runtime and analytics images, promoted (ruling 1071): the release
  # candidate the CI run of this tree built and tested, amd64 and arm64,
  # tagged with the commit the branch carried and as latest. Nothing is built
  # here: the images published are the images tested, their digests
  # unchanged. A tree no green run tested has no candidate, and is refused,
  # so nothing is published that the gates have not seen. The release the
  # images say is the chart's version below.
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.promote.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and both its parents, for the step below.
          fetch-depth: 2

      # The commit the branch carried, rather than the merge commit (see the
      # header): its tree is the merge's, and its SHA is the one other
      # repositories pin.
      - name: The commit the branch carried
        run: |
          set -euo pipefail
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            if [ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse 'HEAD^2^{tree}')" ]; then
              echo "::error::merge $(git rev-parse --short HEAD) holds a tree its branch never had: the branch was not up to date with main, so no pull-request check passed on this tree"
              exit 1
            fi
            git checkout -q --detach 'HEAD^2'
          fi
          echo "publishing $(git rev-parse HEAD)"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      # The candidate tested-<tree>, tagged <commit> and latest: one
      # manifest list carrying both architectures. A release names a tag, so
      # a rollback has a tag to find.
      - name: Promote the tested images
        id: promote
        env:
          SHA: ${{ steps.tag.outputs.sha }}
          TREE: ${{ steps.tag.outputs.tree }}
        run: |
          set -euo pipefail
          version=$(tools/release-candidate.sh promote "$TREE" "$SHA" "$IMAGE")
          analytics=$(tools/release-candidate.sh promote "$TREE" "$SHA" "$ANALYTICS")
          [ "$version" = "$analytics" ] \
            || { echo "::error::the runtime candidate says $version and the analytics one $analytics"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Parsed rather than grepped. The first version of this matched the raw
      # JSON for `"architecture":"amd64"` and failed against a correct image,
      # because the output is pretty-printed and the real text has a space after
      # the colon. An assertion that fails on formatting is an assertion nobody
      # trusts the third time.
      #
      # `unknown` is dropped: buildx adds an attestation manifest per platform
      # and each carries that architecture.
      - name: Check both architectures are there
        env:
          TAG: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          for image in "$IMAGE" "$ANALYTICS"; do
            found=$(docker buildx imagetools inspect "$image:$TAG" --raw \
              | jq -r '.manifests[]?.platform.architecture' \
              | grep -v '^unknown$' | sort -u)
            echo "$image: $(echo $found | tr '\n' ' ')"
            echo "$found" | grep -qx amd64
            echo "$found" | grep -qx arm64
          done

  # The plugin harness, its own image (kernel/the-plugin-harness-is-its-own-image):
  # files only, built from the same commit and tagged with the same commit as
  # the runtime image above, so a plugin pins the two side by side and the
  # harness it copies out is the one core's harness-check ran against that
  # runtime. The runtime image carries none of it, so no pod a chart starts
  # holds a test deployment.
  #
  # After `publish`, as the chart is: `latest` here never names a commit
  # whose runtime is not published. Both architectures, though nothing in it
  # runs, so a plugin's `docker create` on either finds its own platform; a
  # scratch image of copied files needs no emulation to build for both.
  harness:
    needs: publish
    runs-on: ubuntu-latest
    env:
      HARNESS: ghcr.io/open-meridian/meridian-harness
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and both its parents, for the step below.
          fetch-depth: 2

      # The commit the branch carried, rather than the merge commit (see the
      # header): its tree is the merge's, and its SHA is the one other
      # repositories pin.
      - name: The commit the branch carried
        run: |
          set -euo pipefail
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            if [ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse 'HEAD^2^{tree}')" ]; then
              echo "::error::merge $(git rev-parse --short HEAD) holds a tree its branch never had: the branch was not up to date with main, so no pull-request check passed on this tree"
              exit 1
            fi
            git checkout -q --detach 'HEAD^2'
          fi
          echo "publishing $(git rev-parse HEAD)"

      # Before anything builds an image: the runner's preinstalled toolsets
      # and preloaded images (tools/free-runner-disk.sh).
      - name: Free the runner's disk
        run: tools/free-runner-disk.sh

      - id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: harness
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.HARNESS }}:${{ steps.tag.outputs.sha }}
            ${{ env.HARNESS }}:latest
          push: true

      # Read back as a plugin reads it: the files copied out of the tag just
      # pushed, exactly the Makefile's HARNESS_FILES, which harness-check
      # holds the local image to, rather than trusting a push that exited 0.
      # One list, so a file added to the harness is expected in both places.
      - name: Check the harness can be copied out
        env:
          TAG: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          id=$(docker create "$HARNESS:$TAG" none)
          docker cp "$id:/harness" /tmp/harness
          docker rm "$id" >/dev/null
          held=$(find /tmp/harness -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort | tr '\n' ' ')
          expected=$(sed -n 's/^HARNESS_FILES := //p' Makefile | tr ' ' '\n' | LC_ALL=C sort | tr '\n' ' ')
          echo "held: $held"
          echo "expected: $expected"
          [ -n "$expected" ] && [ "$held" = "$expected" ]

  # The backup image (task kernel/a-deployment-is-backed-up-and-restored):
  # pg_dump and age, nothing of the runtime's, which the chart's backup
  # CronJob runs in. Tagged with the same commit as the runtime, and pinned
  # by the chart below the same way, so a chart names the backup image it
  # was published beside. Both architectures: it runs on a person's laptop.
  backup-image:
    needs: publish
    runs-on: ubuntu-latest
    env:
      BACKUP: ghcr.io/open-meridian/meridian-backup
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and both its parents, for the step below.
          fetch-depth: 2

      # The commit the branch carried, rather than the merge commit (see the
      # header): its tree is the merge's, and its SHA is the one other
      # repositories pin.
      - name: The commit the branch carried
        run: |
          set -euo pipefail
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            if [ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse 'HEAD^2^{tree}')" ]; then
              echo "::error::merge $(git rev-parse --short HEAD) holds a tree its branch never had: the branch was not up to date with main, so no pull-request check passed on this tree"
              exit 1
            fi
            git checkout -q --detach 'HEAD^2'
          fi
          echo "publishing $(git rev-parse HEAD)"

      # Before anything builds an image: the runner's preinstalled toolsets
      # and preloaded images (tools/free-runner-disk.sh).
      - name: Free the runner's disk
        run: tools/free-runner-disk.sh

      - id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy/backup
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.BACKUP }}:${{ steps.tag.outputs.sha }}
            ${{ env.BACKUP }}:latest
          push: true

      # Run as the CronJob runs it, rather than trusting a push that exited 0.
      - name: Check it holds pg_dump and age
        env:
          TAG: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          docker run --rm "$BACKUP:$TAG" sh -c 'pg_dump --version && age --version'

  # The brought database's image under Patroni (step 3b; deploy/database):
  # postgres:16-alpine's server with Patroni and pgBackRest, nothing of the
  # runtime's, which the chart's database runs once it has standbys. Tagged
  # with the runtime's commit and pinned by the chart below, as the backup
  # image is. Both architectures.
  postgres-image:
    needs: publish
    runs-on: ubuntu-latest
    env:
      POSTGRES: ghcr.io/open-meridian/meridian-postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: The commit the branch carried
        run: |
          set -euo pipefail
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            if [ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse 'HEAD^2^{tree}')" ]; then
              echo "::error::merge $(git rev-parse --short HEAD) holds a tree its branch never had: the branch was not up to date with main, so no pull-request check passed on this tree"
              exit 1
            fi
            git checkout -q --detach 'HEAD^2'
          fi
          echo "publishing $(git rev-parse HEAD)"

      - name: Free the runner's disk
        run: tools/free-runner-disk.sh

      - id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy/database
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.POSTGRES }}:${{ steps.tag.outputs.sha }}
            ${{ env.POSTGRES }}:latest
          push: true

      # Run as the database runs it, rather than trusting a push that exited 0.
      - name: Check it holds Postgres, Patroni and pgBackRest
        env:
          TAG: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$POSTGRES:$TAG" -c 'postgres --version && patroni --version && pgbackrest version'

  # The chart, pushed beside the image it names.
  #
  # Until this existed, a customer reached the chart by having the repository,
  # which is the one thing an installing customer does not have: `meridian up`
  # defaults to this reference, and a marketplace listing cannot clone a
  # repository either. The image was published and the thing that installs it
  # was not.
  #
  # After `publish` rather than beside it: a chart whose image tag names a
  # manifest that does not exist yet is a chart that installs and cannot pull.
  chart:
    needs: [publish, backup-image, postgres-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and both its parents, for the step below.
          fetch-depth: 2

      # The commit the branch carried, rather than the merge commit (see the
      # header): its tree is the merge's, and its SHA is the one other
      # repositories pin.
      - name: The commit the branch carried
        run: |
          set -euo pipefail
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            if [ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse 'HEAD^2^{tree}')" ]; then
              echo "::error::merge $(git rev-parse --short HEAD) holds a tree its branch never had: the branch was not up to date with main, so no pull-request check passed on this tree"
              exit 1
            fi
            git checkout -q --detach 'HEAD^2'
          fi
          echo "publishing $(git rev-parse HEAD)"

      - id: version
        env:
          RELEASE: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short HEAD)
          # The release the promoted images say, without its commit: the
          # series from Chart.yaml and the patch from the ci run that built
          # and tested them (ruling 1071), so published versions increase --
          # which is what lets Helm resolve `oci://.../meridian-runtime` with
          # no --version at all -- and bumping Chart.yaml still starts a new
          # series.
          version="$RELEASE"
          [ "${version##*+}" = "$sha" ] || { echo "::error::the images say $version, not a release of $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "chart=${version%%+*}" >> "$GITHUB_OUTPUT"

      # A chart and the image it runs are one build, or they are two things
      # that drift. The repository's own copy keeps `latest`, because somebody
      # working on the chart wants the image they just built.
      - name: Pin the image this chart was published beside
        env:
          SHA: ${{ steps.version.outputs.sha }}
        # Quoted, because a short sha can be all digits: unquoted, YAML reads
        # `tag: 1896148` as a number and Helm renders the image as
        # `meridian-runtime:1.896148e+06`. Found when 1896148 was published.
        run: |
          set -euo pipefail
          sed -i "s|^  tag: latest$|  tag: \"$SHA\"|" deploy/chart/values.yaml
          grep -qx "  tag: \"$SHA\"" deploy/chart/values.yaml
          # And the backup image, published beside it by backup-image.
          sed -i "s|^  image: ghcr.io/open-meridian/meridian-backup:latest$|  image: \"ghcr.io/open-meridian/meridian-backup:$SHA\"|" deploy/chart/values.yaml
          grep -qx "  image: \"ghcr.io/open-meridian/meridian-backup:$SHA\"" deploy/chart/values.yaml
          # And the database's image under Patroni, by postgres-image.
          sed -i "s|^    patroniImage: ghcr.io/open-meridian/meridian-postgres:latest$|    patroniImage: \"ghcr.io/open-meridian/meridian-postgres:$SHA\"|" deploy/chart/values.yaml
          grep -qx "    patroniImage: \"ghcr.io/open-meridian/meridian-postgres:$SHA\"" deploy/chart/values.yaml

      # Asserted by rendering rather than by trusting the edit above: a sed
      # that matches nothing exits 0, and the failure would be a published
      # chart that quietly still says `latest`.
      - name: Check the rendered chart names that image
        env:
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          # Rendered whole first. Piped into `grep -q`, which stops at its
          # first match, helm was still writing and died of SIGPIPE, and
          # pipefail made that the step's failure (exit 141) whenever the
          # match came early enough -- more often as the chart grew.
          # At the Kubernetes the chart declares and dev and CI run (the
          # Makefile's KUBERNETES_VERSION): Helm holds `template` to its own
          # default otherwise, older than the chart's kubeVersion.
          kube="$(sed -n 's/^KUBERNETES_VERSION := //p' Makefile)"
          test -n "$kube"
          rendered="$(helm template check deploy/chart --kube-version "$kube" --set deployment.id=publish-check)"
          grep -q "image: \"$IMAGE:$SHA\"" <<<"$rendered"
          # And the analytics component's, published beside it above.
          grep -q "image: \"$ANALYTICS:$SHA\"" <<<"$rendered"

      - name: Package and push
        env:
          SHA: ${{ steps.version.outputs.sha }}
          CHART: ${{ steps.version.outputs.chart }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # No subchart and no dependency, so packaging needs no network and
          # no repository added.
          helm package deploy/chart --version "$CHART" --app-version "$SHA" --destination /tmp
          helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin <<<"$TOKEN"
          helm push "/tmp/meridian-runtime-$CHART.tgz" oci://ghcr.io/open-meridian/charts

      # Pulled back the way a customer meets it, rather than trusting that a
      # push that exited 0 left something installable behind.
      - name: Check it can be pulled back
        env:
          CHART: ${{ steps.version.outputs.chart }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          pulled=$(helm show chart oci://ghcr.io/open-meridian/charts/meridian-runtime --version "$CHART")
          echo "$pulled"
          # Quoted or not: Helm quotes an appVersion only when YAML would
          # otherwise read it as something else, and whether a short commit
          # hash needs that depends on whether it happens to be all digits.
          echo "$pulled" | grep -qE "^appVersion: \"?$SHA\"?$"
