# Publishing the runtime image.
#
# Separate from `ci`, and not a step inside it, because they answer different
# questions. `ci` says whether the commit is sound and blocks a merge. This
# takes a commit that already passed and makes it something a customer can pull.
#
# It runs after `ci` succeeds on `main`, so nothing is ever published that the
# gates have not seen. A workflow_run trigger rather than a push trigger is what
# enforces that ordering; a push trigger would race the gates and sometimes win.
#
# Two architectures, built natively rather than emulated. This runs in a
# customer's cluster, and that cluster is as likely to be arm64 as not: Graviton,
# an Apple laptop, anything ordered in the last three years. An amd64-only image
# fails at the first command in the README, which is how this was found.
#
# Native runners rather than QEMU because the build is Rust. Emulated
# compilation turns a two-minute job into a twenty-minute one, and a slow
# publish is a publish people start skipping.

name: publish

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/open-meridian/meridian-runtime

jobs:
  build:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest, untagged. The tags are applied once, in the merge
      # below, so a half-finished publish never leaves `latest` pointing at one
      # architecture.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          # Through an environment variable: the prefix has to come off in the
          # shell, and shell expansion cannot happen inside a GitHub expression.
          # Nor can a GitHub expression appear in a comment, even an empty one:
          # they are evaluated anywhere in the file, and an empty one fails the
          # whole workflow to parse. That is how this comment broke it once.
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # One manifest list carrying both architectures, tagged by commit and as
      # latest. A release names a tag, so a rollback has a tag to find.
      - name: Combine
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ steps.tag.outputs.sha }}" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

      # Parsed rather than grepped. The first version of this matched the raw
      # JSON for `"architecture":"amd64"` and failed against a correct image,
      # because the output is pretty-printed and the real text has a space after
      # the colon. An assertion that fails on formatting is an assertion nobody
      # trusts the third time.
      #
      # `unknown` is dropped: buildx adds an attestation manifest per platform
      # and each carries that architecture.
      - name: Check both architectures are there
        env:
          TAG: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          found=$(docker buildx imagetools inspect "$IMAGE:$TAG" --raw \
            | jq -r '.manifests[]?.platform.architecture' \
            | grep -v '^unknown$' | sort -u)
          echo "architectures: $(echo $found | tr '\n' ' ')"
          echo "$found" | grep -qx amd64
          echo "$found" | grep -qx arm64
