# CI is confirmation, not the first place a failure is found. The pre-push hook
# runs the same target locally, so a red run here means the hook was bypassed or
# the runner differs from a developer's machine -- both worth knowing.
#
# Each job is named for the make target it runs. ci-mirror-check enforces that
# correspondence from inside ci-local, so a job added here without a target
# fails the build rather than quietly escaping local reproduction.
#
# Ruling 556 (the product owner, 2026-10-24): the plugin harness's suites,
# the gate's longest stage, run as the e2e-harness jobs beside ci-local rather
# than inside it, and the release build's cargo caches are kept between runs.
# Locally `make ci-local` is still the whole gate, harness suites included.
name: ci

# On the pull request and by hand, and not again on main. A change lands
# through a pull request that must be up to date with main and merges with a
# merge commit, so the tree this run passed is the tree the merge puts on
# main, and `publish` runs on that merge without repeating it (the product
# owner, 2026-10-14).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the base commit resolves.
          fetch-depth: 0
          path: workspace/meridian-core

      # The interop gate drives this runtime's sidecar from the Python SDK,
      # which is the only check that the two implementations of that surface
      # agree. Both repositories are public, so this needs no credential and
      # nothing private is reachable from here.
      #
      # Which of the SDK's branches (the v25 build's O1, Q14): a pull
      # request reads the SDK's branch of the same name where it has one --
      # a contract change lands in both at once -- and main otherwise; a run
      # by hand reads main. The run says which. The branch's name comes from
      # the pull request, so it reaches the script only through the
      # environment, and one holding anything but a branch name's characters
      # reads main.
      - name: Choose the SDK's branch
        id: sdk
        env:
          HEAD_REF: ${{ github.head_ref }}
          SDK: https://github.com/${{ github.repository_owner }}/meridian-python.git
        run: |
          ref=main
          case "$HEAD_REF" in
            "" | *[!A-Za-z0-9._/-]*) ;;
            *)
              if git ls-remote --exit-code --heads "$SDK" "refs/heads/$HEAD_REF" >/dev/null 2>&1; then
                ref="$HEAD_REF"
              fi
              ;;
          esac
          if [ "$ref" = main ] && [ -n "$HEAD_REF" ]; then
            echo "interop reads meridian-python@main: the SDK has no branch named after this pull request's"
          else
            echo "interop reads meridian-python@$ref"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/meridian-python
          ref: ${{ steps.sdk.outputs.ref }}
          path: workspace/meridian-python

      # Before anything builds an image: the runner's preinstalled toolsets
      # and preloaded images, which core never uses, so the gate's disk
      # budget meets the headroom it was set for (tools/free-runner-disk.sh).
      - name: Free the runner's disk
        working-directory: workspace/meridian-core
        run: tools/free-runner-disk.sh

      # Ruling 556: the release build's cargo caches from an earlier run, put
      # in place before the gate starts (tools/ci-cargo-cache.sh). Keyed on the
      # toolchain and Cargo.lock; another lock's caches under the same
      # toolchain are still most of the compile. A run of a pull request reads
      # what an earlier run of it, or one on main, kept. Never decides a run.
      - name: The cargo caches' key
        id: cargo
        working-directory: workspace/meridian-core
        run: |
          rust="$(sed -n 's/^ARG RUST_VERSION=//p' Dockerfile | head -1)"
          echo "prefix=cargo-release-${RUNNER_OS}-rust${rust}-" >> "$GITHUB_OUTPUT"
          echo "key=cargo-release-${RUNNER_OS}-rust${rust}-${{ hashFiles('workspace/meridian-core/Cargo.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the cargo caches
        id: cargo-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/cargo
          key: ${{ steps.cargo.outputs.key }}
          restore-keys: ${{ steps.cargo.outputs.prefix }}

      - name: Put the cargo caches in place
        working-directory: workspace/meridian-core
        continue-on-error: true
        run: tools/ci-cargo-cache.sh put "$RUNNER_TEMP/cargo"

      # The gate needs a range to police. A default checkout is shallow and
      # detached, with no upstream and no origin/main, and the tool now fails
      # rather than passing on that. See the review finding on meridian-core#5,
      # where it reported success having inspected nothing.
      - name: Resolve the contract-diff base
        working-directory: workspace/meridian-core
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            *)            base="" ;;
          esac
          # A manual run has no range at all. HEAD against itself inspects
          # nothing, which is the right answer there: nothing arrived to inspect.
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD)"
          fi
          echo "CONTRACT_DIFF_BASE=$base" >> "$GITHUB_ENV"

      # The harness's suites are the e2e-harness jobs below (ruling 556).
      - name: make ci-local
        working-directory: workspace/meridian-core
        run: make ci-local E2E_HARNESS_TARGET=
        # build, test and lint each run in Dockerfile.rust at the pinned toolchain.
        # No Rust is installed on the runner, deliberately: the container is the
        # only place a version is chosen.
        env:
          DOCKER_BUILDKIT: "1"

      # Kept only from a green run, and only where this key was not restored
      # whole: a key is written once.
      - name: Take the cargo caches
        if: success() && steps.cargo-cache.outputs.cache-hit != 'true'
        working-directory: workspace/meridian-core
        continue-on-error: true
        run: tools/ci-cargo-cache.sh take "$RUNNER_TEMP/cargo"

      - name: Keep the cargo caches
        if: success() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/cargo
          key: ${{ steps.cargo.outputs.key }}

      # What the services said, kept only when something failed. The e2e
      # targets write these beside the checkout and the runner names them on
      # failure, which is no help at all once the runner is gone: a red run on
      # 2026-09-23 had to be diagnosed from the assertion output alone because
      # the one file explaining it was discarded with the machine.
      - name: Keep what the e2e services said
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: workspace/meridian-core/.e2e-*.log
          # The logs are dotfiles, which v4 leaves out unless told; with
          # `ignore` as well, every failure uploaded nothing and said nothing
          # until 2026-09-25.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # The plugin harness's suites (ruling 556): `make e2e-harness`, a few suites
  # per job, beside ci-local rather than after it, so the longest stage of the
  # gate is off the run's critical path. Each suite builds its images and runs
  # in its own compose project, needing no other's state (the Makefile's
  # HARNESS_SUITES); the groups are balanced on v27's timings (e2e-lake alone
  # is six minutes). A suite added to HARNESS_SUITES is added to a group here,
  # or no job runs it.
  e2e-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: lake
            suites: e2e-lake e2e-prepared e2e-activity
          - group: orders
            suites: e2e-orders e2e-access-per-role e2e-plugin-area harness-check
          - group: tickets
            suites: e2e-tickets e2e-one-id e2e-service-account e2e-archive
    name: e2e-harness (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace/meridian-core

      # The SDK, chosen as ci-local chooses it.
      - name: Choose the SDK's branch
        id: sdk
        env:
          HEAD_REF: ${{ github.head_ref }}
          SDK: https://github.com/${{ github.repository_owner }}/meridian-python.git
        run: |
          ref=main
          case "$HEAD_REF" in
            "" | *[!A-Za-z0-9._/-]*) ;;
            *)
              if git ls-remote --exit-code --heads "$SDK" "refs/heads/$HEAD_REF" >/dev/null 2>&1; then
                ref="$HEAD_REF"
              fi
              ;;
          esac
          echo "the harness reads meridian-python@$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/meridian-python
          ref: ${{ steps.sdk.outputs.ref }}
          path: workspace/meridian-python

      - name: Free the runner's disk
        working-directory: workspace/meridian-core
        run: tools/free-runner-disk.sh

      # The runtime image each suite builds compiles from ci-local's kept
      # cargo caches; read here, never written.
      - name: The cargo caches' key
        id: cargo
        working-directory: workspace/meridian-core
        run: |
          rust="$(sed -n 's/^ARG RUST_VERSION=//p' Dockerfile | head -1)"
          echo "prefix=cargo-release-${RUNNER_OS}-rust${rust}-" >> "$GITHUB_OUTPUT"
          echo "key=cargo-release-${RUNNER_OS}-rust${rust}-${{ hashFiles('workspace/meridian-core/Cargo.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the cargo caches
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/cargo
          key: ${{ steps.cargo.outputs.key }}
          restore-keys: ${{ steps.cargo.outputs.prefix }}

      - name: Put the cargo caches in place
        working-directory: workspace/meridian-core
        continue-on-error: true
        run: tools/ci-cargo-cache.sh put "$RUNNER_TEMP/cargo"

      - name: make e2e-harness
        working-directory: workspace/meridian-core
        env:
          DOCKER_BUILDKIT: "1"
          SUITES: ${{ matrix.suites }}
        run: make e2e-harness E2E_HARNESS_TARGET="$SUITES"

      - name: Keep what the e2e services said
        if: failure()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-harness-${{ matrix.group }}-logs
          path: workspace/meridian-core/.e2e-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # The four runs that install the chart on a real cluster and sign a person
  # in: spec/installation-and-first-run, paths 1 and 2 and path 1's other two
  # ways in. And a fifth that upgrades one in place from the chart published
  # last (task kernel/upgrading-a-deployment-in-place). Everything above stands something in; these stand in nothing,
  # and on 2026-09-24 and 25 they found seven defects in a chart that every
  # job above had passed -- one of them published, because `publish` waited
  # on this workflow and this workflow had never installed a chart.
  #
  # So they run on every pull request, after ci-local, and each is a required
  # check: `publish` runs on the merge without CI again, so a red run here
  # keeps the change off main and publishes nothing. They need a cluster and
  # the platform, which is private: a pull request from a fork gets no secret
  # to check it out with, fails at the credentials step below, and is closed
  # by outside-pull-requests anyway. A commit ci-local has refused is not
  # worth a cluster. One job per run, so a failure names its half.
  #
  # The window (ruling 935): Kubernetes is supported on every minor a major
  # managed cloud still supports, extended support included (about 26
  # months; 1.33 to 1.37 when this was written). All six run on the k3s
  # release dev runs (the Makefile's KUBERNETES_VERSION); the base install,
  # e2e-cluster, runs once more as a smoke job on the newest k3s patch of
  # each other minor in the window, and each of those is a required check
  # too. A minor entering the window is added here; one leaving it is
  # dropped, and Chart.yaml's kubeVersion, INSTALL.md, chart-check and
  # `meridian doctor` move with the oldest (ruling 936). The name stays
  # `e2e-cluster-k3d (<target>)` for the six; a smoke job's names its k3s.
  e2e-cluster-k3d:
    name: e2e-cluster-k3d (${{ matrix.target }}${{ matrix.k3s && format(', k3s {0}', matrix.k3s) || '' }})
    needs: ci-local
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [e2e-cluster, e2e-cluster-external, e2e-cluster-ldap, e2e-cluster-oidc, e2e-cluster-upgrade, e2e-cluster-backup]
        # Empty: the Makefile's pin.
        k3s: [""]
        include:
          - target: e2e-cluster
            k3s: v1.33.13-k3s2
          - target: e2e-cluster
            k3s: v1.34.12-k3s1
          - target: e2e-cluster
            k3s: v1.35.9-k3s1
          - target: e2e-cluster
            k3s: v1.37.1-k3s1
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace/meridian-core

      # Before anything builds an image: the runner's preinstalled toolsets
      # and preloaded images, which core never uses, so the gate's disk
      # budget meets the headroom it was set for (tools/free-runner-disk.sh).
      - name: Free the runner's disk
        working-directory: workspace/meridian-core
        run: tools/free-runner-disk.sh

      # Said plainly, because without them the steps below fail with an
      # authentication error that reads like the platform is gone.
      - name: The platform's app credentials are there
        env:
          HELD: ${{ secrets.MERIDIAN_PLATFORM_APP_ID != '' && secrets.MERIDIAN_PLATFORM_APP_KEY != '' }}
        run: |
          if [ "$HELD" != "true" ]; then
            echo "::error::MERIDIAN_PLATFORM_APP_ID and MERIDIAN_PLATFORM_APP_KEY are not both set. These runs start the real platform from meridian-platform, which is private: they need a GitHub App installed on it with Contents: read, and its id and private key as these secrets."
            exit 1
          fi

      # A token for meridian-platform alone, read only, minted for this run
      # and expiring within the hour. The organisation has deploy keys off,
      # and an app belongs to no person and does not lapse the way a personal
      # token does.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MERIDIAN_PLATFORM_APP_ID }}
          private-key: ${{ secrets.MERIDIAN_PLATFORM_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: meridian-platform

      # The real platform, at its main, as design's gates read siblings. The
      # token is not left behind for any later step.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/meridian-platform
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: workspace/meridian-platform

      # The CLI, public, at its main, for the backup run's `meridian backup`
      # and `meridian restore` (task kernel/a-deployment-is-backed-up-and-
      # restored): the commands a person restores with, not a stand-in.
      - uses: actions/checkout@v4
        if: matrix.target == 'e2e-cluster-backup'
        with:
          repository: ${{ github.repository_owner }}/meridian-cli
          persist-credentials: false
          path: workspace/meridian-cli

      # Pinned, and checked against the release's own checksum, rather than
      # piping an install script from a branch into a shell.
      - name: k3d
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/k3d https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          echo "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d

      # Helm 4 for the upgrade: its --wait waits for every resource a release
      # names to exist, and failed an upgrade that Helm 3's passed. The
      # installs keep the version they were proven on.
      - uses: azure/setup-helm@v4
        with:
          version: ${{ matrix.target == 'e2e-cluster-upgrade' && 'v4.2.3' || 'v3.16.2' }}

      - name: make e2e-cluster-k3d
        working-directory: workspace/meridian-core
        env:
          DOCKER_BUILDKIT: "1"
          TARGET: ${{ matrix.target }}
          K3S: ${{ matrix.k3s }}
        run: make e2e-cluster-k3d E2E_CLUSTER_TARGET="$TARGET" ${K3S:+E2E_K3S_IMAGE="rancher/k3s:$K3S"}

      # What failed, in the job's own log, before anything else is tried:
      # the artifact service timed out creating the upload below (2026-10-06,
      # "Request timeout: /twirp/github.actions.results.api.v1.ArtifactService/
      # CreateArtifact", retried five times past its step's limit), and a run
      # then said nothing of why it failed until it was cancelled.
      - name: Say what the cluster said
        if: failure()
        working-directory: workspace/meridian-core
        run: |
          for log in .e2e-*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log, its last 300 lines"
            tail -n 300 "$log"
            echo "::endgroup::"
          done

      - name: Keep what the cluster said
        if: failure()
        # A slow artifact service held a failed run open to the job's limit
        # (2026-10-06); the step above has put what failed in the job's log,
        # so an upload that fails or times out never decides the run.
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}${{ matrix.k3s && format('-{0}', matrix.k3s) || '' }}-logs
          path: workspace/meridian-core/.e2e-*.log
          # The logs are dotfiles, which v4 leaves out unless told; with
          # `ignore` as well, every failure uploaded nothing and said nothing
          # until 2026-09-25.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
