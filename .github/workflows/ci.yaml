# CI runs everything, and the merge queue is the only authority for main
# (accepted 2026-11-07, superseding ruling 1075's full local gate). The
# pre-push hook runs a fast gate -- lint, the build, the changed crates' unit
# tests and the stages the changed paths select (`make pre-push`) -- so a red
# job here is reproduced with `make ci-stage STAGE=<stage>`, its cause fixed,
# and never rerun until green.
#
# ci-local's stages, each a job (rulings 1068 and 1069, 443): the checks and
# lint, which need no image, start at once beside the images and compile
# stages, which build every image the gate runs -- the release build's and
# the test binaries -- once for the run; every other stage, the harness's
# suites and the cluster runs then start together, each loading the images it
# runs and compiling nothing. Each stage job runs `make -k ci-stage
# STAGE=<stage>`, the stage exactly as `make ci-local` runs it, measured by the
# same gate (tools/gate.py); ci-mirror-check proves every stage of ci-local is
# one job's here, and every other job a make target's. The `ci-local` job at
# the end is green only when every stage is, so a required check of that name
# still means the whole gate. Locally `make ci-local` is still the whole gate,
# in one, fail-fast.
#
# Ruling 556 (the product owner, 2026-10-24): the plugin harness's suites
# run as the e2e-harness jobs rather than as a stage, and the release build's
# cargo caches are kept between runs.
name: ci

# On the pull request, on the merge queue and by hand, and not again on main.
# A change lands through a pull request that must be up to date with main and
# merges with a merge commit, so the tree this run passed is the tree the
# merge puts on main, and `publish` runs on that merge without repeating it
# (the product owner, 2026-10-14). merge_group (ruling 1069, 444): the merge
# queue runs these checks on the merge it is about to make.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its older run (ruling 1069, 446); a run
# of the merge queue, or by hand, is never cancelled and cancels nothing.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The run's tier (the PO's ruling of 2026-11-08): a pull request runs the
  # fast tier and the jobs the paths it touches select; the merge queue,
  # and a run by hand, run everything, every job that ran before the tiers
  # (tools/ci_tier.py, whose `check` the checks stage runs, and whose
  # `table` lists every job by event). What each tiered job runs comes from
  # here; a run whose plan cannot be read fails its tiered jobs rather than
  # skipping them, and the aggregate ci-local fails a run that is not a pull
  # request's where any job did not succeed.
  tier:
    name: ci-tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      stage_names: ${{ steps.plan.outputs.stage_names }}
      harness: ${{ steps.plan.outputs.harness }}
      harness_any: ${{ steps.plan.outputs.harness_any }}
      harness_left: ${{ steps.plan.outputs.harness_left }}
      harness_left_any: ${{ steps.plan.outputs.harness_left_any }}
      clusters: ${{ steps.plan.outputs.clusters }}
      clusters_left: ${{ steps.plan.outputs.clusters_left }}
      clusters_left_any: ${{ steps.plan.outputs.clusters_left_any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: workspace/meridian-core

      - name: The plan
        id: plan
        working-directory: workspace/meridian-core
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/ci_tier.py plan --event "$EVENT" ${BASE:+--base "$BASE" --head "$HEAD"} | tee -a "$GITHUB_OUTPUT"
          { echo "## This run's tier ($EVENT)"; echo; python3 tools/ci_tier.py table; } >> "$GITHUB_STEP_SUMMARY"

  # The two stages that need no image: beside the builds, not after them.
  static:
    name: ci-local (${{ matrix.stage }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stage: [checks, lint]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the base commit resolves.
          fetch-depth: 0
          path: workspace/meridian-core

      # The gate needs a range to police. A default checkout is shallow and
      # detached, with no upstream and no origin/main, and the tool now fails
      # rather than passing on that. See the review finding on meridian-core#5,
      # where it reported success having inspected nothing.
      - name: Resolve the contract-diff base
        working-directory: workspace/meridian-core
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            merge_group)  base="${{ github.event.merge_group.base_sha }}" ;;
            *)            base="" ;;
          esac
          # A manual run has no range at all. HEAD against itself inspects
          # nothing, which is the right answer there: nothing arrived to inspect.
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD)"
          fi
          echo "CONTRACT_DIFF_BASE=$base" >> "$GITHUB_ENV"

      - name: Free the runner's disk
        working-directory: workspace/meridian-core
        run: tools/free-runner-disk.sh

      # The tools its builds fetch from GitHub's releases, from GitHub's
      # cache where a run kept them (tools/ci-tools.txt): a release-download
      # outage is no verdict on a change.
      - uses: ./workspace/meridian-core/.github/actions/ci-tools
        with:
          tools: sccache nextest cargo-deny protoc

      # build, test and lint each run in Dockerfile.rust at the pinned toolchain.
      # No Rust is installed on the runner, deliberately: the container is the
      # only place a version is chosen.
      - name: make ci-stage
        working-directory: workspace/meridian-core
        env:
          DOCKER_BUILDKIT: "1"
          STAGE: ${{ matrix.stage }}
        run: make -k ci-stage STAGE="$STAGE"

  # The images stage: the runtime image and the release build's others, the
  # SDK's, and the cluster runs' two, built once and handed to every job that
  # runs them as this run's artifacts (tools/ci-images.sh).
  #
  # And the release candidate (ruling 1071): the runtime and analytics images
  # are built as the release, <series>.<run number>+<commit>, and pushed by
  # digest, untagged, so that once every check of this run is green the
  # release-candidate job tags exactly the images tested, and publish
  # promotes them on the merge without building again. Built on buildx's
  # docker-container builder, which pushes by digest and loads every image
  # the make targets build, the cargo caches put into it.
  images:
    name: ci-local (${{ matrix.stage }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        stage: [images]
    outputs:
      sdk: ${{ steps.sdk.outputs.ref }}
      version: ${{ steps.release.outputs.version }}
      tree: ${{ steps.release.outputs.tree }}
      runtime: ${{ steps.candidate.outputs.runtime }}
      analytics: ${{ steps.candidate.outputs.analytics }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge and the commit the branch carried, which the release
          # names.
          fetch-depth: 2
          path: workspace/meridian-core

      - name: The release this run builds
        id: release
        working-directory: workspace/meridian-core
        run: |
          tools/release-candidate.sh version | tee -a "$GITHUB_OUTPUT"
          # The images' times from the commit, not the clock, so the build
          # pushed below is the build loaded and tested, step for step.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          driver-opts: default-load=true

      # `docker build`, as the make targets call it, takes the builder from
      # here; the builder made current above is buildx's alone.
      - name: Every build on that builder
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: echo "BUILDX_BUILDER=$BUILDER" >> "$GITHUB_ENV"

      # Only where this run may push: a pull request from a fork never
      # merges, and its token reads packages and writes none. Elsewhere the
      # images build and load as ever, and no candidate is pushed.
      - name: Where the candidate is pushed
        id: push
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "registry=ghcr.io/$OWNER" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: steps.push.outputs.registry != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The interop gate drives this runtime's sidecar from the Python SDK,
      # which is the only check that the two implementations of that surface
      # agree. Both repositories are public, so this needs no credential and
      # nothing private is reachable from here.
      #
      # Which of the SDK's branches (the v25 build's O1, Q14): a pull
      # request reads the SDK's branch of the same name where it has one --
      # a contract change lands in both at once -- and main otherwise; a run
      # by hand or on the merge queue reads main. The run says which, and
      # every job of the run reads the one chosen here. The branch's name
      # comes from the pull request, so it reaches the script only through
      # the environment, and one holding anything but a branch name's
      # characters reads main.
      - name: Choose the SDK's branch
        id: sdk
        env:
          HEAD_REF: ${{ github.head_ref }}
          SDK: https://github.com/${{ github.repository_owner }}/meridian-python.git
        run: |
          ref=main
          case "$HEAD_REF" in
            "" | *[!A-Za-z0-9._/-]*) ;;
            *)
              if git ls-remote --exit-code --heads "$SDK" "refs/heads/$HEAD_REF" >/dev/null 2>&1; then
                ref="$HEAD_REF"
              fi
              ;;
          esac
          if [ "$ref" = main ] && [ -n "$HEAD_REF" ]; then
            echo "interop reads meridian-python@main: the SDK has no branch named after this pull request's"
          else
            echo "interop reads meridian-python@$ref"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/meridian-python
          ref: ${{ steps.sdk.outputs.ref }}
          path: workspace/meridian-python

      # The CLI, public, at its main, for the backup run's `meridian backup`
      # and `meridian restore` (task kernel/a-deployment-is-backed-up-and-
      # restored): the commands a person restores with, not a stand-in.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/meridian-cli
          persist-credentials: false
          path: workspace/meridian-cli

      # Its e2e image depends on nothing but that commit, so it is built
      # once per commit of meridian-cli's main and kept (cargo-cache.yaml
      # keeps it where every pull request reads it), rather than compiled
      # on every run's longest path.
      - name: The CLI's commit
        id: cli
        run: echo "sha=$(git -C workspace/meridian-cli rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore the CLI's image
        id: cli-image
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/cli-image
          key: cli-e2e-image-${{ steps.cli.outputs.sha }}

      # Before anything builds an image: the runner's preinstalled toolsets
      # and preloaded images, which core never uses, so the gate's disk
      # budget meets the headroom it was set for (tools/free-runner-disk.sh).
      - name: Free the runner's disk
        working-directory: workspace/meridian-core
        run: tools/free-runner-disk.sh

      # Ruling 556: the release build's cargo caches from an earlier run, put
      # in place before the gate starts (tools/ci-cargo-cache.sh). Keyed on the
      # toolchain and Cargo.lock; another lock's caches under the same
      # toolchain are still most of the compile. A run of a pull request reads
      # what an earlier run of it, or one on main, kept. Never decides a run.
      - name: The cargo caches' key
        id: cargo
        working-directory: workspace/meridian-core
        run: |
          rust="$(sed -n 's/^ARG RUST_VERSION=//p' Dockerfile | head -1)"
          echo "prefix=cargo-release-${RUNNER_OS}-rust${rust}-" >> "$GITHUB_OUTPUT"
          echo "key=cargo-release-${RUNNER_OS}-rust${rust}-${{ hashFiles('workspace/meridian-core/Cargo.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the cargo caches
        id: cargo-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/cargo
          key: ${{ steps.cargo.outputs.key }}
          restore-keys: ${{ steps.cargo.outputs.prefix }}

      - name: Put the cargo caches in place
        working-directory: workspace/meridian-core
        continue-on-error: true
        run: tools/ci-cargo-cache.sh put "$RUNNER_TEMP/cargo"

      - uses: ./workspace/meridian-core/.github/actions/ci-tools
        with:
          tools: sccache

      # GitHub's cache for sccache in the release build (ruling 1104; step 3b
      # part 5), as the compile job's: the runtime's token and the cache
      # service's addresses, handed to the build as BuildKit secrets alone
      # (the Makefile's SCCACHE_SECRETS, tools/with-sccache.sh). Pinned by
      # commit (v3.1.0).
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124

      - name: make ci-stage
        working-directory: workspace/meridian-core
        env:
          DOCKER_BUILDKIT: "1"
          STAGE: ${{ matrix.stage }}
          MERIDIAN_VERSION: ${{ steps.release.outputs.version }}
          CANDIDATE_REGISTRY: ${{ steps.push.outputs.registry }}
        run: make -k ci-stage STAGE="$STAGE" MERIDIAN_VERSION="$MERIDIAN_VERSION" CANDIDATE_REGISTRY="$CANDIDATE_REGISTRY"

      - name: The release candidate, as pushed
        id: candidate
        if: steps.push.outputs.registry != ''
        working-directory: workspace/meridian-core
        env:
          REGISTRY: ${{ steps.push.outputs.registry }}
        run: |
          echo "runtime=$(tools/release-candidate.sh pushed meridian-runtime:local "$REGISTRY/meridian-runtime")" >> "$GITHUB_OUTPUT"
          echo "analytics=$(tools/release-candidate.sh pushed meridian-analytics:local "$REGISTRY/meridian-analytics")" >> "$GITHUB_OUTPUT"

      - name: make backup-cli-image
        if: steps.cli-image.outputs.cache-hit != 'true'
        working-directory: workspace/meridian-core
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          make backup-cli-image CLI=../meridian-cli
          tools/ci-images.sh save "$RUNNER_TEMP/cli-image" backup-cli

      - name: Keep the CLI's image
        if: steps.cli-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/cli-image
          key: cli-e2e-image-${{ steps.cli.outputs.sha }}

      - name: Save the images
        working-directory: workspace/meridian-core
        run: |
          tools/ci-images.sh save "$RUNNER_TEMP/images" runtime harness interop version-check
          tools/ci-images.sh save "$RUNNER_TEMP/cluster-images" analytics
          cp "$RUNNER_TEMP"/cli-image/backup-cli.* "$RUNNER_TEMP/cluster-images/"

      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: ${{ runner.temp }}/images
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: cluster-images
          path: ${{ runner.temp }}/cluster-images
          compression-level: 0
          retention-days: 1

      # Kept only from a green run, and only where this key was not restored
      # whole: a key is written once.
      - name: Take the cargo caches
        if: success() && steps.cargo-cache.outputs.cache-hit != 'true'
        working-directory: workspace/meridian-core
        continue-on-error: true
        run: tools/ci-cargo-cache.sh take "$RUNNER_TEMP/cargo"

      - name: Keep the cargo caches
        if: success() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/cargo
          key: ${{ steps.cargo.outputs.key }}

  # The compile stage: every test binary and the settings pages' server, the
  # debug build, once (Dockerfile.rust's compile and settings-binary-image),
  # handed on as the run's artifact.
  compile:
    name: ci-local (${{ matrix.stage }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        stage: [compile]
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace/meridian-core

      - name: Free the runner's disk
        working-directory: workspace/meridian-core
        run: tools/free-runner-disk.sh

      # The tools its builds fetch from GitHub's releases, from GitHub's
      # cache where a run kept them (tools/ci-tools.txt): a release-download
      # outage is no verdict on a change.
      - uses: ./workspace/meridian-core/.github/actions/ci-tools
        with:
          tools: sccache nextest

      # GitHub's cache for sccache (ruling 1104): the runtime's token and the
      # cache service's addresses put in this job's environment, from which
      # the Makefile hands them to Dockerfile.rust's compiles as BuildKit
      # secrets alone (SCCACHE_SECRETS, tools/with-sccache.sh): in no layer,
      # no build argument and no log. Pinned by commit (v3.1.0).
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124

      - name: make ci-stage
        working-directory: workspace/meridian-core
        env:
          DOCKER_BUILDKIT: "1"
          STAGE: ${{ matrix.stage }}
        run: make -k ci-stage STAGE="$STAGE"

      # What sccache did for the compile (ruling 1104): its requests, hits
      # and misses, from the build's own log, or that it did not start.
      - name: What sccache did
        if: ${{ !cancelled() }}
        working-directory: workspace/meridian-core
        run: grep -E -A14 'with-sccache|Compile requests' .tests-image.log | cut -c1-200 || echo "sccache said nothing"

      - name: Say what the compile said
        if: failure()
        working-directory: workspace/meridian-core
        run: tail -n 200 .tests-image.log || true

      - name: Save the images
        working-directory: workspace/meridian-core
        run: |
          tools/ci-images.sh save "$RUNNER_TEMP/test-images" tests
          tools/ci-images.sh save "$RUNNER_TEMP/settings-binary" settings-binary

      - uses: actions/upload-artifact@v4
        with:
          name: test-images
          path: ${{ runner.temp }}/test-images
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: settings-binary
          path: ${{ runner.temp }}/settings-binary
          compression-level: 0
          retention-days: 1

  # The rest of ci-local's stages, each on the images it runs: a leg a stage,
  # or a few short ones run in order on one runner.
  stages:
    name: ci-local (${{ matrix.stage }})
    needs: [tier, images, compile]
    # checks: the test report below, a check of its own per leg (ruling 1104).
    permissions:
      contents: read
      checks: write
    # Run even when a build failed, to fail by name here rather than be
    # skipped: GitHub counts a skipped required check as passed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Stages share runners, each leg running its stages in order: the
          # organisation runs at most 20 jobs at once (GitHub Free, ruling
          # 1073), and a run keeps room for a plugin's or the SDK's beside
          # it. A leg a stage again where more run at once.
          - stage: settings-page
            artifacts: images settings-binary
            images: runtime settings-binary
          - stage: tests dashboards
            artifacts: images test-images
            images: runtime tests interop
          - stage: sdk first-run image
            artifacts: images
            images: runtime interop version-check
    steps:
      # Run or left to the merge queue by the plan (the tier job): a leg
      # the pull request's tier leaves says so and runs nothing.
      - name: In this run's tier
        id: tier
        env:
          RUN: ${{ needs.tier.outputs.full == 'true' || contains(fromJSON(needs.tier.outputs.stage_names), matrix.stage) }}
        run: |
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          [ "$RUN" = true ] || echo "::notice::ci-local (${{ matrix.stage }}) is not in this pull request's tier: the merge queue runs it"

      - name: The images were built
        if: steps.tier.outputs.run == 'true'
        env:
          IMAGES: ${{ needs.images.result }}
          COMPILE: ${{ needs.compile.result }}
        run: |
          [ "$IMAGES" = success ] && [ "$COMPILE" = success ] \
            || { echo "::error::the images stage was $IMAGES and the compile stage $COMPILE: this stage runs what they build, so it cannot run"; exit 1; }

      - uses: actions/checkout@v4
        if: steps.tier.outputs.run == 'true'
        with:
          path: workspace/meridian-core

      - uses: actions/checkout@v4
        if: steps.tier.outputs.run == 'true'
        with:
          repository: ${{ github.repository_owner }}/meridian-python
          ref: ${{ needs.images.outputs.sdk }}
          path: workspace/meridian-python

      - name: Free the runner's disk
        if: steps.tier.outputs.run == 'true'
        working-directory: workspace/meridian-core
        run: tools/free-runner-disk.sh

      - uses: ./workspace/meridian-core/.github/actions/gate-images
        if: steps.tier.outputs.run == 'true'
        with:
          artifacts: ${{ matrix.artifacts }}
          names: ${{ matrix.images }}

      # The tools its builds fetch from GitHub's releases, from GitHub's
      # cache where a run kept them (tools/ci-tools.txt): a release-download
      # outage is no verdict on a change.
      - uses: ./workspace/meridian-core/.github/actions/ci-tools
        if: steps.tier.outputs.run == 'true'
        with:
          tools: sccache nextest

      - name: make ci-stage
        if: steps.tier.outputs.run == 'true'
        working-directory: workspace/meridian-core
        env:
          DOCKER_BUILDKIT: "1"
          STAGE: ${{ matrix.stage }}
          MERIDIAN_VERSION: ${{ needs.images.outputs.version }}
        run: make -k ci-stage STAGE="$STAGE" IMAGES=pulled MERIDIAN_VERSION="$MERIDIAN_VERSION" NEXTEST_PROFILE=ci

      # A test that failed and then passed on its retry (nextest's ci
      # profile) named on the run and in its summary (tools/ci-flaky.py):
      # flaky on this commit, never hidden by the retry (ruling 1104).
      - name: Flaky tests, named
        if: steps.tier.outputs.run == 'true' && (!cancelled())
        working-directory: workspace/meridian-core
        run: python3 tools/ci-flaky.py .junit

      # Every test binary's results, as a check of their own (ruling 1104),
      # from the JUnit nextest wrote (tools/run-tests.sh). Pinned by commit
      # (v2.6.0).
      - name: Test report
        if: steps.tier.outputs.run == 'true' && (!cancelled() && hashFiles('workspace/meridian-core/.junit/*.xml') != '')
        uses: dorny/test-reporter@3d76b34a4535afbd0600d347b09a6ee5deb3ed7f
        with:
          name: tests (${{ matrix.stage }})
          # The repository is checked out below the workspace, and the
          # action lists its files from where it is told it is.
          working-directory: workspace/meridian-core
          path: .junit/*.xml
          reporter: java-junit
          fail-on-error: false

      # What the services said, kept only when something failed. The e2e
      # targets write these beside the checkout and the runner names them on
      # failure, which is no help at all once the runner is gone: a red run on
      # 2026-09-23 had to be diagnosed from the assertion output alone because
      # the one file explaining it was discarded with the machine.
      - name: Keep what the e2e services said
        if: steps.tier.outputs.run == 'true' && (failure())
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ strategy.job-index }}
          path: workspace/meridian-core/.e2e-*.log
          # The logs are dotfiles, which v4 leaves out unless told; with
          # `ignore` as well, every failure uploaded nothing and said nothing
          # until 2026-09-25.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # The whole gate, as one check: green only when every stage's job is. The
  # check named ci-local means what it meant before ci-local was split.
  ci-local:
    name: ci-local
    needs: [tier, static, images, compile, stages, e2e-harness, e2e-cluster-k3d, e2e-cluster-arm64]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The stages, every run. And -- because a skipped job passes a
      # required check -- on a run that is not a pull request's, every job
      # of the tiers too, each succeeded, none skipped, the plan everything:
      # the merge queue can never pass by a job not running.
      - name: Every stage passed, and on the queue every job of the merge queue's run succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ needs.tier.outputs.full }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '[.tier, .static, .images, .compile, .stages] | all(.result == "success")' >/dev/null \
            || { echo "::error::a stage of ci-local did not pass"; exit 1; }
          if [ "$EVENT" = pull_request ]; then
            echo "$NEEDS" | jq -e '[.["e2e-harness"], .["e2e-cluster-k3d"], .["e2e-cluster-arm64"]] | all(.result == "success" or .result == "skipped")' >/dev/null \
              || { echo "::error::a job in this pull request's tier did not pass"; exit 1; }
          else
            [ "$FULL" = true ] || { echo "::error::the plan for $EVENT is not every job"; exit 1; }
            echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null \
              || { echo "::error::not every job of the merge queue's run succeeded: none may pass the queue skipped"; exit 1; }
          fi

  # The plugin harness's suites (ruling 556): `make e2e-harness`, a few suites
  # per job, beside the stages rather than in one, so the longest of them is
  # off the run's critical path. Each suite runs in its own compose project,
  # needing no other's state (the Makefile's HARNESS_SUITES), on the images
  # the images job built; the groups are balanced on v27's timings (e2e-lake
  # alone is six minutes). A suite added to HARNESS_SUITES is added to a group
  # here, or no job runs it.
  e2e-harness:
    needs: [tier, images]
    # Its groups the plan's (tools/ci_tier.py HARNESS_GROUPS): every one on
    # the queue; on a pull request, those its paths select. Run unless the
    # plan says none, so a plan that could not be read fails it.
    if: ${{ !cancelled() && needs.tier.outputs.harness_any != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tier.outputs.harness) }}
    name: e2e-harness (${{ matrix.group }})
    steps:
      - name: The images were built
        env:
          IMAGES: ${{ needs.images.result }}
        run: |
          [ "$IMAGES" = success ] \
            || { echo "::error::the images stage was $IMAGES: these suites run what it builds, so they cannot run"; exit 1; }

      - uses: actions/checkout@v4
        with:
          path: workspace/meridian-core

      # The SDK the images job chose.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/meridian-python
          ref: ${{ needs.images.outputs.sdk }}
          path: workspace/meridian-python

      - name: Free the runner's disk
        working-directory: workspace/meridian-core
        run: tools/free-runner-disk.sh

      - uses: ./workspace/meridian-core/.github/actions/gate-images
        with:
          artifacts: images
          names: runtime harness interop

      - name: make e2e-harness
        working-directory: workspace/meridian-core
        env:
          DOCKER_BUILDKIT: "1"
          SUITES: ${{ matrix.suites }}
        run: make e2e-harness E2E_HARNESS_TARGET="$SUITES" IMAGES=pulled

      - name: Keep what the e2e services said
        if: failure()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-harness-${{ matrix.group }}-logs
          path: workspace/meridian-core/.e2e-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # A required check the pull request's tier leaves to the merge queue,
  # under its own name, so the pull request can be queued: it runs nothing
  # and says so. Never on the queue, whose plan leaves nothing.
  e2e-harness-left:
    needs: tier
    if: ${{ needs.tier.outputs.harness_left_any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix: ${{ fromJSON(needs.tier.outputs.harness_left) }}
    name: e2e-harness (${{ matrix.group }})
    steps:
      - name: Left to the merge queue
        run: echo "::notice::e2e-harness (${{ matrix.group }}) is not in this pull request's tier; the merge queue runs it"

  # The four runs that install the chart on a real cluster and sign a person
  # in: spec/installation-and-first-run, paths 1 and 2 and path 1's other two
  # ways in. And a fifth that upgrades one in place from the chart published
  # last (task kernel/upgrading-a-deployment-in-place). Everything above stands something in; these stand in nothing,
  # and on 2026-09-24 and 25 they found seven defects in a chart that every
  # job above had passed -- one of them published, because `publish` waited
  # on this workflow and this workflow had never installed a chart.
  #
  # So they run on every pull request, alongside ci-local's stages (ruling
  # 1066), and each is a required check: `publish` runs on the merge without
  # CI again, so a red run here keeps the change off main and publishes
  # nothing. They run the images the images job built (ruling 1068) and need
  # nothing else of ci-local's, so a pull request's cluster findings come
  # back even when a stage fails. They need a cluster and the platform, which
  # is private: a pull request from a fork gets no secret to check it out
  # with, fails at the credentials step below, and is closed by
  # outside-pull-requests anyway. One job per run, so a failure names its
  # half.
  #
  # The window (ruling 935): Kubernetes is supported on every minor a major
  # managed cloud still supports, extended support included (about 26
  # months; 1.33 to 1.37 when this was written). All six run on the k3s
  # release dev runs (the Makefile's KUBERNETES_VERSION); the base install,
  # e2e-cluster, runs once more as a smoke job on the newest k3s patch of
  # each other minor in the window, and each of those is a required check
  # too. A minor entering the window is added here; one leaving it is
  # dropped, and Chart.yaml's kubeVersion, INSTALL.md, chart-check and
  # `meridian doctor` move with the oldest (ruling 936). The name stays
  # `e2e-cluster-k3d (<target>)` for the six; a smoke job's names its k3s.
  e2e-cluster-k3d:
    name: e2e-cluster-k3d (${{ matrix.target }}${{ matrix.profile && format(', {0}', matrix.profile) || '' }}${{ matrix.k3s && format(', k3s {0}', matrix.k3s) || '' }})
    needs: [tier, images]
    # Run even when the images failed, to fail by name rather than be
    # skipped: GitHub counts a skipped required check as passed. A plan
    # that could not be read fails it too.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout || 45 }}
    strategy:
      fail-fast: false
      # The plan's runs (tools/ci_tier.py CLUSTERS): every one on the queue;
      # on a pull request the base install and those its paths select. The
      # runs, as they were here: the six targets on the Makefile's k3s pin;
      # the base install on the newest patch of each other minor in the
      # window (ruling 935); and step 3b's (spec/a-deployment-scales-out-
      # and-fails-over-by-configuration section 15): the HA configuration's
      # shape, a live install moved tolerant -> ha -> tolerant, and the
      # failure classes in both profiles, three agents in three zones where
      # the run is HA.
      matrix: ${{ fromJSON(needs.tier.outputs.clusters) }}
    steps:
      - name: The images were built
        env:
          IMAGES: ${{ needs.images.result }}
        run: |
          [ "$IMAGES" = success ] \
            || { echo "::error::the images stage was $IMAGES: this run installs what it builds, so it cannot run"; exit 1; }

      - uses: actions/checkout@v4
        with:
          path: workspace/meridian-core

      # Before anything is loaded: the runner's preinstalled toolsets and
      # preloaded images, which core never uses, so the gate's disk budget
      # meets the headroom it was set for (tools/free-runner-disk.sh).
      - name: Free the runner's disk
        working-directory: workspace/meridian-core
        run: tools/free-runner-disk.sh

      # Said plainly, because without them the steps below fail with an
      # authentication error that reads like the platform is gone.
      - name: The platform's app credentials are there
        env:
          HELD: ${{ secrets.MERIDIAN_PLATFORM_APP_ID != '' && secrets.MERIDIAN_PLATFORM_APP_KEY != '' }}
        run: |
          if [ "$HELD" != "true" ]; then
            echo "::error::MERIDIAN_PLATFORM_APP_ID and MERIDIAN_PLATFORM_APP_KEY are not both set. These runs start the real platform from meridian-platform, which is private: they need a GitHub App installed on it with Contents: read, and its id and private key as these secrets."
            exit 1
          fi

      # A token for meridian-platform alone, read only, minted for this run
      # and expiring within the hour. The organisation has deploy keys off,
      # and an app belongs to no person and does not lapse the way a personal
      # token does.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MERIDIAN_PLATFORM_APP_ID }}
          private-key: ${{ secrets.MERIDIAN_PLATFORM_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: meridian-platform

      # The real platform, at its main, as design's gates read siblings. The
      # token is not left behind for any later step.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/meridian-platform
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: workspace/meridian-platform

      # The runtime and analytics images this run built, and for the backup
      # run the CLI's, which the images job built from meridian-cli's main.
      - uses: ./workspace/meridian-core/.github/actions/gate-images
        with:
          artifacts: images cluster-images
          # The failover and reconfigure runs' write driver runs in the
          # SDK's interop image (e2e/failover/driver.py).
          names: ${{ matrix.target == 'e2e-cluster-backup' && 'runtime analytics backup-cli' || ((matrix.target == 'e2e-cluster-failover' || matrix.target == 'e2e-cluster-reconfigure') && 'runtime analytics interop' || 'runtime analytics') }}

      # Pinned, and checked against the release's own checksum, rather than
      # piping an install script from a branch into a shell; from GitHub's
      # cache where a run kept it (tools/ci-tools.txt). elle-cli too, for
      # the ha failover run's Elle check below.
      - uses: ./workspace/meridian-core/.github/actions/ci-tools
        with:
          tools: ${{ matrix.target == 'e2e-cluster-failover' && matrix.profile == 'ha' && 'k3d elle-cli' || 'k3d' }}

      - name: k3d
        run: sudo install -m 0755 "$CI_TOOLS/k3d-linux-amd64" /usr/local/bin/k3d

      # Helm 4 for the upgrades: its --wait waits for every resource a
      # release names to exist, and failed an upgrade that Helm 3's passed;
      # and reconfigure's upgrades run as `meridian upgrade-deployment` runs
      # them on Helm 4 (step 3b's CLI rehearsal), whose server-side apply
      # refuses a member count first run's scale owns unless the chart takes
      # it back (--force-conflicts): the newest Helm the CLI meets, and the
      # stricter. The installs keep the version they were proven on.
      - uses: azure/setup-helm@v4
        with:
          version: ${{ (matrix.target == 'e2e-cluster-upgrade' || matrix.target == 'e2e-cluster-reconfigure') && 'v4.2.3' || 'v3.16.2' }}

      - name: make e2e-cluster-k3d
        working-directory: workspace/meridian-core
        env:
          DOCKER_BUILDKIT: "1"
          TARGET: ${{ matrix.target }}
          K3S: ${{ matrix.k3s }}
          # The desktop footprint's peak, this job's, for footprint-judge.
          E2E_FOOTPRINT_PEAK: .e2e-footprint-peak.txt
          E2E_FOOTPRINT_JOB: ${{ matrix.target }}${{ matrix.k3s && format(' k3s {0}', matrix.k3s) || '' }}
          # Step 3b's runs: the profile, and the agents (in three zones).
          PROFILE: ${{ matrix.profile || 'tolerant' }}
          AGENTS: ${{ matrix.agents || 0 }}
        run: |
          zones=""
          if [ "$AGENTS" != 0 ]; then zones="zone-a zone-b zone-c"; fi
          make e2e-cluster-k3d E2E_CLUSTER_TARGET="$TARGET" IMAGES=pulled ${K3S:+E2E_K3S_IMAGE="rancher/k3s:$K3S"} \
            PROFILE="$PROFILE" E2E_K3D_AGENTS="$AGENTS" E2E_K3D_ZONES="$zones"

      - name: Keep the failure classes' measurements
        if: (matrix.target == 'e2e-cluster-failover' || matrix.target == 'e2e-cluster-reconfigure') && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target == 'e2e-cluster-reconfigure' && 'reconfigure-claims' || format('failover-claims-{0}', matrix.profile) }}
          path: workspace/meridian-core/.e2e-failover-claims.jsonl
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      # Elle (step 3b part 5; the PO's ruling of 2026-11-07, item 2): the
      # write driver's history, list-append under strict-serializable per
      # key -- per-partition linearizability, the book's account partitions
      # each one fenced log -- checked by elle-cli on a pinned JVM image, in
      # this job alone and never in an image; and a copy with one read
      # reordered refused (tools/elle-check.sh says why the lake is left out).
      - name: Elle
        if: matrix.target == 'e2e-cluster-failover' && matrix.profile == 'ha' && !cancelled()
        working-directory: workspace/meridian-core
        run: tools/elle-check.sh .e2e-failover-history.edn "$CI_TOOLS"

      - name: Keep the driver's history
        if: (matrix.target == 'e2e-cluster-failover' || matrix.target == 'e2e-cluster-reconfigure') && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target == 'e2e-cluster-reconfigure' && 'reconfigure-history' || format('failover-history-{0}', matrix.profile) }}
          path: workspace/meridian-core/.e2e-failover-history.edn
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      # The restore to a time and the checksum step's measurements (step 3b
      # part 3), kept for the claims ledger as the failover runs' are.
      - name: Keep the backup run's measurements
        if: matrix.target == 'e2e-cluster-backup' && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backup-claims
          path: workspace/meridian-core/.e2e-backup-claims.jsonl
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Keep this job's footprint peak
        if: matrix.target == 'e2e-cluster' && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: footprint-peak${{ matrix.k3s && format('-{0}', matrix.k3s) || '' }}
          path: workspace/meridian-core/.e2e-footprint-peak.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      # What failed, in the job's own log, before anything else is tried:
      # the artifact service timed out creating the upload below (2026-10-06,
      # "Request timeout: /twirp/github.actions.results.api.v1.ArtifactService/
      # CreateArtifact", retried five times past its step's limit), and a run
      # then said nothing of why it failed until it was cancelled.
      - name: Say what the cluster said
        if: failure()
        working-directory: workspace/meridian-core
        run: |
          for log in .e2e-*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log, its last 300 lines"
            tail -n 300 "$log"
            echo "::endgroup::"
          done

      - name: Keep what the cluster said
        if: failure()
        # A slow artifact service held a failed run open to the job's limit
        # (2026-10-06); the step above has put what failed in the job's log,
        # so an upload that fails or times out never decides the run.
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}${{ matrix.profile && format('-{0}', matrix.profile) || '' }}${{ matrix.k3s && format('-{0}', matrix.k3s) || '' }}-logs
          path: workspace/meridian-core/.e2e-*.log
          # The logs are dotfiles, which v4 leaves out unless told; with
          # `ignore` as well, every failure uploaded nothing and said nothing
          # until 2026-09-25.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # The cluster runs the pull request's tier leaves to the merge queue, each
  # under its own name, as e2e-harness-left: running nothing, saying so,
  # never on the queue.
  e2e-cluster-left:
    needs: tier
    if: ${{ needs.tier.outputs.clusters_left_any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix: ${{ fromJSON(needs.tier.outputs.clusters_left) }}
    name: e2e-cluster-k3d (${{ matrix.target }}${{ matrix.profile && format(', {0}', matrix.profile) || '' }}${{ matrix.k3s && format(', k3s {0}', matrix.k3s) || '' }})
    steps:
      - name: Left to the merge queue
        run: echo "::notice::this cluster run is not in this pull request's tier; the merge queue runs it"

  # arm64, tested and not only built (ruling 1071): the release candidate's
  # arm64 images, built natively on GitHub's arm64 runner as the amd64 ones
  # are by the images job, stamped with the same release and pushed by digest
  # the same way; then the base install, e2e-cluster, on a k3d cluster on that
  # runner, as e2e-cluster-k3d runs it on amd64. A required check: publish
  # promotes the arm64 image beside the amd64 one, so it is tested first.
  e2e-cluster-arm64:
    name: e2e-cluster-k3d (e2e-cluster, arm64)
    needs: tier
    # The merge queue's, which builds the release candidate's arm64 images;
    # skipped only where the plan says a pull request's tier, so a plan that
    # could not be read runs it.
    if: ${{ !cancelled() && needs.tier.outputs.full != 'false' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      runtime: ${{ steps.candidate.outputs.runtime }}
      analytics: ${{ steps.candidate.outputs.analytics }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          path: workspace/meridian-core

      - name: The release this run builds
        id: release
        working-directory: workspace/meridian-core
        run: |
          tools/release-candidate.sh version | tee -a "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          driver-opts: default-load=true

      # `docker build`, as the make targets call it, takes the builder from
      # here; the builder made current above is buildx's alone.
      - name: Every build on that builder
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: echo "BUILDX_BUILDER=$BUILDER" >> "$GITHUB_ENV"

      - name: Where the candidate is pushed
        id: push
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "registry=ghcr.io/$OWNER" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: steps.push.outputs.registry != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free the runner's disk
        working-directory: workspace/meridian-core
        run: tools/free-runner-disk.sh

      # The arm64 release build's own cargo caches (ruling 556), by the
      # runner's architecture: amd64's are no use to it.
      - name: The cargo caches' key
        id: cargo
        working-directory: workspace/meridian-core
        run: |
          rust="$(sed -n 's/^ARG RUST_VERSION=//p' Dockerfile | head -1)"
          echo "prefix=cargo-release-${RUNNER_OS}-${RUNNER_ARCH}-rust${rust}-" >> "$GITHUB_OUTPUT"
          echo "key=cargo-release-${RUNNER_OS}-${RUNNER_ARCH}-rust${rust}-${{ hashFiles('workspace/meridian-core/Cargo.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the cargo caches
        id: cargo-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/cargo
          key: ${{ steps.cargo.outputs.key }}
          restore-keys: ${{ steps.cargo.outputs.prefix }}

      - name: Put the cargo caches in place
        working-directory: workspace/meridian-core
        continue-on-error: true
        run: tools/ci-cargo-cache.sh put "$RUNNER_TEMP/cargo"

      - uses: ./workspace/meridian-core/.github/actions/ci-tools
        with:
          tools: sccache

      # GitHub's cache for sccache in the release build (ruling 1104; step 3b
      # part 5), as the compile job's: the runtime's token and the cache
      # service's addresses, handed to the build as BuildKit secrets alone
      # (the Makefile's SCCACHE_SECRETS, tools/with-sccache.sh). Pinned by
      # commit (v3.1.0).
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124

      - name: make runtime-image analytics-image
        working-directory: workspace/meridian-core
        env:
          DOCKER_BUILDKIT: "1"
          MERIDIAN_VERSION: ${{ steps.release.outputs.version }}
          CANDIDATE_REGISTRY: ${{ steps.push.outputs.registry }}
        run: make runtime-image analytics-image MERIDIAN_VERSION="$MERIDIAN_VERSION" CANDIDATE_REGISTRY="$CANDIDATE_REGISTRY"

      - name: The release candidate, as pushed
        id: candidate
        if: steps.push.outputs.registry != ''
        working-directory: workspace/meridian-core
        env:
          REGISTRY: ${{ steps.push.outputs.registry }}
        run: |
          echo "runtime=$(tools/release-candidate.sh pushed meridian-runtime:local "$REGISTRY/meridian-runtime")" >> "$GITHUB_OUTPUT"
          echo "analytics=$(tools/release-candidate.sh pushed meridian-analytics:local "$REGISTRY/meridian-analytics")" >> "$GITHUB_OUTPUT"

      - name: The platform's app credentials are there
        env:
          HELD: ${{ secrets.MERIDIAN_PLATFORM_APP_ID != '' && secrets.MERIDIAN_PLATFORM_APP_KEY != '' }}
        run: |
          if [ "$HELD" != "true" ]; then
            echo "::error::MERIDIAN_PLATFORM_APP_ID and MERIDIAN_PLATFORM_APP_KEY are not both set. These runs start the real platform from meridian-platform, which is private: they need a GitHub App installed on it with Contents: read, and its id and private key as these secrets."
            exit 1
          fi

      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MERIDIAN_PLATFORM_APP_ID }}
          private-key: ${{ secrets.MERIDIAN_PLATFORM_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: meridian-platform

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/meridian-platform
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: workspace/meridian-platform

      # Pinned, and checked against the release's own checksum; from
      # GitHub's cache where a run kept it (tools/ci-tools.txt).
      - uses: ./workspace/meridian-core/.github/actions/ci-tools
        with:
          tools: k3d

      - name: k3d
        run: sudo install -m 0755 "$CI_TOOLS/k3d-linux-arm64" /usr/local/bin/k3d

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      # The images built above, here already: nothing is built again. The
      # browser's and the platform's images build on Docker's own builder,
      # as on amd64's runs.
      - name: make e2e-cluster-k3d
        working-directory: workspace/meridian-core
        env:
          DOCKER_BUILDKIT: "1"
          BUILDX_BUILDER: default
        run: make e2e-cluster-k3d E2E_CLUSTER_TARGET=e2e-cluster IMAGES=pulled

      - name: Say what the cluster said
        if: failure()
        working-directory: workspace/meridian-core
        run: |
          for log in .e2e-*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log, its last 300 lines"
            tail -n 300 "$log"
            echo "::endgroup::"
          done

      - name: Keep what the cluster said
        if: failure()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cluster-arm64-logs
          path: workspace/meridian-core/.e2e-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Take the cargo caches
        if: success() && steps.cargo-cache.outputs.cache-hit != 'true'
        working-directory: workspace/meridian-core
        continue-on-error: true
        run: tools/ci-cargo-cache.sh take "$RUNNER_TEMP/cargo"

      - name: Keep the cargo caches
        if: success() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/cargo
          key: ${{ steps.cargo.outputs.key }}

  # The release candidate, tagged once the run is green (ruling 1071): the
  # amd64 and arm64 images every check above ran, as one manifest list per
  # image tagged tested-<tree>, the tree main will hold. publish promotes
  # that list on the merge and refuses a tree with none. Nothing is built.
  release-candidate:
    needs: [images, ci-local, e2e-harness, e2e-cluster-k3d, e2e-cluster-arm64]
    if: >-
      success() && needs.images.outputs.runtime != '' && needs.e2e-cluster-arm64.outputs.runtime != ''
      && needs.images.outputs.version == needs.e2e-cluster-arm64.outputs.version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace/meridian-core

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the tested images
        working-directory: workspace/meridian-core
        env:
          OWNER: ${{ github.repository_owner }}
          TREE: ${{ needs.images.outputs.tree }}
          RUNTIME_AMD64: ${{ needs.images.outputs.runtime }}
          RUNTIME_ARM64: ${{ needs.e2e-cluster-arm64.outputs.runtime }}
          ANALYTICS_AMD64: ${{ needs.images.outputs.analytics }}
          ANALYTICS_ARM64: ${{ needs.e2e-cluster-arm64.outputs.analytics }}
        run: |
          set -euo pipefail
          tools/release-candidate.sh tag "$TREE" "ghcr.io/$OWNER/meridian-runtime" "$RUNTIME_AMD64" "$RUNTIME_ARM64"
          tools/release-candidate.sh tag "$TREE" "ghcr.io/$OWNER/meridian-analytics" "$ANALYTICS_AMD64" "$ANALYTICS_ARM64"

  # The desktop footprint's peak memory (ruling 1058), judged by the median
  # of the e2e-cluster jobs' peaks and never by one job's (step 3b, decided
  # under A): one runner's peak moves by about 10 MiB run to run, and on
  # core#81 one job peaked at 185 MiB beside four at 168 to 171. Each job
  # keeps its peak; this holds their median to v29's baseline, printing
  # every job's and the highest.
  footprint-judge:
    needs: e2e-cluster-k3d
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace/meridian-core
      - uses: actions/download-artifact@v4
        with:
          pattern: footprint-peak*
          path: workspace/meridian-core/.footprint-peaks
      - name: make footprint-judge
        working-directory: workspace/meridian-core
        run: make footprint-judge FOOTPRINT_PEAKS="$(find .footprint-peaks -name '*.txt' | sort | tr '\n' ' ')"

  # The claims ledger (366; ruling 1113): every measurement this run's
  # cluster jobs made held to its bound, and every class the ledger holds
  # measured again by them, none dropped silently -- a job that failed or
  # kept nothing fails this by name. The ledger against this run is the
  # job's summary.
  claims-check:
    needs: [tier, e2e-cluster-k3d]
    # Every class the ledger holds, measured again: the full set's, so the
    # queue's (and a pull request's whose plan is everything); a failover
    # run on a pull request holds its own claims to their bounds itself.
    if: ${{ !cancelled() && needs.tier.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace/meridian-core
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-claims*'
          path: workspace/meridian-core/.claims
      - name: make claims-check
        working-directory: workspace/meridian-core
        run: |
          files="$(find .claims -name '*.jsonl' 2>/dev/null | sort | tr '\n' ' ')"
          [ -n "$files" ] || { echo "::error::no cluster job kept its claims, so nothing measured could be held to the ledger"; exit 1; }
          make claims-check CLAIMS_RUN="$files"
