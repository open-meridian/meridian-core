# The failure classes, injected and timed, run several times over on the same
# images, and green only when every run is (accepted 2026-11-07: the fast
# local gate, CI decides). It replaces the five local runs a step 3b change
# was proved by: `make e2e-cluster-k3d E2E_CLUSTER_TARGET=e2e-cluster-failover`
# in each profile named, `repeat` times, each on its own runner and its own
# cluster, from one build of the runtime and analytics images: one matrix of
# profiles x runs under one "every run green" check (ruled 2026-11-11).
#
#   gh workflow run failover-repeat --ref <branch> -f profiles=tolerant,ha -f repeat=3
#   gh workflow run failover-repeat --ref <branch> -f profiles=ha -f repeat=5
#   gh workflow run failover-repeat --ref <branch> -f profiles=reconfigure -f repeat=1
#
# By hand only. Each run keeps its claims (failover-claims-<profile>-<n>), as
# ci's failover jobs keep theirs for the claims ledger.
name: failover-repeat

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: The profiles installed, comma-separated (tolerant; ha on three agents in three zones; reconfigure, a live install moved tolerant -> ha -> tolerant -> ha and restored to a time, as e2e-cluster-reconfigure runs)
        type: string
        default: tolerant,ha
      failure:
        description: The failure classes injected, comma-separated (FAILURE=); empty for the profile's all (reconfigure takes none)
        type: string
        default: ""
      repeat:
        description: How many runs, each of which must be green (1 to 10)
        type: string
        default: "5"
      sdk_ref:
        description: The SDK's branch or tag the write driver's interop image is built from (main; a contract's branch while its SDK is held unmerged until core's lands, as step 3c's c30)
        type: string
        default: main

permissions:
  contents: read

jobs:
  # The images every run installs, built once, as ci's images job builds
  # them (make runtime-image analytics-image), over the release build's cargo
  # caches main keeps (cargo-cache.yaml); read, never written, here.
  failover-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      runs: ${{ steps.runs.outputs.runs }}
      profiles: ${{ steps.runs.outputs.profiles }}
    defaults:
      run:
        working-directory: workspace/meridian-core
    steps:
      - name: The runs
        id: runs
        working-directory: .
        env:
          PROFILES: ${{ inputs.profiles }}
          REPEAT: ${{ inputs.repeat }}
          FAILURE: ${{ inputs.failure }}
          SDK_REF: ${{ inputs.sdk_ref }}
        run: |
          # Each profile named once, in the order given.
          profiles=""
          for p in $(echo "$PROFILES" | tr ',' ' '); do
            case "$p" in
              tolerant | ha | reconfigure) ;;
              *) echo "::error::profiles is tolerant, ha or reconfigure, comma-separated, not '$PROFILES'"; exit 1 ;;
            esac
            case ",$profiles," in *",\"$p\","*) continue ;; esac
            profiles="${profiles:+$profiles,}\"$p\""
          done
          [ -n "$profiles" ] || { echo "::error::profiles names no profile"; exit 1; }
          case "$REPEAT" in
            [1-9] | 10) ;;
            *) echo "::error::repeat is a whole number from 1 to 10, not '$REPEAT'"; exit 1 ;;
          esac
          case "$FAILURE" in
            *[!a-z0-9,-]*) echo "::error::failure is class names, comma-separated, not '$FAILURE'"; exit 1 ;;
          esac
          case "$SDK_REF" in
            "" | *[!A-Za-z0-9._/-]*) echo "::error::sdk_ref is a branch or tag of meridian-python, not '$SDK_REF'"; exit 1 ;;
          esac
          echo "profiles=[$profiles]" >> "$GITHUB_OUTPUT"
          echo "runs=[$(seq -s, 1 "$REPEAT")]" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          path: workspace/meridian-core

      # The SDK at its main, for the write driver's interop image
      # (e2e/failover/driver.py), as ci's images job builds it.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/meridian-python
          # main, or the branch `sdk_ref` names (step 3c: the SDK held
          # unmerged until core's lands).
          ref: ${{ inputs.sdk_ref }}
          path: workspace/meridian-python

      - name: Free the runner's disk
        run: tools/free-runner-disk.sh

      - name: The cargo caches' key
        id: cargo
        run: |
          rust="$(sed -n 's/^ARG RUST_VERSION=//p' Dockerfile | head -1)"
          echo "prefix=cargo-release-${RUNNER_OS}-rust${rust}-" >> "$GITHUB_OUTPUT"
          echo "key=cargo-release-${RUNNER_OS}-rust${rust}-${{ hashFiles('workspace/meridian-core/Cargo.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the cargo caches
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/cargo
          key: ${{ steps.cargo.outputs.key }}
          restore-keys: ${{ steps.cargo.outputs.prefix }}

      - name: Put the cargo caches in place
        continue-on-error: true
        run: tools/ci-cargo-cache.sh put "$RUNNER_TEMP/cargo"

      - name: make runtime-image analytics-image interop-image
        env:
          DOCKER_BUILDKIT: "1"
        run: make runtime-image analytics-image interop-image

      - name: Save the images
        run: tools/ci-images.sh save "$RUNNER_TEMP/failover-images" runtime analytics interop

      - uses: actions/upload-artifact@v4
        with:
          name: failover-images
          path: ${{ runner.temp }}/failover-images
          compression-level: 0
          retention-days: 1

  # Each run as ci's e2e-cluster-k3d job runs e2e-cluster-failover: its own
  # runner, its own k3d cluster, the images above; each profile keeps its own
  # timeout (tolerant 45 minutes, ha and reconfigure 70).
  failover-repeat:
    name: failover-repeat (${{ matrix.profile }}, run ${{ matrix.run }})
    needs: [failover-images]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.profile == 'tolerant' && 45 || 70 }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.failover-images.outputs.profiles) }}
        run: ${{ fromJSON(needs.failover-images.outputs.runs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace/meridian-core

      - name: Free the runner's disk
        working-directory: workspace/meridian-core
        run: tools/free-runner-disk.sh

      - uses: ./workspace/meridian-core/.github/actions/gate-images
        with:
          artifacts: failover-images
          names: runtime analytics interop

      # Pinned, and checked against the release's own checksum, as ci's,
      # from GitHub's cache where a run kept it (tools/ci-tools.txt).
      - uses: ./workspace/meridian-core/.github/actions/ci-tools
        with:
          tools: k3d

      - name: k3d
        run: sudo install -m 0755 "$CI_TOOLS/k3d-linux-amd64" /usr/local/bin/k3d

      # Reconfigure's upgrades on Helm 4, with `meridian upgrade-deployment`'s
      # flags, as ci.yaml's e2e-cluster-reconfigure runs them.
      - uses: azure/setup-helm@v4
        with:
          version: ${{ matrix.profile == 'reconfigure' && 'v4.2.3' || 'v3.16.2' }}

      - name: make e2e-cluster-k3d
        working-directory: workspace/meridian-core
        env:
          DOCKER_BUILDKIT: "1"
          PROFILE: ${{ matrix.profile }}
          FAILURE: ${{ inputs.failure }}
        run: |
          agents=0 zones=""
          if [ "$PROFILE" != tolerant ]; then agents=3 zones="zone-a zone-b zone-c"; fi
          if [ "$PROFILE" = reconfigure ]; then FAILURE=""; fi
          make e2e-cluster-k3d E2E_CLUSTER_TARGET=e2e-cluster-failover IMAGES=pulled \
            PROFILE="$PROFILE" FAILURE="$FAILURE" E2E_K3D_AGENTS="$agents" E2E_K3D_ZONES="$zones"

      - name: Keep the failure classes' measurements
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: failover-claims-${{ matrix.profile }}-${{ matrix.run }}
          path: workspace/meridian-core/.e2e-failover-claims.jsonl
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Say what the cluster said
        if: failure()
        working-directory: workspace/meridian-core
        run: |
          for log in .e2e-*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log, its last 300 lines"
            tail -n 300 "$log"
            echo "::endgroup::"
          done

      # What the cluster said, whole, as ci's cluster jobs keep it: every pod
      # of the run's namespace, each container's log and its previous one,
      # a failed hook's Job (the preflight) and a migration's included
      # (e2e-cluster-k3d writes .e2e-cluster.log when the run fails). The
      # step above prints only its tail, which on run 42482853675 was the
      # registry's probes and none of the preflight's report.
      - name: Keep what the cluster said
        if: failure()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: failover-repeat-logs-${{ matrix.profile }}-${{ matrix.run }}
          path: workspace/meridian-core/.e2e-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Green only when every run of every profile was.
  failover-verdict:
    name: failover-repeat (every run green)
    needs: [failover-images, failover-repeat]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every run green
        env:
          IMAGES: ${{ needs.failover-images.result }}
          RUNS: ${{ needs.failover-repeat.result }}
          PROFILES: ${{ needs.failover-images.outputs.profiles }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          if [ "$IMAGES" = success ] && [ "$RUNS" = success ]; then
            echo "failover-repeat: $REPEAT of $REPEAT runs green in each of $PROFILES"
          else
            echo "::error::failover-repeat: not every run was green in $PROFILES (images $IMAGES, runs $RUNS)"
            exit 1
          fi
