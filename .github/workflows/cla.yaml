# Has this pull request's author agreed to the contribution terms?
#
# Employees are not asked: employment settles ownership, and GitHub reports
# which side of that line an author is on.
#
# It fails while CLA.md is missing rather than passing. A tick there would look
# like assurance.

name: cla

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          set -euo pipefail

          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "$AUTHOR contributes as $ASSOCIATION."
              exit 0
              ;;
          esac

          if [ ! -f CLA.md ]; then
            echo "::error::CLA.md is not published yet, so outside contributions cannot be merged."
            exit 1
          fi

          # An exact line: "@ada" must not be satisfied by "@adam".
          if grep -qx -- "- @$AUTHOR" CONTRIBUTORS.md 2>/dev/null; then
            echo "$AUTHOR has agreed."
            exit 0
          fi

          echo "::error::$AUTHOR has not agreed. Read CLA.md, then open a pull request adding '- @$AUTHOR' to CONTRIBUTORS.md."
          exit 1
