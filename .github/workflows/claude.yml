name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # Not on a new issue: each one started a run that was skipped. Mention
  # @claude in a comment on the issue instead (the product owner, 2026-10-07).
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

          # Its reply is public and posted at once, so it answers only from
          # what it can see here (the product owner, 2026-10-07).
          claude_args: >-
            --append-system-prompt "You are replying in public on an Open
            Meridian repository, and your reply is posted as soon as you
            finish. Answer only from this repository's code and docs. The
            design repository, its specs and its rulings are private and you
            cannot see them: when a question turns on why something is
            designed as it is, or on what is planned, say so plainly and
            point to https://open-meridian.dev rather than guessing. Never
            promise a feature, a date or a priority. Never say or imply that
            Open Meridian meets a regulation or is ready for regulated use.
            Keep replies short and factual." 

